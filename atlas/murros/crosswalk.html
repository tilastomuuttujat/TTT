<!doctype html>
<html lang="fi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlasverkko · Murrosatlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/theme.css">
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{display:flex;flex-direction:column;overflow:hidden;background:var(--t-paper);color:var(--t-ink);font:14px/1.5 var(--t-sans)}button,a{font:inherit}.topbar{display:flex;align-items:center;gap:14px;min-height:var(--t-nav-h);padding:9px 18px;border-bottom:1px solid var(--t-line);background:var(--t-veil);backdrop-filter:blur(14px);z-index:10}.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit}.mark{width:24px;height:24px;border-radius:50%;background:conic-gradient(from 210deg,var(--t-forest),var(--t-ochre),var(--t-copper),var(--t-forest));box-shadow:var(--t-glow)}.brand b{font-family:var(--t-serif);font-size:18px}.tabs{display:flex;gap:2px;margin-left:auto;padding:3px;border:1px solid var(--t-line-soft);border-radius:999px;background:var(--t-surface-sunk)}.tabs a{padding:7px 13px;border-radius:999px;color:var(--t-muted);text-decoration:none;white-space:nowrap}.tabs a.active{background:var(--t-surface);color:var(--t-ink);box-shadow:var(--t-shadow-1)}.tools{display:flex;gap:7px}.tools button{width:35px;height:35px;border:1px solid var(--t-line);border-radius:10px;background:var(--t-surface);color:var(--t-ink);cursor:pointer}#viewRoot{flex:1;min-width:0;min-height:0;overflow:hidden}.error{max-width:700px;margin:40px auto;padding:24px;border:1px solid var(--t-line);border-radius:14px;background:var(--t-surface);white-space:pre-wrap}@media(max-width:760px){.topbar{flex-wrap:wrap}.tabs{order:3;width:100%;margin:0;overflow:auto}.tabs a{padding:6px 9px;font-size:12px}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><span class="mark"></span><b>Murrosatlas</b></a>
  <nav class="tabs" aria-label="Crosswalk-näkymä">
    <a data-mode="network" href="crosswalk.html?view=network">Atlasverkko</a>
    <a data-mode="radial" href="crosswalk.html?view=radial">Kytkentäkehä</a>
    <a data-mode="timeline" href="crosswalk.html?view=timeline">Aikajana</a>
    <a href="index.html">Muut näkymät</a>
  </nav>
  <div class="tools"><button id="themeBtn" aria-label="Vaihda teema">◐</button><button id="fsBtn" aria-label="Koko näyttö">⛶</button></div>
</header>
<main id="viewRoot"></main>
<script type="module">
const root=document.getElementById('viewRoot');
const params=new URLSearchParams(location.search);
const mode=['network','radial','timeline'].includes(params.get('view'))?params.get('view'):'network';
const modules={network:'./views/atlasverkko.js',radial:'./views/kytkentakeha.js',timeline:'./views/aikajana.js'};
document.querySelector(`[data-mode="${mode}"]`)?.classList.add('active');
try{const view=await import(modules[mode]);await view.mount(root);document.title=`${view.title} · Murrosatlas`;}catch(error){console.error(error);root.innerHTML=`<div class="error"><strong>Näkymän lataus epäonnistui.</strong>\n\n${String(error?.stack||error)}</div>`;}
document.getElementById('themeBtn').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'});
document.getElementById('fsBtn').addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen());
</script>
</body>
</html>
