<!doctype html>
<html lang="fi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Murrosatlas · infografiikkojen hallinta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/theme.css">
<style>
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;font:14px/1.5 var(--t-sans);color:var(--t-ink);background:var(--t-paper)}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--t-veil);backdrop-filter:blur(14px);border-bottom:1px solid var(--t-line)}.top h1{margin:0;font:600 19px var(--t-serif)}.top .sub{font:10px var(--t-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--t-muted)}.top .grow{flex:1}.btn{border:1px solid var(--t-line);border-radius:10px;padding:8px 12px;background:var(--t-surface);color:var(--t-ink);cursor:pointer}.btn:hover{border-color:var(--t-forest)}.btn.primary{background:var(--t-forest);border-color:var(--t-forest);color:var(--t-on-accent)}.btn.danger{color:var(--t-berry)}main{max-width:1500px;margin:0 auto;padding:22px}.panel{background:var(--t-surface);border:1px solid var(--t-line);border-radius:16px;box-shadow:var(--t-shadow-1)}#login{max-width:440px;margin:8vh auto;padding:26px}#login h2{margin:0 0 8px;font:600 25px var(--t-serif)}#login p{color:var(--t-muted)}label{display:block;margin:14px 0 5px;font-weight:600}input[type=email],input[type=password],input[type=search],select{width:100%;border:1px solid var(--t-line);border-radius:10px;padding:9px 11px;background:var(--t-surface);color:var(--t-ink)}.login-actions{display:flex;gap:9px;margin-top:18px}.message{min-height:22px;margin-top:12px;color:var(--t-berry)}#admin[hidden],#login[hidden]{display:none}.toolbar{display:grid;grid-template-columns:minmax(230px,1fr) 180px 180px auto;gap:10px;padding:14px;align-items:center}.stats{display:flex;gap:14px;flex-wrap:wrap;padding:0 14px 14px;color:var(--t-muted);font:11px var(--t-mono)}.bulk{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--t-line-soft);border-bottom:1px solid var(--t-line-soft)}.table-wrap{overflow:auto;max-height:calc(100vh - 250px)}table{width:100%;border-collapse:collapse;min-width:920px}th,td{padding:10px 12px;border-bottom:1px solid var(--t-line-soft);text-align:left;vertical-align:middle}th{position:sticky;top:0;z-index:4;background:var(--t-surface-2);font:600 11px var(--t-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--t-muted)}tr:hover td{background:var(--t-surface-2)}.title{font-weight:600}.meta{font:10px var(--t-mono);color:var(--t-muted);margin-top:2px}.thumb{width:92px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--t-line);background:var(--t-surface-sunk)}.noimg{display:grid;place-items:center;width:92px;height:58px;border:1px dashed var(--t-line-strong);border-radius:8px;color:var(--t-faint);font:10px var(--t-mono)}.switch{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer}.switch input{position:absolute;opacity:0}.track{width:44px;height:24px;border-radius:999px;background:var(--t-line-strong);padding:3px;transition:.15s}.track::after{content:"";display:block;width:18px;height:18px;border-radius:50%;background:var(--t-surface);box-shadow:0 1px 4px rgba(0,0,0,.2);transition:.15s}.switch input:checked+.track{background:var(--t-forest)}.switch input:checked+.track::after{transform:translateX(20px)}.state{font-size:12px;color:var(--t-muted)}.saving{opacity:.55;pointer-events:none}.empty{padding:36px;text-align:center;color:var(--t-muted)}@media(max-width:850px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .wide{grid-column:1/-1}.table-wrap{max-height:none}.top .sub{display:none}}@media(max-width:560px){main{padding:10px}.toolbar{grid-template-columns:1fr}.toolbar .wide{grid-column:auto}.top{flex-wrap:wrap}}
</style>
</head>
<body>
<header class="top">
  <div><h1>Infografiikkojen hallinta</h1><div class="sub">Murrosatlas · Supabase</div></div>
  <div class="grow"></div>
  <a class="btn" href="index.html">Avaa atlas</a>
  <button class="btn" id="themeBtn" type="button">Vaihda teema</button>
  <button class="btn danger" id="logoutBtn" type="button" hidden>Kirjaudu ulos</button>
</header>
<main>
  <section class="panel" id="login">
    <h2>Kirjaudu hallintaan</h2>
    <p>Käytä Supabase-projektin käyttäjätunnusta. Julkaisuvalinnat tallentuvat suoraan <code>items.unpublished</code>-kenttään.</p>
    <form id="loginForm">
      <label for="email">Sähköposti</label><input id="email" type="email" autocomplete="username" required>
      <label for="password">Salasana</label><input id="password" type="password" autocomplete="current-password" required>
      <div class="login-actions"><button class="btn primary" type="submit">Kirjaudu</button></div>
      <div class="message" id="loginMsg" role="status"></div>
    </form>
  </section>

  <section class="panel" id="admin" hidden>
    <div class="toolbar">
      <input class="wide" id="search" type="search" placeholder="Hae nimellä, tunnisteella tai vuodella…">
      <select id="visibility"><option value="all">Kaikki näkyvyydet</option><option value="published">Julkaistut</option><option value="hidden">Piilotetut</option></select>
      <select id="imageFilter"><option value="all">Kaikki kortit</option><option value="with">Infografiikka on</option><option value="without">Infografiikka puuttuu</option></select>
      <button class="btn" id="refreshBtn" type="button">Päivitä</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="bulk">
      <button class="btn" id="selectVisible" type="button">Valitse näkyvät</button>
      <button class="btn" id="clearSelection" type="button">Tyhjennä valinta</button>
      <button class="btn primary" id="publishSelected" type="button">Julkaise valitut</button>
      <button class="btn danger" id="hideSelected" type="button">Piilota valitut</button>
      <span class="message" id="adminMsg" role="status"></span>
    </div>
    <div class="table-wrap">
      <table><thead><tr><th><input id="checkAll" type="checkbox" aria-label="Valitse kaikki näkyvät"></th><th>Infografiikka</th><th>Kortti</th><th>Vuosi</th><th>Tyyppi</th><th>Näkyvyys</th></tr></thead><tbody id="rows"></tbody></table>
      <div class="empty" id="empty" hidden>Ei hakuehtoja vastaavia kortteja.</div>
    </div>
  </section>
</main>
<script type="module" src="assets/admin.js"></script>
</body>
</html>
