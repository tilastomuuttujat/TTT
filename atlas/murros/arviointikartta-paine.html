function lensAnalysis(){const state=lensState(),records=lensRecords().sort((a,b)=>a.year_start-b.year_start),laws=records.filter(r=>r.statute_id),pressures=records.filter(r=>!r.statute_id&&(r.structural_out||chainEdges(r.item_id).length)),capacityTypes=new Set(["enabled","created_capacity_for","created_structure_for","supported","implemented_through","integrates"]),responses=laws.filter(r=>chainEdges(r.item_id).some(e=>capacityTypes.has(e.relation_type))),candidates=laws.map(r=>({r,signals:adverseSignals(r)})).filter(x=>x.signals.length>=3||(x.r.repair_signal&&x.signals.length>=2)),turn=candidates[0]||null;return{state,records,laws,pressures,responses,turn}}
function renderLensReading(){const host=document.getElementById("pressureMode");if(!host)return;let el=document.getElementById("lensReading");if(!el){el=document.createElement("section");el.id="lensReading";el.className="lens-reading";host.querySelector(".pressure-track-wrap")?.before(el)}const a=lensAnalysis();if(!a.state.hasControls){el.innerHTML=`<div class="lens-confidence">Murroskartan linssit latautuvat…</div>`;return}if(!a.state.active.length){el.innerHTML=`<div class="lens-reading-head"><div><div class="pressure-kicker">Linssiohjattu tulkinta</div><h3>Valitse vähintään yksi linssi</h3><p>Painekartta rajaa sen jälkeen murrosilmiöt valittujen linssien yhteiseen näkymään ja seuraa niistä lainsäädännön vasteeseen sekä mahdolliseen sivuvaikutuskäänteeseen.</p></div></div>`;return}const pressure=a.pressures[0],response=a.laws[0],capacity=a.responses[0]||a.laws[1],turn=a.turn,coverage=a.records.length?Math.round(a.laws.length/a.records.length*100):0;el.innerHTML=`<div class="lens-reading-head"><div><div class="pressure-kicker">Linssiohjattu tulkinta</div><h3>Miten lainsäädäntö seuraa valittua näkökulmaa?</h3><p>Näkymä lukee Murroskartan valitsemat solmut ja yhdistää niihin Supabasen lakilinkit, rakenteelliset relaatiot ja painesignaalit.</p></div><div class="lens-badges">${a.state.labels.map(x=>`<span class="lens-badge">${esc(x)}</span>`).join("")}</div></div><div class="lens-flow"><article class="lens-stage"><small>1 · Linssin muutospaine</small><b>${pressure?esc(pressure.item_title):"Ei yksiselitteistä alkusignaalia"}</b><p>${pressure?esc(pressure.problem||"Murros näkyy rakenteellisena paineena ennen lakilinkkiä."):"Valintaan kuuluvista solmuista ei löydy vielä lakia edeltävää rakenteellista painetta."}</p></article><article class="lens-stage"><small>2 · Lainsäädännön vaste</small><b>${response?esc(response.statute_title||response.item_title):"Lakilinkki puuttuu"}</b><p>${response?`${response.year_start||""} · ${esc(response.mechanism||"Laki vastaa valitun linssin esiin nostamaan muutokseen.")}`:`${a.records.length} linssisolmua, mutta ei varmistettua lakilinkkiä.`}</p></article><article class="lens-stage"><small>3 · Rakennettu kapasiteetti</small><b>${capacity?esc(capacity.item_title):"Relaatiota ei ole kirjattu"}</b><p>${capacity?`${esc(roleMeta(capacity).label)} · ${esc(capacity.long_effect||"Vaste kytkeytyy osaksi muuta sääntelyverkostoa.")}`:"Nykyisestä relaatiodatasta ei löydy valintaan kuuluvaa toimeenpano- tai kapasiteettiketjua."}</p></article><article class="lens-stage ${turn?"is-turn":""}"><small>4 · Mahdollinen sivuvaikutuskäänne</small><b>${turn?`${esc(turn.r.item_title)} · ${turn.r.year_start||""}`:"Ei tunnistettavaa käännettä"}</b><p>${turn?`${esc(turn.signals.slice(0,3).join(", "))}. Avaa solmu tarkistaaksesi mekanismin.`:"Valinnan lakisolmuihin ei kasaudu vähintään kolmea riippumatonta painemerkkiä."}</p></article></div><div class="lens-confidence">Kattavuus: ${a.laws.length}/${a.records.length} valitun linssin murrossolmusta on yhdistetty lakiin (${coverage} %). Käänne on diagnostinen havainto, ei todistettu syy–seuraussuhde.${turn?` Ehdokas syntyy ${turn.signals.length} samanaikaisesta signaalista.`:""}</div>`;if(turn)el.querySelector(".lens-stage.is-turn").onclick=()=>selectItem(turn.r.item_id,true)}
function scheduleLensSync(){clearTimeout(lensSyncTimer);lensSyncTimer=setTimeout(()=>{renderLensReading();renderDiagList();applyMapPressure()},60)}
function addPressureMode(){const map=document.querySelector(".map");if(!map)return;const section=document.createElement("section");section.id="pressureMode";section.setAttribute("aria-label","Kerrostumispaineen yleiskuva");map.before(section);renderPressureMode()}
function renderPressureMode(){const el=document.getElementById("pressureMode");if(!el)return;const repairs=diagData.filter(r=>r.repair_signal).length,locks=diagData.filter(r=>roleOf(r)==="toimeenpanolukko").length,high=diagData.filter(r=>(r.layering_risk||0)>=65).length,trackData=diagData.filter(r=>r.layering_risk!==null||r.pressure_signal_count>0);const years=diagData.map(r=>r.year_start).filter(Boolean),min=Math.min(...years),max=Math.max(...years),range=Math.max(1,max-min);const ticks=[min,1900,1950,2000,max].filter((v,i,a)=>v>=min&&v<=max&&a.indexOf(v)===i);el.innerHTML=`<div class="pressure-head"><div><div class="pressure-kicker">Painekartta · Supabase × Lakikartta</div><h2>Missä verkosto alkaa korjata itseään?</h2><p>Solmun koko ja korkeus kuvaavat kerrostumisriskiä, väri rakenteellista roolia. Valinta avaa myös murrosrelaatioista muodostuvan todellisen korjausketjun.</p></div><div class="pressure-summary"><div class="pressure-stat"><b>${diagData.length}</b><span>murrossolmua</span></div><div class="pressure-stat"><b>${diagEdges.length}</b><span>todennettua relaatiota</span></div><div class="pressure-stat"><b>${repairs+locks+high}</b><span>tutkittavaa kohtaa</span></div></div></div><div class="pressure-controls">${[["all","Kaikki"],["korjaava kerros","Korjaavat kerrokset"],["kantava solmu","Kantavat solmut"],["toimeenpanolukko","Toimeenpanolukot"]].map(([v,l])=>`<button class="pressure-filter" data-filter="${v}" aria-pressed="${filter===v}">${l}</button>`).join("")}<div class="pressure-legend">${Object.entries(ROLE).map(([k,m])=>`<span><i style="--rc:${m.c}"></i>${m.label}</span>`).join("")}</div></div><div class="pressure-track-wrap"><div class="pressure-track">${ticks.map(y=>`<span class="pressure-year" style="left:${((y-min)/range)*100}%">${y}</span>`).join("")}${trackData.map(r=>{const meta=roleMeta(r),x=((r.year_start-min)/range)*100,risk=clamp(r.layering_risk??r.pressure_signal_count*14),dim=!matchesFilter(r);return`<button class="pressure-dot ${dim?"is-dim":""}" data-id="${esc(r.item_id)}" aria-label="${esc(r.item_title)}, kerrostumisriski ${fmt(r.layering_risk)}" aria-current="${r.item_id===selectedId}" style="left:${x}%;bottom:${18+risk*1.08}px;--risk:${risk};--role:${meta.c}"><span>${esc(r.item_title)}</span></button>`}).join("")}</div></div>`;el.querySelectorAll(".pressure-filter").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderPressureMode();renderDiagList();applyMapPressure()});el.querySelectorAll(".pressure-dot:not(.is-dim)").forEach(b=>b.onclick=()=>selectItem(b.dataset.id,true))}
function injectDiagUI(){const style=document.createElement("style");style.id="diagIntegratedStyle";style.textContent=DIAG_CSS;document.head.appendChild(style);const toggle=document.createElement("button");toggle.id="diagToggle";toggle.type="button";toggle.textContent="Avaa painediagnoosi";const drawer=document.createElement("aside");drawer.id="diagDrawer";drawer.dataset.open="false";drawer.setAttribute("aria-label","Verkoston korjausketjun diagnoosi");drawer.innerHTML=`<div class="diag-head"><div><div class="diag-kicker">Atlas × Lakikartta</div><h2>Korjausketjun diagnoosi</h2><p>Valitse solmu paineen aikajanalta, Murroskartasta tai luettelosta.</p></div><button class="diag-close" type="button" aria-label="Sulje diagnoosi">×</button></div><div class="diag-tabs">${[["all","Kaikki"],["korjaava kerros","Korjaavat"],["kantava solmu","Kantavat"],["toimeenpanolukko","Lukot"]].map(([v,l])=>`<button class="diag-tab" data-filter="${v}" aria-pressed="${filter===v}">${l}</button>`).join("")}</div><div class="diag-content"><div class="diag-list" id="diagList"></div><div class="diag-detail" id="diagDetail"></div></div>`;document.body.append(toggle,drawer);toggle.onclick=()=>drawer.dataset.open=drawer.dataset.open==="true"?"false":"true";drawer.querySelector(".diag-close").onclick=()=>drawer.dataset.open="false";drawer.querySelectorAll(".diag-tab").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;drawer.querySelectorAll(".diag-tab").forEach(x=>x.setAttribute("aria-pressed",x===b));renderDiagList();renderPressureMode();applyMapPressure()});document.addEventListener("keydown",e=>{if(e.key==="Escape")drawer.dataset.open="false"});document.addEventListener("click",e=>{const node=e.target.closest?.(".node");if(!node||node.closest("#diagDrawer"))return;const id=nodeId(node);if(id)syncFromAtlas(id)},true);const observer=new MutationObserver(records=>{if(records.some(r=>(r.type==="attributes"&&r.attributeName==="aria-pressed"&&r.target.matches?.(".chip[data-chain-id]"))||(r.type==="childList"&&r.target.id==="pressureMode"&&!document.getElementById("lensReading"))))scheduleLensSync()});observer.observe(document.body,{subtree:true,attributes:true,childList:true,attributeFilter:["aria-pressed"]});addPressureMode();renderLensReading();renderDiagList();setTimeout(()=>{renderLensReading();applyMapPressure()},160)}
function findRecord(id){return diagData.find(r=>r.item_id===id)||diagData.find(r=>r.item_id?.includes(id)||id.includes?.(r.item_id)||r.statute_id===id)}
function syncFromAtlas(id){const r=findRecord(id);if(r)selectItem(r.item_id,true)}
function selectItem(id,open){selectedId=id;renderPressureMode();renderDiagList();applyMapPressure();if(open)document.getElementById("diagDrawer").dataset.open="true"}
function chainEdges(id){return diagEdges.filter(e=>e.from_item_id===id||e.to_item_id===id).sort((a,b)=>Number(b.pressure_signal)-Number(a.pressure_signal)||b.weight-a.weight)}
function chainIds(id){const ids=new Set([id]);chainEdges(id).forEach(e=>{ids.add(e.from_item_id);ids.add(e.to_item_id)});return ids}
function applyMapPressure(){const chain=selectedId?chainIds(selectedId):new Set;document.querySelectorAll(".node").forEach(node=>{const id=node.dataset?.id||node.getAttribute("data-id")||node.id||node.querySelector?.("[data-id]")?.dataset?.id,r=id&&findRecord(id);node.classList.remove("pressure-linked","pressure-selected","pressure-chain");if(!r)return;const meta=roleMeta(r);node.classList.add("pressure-linked");if(r.item_id===selectedId)node.classList.add("pressure-selected");else if(chain.has(r.item_id))node.classList.add("pressure-chain");node.style.setProperty("--pressure-role",meta.c);node.style.setProperty("--pressure-risk",clamp(r.layering_risk));node.style.opacity=matchesFilter(r)?"":"0.12"})}
function renderDiagList(){const list=document.getElementById("diagList");if(!list)return;const arr=filtered();if(!selectedId||!arr.some(r=>r.item_id===selectedId))selectedId=arr[0]?.item_id||null;list.innerHTML=arr.map(r=>{const m=roleMeta(r);return`<button class="diag-item" data-id="${esc(r.item_id)}" aria-current="${r.item_id===selectedId}"><b>${esc(r.item_title)}</b><span class="diag-item-meta"><span style="color:${m.c}">${esc(m.label)}</span><span>${r.year_start||""}</span></span><i class="diag-item-bar" style="--w:${clamp(r.layering_risk)}%;--rc:${m.c}"></i></button>`}).join("");list.querySelectorAll(".diag-item").forEach(b=>b.onclick=()=>selectItem(b.dataset.id,false));renderDiagDetail(diagData.find(r=>r.item_id===selectedId))}
function renderDiagDetail(r){const el=document.getElementById("diagDetail");if(!el)return;if(!r){el.innerHTML=`<div class="diag-role">Diagnoosi</div><h3>Ei osumaa</h3><div class="diag-note">Valitulle solmulle ei vielä ole painekartta-aineistoa.</div>`;return}const m=roleMeta(r),metrics=[["Verkostokeskeisyys",r.network],["Muutosintensiteetti",r.change],["Delegaatiosyvyys",r.delegation],["Yhteismuutos",r.coamend],["Resurssipaino",r.budget],["Järjestelmäpaino",r.system_weight]],edges=chainEdges(r.item_id),chain=edges.slice(0,12).map(e=>{const outgoing=e.from_item_id===r.item_id,other=findRecord(outgoing?e.to_item_id:e.from_item_id),color=e.pressure_signal?"#ad4128":e.rel_class==="rakenne"?"#245b78":e.rel_class==="kaari"?"#76558f":"#71808d";return`<div class="chain-edge" style="--ec:${color}"><span class="chain-arrow">${outgoing?"→":"←"}</span><button data-chain-id="${esc(other?.item_id||"")}"><b>${esc(other?.item_title||"Tuntematon solmu")}</b><small>${esc(e.relation_type)} · ${esc(e.rel_class)} · ${esc(e.confidence||"–")}</small></button></div>`}).join("");el.innerHTML=`<div style="--rc:${m.c}"><div class="diag-role">${esc(m.label)}</div><h3>${esc(r.item_title)}</h3><div class="diag-meta">${esc(r.year_start||"")}${r.statute_title?` · ${esc(r.statute_title)} · ${esc(r.statute_id||"")}`:" · ei vielä lakilinkkiä"}</div><div class="diag-path"><div class="diag-step"><b>1 · Alkuperäinen ongelma</b>${esc(r.problem||"Ei vielä kuvattu.")}</div><div class="diag-step"><b>2 · Ratkaisu</b>${esc(r.mechanism||"Ei vielä kuvattu.")}</div><div class="diag-step"><b>3 · Syntynyt riippuvuus</b>${esc(r.long_effect||"Ei vielä kuvattu.")}</div><div class="diag-step"><b>4 · Diagnostinen rooli</b>${esc(m.label)}: säädöksen tai murroksen paikka nykyisessä verkostossa.</div></div><div class="diag-chain"><h4>Saapuvat ja lähtevät vaikutusketjut · ${edges.length}</h4>${chain||`<div class="chain-empty">Solmulle ei ole vielä kirjattuja relaatioita.</div>`}</div><div class="diag-profile"><h4>Paineen osatekijät</h4>${metrics.map(([k,v])=>`<div class="profile-row"><span>${k}</span><span class="profile-bar"><i style="--w:${clamp(v)}%"></i></span><output>${fmt(v)}</output></div>`).join("")}<div class="risk-total"><span>Kerrostumisriski</span><b>${fmt(r.layering_risk)}</b></div></div><div class="diag-action"><b>Purkukohta</b><p>${esc(actionFor(r))}</p></div><div class="diag-note">Aineisto: Supabase paine_v2, ${esc(r.coverage_status||"ei kattavuustietoa")}. Diagnostinen tulkinta ei ole todistettu kausaalisuhde.</div></div>`;el.querySelectorAll("[data-chain-id]").forEach(b=>b.onclick=()=>selectItem(b.dataset.chainId,false))}
async function executeScripts(scripts){for(const old of scripts){const s=document.createElement("script");[...old.attributes].forEach(a=>s.setAttribute(a.name,a.value));if(old.src){await new Promise((resolve,reject)=>{s.onload=resolve;s.onerror=reject;document.body.appendChild(s)}).catch(err=>console.warn("Murroskartan skriptin lataus epäonnistui",old.src,err))}else{s.textContent=old.textContent;document.body.appendChild(s)}}}
async function apiFetch(url){const r=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});if(!r.ok)throw new Error(`Supabase Data API: ${r.status}`);return r.json()}
async function boot(){document.documentElement.classList.add("diag-loading");try{const[htmlResp,nodes,edges]=await Promise.all([fetch(BASE_HTML),apiFetch(NODES_API),apiFetch(EDGES_API)]);if(!htmlResp.ok)throw new Error(`arviointikartta.html: ${htmlResp.status}`);const source=await htmlResp.text();diagData=normalize(nodes);diagEdges=Array.isArray(edges)?edges:[];const doc=new DOMParser().parseFromString(source,"text/html");document.title="Murroskartta 1800–2050 · painekartta";doc.head.querySelectorAll('style,link[rel="stylesheet"]').forEach(n=>document.head.appendChild(n.cloneNode(true)));const scripts=[...doc.querySelectorAll("script")];doc.querySelectorAll("script").forEach(s=>s.remove());document.body.innerHTML=doc.body.innerHTML;await executeScripts(scripts);document.dispatchEvent(new Event("DOMContentLoaded",{bubbles:true}));injectDiagUI();document.documentElement.classList.remove("diag-loading")}catch(err){console.error(err);document.getElementById("diagBootstrap").innerHTML=`<div class="box"><strong>Painekartan lataus epäonnistui</strong><span>${esc(err.message)}</span></div>`}}
boot();
})();
