<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Murroskartta 1800–2050 · diagnoositila</title>
<meta name="description" content="Murroskartta ja avautuva Atlas–Lakikartta-diagnoosi samassa DOM-näkymässä.">
<style id="diag-bootstrap-style">
  html.diag-loading body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f2ede3;color:#15293c}
  #diagBootstrap{min-height:100vh;display:grid;place-items:center;padding:30px}
  #diagBootstrap .box{padding:18px 22px;border:1px solid #d6cec0;border-radius:14px;background:#fffdf8}
  #diagBootstrap strong{display:block;margin-bottom:5px}
</style>
</head>
<body>
<div id="diagBootstrap"><div class="box"><strong>Ladataan Murroskarttaa…</strong><span>Arviointikartta ja diagnoosiaineisto yhdistetään samaan näkymään.</span></div></div>

<script>
(() => {
  "use strict";

  const BASE_HTML = "./arviointikartta.html";
  const DIAG_DATA = "./painekartta-data.json";

  const DIAG_CSS = `
  #diagToggle{
    position:fixed;right:18px;bottom:18px;z-index:10020;
    border:1px solid var(--line,#d6cec0);border-radius:999px;
    padding:10px 15px;background:var(--ink,#15293c);color:var(--paper,#fffdf8);
    box-shadow:0 12px 34px -18px rgba(0,0,0,.55);cursor:pointer;
    font:700 11px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    letter-spacing:.03em
  }
  #diagToggle:hover{transform:translateY(-1px)}
  #diagDrawer{
    position:fixed;z-index:10010;right:14px;top:14px;bottom:14px;
    width:min(560px,calc(100vw - 28px));display:flex;flex-direction:column;
    background:var(--paper,#fffdf8);border:1px solid var(--line,#d6cec0);
    border-radius:18px;box-shadow:0 24px 70px -28px rgba(0,0,0,.62);
    transform:translateX(calc(100% + 35px));transition:transform .25s ease;
    overflow:hidden;color:var(--ink,#15293c)
  }
  #diagDrawer[data-open="true"]{transform:translateX(0)}
  .diag-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;
    padding:15px 16px 13px;border-bottom:1px solid var(--line,#d6cec0);
    background:linear-gradient(180deg,var(--paper2,#faf6ee),transparent)}
  .diag-kicker{font:800 9px/1.3 ui-sans-serif,system-ui;letter-spacing:.16em;text-transform:uppercase;color:var(--hot,#ad4128)}
  .diag-head h2{font:400 23px/1.08 "Iowan Old Style",Georgia,serif;margin:5px 0 3px}
  .diag-head p{margin:0;max-width:47ch;font-size:10px;line-height:1.45;color:var(--muted,#6d7883)}
  .diag-close{border:1px solid var(--line,#d6cec0);background:var(--paper,#fffdf8);
    width:31px;height:31px;border-radius:50%;cursor:pointer;font-size:16px}
  .diag-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line,#d6cec0)}
  .diag-tab{border:1px solid var(--line,#d6cec0);border-radius:999px;background:var(--paper2,#faf6ee);
    padding:5px 8px;font-size:9.5px;cursor:pointer;color:var(--muted,#6d7883)}
  .diag-tab[aria-pressed="true"]{background:var(--ink,#15293c);border-color:var(--ink,#15293c);color:var(--paper,#fffdf8)}
  .diag-content{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:0;flex:1}
  .diag-list{overflow:auto;border-right:1px solid var(--line,#d6cec0);padding:7px}
  .diag-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid color-mix(in srgb,var(--line,#d6cec0) 60%,transparent);
    background:transparent;padding:8px 7px;cursor:pointer}
  .diag-item:hover,.diag-item[aria-current="true"]{background:var(--paper2,#faf6ee)}
  .diag-item b{display:block;font-size:10px;line-height:1.3}
  .diag-item span{display:flex;justify-content:space-between;gap:6px;margin-top:3px;font-size:8.5px;color:var(--muted,#6d7883)}
  .diag-item i{display:block;height:3px;margin-top:5px;border-radius:9px;background:var(--soft,#ece5d9);overflow:hidden}
  .diag-item i:after{content:"";display:block;height:100%;width:var(--w,0%);background:var(--hot,#ad4128)}
  .diag-detail{overflow:auto;padding:14px 15px}
  .diag-role{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--hot,#ad4128)}
  .diag-detail h3{font:400 24px/1.08 "Iowan Old Style",Georgia,serif;margin:5px 0 3px}
  .diag-meta{font-size:9px;color:var(--muted,#6d7883);margin-bottom:10px}
  .diag-story{border-left:2px solid var(--line,#d6cec0);padding:7px 9px;margin:7px 0;background:var(--paper2,#faf6ee);font-size:10px;line-height:1.48}
  .diag-story b{display:block;margin-bottom:2px;color:var(--ink,#15293c)}
  .diag-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}
  .diag-metric{padding:7px;border:1px solid var(--line,#d6cec0);border-radius:8px}
  .diag-metric span{display:block;font-size:8px;color:var(--muted,#6d7883)}
  .diag-metric b{font:400 16px/1.1 "Iowan Old Style",Georgia,serif}
  .diag-action{margin-top:10px;padding:10px;border:1px solid var(--line,#d6cec0);border-radius:10px;
    background:color-mix(in srgb,var(--future,#2f6b4f) 5%,var(--paper2,#faf6ee))}
  .diag-action b{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--future,#2f6b4f)}
  .diag-action p{margin:5px 0 0;font-size:10px;line-height:1.5;color:var(--ink2,#3c4d5e)}
  .diag-note{margin-top:10px;font-size:8.5px;line-height:1.45;color:var(--muted,#6d7883)}
  .diag-sync{margin-top:8px;padding-top:8px;border-top:1px solid var(--line,#d6cec0);
    font:italic 12px/1.45 "Iowan Old Style",Georgia,serif}
  @media(max-width:720px){
    #diagDrawer{right:7px;left:7px;top:7px;bottom:7px;width:auto}
    .diag-content{grid-template-columns:1fr}
    .diag-list{max-height:190px;border-right:0;border-bottom:1px solid var(--line,#d6cec0)}
  }`;

  let diagData = [];
  let selectedId = null;
  let filter = "all";

  const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[m]));
  const fmt = v => Number.isFinite(+v) ? (+v).toFixed(1) : "–";

  function normalize(raw){
    const arr = Array.isArray(raw) ? raw : (raw?.items || raw?.data || []);
    return arr.map(r => ({
      ...r,
      item_id: r.item_id || r.id,
      item_title: r.item_title || r.title || r.label || r.statute_title || r.item_id,
      statute_title: r.statute_title || r.law_title || r.item_title || r.title,
      year_start: +(r.year_start ?? r.year ?? r.statute_year ?? 0),
      network: +(r.network ?? r.network_component ?? NaN),
      change: +(r.change ?? r.legislative_change_intensity ?? NaN),
      delegation: +(r.delegation ?? r.delegation_depth_score ?? NaN),
      coamend: +(r.coamend ?? r.co_amendment_centrality ?? NaN),
      budget: +(r.budget ?? r.budget_component ?? NaN),
      system_weight: +(r.system_weight ?? r.institutional_system_weight ?? NaN),
      layering_risk: +(r.layering_risk ?? r.pressure ?? NaN),
      repair_signal: !!(r.repair_signal ?? (r.role === "korjaava kerros")),
      role: r.role || "perusrakenne"
    })).filter(r => r.item_id);
  }

  function roleOf(r){
    if(r.role) return r.role;
    if(r.repair_signal) return "korjaava kerros";
    if(Number.isFinite(r.delegation) && r.delegation >= 70) return "toimeenpanolukko";
    if(Number.isFinite(r.network) && r.network >= 65) return "kantava solmu";
    return "perusrakenne";
  }

  function filtered(){
    return diagData.filter(r => {
      const role = roleOf(r);
      if(filter === "repair") return role === "korjaava kerros";
      if(filter === "carry") return role === "kantava solmu";
      if(filter === "lock") return role === "toimeenpanolukko";
      return true;
    }).sort((a,b) => (b.layering_risk||0) - (a.layering_risk||0));
  }

  function actionFor(r){
    const n=r.network||0,c=r.change||0,d=r.delegation||0,co=r.coamend||0;
    if(r.repair_signal && (r.layering_risk||0)>=60)
      return "Tutki, voidaanko myöhempi korjaava kerros korvata muuttamalla sitä aiempaa rakennetta, jonka sivuvaikutusta tai yhteensovitusongelmaa se joutuu paikkaamaan.";
    if(d>=70)
      return "Lyhennä toimeenpanoketjua: yhdistä vastuita, vakioi rajapintoja ja poista sellaisia delegaatiokerroksia, jotka tekevät muutoksesta järjestelmätasoisen.";
    if(co>=45)
      return "Erota välttämättömät yhteismuutokset sellaisista kytkennöistä, jotka voidaan korvata vakaalla rajapinnalla tai yhteisellä perussäännöllä.";
    if(n>=65)
      return "Suojaa kantavan solmun rajapinnat ja tee vaikutusketjutesti ennen parametrimuutosta. Tavoite ei ole purkaa hyödyllistä verkkoa vaan vähentää pakollista kytkentää.";
    if(c>=65)
      return "Korkea muutostahti viittaa jatkuvaan säätämiseen. Selvitä, onko toistuvien parametrikorjausten taustalla yksi pysyvä mekanismi, jota voisi muuttaa kerralla.";
    return "Säilytä paikallinen muutoskyky. Vältä uuden poikkeuksen tai rinnakkaisen reitin lisäämistä ilman, että jokin vanha riippuvuus samalla poistuu.";
  }

  function injectDiagUI(){
    const style = document.createElement("style");
    style.id = "diagIntegratedStyle";
    style.textContent = DIAG_CSS;
    document.head.appendChild(style);

    const toggle = document.createElement("button");
    toggle.id = "diagToggle";
    toggle.type = "button";
    toggle.textContent = "Diagnoosi · korjausketju";

    const drawer = document.createElement("aside");
    drawer.id = "diagDrawer";
    drawer.dataset.open = "false";
    drawer.setAttribute("aria-label","Verkoston korjausketjun diagnoosi");
    drawer.innerHTML = `
      <div class="diag-head">
        <div><div class="diag-kicker">Atlas × Lakikartta</div>
          <h2>Missä verkosto alkaa korjata itseään?</h2>
          <p>Valitse Murroskartan solmu tai selaa säädöksiä. Diagnoosi erottaa alkuperäisen ongelman, syntyneen kytkennän ja mahdollisen myöhemmän korjauskerroksen.</p>
        </div>
        <button class="diag-close" type="button" aria-label="Sulje diagnoosi">×</button>
      </div>
      <div class="diag-tabs">
        <button class="diag-tab" data-filter="all" aria-pressed="true">Kaikki</button>
        <button class="diag-tab" data-filter="repair" aria-pressed="false">Korjaavat kerrokset</button>
        <button class="diag-tab" data-filter="carry" aria-pressed="false">Kantavat solmut</button>
        <button class="diag-tab" data-filter="lock" aria-pressed="false">Toimeenpanolukot</button>
      </div>
      <div class="diag-content">
        <div class="diag-list" id="diagList"></div>
        <div class="diag-detail" id="diagDetail"></div>
      </div>`;

    document.body.append(toggle, drawer);
    toggle.onclick = () => drawer.dataset.open = drawer.dataset.open === "true" ? "false" : "true";
    drawer.querySelector(".diag-close").onclick = () => drawer.dataset.open = "false";
    drawer.querySelectorAll(".diag-tab").forEach(b => b.onclick = () => {
      filter = b.dataset.filter;
      drawer.querySelectorAll(".diag-tab").forEach(x =>
        x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      renderDiagList();
    });

    document.addEventListener("keydown", e => {
      if(e.key === "Escape" && drawer.dataset.open === "true") drawer.dataset.open = "false";
    });

    document.addEventListener("click", e => {
      const node = e.target.closest?.(".node");
      if(!node || node.closest("#diagDrawer")) return;
      const id = node.dataset?.id || node.getAttribute("data-id") ||
                 node.id || node.querySelector?.("[data-id]")?.dataset?.id;
      if(id) syncFromAtlas(id);
    }, true);

    renderDiagList();
  }

  function syncFromAtlas(id){
    const exact = diagData.find(r => r.item_id === id);
    const loose = exact || diagData.find(r =>
      r.item_id?.includes(id) || id.includes?.(r.item_id) ||
      r.statute_id === id
    );
    if(!loose) return;
    selectedId = loose.item_id;
    renderDiagList();
    renderDiagDetail(loose, true);
    document.getElementById("diagDrawer").dataset.open = "true";
  }

  function renderDiagList(){
    const list = document.getElementById("diagList");
    if(!list) return;
    const arr = filtered();
    if(!selectedId || !arr.some(r => r.item_id === selectedId)) selectedId = arr[0]?.item_id || null;
    list.innerHTML = arr.map(r => `
      <button class="diag-item" data-id="${esc(r.item_id)}" aria-current="${r.item_id===selectedId}">
        <b>${esc(r.statute_title || r.item_title)}</b>
        <span><span>${esc(roleOf(r))}</span><span>${r.year_start||""}</span></span>
        <i style="--w:${Math.max(0,Math.min(100,r.layering_risk||0))}%"></i>
      </button>`).join("");
    list.querySelectorAll(".diag-item").forEach(b => b.onclick = () => {
      selectedId = b.dataset.id;
      const r = diagData.find(x => x.item_id === selectedId);
      renderDiagList();
      renderDiagDetail(r, false);
    });
    renderDiagDetail(diagData.find(r => r.item_id === selectedId), false);
  }

  function renderDiagDetail(r, synced){
    const el = document.getElementById("diagDetail");
    if(!el) return;
    if(!r){
      el.innerHTML = `<div class="diag-role">Diagnoosi</div><h3>Ei osumaa</h3>
      <div class="diag-note">Valitulle Murroskartan solmulle ei vielä ole Atlas–Lakikartta-linkitystä painekartta-data.json-aineistossa.</div>`;
      return;
    }
    const metrics = [
      ["verkostokeskeisyys",r.network],["muutosintensiteetti",r.change],
      ["delegaatiosyvyys",r.delegation],["yhteismuutos",r.coamend],
      ["resurssipaino",r.budget],["kerrostumisriski",r.layering_risk]
    ];
    el.innerHTML = `
      <div class="diag-role">${esc(roleOf(r))}</div>
      <h3>${esc(r.statute_title || r.item_title)}</h3>
      <div class="diag-meta">${esc(r.year_start || "")} · ${esc(r.statute_id || "")}</div>
      <div class="diag-story"><b>1 · Alkuperäinen ongelma</b>${esc(r.problem || "Ei vielä kuvattu.")}</div>
      <div class="diag-story"><b>2 · Ratkaisu ja uusi kytkentä</b>${esc(r.mechanism || "Ei vielä kuvattu.")}</div>
      <div class="diag-story"><b>3 · Pitkä vaikutus</b>${esc(r.long_effect || "Ei vielä kuvattu.")}</div>
      <div class="diag-metrics">${metrics.map(([k,v]) =>
        `<div class="diag-metric"><span>${k}</span><b>${fmt(v)}</b></div>`).join("")}</div>
      <div class="diag-action"><b>Mitä voisi yrittää purkaa?</b><p>${esc(actionFor(r))}</p></div>
      ${synced?`<div class="diag-sync">Tämä diagnoosi avautui Murroskartassa valitusta solmusta.</div>`:""}
      <div class="diag-note">Diagnostinen tulkinta, ei todistettu kausaalisuhde. Tavoitteena on tunnistaa kohdat, joissa uusi sääntely näyttää korjaavan aiemman rakenteen yhteensovitusongelmaa.</div>`;
  }

  async function executeScripts(scripts){
    for(const old of scripts){
      const s=document.createElement("script");
      [...old.attributes].forEach(a => s.setAttribute(a.name,a.value));
      if(old.src){
        await new Promise((resolve,reject)=>{
          s.onload=resolve;s.onerror=reject;
          document.body.appendChild(s);
        }).catch(err => console.warn("Murroskartan skriptin lataus epäonnistui",old.src,err));
      }else{
        s.textContent=old.textContent;
        document.body.appendChild(s);
      }
    }
  }

  async function boot(){
    document.documentElement.classList.add("diag-loading");
    try{
      const [htmlResp,dataResp] = await Promise.all([fetch(BASE_HTML),fetch(DIAG_DATA)]);
      if(!htmlResp.ok) throw new Error(`arviointikartta.html: ${htmlResp.status}`);
      if(!dataResp.ok) throw new Error(`painekartta-data.json: ${dataResp.status}`);

      const source = await htmlResp.text();
      diagData = normalize(await dataResp.json());

      const doc = new DOMParser().parseFromString(source,"text/html");
      document.title = "Murroskartta 1800–2050 · diagnoositila";

      doc.head.querySelectorAll('style,link[rel="stylesheet"]').forEach(n =>
        document.head.appendChild(n.cloneNode(true)));

      const scripts = [...doc.querySelectorAll("script")];
      doc.querySelectorAll("script").forEach(s => s.remove());

      document.body.innerHTML = doc.body.innerHTML;
      await executeScripts(scripts);
      document.dispatchEvent(new Event("DOMContentLoaded",{bubbles:true}));

      injectDiagUI();
      document.documentElement.classList.remove("diag-loading");
    }catch(err){
      console.error(err);
      document.getElementById("diagBootstrap").innerHTML =
        `<div class="box"><strong>Murroskartan lataus epäonnistui</strong><span>${esc(err.message)}</span></div>`;
    }
  }

  boot();
})();
</script>
</body>
</html>
