<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maisema 3D · Suomen rakennemuutosten atlas</title>
<style>
:root{--bg:#070a0f;--panel:rgba(12,18,28,.88);--line:#29374c;--text:#eef3fb;--muted:#9aa7bb;--accent:#ffd166;--R:#4f8ef7;--S:#2fd08c;--K:#f4536a;--A:#8d70c9;--M:#b06a5a}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 50% 15%,#182337 0,#0b111b 38%,var(--bg) 78%)}
button,input,select{font:inherit}.stage{position:fixed;inset:0}.canvas-wrap{position:absolute;inset:0}canvas{display:block}.hud{position:absolute;z-index:5;pointer-events:none}.panel{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 54px rgba(0,0,0,.4);backdrop-filter:blur(14px)}
.intro{left:18px;top:18px;width:min(330px,calc(100vw - 36px));padding:17px}.kicker{font:600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.17em;text-transform:uppercase;color:var(--accent)}h1{margin:7px 0 4px;font:600 25px/1.08 Georgia,serif}p{margin:0;color:#cbd4e3}.legend{display:grid;grid-template-columns:repeat(3,max-content);gap:8px 14px;margin-top:14px;font-size:11px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:6px}.sw{width:8px;height:8px;border-radius:50%}
.controls{left:18px;bottom:18px;width:min(510px,calc(100vw - 36px));padding:14px 16px}.control-row{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center}.control-row+.control-row{margin-top:11px}.control-label{font:600 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--accent)}.year{min-width:45px;text-align:right;font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent)}select,.btn{border:1px solid var(--line);border-radius:9px;background:#111a28;color:var(--text);padding:7px 9px}.btn{cursor:pointer}.btn:hover{border-color:#50617a}.actions{display:flex;gap:7px;justify-content:flex-end}
.details{right:18px;top:18px;width:min(350px,calc(100vw - 36px));padding:17px;display:none}.details.open{display:block}.details h2{margin:6px 28px 7px 0;font:600 21px/1.15 Georgia,serif}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{padding:3px 7px;border-radius:999px;border:1px solid var(--line);font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#cbd4e3}.close{position:absolute;right:12px;top:11px;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:#111a28;color:var(--text);cursor:pointer}.summary{max-height:33vh;overflow:auto;padding-right:5px;color:#d8e0ec}.hint{position:absolute;left:50%;top:20px;transform:translateX(-50%);z-index:4;padding:8px 12px;border-radius:999px;background:rgba(8,12,19,.72);border:1px solid rgba(120,142,174,.28);font-size:11px;color:#aebacf;pointer-events:none}.loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#070a0f;color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}.loading[hidden]{display:none}.error{max-width:620px;margin:20px;padding:22px;border:1px solid #793f4a;border-radius:12px;background:#1b1116;color:#ffd9df;white-space:pre-wrap}
@media(max-width:900px){.intro{width:280px}.details{top:auto;bottom:140px}.hint{display:none}.legend{grid-template-columns:repeat(2,max-content)}}
@media(max-width:620px){.intro{top:10px;left:10px;width:calc(100vw - 20px);padding:12px}.intro p,.legend{display:none}h1{font-size:18px}.controls{left:10px;bottom:10px;width:calc(100vw - 20px)}.details{right:10px;left:10px;bottom:132px;width:auto;max-height:45vh}.actions .btn:first-child{display:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="canvas-wrap" id="canvasWrap"></div>
  <div class="hint">Vedä kiertääksesi · rullaa zoomataksesi · napsauta solmua</div>
  <section class="hud panel intro">
    <div class="kicker">M05 · Historiamaisema</div>
    <h1>Rakennemuutokset tilassa</h1>
    <p>Aika kulkee vasemmalta oikealle. Syvyys erottaa teemaluokat ja korkeus kausaalisen vaiheen.</p>
    <div class="legend" id="legend"></div>
  </section>
  <section class="hud panel controls" aria-label="Maiseman ohjaimet">
    <div class="control-row"><span class="control-label">Aika</span><input id="yearRange" type="range" min="1850" max="2050" value="2050" step="1"><output class="year" id="yearOut">2050</output></div>
    <div class="control-row"><span class="control-label">Teema</span><select id="themeSelect"><option value="">Kaikki teemat</option></select><div class="actions"><button class="btn" id="playBtn" type="button">▶ Toista</button><button class="btn" id="resetBtn" type="button">Palauta</button></div></div>
  </section>
  <aside class="hud panel details" id="details" aria-live="polite"><button class="close" id="closeDetails" aria-label="Sulje">×</button><div class="kicker" id="detailId"></div><h2 id="detailTitle"></h2><div class="meta" id="detailMeta"></div><div class="summary" id="detailSummary"></div></aside>
  <div class="loading" id="loading">Rakennetaan historiamaisemaa…</div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module" src="./maisema-app.js"></script>
</body>
</html>
