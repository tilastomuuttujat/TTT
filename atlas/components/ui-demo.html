<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atlas UI Kit</title>
  <script type="module" src="./atlas-ui.js"></script>
  <style>
    :root{--bg:#f3f0e7;--paper:#fffdf7;--ink:#172421;--muted:#66716b;--line:#dcd5c7;--accent:#1f4642;--copper:#b56a34}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header,main{width:min(1180px,calc(100% - 32px));margin:auto} header{padding:54px 0 28px} h1{margin:0;color:var(--accent);font:600 clamp(2rem,5vw,4.2rem)/1.02 Georgia,serif}.lead{max-width:780px;color:var(--muted);font-size:1.05rem;line-height:1.6}
    main{padding-bottom:80px}.section{margin-top:28px}.section>h2{margin:0 0 12px;color:var(--accent);font:600 1.35rem Georgia,serif}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.full{grid-column:1/-1}
    atlas-stat-card,atlas-topic,atlas-article,atlas-timeline,atlas-network{--atlas-paper:#fffdf7;--atlas-line:#dcd5c7;--atlas-title:#1f4642;--atlas-ink:#172421;--atlas-radius:16px;--atlas-serif:Georgia,serif}
    code{background:#ebe6da;padding:2px 5px;border-radius:5px}@media(max-width:760px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
<header>
  <h1>Atlas UI Kit</h1>
  <p class="lead">Sama komponenttikirjasto toimii TTT:ssä, Hyvinvointivaltio-sivustossa ja muissa julkaisuissa. Sivusto tuo yhden moduulin ja käyttää semanttisia HTML-elementtejä.</p>
</header>
<main>
  <section class="section">
    <h2>Tilastokortit</h2>
    <div class="grid">
      <atlas-stat-card card="JULKINEN_VELKA_POLKU"></atlas-stat-card>
      <atlas-stat-card card="SYNTYVYYS_MURROS"></atlas-stat-card>
    </div>
  </section>

  <section class="section">
    <h2>Aihekokonaisuus</h2>
    <atlas-topic class="full" item="1990-luvun-lama" cards="TYOTTOMYYS_1990_2024,JULKINEN_VELKA_POLKU"></atlas-topic>
  </section>

  <section class="section">
    <h2>Aikajana ja verkko</h2>
    <div class="grid">
      <atlas-timeline domain="talous" limit="8"></atlas-timeline>
      <atlas-network focus="1990-luvun-lama" depth="1"></atlas-network>
    </div>
  </section>

  <section class="section">
    <h2>Artikkeli</h2>
    <atlas-article article="1990-luvun-laman-pitka-varjo"></atlas-article>
  </section>
</main>
</body>
</html>
