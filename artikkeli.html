<style>
:root{--ink:#142631;--paper:#f4f0e7;--teal:#1f6f71;--blue:#245878;--ochre:#b57a22;--rust:#b54c2a;--red:#912e27;--line:rgba(20,38,49,.18);--soft:#e7dfd1;--white:#fffdf8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 18% 4%,rgba(255,255,255,.72),transparent 32rem),var(--paper);color:var(--ink);font-family:Fraunces,Georgia,serif;text-rendering:optimizeLegibility}a{color:inherit}.hidden{display:none!important}
.masthead{display:flex;align-items:center;justify-content:space-between;max-width:1240px;margin:auto;padding:28px 32px;border-bottom:1px solid var(--line);font:700 11px/1.2 Inter,sans-serif;letter-spacing:.16em}.brand{display:flex;align-items:center;gap:12px;text-decoration:none}.brand-mark{display:grid;width:30px;height:30px;place-items:center;border-radius:50%;background:var(--ink);color:var(--paper);font-size:14px;letter-spacing:0}.masthead-actions{display:flex;align-items:center;gap:24px}.masthead-meta{color:rgba(20,38,49,.62)}.copy-link{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:800 10px/1 Inter,sans-serif;letter-spacing:.12em;cursor:pointer}.copy-link:hover,.copy-link:focus-visible{border-color:var(--ink);background:var(--ink);color:var(--paper);outline:0}.copy-link.copied{border-color:var(--teal);background:var(--teal);color:#fff}
.hero{max-width:1100px;margin:auto;padding:104px 32px 88px;text-align:center}.kicker,.num{margin:0 0 25px;color:var(--rust);font:800 12px/1.2 Inter,sans-serif;letter-spacing:.2em}.hero h1{max-width:1000px;margin:auto;font-size:clamp(3.1rem,8.4vw,7.5rem);font-weight:500;line-height:.89;letter-spacing:-.055em}.hero h1 em{display:block;color:var(--red);font-weight:500}.dek{max-width:760px;margin:38px auto 0;color:rgba(20,38,49,.76);font-size:clamp(1.25rem,2.2vw,1.8rem);line-height:1.42}.spectrum{display:flex;justify-content:center;gap:5px;margin-top:55px}.spectrum i{display:block;width:54px;height:5px}.spectrum i:nth-child(1){background:var(--teal)}.spectrum i:nth-child(2){background:var(--blue)}.spectrum i:nth-child(3){background:var(--ochre)}.spectrum i:nth-child(4){background:var(--rust)}.spectrum i:nth-child(5){background:var(--red)}
.shell{display:grid;grid-template-columns:230px minmax(0,720px);gap:76px;max-width:1100px;margin:auto;padding:0 32px 120px;align-items:start}.toc{position:sticky;top:28px;padding-top:8px;font-family:Inter,sans-serif}.toc>p{margin:0 0 18px;font-size:10px;font-weight:800;letter-spacing:.18em}.toc nav{border-top:1px solid var(--line)}.toc a{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);color:rgba(20,38,49,.69);font-size:11px;line-height:1.3;text-decoration:none}.toc a:hover{color:var(--red)}.infographic-thumb{display:block;width:100%;margin:0 0 22px;padding:8px;border:1px solid var(--line);background:var(--soft);font:700 10px/1.35 Inter,sans-serif;letter-spacing:.06em;text-align:left;cursor:zoom-in}.infographic-thumb img{display:block;width:100%;height:auto}.infographic-thumb span{display:flex;justify-content:space-between;gap:8px;padding:9px 2px 1px}.infographic-thumb span::after{content:'↗';color:var(--rust);font-size:14px}
.prose{min-width:0}.prose>p,.prose section>p{margin:0 0 1.45em;font-size:1.19rem;line-height:1.78;hyphens:auto}.prose>.lead{font-size:1.5rem;line-height:1.62}.lead:first-child::first-letter{float:left;margin:.08em .12em 0 0;color:var(--red);font-size:5.2rem;font-weight:600;line-height:.75}.prose section{scroll-margin-top:28px;padding-top:78px}.prose h2{margin:0 0 32px;font-size:clamp(2.15rem,4.2vw,3.35rem);font-weight:500;line-height:1.03;letter-spacing:-.035em}.prose .num{margin-bottom:13px;font-size:12px;line-height:1.2}.bullets{margin:40px 0;padding:30px 34px;background:var(--ink);color:var(--paper)}.bullets li{margin:.75em 0;line-height:1.5}blockquote{margin:48px 0;padding:8px 0 8px 30px;border-left:5px solid var(--rust);color:var(--blue);font-size:1.55rem;font-style:italic;line-height:1.48}.closing{margin-top:55px;padding:42px 46px;border:0;background:var(--ink);color:var(--paper)}
/* Narratiivinen visualisointimoduuli */
.story-viz{margin:64px 0 8px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:28px 0 30px;font-family:Inter,sans-serif}.story-viz__eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:var(--rust);font-size:10px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}.story-viz__eyebrow::before{content:'';width:26px;height:3px;background:var(--rust)}.story-viz h3{margin:0;max-width:650px;font:500 clamp(1.8rem,4vw,2.8rem)/1.03 Fraunces,serif;letter-spacing:-.035em}.story-viz__intro{margin:14px 0 24px!important;max-width:620px;color:rgba(20,38,49,.72);font:500 14px/1.6 Inter,sans-serif!important}.story-viz__canvas{position:relative;overflow:hidden;background:rgba(255,253,248,.54);border:1px solid var(--line);padding:22px}.story-viz__chain{display:grid;gap:10px}.chain-step{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr);gap:13px;align-items:start;padding:13px 14px;border:1px solid rgba(20,38,49,.14);background:rgba(255,255,255,.54);opacity:.32;transition:opacity .25s,border-color .25s,transform .25s,background .25s}.chain-step.is-visible{opacity:1}.chain-step.is-current{border-color:var(--rust);background:#fffaf2;transform:translateX(3px)}.chain-step:not(:last-child)::after{content:'';position:absolute;left:34px;bottom:-11px;width:1px;height:11px;background:rgba(20,38,49,.3)}.chain-step__n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:11px;font-weight:800}.chain-step__label{margin:1px 0 3px;color:var(--rust);font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.chain-step__title{font:700 14px/1.3 Inter,sans-serif}.chain-step__text{margin:4px 0 0!important;color:rgba(20,38,49,.72);font:500 12px/1.48 Inter,sans-serif!important}.story-viz__controls{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px}.story-viz__progress{font-size:10px;font-weight:800;letter-spacing:.12em;color:rgba(20,38,49,.58)}.story-viz__buttons{display:flex;gap:8px}.story-viz button{min-height:42px;padding:0 15px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:800 10px/1 Inter,sans-serif;letter-spacing:.09em;cursor:pointer}.story-viz button.primary{background:var(--ink);color:var(--paper)}.story-viz button:disabled{opacity:.35;cursor:not-allowed}.story-viz__takeaway{margin:18px 0 0!important;padding:16px 18px;border-left:4px solid var(--teal);background:rgba(31,111,113,.08);font:600 13px/1.55 Inter,sans-serif!important}.story-viz__atlas{display:inline-flex;margin-top:15px;color:var(--blue);font:800 10px/1.2 Inter,sans-serif;letter-spacing:.1em;text-decoration:none}.story-viz__atlas:hover{text-decoration:underline}
.timeline-viz__years{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.timeline-viz__years button{flex:1;min-width:72px;border-color:var(--line)}.timeline-viz__years button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}.timeline-viz__panel{margin-top:15px;padding:19px;border-left:4px solid var(--ochre);background:rgba(181,122,34,.08)}.timeline-viz__year{font:800 11px/1 Inter,sans-serif;letter-spacing:.12em;color:var(--rust)}.timeline-viz__title{margin:8px 0 5px!important;font:600 22px/1.15 Fraunces,serif!important}.timeline-viz__text{margin:0!important;font:500 13px/1.55 Inter,sans-serif!important;color:rgba(20,38,49,.72)}
/* Rinnakkainen muuttujavertailu */
.compare-viz__selector{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:10px;margin:20px 0 18px}.compare-viz__selector button{width:48px;height:48px;padding:0;border:1px solid var(--ink);background:transparent;font-size:20px}.compare-viz__variable{text-align:center}.compare-viz__variable small{display:block;margin-bottom:5px;color:rgba(20,38,49,.55);font:800 9px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase}.compare-viz__variable strong{display:block;font:600 clamp(1.35rem,3vw,2rem)/1.1 Fraunces,serif;letter-spacing:-.02em}.compare-viz__question{margin:7px auto 0!important;max-width:560px;color:rgba(20,38,49,.68);font:500 12px/1.5 Inter,sans-serif!important}.compare-viz__grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.compare-lane{min-width:0;border:1px solid var(--line);background:rgba(255,253,248,.55);padding:16px}.compare-lane--a{border-top:4px solid var(--teal)}.compare-lane--b{border-top:4px solid var(--rust)}.compare-lane__head{min-height:78px;padding-bottom:12px;border-bottom:1px solid var(--line)}.compare-lane__tag{margin-bottom:7px;color:rgba(20,38,49,.55);font:800 9px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase}.compare-lane__title{font:700 14px/1.3 Inter,sans-serif}.compare-lane__sub{margin:5px 0 0!important;color:rgba(20,38,49,.62);font:500 11px/1.45 Inter,sans-serif!important}.compare-chain{display:grid;gap:0;padding-top:10px}.compare-step{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr);gap:9px;padding:10px 0 14px;opacity:.18;transform:translateY(5px);transition:opacity .35s,transform .35s}.compare-step.is-visible{opacity:1;transform:none}.compare-step.is-current .compare-step__dot{transform:scale(1.16);box-shadow:0 0 0 4px rgba(20,38,49,.08)}.compare-step:not(:last-child)::after{content:'';position:absolute;left:12px;top:35px;bottom:-1px;width:1px;background:var(--line);transform:scaleY(0);transform-origin:top;transition:transform .45s}.compare-step.is-visible:not(:last-child)::after{transform:scaleY(1)}.compare-step__dot{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--ink);color:var(--paper);font:800 9px/1 Inter,sans-serif;transition:.25s}.compare-lane--a .compare-step.is-current .compare-step__dot{background:var(--teal)}.compare-lane--b .compare-step.is-current .compare-step__dot{background:var(--rust)}.compare-step__kicker{margin:1px 0 4px;color:rgba(20,38,49,.52);font:800 8px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase}.compare-step__title{font:700 12px/1.35 Inter,sans-serif}.compare-step__text{margin:3px 0 0!important;color:rgba(20,38,49,.68);font:500 10.5px/1.48 Inter,sans-serif!important}.compare-viz__synthesis{display:grid;grid-template-columns:92px 1fr;gap:12px;margin-top:14px;padding:14px 16px;background:var(--ink);color:var(--paper)}.compare-viz__synthesis b{font:800 9px/1.25 Inter,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#d9c8a8}.compare-viz__synthesis p{margin:0!important;font:500 12px/1.55 Inter,sans-serif!important}.compare-viz__dots{display:flex;justify-content:center;gap:6px;margin-top:12px}.compare-viz__dots i{display:block;width:6px;height:6px;border-radius:50%;background:rgba(20,38,49,.2)}.compare-viz__dots i.active{background:var(--rust);transform:scale(1.3)}

/* Sama ihminen, kaksi järjestelmää */
.two-systems__tabs{display:flex;gap:7px;overflow:auto;margin:20px 0 14px;padding-bottom:3px}.two-systems__tabs button{flex:0 0 auto;border-color:var(--line)}.two-systems__tabs button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}.two-systems__case{margin:0 0 16px;padding:16px 18px;border-left:4px solid var(--ochre);background:rgba(181,122,34,.08)}.two-systems__case small{display:block;margin-bottom:6px;color:var(--rust);font:800 9px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase}.two-systems__case strong{display:block;font:600 18px/1.35 Fraunces,serif}.two-systems__grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two-system{border:1px solid var(--line);background:rgba(255,253,248,.58);padding:16px}.two-system:first-child{border-top:4px solid var(--blue)}.two-system:last-child{border-top:4px solid var(--teal)}.two-system__tag{color:rgba(20,38,49,.52);font:800 8px/1 Inter,sans-serif;letter-spacing:.13em;text-transform:uppercase}.two-system h4{margin:6px 0 13px;font:600 18px/1.2 Fraunces,serif}.two-system__flow{display:grid;gap:0}.two-system__step{position:relative;display:grid;grid-template-columns:25px 1fr;gap:9px;padding:8px 0 12px}.two-system__step:not(:last-child)::after{content:'';position:absolute;left:12px;top:32px;bottom:-1px;width:1px;background:var(--line)}.two-system__n{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--ink);color:var(--paper);font:800 9px/1 Inter,sans-serif}.two-system__step b{font:700 11px/1.35 Inter,sans-serif}.two-system__step p{margin:2px 0 0!important;color:rgba(20,38,49,.65);font:500 10.5px/1.45 Inter,sans-serif!important}.two-systems__question{margin:15px 0 0!important;padding:15px 17px;background:var(--ink);color:var(--paper);font:600 14px/1.5 Fraunces,serif!important}.two-systems__insight{margin:10px 0 0!important;font:600 12px/1.55 Inter,sans-serif!important;color:rgba(20,38,49,.72)}
@media(max-width:600px){.two-systems__grid{grid-template-columns:1fr}.two-system h4{font-size:17px}}

@media(max-width:600px){.boundary-map__frame{padding:15px}.boundary-map__track{min-height:500px}.boundary-item{grid-template-columns:1fr 34px 1fr;gap:6px}.boundary-item__label{font-size:10px}.boundary-map__principle{grid-template-columns:1fr}.boundary-map__line::before{left:12px;transform:translateY(-50%)}}

@media(max-width:600px){.compare-viz__grid{grid-template-columns:1fr}.compare-lane__head{min-height:0}.compare-viz__synthesis{grid-template-columns:1fr;gap:6px}.compare-viz__selector{grid-template-columns:44px minmax(0,1fr) 44px}.compare-viz__selector button{width:44px;height:44px}.compare-step__text{font-size:11px!important}}
@media(prefers-reduced-motion:reduce){.compare-step,.compare-step::after{transition:none}}


/* Ajallinen kerrostumisverkko */
.layer-viz__nav{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 14px}.layer-viz__nav button{min-width:62px;border-color:var(--line)}.layer-viz__nav button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}.layer-viz__stage{position:relative;min-height:360px;border:1px solid var(--line);background:rgba(255,253,248,.56);overflow:hidden}.layer-viz__stage svg{display:block;width:100%;height:auto;min-height:360px}.layer-edge{stroke:rgba(20,38,49,.22);stroke-width:1.4;transition:opacity .45s,stroke-width .45s}.layer-edge.repair{stroke:var(--rust);stroke-dasharray:5 5}.layer-node circle{fill:var(--paper);stroke:var(--ink);stroke-width:1.4;transition:r .35s,opacity .35s}.layer-node.core circle{fill:var(--ink)}.layer-node.core text{fill:var(--paper)}.layer-node text{font:700 10px Inter,sans-serif;fill:var(--ink);text-anchor:middle;pointer-events:none}.layer-viz__meta{display:grid;grid-template-columns:1fr 140px;gap:16px;align-items:end;margin-top:14px}.layer-viz__caption{font:500 12px/1.55 Inter,sans-serif;color:rgba(20,38,49,.72)}.pressure__label{display:flex;justify-content:space-between;font:800 9px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase}.pressure__bar{height:8px;margin-top:7px;background:rgba(20,38,49,.1);overflow:hidden}.pressure__fill{height:100%;background:var(--rust);transition:width .5s}.layer-viz__toggle{display:flex;align-items:center;gap:9px;margin-top:15px;font:700 10px/1.3 Inter,sans-serif}.layer-viz__toggle input{width:18px;height:18px;accent-color:var(--rust)}
/* Purkamissimulaatio */
.intervention-viz__choices{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0 14px}.intervention-viz__choices button{border-color:var(--line)}.intervention-viz__choices button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}.intervention-flow{display:grid;grid-template-columns:1fr 42px 1fr 42px 1fr;align-items:stretch;gap:8px}.impact-card{padding:15px 13px;border:1px solid var(--line);background:rgba(255,253,248,.62);opacity:.2;transform:translateY(5px);transition:opacity .4s,transform .4s,border-color .4s}.impact-card.visible{opacity:1;transform:none}.impact-card.primary{border-top:4px solid var(--teal)}.impact-card.secondary{border-top:4px solid var(--ochre)}.impact-card.tradeoff{border-top:4px solid var(--rust)}.impact-card small{display:block;margin-bottom:7px;color:rgba(20,38,49,.52);font:800 8px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase}.impact-card strong{display:block;font:700 12px/1.35 Inter,sans-serif}.impact-card p{margin:5px 0 0!important;color:rgba(20,38,49,.67);font:500 10.5px/1.48 Inter,sans-serif!important}.impact-arrow{display:grid;place-items:center;color:rgba(20,38,49,.4);font:500 24px/1 Fraunces,serif}.intervention-viz__balance{margin-top:14px;padding:14px 16px;border-left:4px solid var(--blue);background:rgba(36,88,120,.07);font:600 12px/1.55 Inter,sans-serif}.intervention-viz__note{margin-top:10px!important;color:rgba(20,38,49,.58);font:500 10px/1.45 Inter,sans-serif!important}
@media(max-width:600px){.layer-viz__nav{justify-content:flex-start;overflow:auto}.layer-viz__meta{grid-template-columns:1fr}.intervention-flow{grid-template-columns:1fr}.impact-arrow{height:24px;transform:rotate(90deg)}.layer-viz__stage{min-height:320px}.layer-viz__stage svg{min-height:320px}}
@media(prefers-reduced-motion:reduce){.layer-edge,.layer-node circle,.pressure__fill,.impact-card{transition:none}}

.viz-placeholder{margin:42px 0;padding:20px;border:1px dashed var(--line);font:600 12px/1.5 Inter,sans-serif;color:rgba(20,38,49,.65)}
.lightbox{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:28px;background:rgba(10,22,29,.91);opacity:0;visibility:hidden;transition:.2s}.lightbox.open{opacity:1;visibility:visible}.lightbox img{display:block;max-width:94vw;max-height:90vh}.lightbox-close{position:absolute;top:18px;right:18px;width:44px;height:44px;border:1px solid rgba(255,255,255,.5);border-radius:50%;background:rgba(20,38,49,.86);color:#fff;font-size:25px;cursor:pointer}body.lightbox-open{overflow:hidden}.status{max-width:720px;margin:80px auto;padding:24px;border:1px solid var(--line);font:600 14px/1.6 Inter,sans-serif}.status.error{border-color:var(--red);color:var(--red)}footer{display:flex;justify-content:space-between;max-width:1240px;margin:auto;padding:30px 32px 42px;border-top:1px solid var(--line);font:800 10px/1.2 Inter,sans-serif;letter-spacing:.16em}
@media(max-width:880px){.shell{grid-template-columns:1fr;gap:0;max-width:760px}.toc{position:static;margin-bottom:54px}.toc>p,.toc nav{display:none}.infographic-thumb{max-width:260px;margin:0 auto}.hero{padding-top:78px}}
@media(max-width:600px){.masthead{padding:16px 20px}.brand>span:last-child,.masthead-meta{display:none}.hero{padding:66px 20px 58px;text-align:left}.hero h1{font-size:clamp(3rem,15vw,5rem)}.spectrum{justify-content:flex-start}.shell{padding:0 20px 80px}.prose>p,.prose section>p{font-size:1.08rem;line-height:1.72}.prose>.lead{font-size:1.27rem}.story-viz{margin:48px -20px 8px;padding:24px 20px}.story-viz__canvas{padding:13px}.chain-step{grid-template-columns:36px minmax(0,1fr);padding:12px 10px}.chain-step__n{width:30px;height:30px}.story-viz__controls{align-items:flex-start;flex-direction:column}.story-viz__buttons{width:100%}.story-viz__buttons button{flex:1}.closing,.bullets{margin-left:-20px;margin-right:-20px}.lightbox{padding:10px}footer{padding:24px 20px 32px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.chain-step{transition:none}}
/* ===== Laajennetut visualisoinnit (flow-split, model-sliders, radar-compare, phase-clock, matrix-map) ===== */
.viz-switch{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0 14px}
.viz-switch button{padding:9px 13px;border:1px solid var(--line);background:transparent;color:var(--ink);font:800 9.5px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:.18s}
.viz-switch button:hover{border-color:var(--ink)}
.viz-switch button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.viz-figure{position:relative;margin:0;padding:0;background:var(--white);border:1px solid var(--line)}
.viz-figure svg{display:block;width:100%;height:auto}
.viz-readout{margin:16px 0 0;padding:16px 18px;border-left:4px solid var(--teal);background:rgba(31,111,113,.08)}
.viz-readout small{display:block;margin-bottom:6px;color:var(--teal);font:800 9px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.viz-readout strong{display:block;font:600 19px/1.3 Fraunces,serif}
.viz-readout p{margin:7px 0 0!important;font:500 14px/1.6 Inter,sans-serif!important;color:rgba(20,38,49,.78)}
.viz-note{margin:14px 0 0!important;font:600 10.5px/1.5 Inter,sans-serif!important;letter-spacing:.04em;color:rgba(20,38,49,.55)}

/* flow-split */
.flow-viz__ribbon{transition:opacity .25s,stroke-width .25s}
.flow-viz.is-focus .flow-viz__ribbon{opacity:.12}
.flow-viz__ribbon.is-active{opacity:.85!important}
.flow-viz__node rect{transition:.25s}
.flow-viz__node{cursor:pointer}
.flow-viz__node text{font:700 11px/1 Inter,sans-serif;fill:var(--ink);stroke:#fffdf8;stroke-width:3.5px;paint-order:stroke fill;stroke-linejoin:round}
.flow-viz__node .flow-viz__val{font:800 9.5px/1 Inter,sans-serif;fill:rgba(20,38,49,.5);letter-spacing:.1em}
.flow-viz__col-label{font:800 9px/1 Inter,sans-serif;fill:rgba(20,38,49,.45);letter-spacing:.16em;text-transform:uppercase}

/* model-sliders */
.model-viz__grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:start}
.model-input{margin-bottom:20px}
.model-input label{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font:700 11px/1.3 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.model-input label b{font:800 15px/1 Inter,sans-serif;color:var(--blue);letter-spacing:0}
.model-input p{margin:6px 0 9px!important;font:500 12.5px/1.55 Inter,sans-serif!important;color:rgba(20,38,49,.62)}
.model-input input[type=range]{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:linear-gradient(90deg,var(--blue) var(--pct,50%),rgba(20,38,49,.16) var(--pct,50%));cursor:pointer}
.model-input input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--ink);border:3px solid var(--white);box-shadow:0 1px 6px rgba(0,0,0,.25)}
.model-input input[type=range]::-moz-range-thumb{width:16px;height:16px;border:3px solid var(--white);border-radius:50%;background:var(--ink)}
.model-output{margin-bottom:17px}
.model-output header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.model-output header span{font:700 11px/1.3 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.model-output header b{font:800 20px/1 Inter,sans-serif;letter-spacing:-.01em}
.model-output__track{position:relative;height:12px;background:rgba(20,38,49,.1)}
.model-output__fill{position:absolute;inset:0 auto 0 0;width:0;transition:width .35s cubic-bezier(.2,.7,.2,1)}
.model-output__target{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);opacity:.55}
.model-output small{display:block;margin-top:6px;font:600 11px/1.5 Inter,sans-serif;color:rgba(20,38,49,.6)}
.model-viz__presets{margin-bottom:16px}

/* radar-compare */
.radar-viz__legend{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0 0}
.radar-viz__legend button{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);background:transparent;font:700 10px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;opacity:.4;transition:.2s}
.radar-viz__legend button.active{opacity:1;border-color:var(--ink)}
.radar-viz__legend i{width:12px;height:12px;border-radius:50%}
.radar-viz__axis{font:700 10px/1 Inter,sans-serif;fill:rgba(20,38,49,.7)}
.radar-viz__poly{transition:opacity .3s,transform .4s}

/* phase-clock */
.clock-viz__seg{cursor:pointer;transition:opacity .25s,transform .3s;transform-origin:center}
.clock-viz__seg:hover{opacity:.85}
.clock-viz__label{font:800 10px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;pointer-events:none}
.clock-viz__center{font:600 17px/1 Fraunces,serif;fill:var(--ink);text-anchor:middle}
.clock-viz__center tspan.sub{font:800 8.5px/1 Inter,sans-serif;fill:rgba(20,38,49,.55);letter-spacing:.16em}

/* matrix-map */
.matrix-viz__dot{cursor:pointer;transition:.22s}
.matrix-viz__dot:hover circle,.matrix-viz__dot.is-active circle{stroke-width:3}
.matrix-viz__dot text{font:700 10px/1 Inter,sans-serif;fill:var(--ink)}
.matrix-viz__quad{font:800 8.5px/1 Inter,sans-serif;fill:rgba(20,38,49,.38);letter-spacing:.14em;text-transform:uppercase}
.matrix-viz__axis-label{font:800 9px/1 Inter,sans-serif;fill:rgba(20,38,49,.6);letter-spacing:.12em;text-transform:uppercase}
@media(max-width:700px){.model-viz__grid{grid-template-columns:1fr;gap:8px}}
@media(prefers-reduced-motion:reduce){.model-output__fill,.radar-viz__poly,.clock-viz__seg,.flow-viz__ribbon{transition:none}}


/* ===== Premium visual polish v2 ===== */
.viz-figure{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(20,38,49,.12);
  border-radius:18px;
  background:
    radial-gradient(circle at 10% 0%,rgba(255,255,255,.95),transparent 34%),
    linear-gradient(180deg,rgba(255,253,248,.98),rgba(244,240,231,.62));
  box-shadow:0 18px 46px rgba(20,38,49,.07);
}
.viz-figure::after{
  content:"";
  pointer-events:none;
  position:absolute;
  inset:0;
  border-radius:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.82);
}
.viz-switch{gap:8px;margin:20px 0 16px}
.viz-switch button{
  min-height:40px;
  padding:0 15px;
  border-radius:999px;
  border:1px solid rgba(20,38,49,.14);
  background:rgba(255,253,248,.58);
  font-size:10px;
  letter-spacing:.08em;
}
.viz-switch button:hover{background:#fffdf8;border-color:rgba(20,38,49,.35)}
.viz-switch button.active{
  background:var(--ink);
  border-color:var(--ink);
  box-shadow:0 6px 18px rgba(20,38,49,.14);
}
.viz-readout{
  margin-top:14px;
  padding:18px 20px;
  border:1px solid rgba(31,111,113,.12);
  border-left:4px solid var(--teal);
  border-radius:0 14px 14px 0;
  background:linear-gradient(90deg,rgba(31,111,113,.09),rgba(255,253,248,.44));
}
.viz-readout small{font-size:10px}
.viz-readout strong{font-size:20px;letter-spacing:-.015em}
.viz-readout p{font-size:14.5px!important;line-height:1.62!important}
.viz-note{font-size:11px!important;line-height:1.55!important}

/* Virtaus: enemmän informaatiografiikkaa, vähemmän teknistä Sankey-estetiikkaa */
.flow-viz .viz-figure{padding:8px 0}
.flow-viz__ribbon{
  stroke-linecap:round;
  transition:opacity .22s,stroke-width .22s,filter .22s;
}
.flow-viz__ribbon.is-active{filter:drop-shadow(0 2px 3px rgba(20,38,49,.14))}
.flow-viz__node rect{
  filter:drop-shadow(0 2px 4px rgba(20,38,49,.10));
}
.flow-viz__node text{
  font-size:12px;
  font-weight:700;
  letter-spacing:-.01em;
  stroke:#fffdf8;
  stroke-width:5px;
}
.flow-viz__node .flow-viz__val{
  font-size:9.5px;
  font-weight:700;
  letter-spacing:.08em;
  fill:rgba(20,38,49,.46);
}
.flow-viz__col-label{
  font-size:9px;
  letter-spacing:.13em;
  fill:rgba(20,38,49,.42);
}

/* Radar: hillitty analyyttinen profiilikortti */
.radar-viz .viz-figure{padding:8px}
.radar-viz__grid-ring{fill:none;stroke:rgba(20,38,49,.085);stroke-width:1}
.radar-viz__grid-ring.outer{stroke:rgba(20,38,49,.16)}
.radar-viz__spoke{stroke:rgba(20,38,49,.09);stroke-width:1}
.radar-viz__axis{
  font-size:11px;
  font-weight:700;
  fill:rgba(20,38,49,.78);
}
.radar-viz__poly{
  vector-effect:non-scaling-stroke;
  transition:opacity .25s,transform .3s,filter .25s;
  filter:drop-shadow(0 5px 9px rgba(20,38,49,.08));
}
.radar-viz__point{stroke:#fffdf8;stroke-width:2.5}
.radar-viz__legend{gap:8px;margin-top:14px}
.radar-viz__legend button{
  min-height:40px;
  padding:0 14px;
  border-radius:999px;
  background:rgba(255,253,248,.54);
  border-color:rgba(20,38,49,.13);
  font-size:10px;
  letter-spacing:.07em;
  opacity:.48;
}
.radar-viz__legend button.active{
  opacity:1;
  background:#fffdf8;
  border-color:rgba(20,38,49,.30);
  box-shadow:0 5px 16px rgba(20,38,49,.06);
}
.radar-viz__legend i{width:9px;height:9px}

/* Nelikenttä: editorialinen kartta, ei Excel-ruudukko */
.matrix-viz .viz-figure{padding:8px}
.matrix-viz__plot-bg{fill:rgba(255,253,248,.52)}
.matrix-viz__quad-fill{opacity:.035}
.matrix-viz__axis{stroke:rgba(20,38,49,.20);stroke-width:1.1}
.matrix-viz__mid{stroke:rgba(20,38,49,.12);stroke-width:1;stroke-dasharray:3 7}
.matrix-viz__dot{cursor:pointer}
.matrix-viz__dot circle{
  filter:drop-shadow(0 4px 7px rgba(20,38,49,.13));
  transition:r .18s,stroke-width .18s,filter .18s;
}
.matrix-viz__dot:hover circle,.matrix-viz__dot.is-active circle{
  stroke-width:3;
  filter:drop-shadow(0 7px 11px rgba(20,38,49,.18));
}
.matrix-viz__dot text{
  font-size:11px;
  font-weight:700;
  paint-order:stroke fill;
  stroke:#fffdf8;
  stroke-width:5px;
  stroke-linejoin:round;
}
.matrix-viz__quad{
  font-size:8.5px;
  font-weight:800;
  fill:rgba(20,38,49,.34);
  letter-spacing:.11em;
}
.matrix-viz__axis-label{
  font-size:9.5px;
  font-weight:800;
  fill:rgba(20,38,49,.58);
  letter-spacing:.09em;
}

/* Curve */
.curve-viz .viz-figure{padding:8px}
.curve-grid{stroke:rgba(20,38,49,.08);stroke-width:1}
.curve-axis{stroke:rgba(20,38,49,.20);stroke-width:1.1}
.curve-line{
  fill:none;
  stroke-width:3.2;
  stroke-linecap:round;
  stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
  filter:drop-shadow(0 5px 8px rgba(20,38,49,.08));
}
.curve-area{opacity:.07}
.curve-dot{stroke:#fffdf8;stroke-width:2.4;cursor:pointer}
.curve-label{
  font:700 10px/1 Inter,sans-serif;
  fill:rgba(20,38,49,.58);
}
.curve-viz__legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.curve-viz__legend button{
  min-height:38px;padding:0 13px;border:1px solid rgba(20,38,49,.13);
  border-radius:999px;background:rgba(255,253,248,.58);
  font:700 10px/1 Inter,sans-serif;cursor:pointer
}
.curve-viz__legend button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Pie -> premium donut */
.pie-viz__layout{display:grid;grid-template-columns:minmax(260px,.9fr) minmax(220px,1.1fr);gap:18px;align-items:center}
.pie-viz .viz-figure{padding:8px}
.pie-seg{cursor:pointer;transition:opacity .2s,filter .2s,transform .2s;transform-origin:center}
.pie-seg:hover,.pie-seg.is-active{filter:drop-shadow(0 6px 8px rgba(20,38,49,.16))}
.pie-center-title{font:600 26px/1 Fraunces,serif;fill:var(--ink);text-anchor:middle}
.pie-center-sub{font:800 9px/1 Inter,sans-serif;fill:rgba(20,38,49,.48);letter-spacing:.12em;text-anchor:middle}
.pie-viz__list{display:grid;gap:8px}
.pie-viz__item{
  display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;
  min-height:46px;padding:10px 12px;border:1px solid rgba(20,38,49,.10);
  border-radius:12px;background:rgba(255,253,248,.50);cursor:pointer
}
.pie-viz__item:hover,.pie-viz__item.active{background:#fffdf8;border-color:rgba(20,38,49,.24);box-shadow:0 5px 16px rgba(20,38,49,.06)}
.pie-viz__item i{width:9px;height:9px;border-radius:50%}
.pie-viz__item span{font:700 11px/1.35 Inter,sans-serif}
.pie-viz__item b{font:800 12px/1 Inter,sans-serif}

@media(max-width:700px){
  .viz-figure{border-radius:14px;box-shadow:0 10px 28px rgba(20,38,49,.06)}
  .viz-switch{flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px}
  .viz-switch button{min-height:44px;flex:0 0 auto;font-size:10.5px}
  .viz-readout{padding:16px}
  .viz-readout strong{font-size:19px}
  .viz-readout p{font-size:14px!important}
  .flow-viz__node text,.matrix-viz__dot text,.radar-viz__axis{font-size:12px}
  .pie-viz__layout{grid-template-columns:1fr}
  .pie-viz__list{grid-template-columns:1fr}
}


/* ===== Open visualizations: no framed figure background ===== */
.flow-viz .viz-figure,
.pie-viz .viz-figure,
.matrix-viz .viz-figure,
.radar-viz .viz-figure{
  overflow:visible;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
}
.flow-viz .viz-figure::after,
.pie-viz .viz-figure::after,
.matrix-viz .viz-figure::after,
.radar-viz .viz-figure::after{
  display:none;
}
.flow-viz .viz-figure,
.pie-viz .viz-figure,
.matrix-viz .viz-figure,
.radar-viz .viz-figure{
  padding-left:0;
  padding-right:0;
}
@media(max-width:700px){
  .flow-viz .viz-figure,
  .pie-viz .viz-figure,
  .matrix-viz .viz-figure,
  .radar-viz .viz-figure{
    border-radius:0;
    box-shadow:none;
  }
}


/* ===== Open visualizations v2 ===== */

/* Piirakka/rengas: myös itse piirakkakuvion mahdollinen taustakehys kokonaan pois */
.pie-viz .viz-figure,
.pie-viz__layout .viz-figure,
.pie-viz figure{
  border:0 !important;
  border-radius:0 !important;
  background:none !important;
  box-shadow:none !important;
  outline:0 !important;
  padding:0 !important;
}
.pie-viz .viz-figure::before,
.pie-viz .viz-figure::after,
.pie-viz figure::before,
.pie-viz figure::after{
  content:none !important;
  display:none !important;
}

/* Virtaus: tekstistä normaalia typografiaa ilman valkoista halo/reunusta */
.flow-viz__node text{
  stroke:none !important;
  stroke-width:0 !important;
  paint-order:normal !important;
  filter:none !important;
}
.flow-viz__node .flow-viz__val{
  stroke:none !important;
  stroke-width:0 !important;
  paint-order:normal !important;
}

/* Nelikenttä: pisteiden nimet ilman valkoista reunusta */
.matrix-viz__dot text{
  stroke:none !important;
  stroke-width:0 !important;
  paint-order:normal !important;
  filter:none !important;
}

/* Pidetään avoimet visualisoinnit aidosti osana artikkelipintaa */
.flow-viz .viz-figure,
.matrix-viz .viz-figure,
.radar-viz .viz-figure{
  border:0 !important;
  border-radius:0 !important;
  background:none !important;
  box-shadow:none !important;
  outline:0 !important;
}


/* ===== Open circular visualizations v3 ===== */
/* Kuvassa näkyvä rengas on phase-clock/clock-viz, ei pie-viz.
   Poistetaan kehys ja taustakortti molemmista ympyrävisualisoinneista. */
.clock-viz .viz-figure,
.phase-clock-viz .viz-figure,
.pie-viz .viz-figure,
.clock-viz figure,
.phase-clock-viz figure,
.pie-viz figure{
  border:0 !important;
  border-radius:0 !important;
  background:transparent !important;
  background-image:none !important;
  box-shadow:none !important;
  outline:0 !important;
  padding-left:0 !important;
  padding-right:0 !important;
}
.clock-viz .viz-figure::before,
.clock-viz .viz-figure::after,
.phase-clock-viz .viz-figure::before,
.phase-clock-viz .viz-figure::after,
.pie-viz .viz-figure::before,
.pie-viz .viz-figure::after{
  content:none !important;
  display:none !important;
}


/* ===== Poimitut artikkelivisualisoinnit: premium integration ===== */

/* Shared controls */
.viz-choicebar{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 16px}
.viz-choicebar button{
  min-height:42px;padding:0 15px;border:1px solid rgba(20,38,49,.16);
  border-radius:999px;background:transparent;color:var(--ink);
  font:800 10px/1 Inter,sans-serif;letter-spacing:.08em;cursor:pointer
}
.viz-choicebar button.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.viz-choicebar button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* Palautekierto / arvon kierto — intentionally open, no framed chart background */
.feedback-viz__layout{display:grid;grid-template-columns:minmax(280px,1.05fr) minmax(220px,.95fr);gap:24px;align-items:center;margin-top:18px}
.feedback-viz__dial{min-width:0}
.feedback-viz__dial svg{display:block;width:100%;height:auto;overflow:visible}
.feedback-viz__ring{fill:none;stroke:rgba(20,38,49,.10);stroke-width:1.3}
.feedback-viz__flow{fill:none;stroke-width:3;stroke-dasharray:8 14;stroke-linecap:round;animation:feedbackDash 2.5s linear infinite}
@keyframes feedbackDash{to{stroke-dashoffset:-44}}
.feedback-viz__node{cursor:pointer}
.feedback-viz__node circle{fill:var(--paper);stroke-width:1.8;transition:.18s}
.feedback-viz__node:hover circle,.feedback-viz__node.active circle{stroke-width:3;filter:drop-shadow(0 5px 8px rgba(20,38,49,.12))}
.feedback-viz__node text{font:800 8px/1 Inter,sans-serif;letter-spacing:.05em;fill:var(--ink);pointer-events:none}
.feedback-viz__center-title{font:600 17px/1 Fraunces,serif;text-anchor:middle}
.feedback-viz__center-sub{font:800 8px/1 Inter,sans-serif;letter-spacing:.14em;text-anchor:middle;fill:rgba(20,38,49,.48)}
.feedback-viz__detail{padding:2px 0}
.feedback-viz__detail small{display:block;margin-bottom:7px;color:var(--rust);font:800 9px/1 Inter,sans-serif;letter-spacing:.13em;text-transform:uppercase}
.feedback-viz__detail h4{margin:0 0 8px;font:600 22px/1.18 Fraunces,serif}
.feedback-viz__detail p{margin:0!important;color:rgba(20,38,49,.72);font:500 13.5px/1.62 Inter,sans-serif!important}
.feedback-viz__outcome{margin-top:16px;padding:14px 16px;border-left:4px solid var(--teal);background:rgba(31,111,113,.07);font:600 12.5px/1.58 Inter,sans-serif}
.feedback-viz__outcome.amplifying{border-left-color:var(--rust);background:rgba(181,76,42,.07)}
.feedback-viz__caption{margin:14px 0 0!important;color:rgba(20,38,49,.62);font:500 12px/1.55 Inter,sans-serif!important}

/* Neljä käännettä — open dial + editorial detail */
.generation-viz__layout{display:grid;grid-template-columns:minmax(280px,.95fr) minmax(240px,1.05fr);gap:28px;align-items:center;margin-top:18px}
.generation-viz__dial svg{display:block;width:100%;height:auto;overflow:visible}
.generation-viz__seg{cursor:pointer;transition:opacity .18s,filter .18s}
.generation-viz__seg:hover,.generation-viz__seg.active{filter:drop-shadow(0 6px 9px rgba(20,38,49,.12))}
.generation-viz__label{font:800 8px/1 Inter,sans-serif;letter-spacing:.08em;pointer-events:none}
.generation-viz__detail small{display:block;color:var(--rust);font:800 9px/1 Inter,sans-serif;letter-spacing:.13em;text-transform:uppercase}
.generation-viz__detail h4{margin:8px 0 5px;font:600 24px/1.15 Fraunces,serif}
.generation-viz__mood{margin:0 0 12px!important;color:rgba(20,38,49,.55);font:700 11px/1.45 Inter,sans-serif!important}
.generation-viz__caption{margin:0 0 12px!important;color:rgba(20,38,49,.72);font:500 13px/1.62 Inter,sans-serif!important}
.generation-viz__signals{margin:0;padding:0;list-style:none}
.generation-viz__signals li{position:relative;padding:9px 0 9px 17px;border-top:1px solid var(--line);font:600 11.5px/1.45 Inter,sans-serif}
.generation-viz__signals li::before{content:"";position:absolute;left:0;top:16px;width:8px;height:2px;background:var(--teal)}

/* Kolme sukupolvea — layer stack */
.layer-stack-viz__list{display:grid;gap:8px;margin-top:18px}
.layer-stack-viz__item{border-top:1px solid rgba(20,38,49,.18)}
.layer-stack-viz__item:last-child{border-bottom:1px solid rgba(20,38,49,.18)}
.layer-stack-viz__head{
  display:grid;grid-template-columns:92px minmax(0,1fr) 28px;gap:14px;align-items:center;
  width:100%;padding:16px 2px;border:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer
}
.layer-stack-viz__era{font:800 9px/1.25 Inter,sans-serif;letter-spacing:.09em;color:var(--rust)}
.layer-stack-viz__name{font:600 18px/1.22 Fraunces,serif}
.layer-stack-viz__lead{display:block;margin-top:4px;color:rgba(20,38,49,.55);font:600 11px/1.4 Inter,sans-serif}
.layer-stack-viz__chev{font:500 22px/1 Fraunces,serif;transition:transform .18s}
.layer-stack-viz__item.open .layer-stack-viz__chev{transform:rotate(90deg)}
.layer-stack-viz__body{padding:0 2px 20px 106px}
.layer-stack-viz__body p{margin:0 0 13px!important;color:rgba(20,38,49,.72);font:500 13px/1.65 Inter,sans-serif!important}
.layer-stack-viz__tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.layer-stack-viz__tags span{padding:5px 8px;border:1px solid var(--line);font:800 8px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase}
.layer-stack-viz__gaincost{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.curve-viz .viz-figure{border:0!important;background:transparent!important;box-shadow:none!important;border-radius:0!important;padding-left:0!important;padding-right:0!important}
.curve-viz .viz-figure::after{display:none!important}

/* Source-style ajatuskoe, but retain current responsive renderer */
.two-systems__case{border-left-color:var(--ochre)}
.two-system:first-child{border-top-color:var(--rust)}
.two-system:last-child{border-top-color:var(--teal)}

@media(max-width:700px){
  .feedback-viz__layout,.generation-viz__layout{grid-template-columns:1fr;gap:16px}
  .generation-viz__detail h4,.feedback-viz__detail h4{font-size:21px}
  .layer-stack-viz__head{grid-template-columns:1fr 28px;gap:6px}
  .layer-stack-viz__era{grid-column:1/-1}
  .layer-stack-viz__body{padding-left:2px}
  .layer-stack-viz__gaincost{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  .feedback-viz__flow{animation:none}
  .generation-viz__seg,.layer-stack-viz__chev{transition:none}
}

  items.forEach((it,i)=>{const span=2*Math.PI*Math.max(0,Number(it.value||0))/total,gap=.018,a0=a+gap,a1=a+span-gap,g=svgEl('g',{class:'pie-seg',tabindex:'0',role:'button'});g.append(svgEl('path',{d:arc(a0,a1),fill:tone(it.tone)}));const pick=()=>choose(i);g.addEventListener('click',pick);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}});svg.append(g);a+=span});
  const title=svgEl('text',{x:cx,y:cy-4,class:'pie-center-title'});title.textContent=config.centerLabel||'100 %';const sub=svgEl('text',{x:cx,y:cy+22,class:'pie-center-sub'});sub.textContent=(config.centerNote||'KOKONAISUUS').toUpperCase();svg.append(title,sub);
 }
 items.forEach((it,i)=>{const row=el('button','pie-viz__item');row.type='button';const dot=document.createElement('i');dot.style.background=tone(it.tone);const pct=100*Math.max(0,Number(it.value||0))/total;row.append(dot,el('span','',it.label||''),el('b','',`${pct.toLocaleString('fi-FI',{maximumFractionDigits:1})} %`));row.addEventListener('click',()=>choose(i));list.append(row)});
 layout.append(figure,list);root.append(layout,readout.box,el('p','viz-note',config.note||'Rengas näyttää osuudet kokonaisuudesta. Valitse osuus nähdäksesi tarkemman tulkinnan.'));draw();if(items.length)choose(0);return root;
}


function feedbackLoop(config){
 const root=vizHead(config,'feedback-viz',config.eyebrow||'Palautekierto',config.title||'Palautekierto');
 const modes=(config.modes||[]).slice(0,4);let mi=0,selected=0;
 const bar=el('div','viz-choicebar'),layout=el('div','feedback-viz__layout'),dial=el('div','feedback-viz__dial'),detail=el('div','feedback-viz__detail'),caption=el('p','feedback-viz__caption');
 layout.append(dial,detail);root.append(bar,layout,caption,el('p','viz-note',config.note||''));
 const cx=180,cy=180,rr=116,NS='http://www.w3.org/2000/svg',pos=(n,i)=>{const a=-Math.PI/2+i/n*Math.PI*2;return{x:cx+rr*Math.cos(a),y:cy+rr*Math.sin(a)}};
 function renderDetail(m,i){const n=(m.nodes||[])[i]||{};detail.replaceChildren(el('small','',n.label||''),el('h4','',n.title||''),el('p','',n.text||''));const out=el('div','feedback-viz__outcome'+(m.kind==='amplifying'?' amplifying':''),m.outcome||'');detail.append(out)}
 function draw(){
  const m=modes[mi]||{},nodes=m.nodes||[],corrective=m.kind!=='amplifying',accent=corrective?tone('teal'):tone('rust');
  const svg=svgEl('svg',{viewBox:'0 0 360 360',role:'img','aria-label':`${m.name||''} palautekierto`});svg.append(svgEl('circle',{cx,cy,r:rr,class:'feedback-viz__ring'}));
  nodes.forEach((_,i)=>{const a=pos(nodes.length,i),b=pos(nodes.length,(i+1)%nodes.length),p=svgEl('path',{d:`M${a.x},${a.y} A${rr},${rr} 0 0 1 ${b.x},${b.y}`,stroke:accent,class:'feedback-viz__flow',opacity:corrective?.55:.72});if(!corrective)p.style.animationDirection='reverse';svg.append(p)});
  nodes.forEach((n,i)=>{const p=pos(nodes.length,i),g=svgEl('g',{class:'feedback-viz__node'+(i===selected?' active':''),tabindex:'0',role:'button'});g.append(svgEl('circle',{cx:p.x,cy:p.y,r:29,stroke:accent}));const t=svgEl('text',{x:p.x,y:p.y+3,'text-anchor':'middle'});t.textContent=n.label||'';g.append(t);const choose=()=>{selected=i;draw();renderDetail(m,i)};g.addEventListener('click',choose);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}});svg.append(g)});
  const title=svgEl('text',{x:cx,y:cy-6,class:'feedback-viz__center-title',fill:accent});title.textContent=m.name||'';const sub=svgEl('text',{x:cx,y:cy+16,class:'feedback-viz__center-sub'});sub.textContent=corrective?'TASAAVA KIERTO':'KASAAVA KIERTO';svg.append(title,sub);dial.replaceChildren(svg);caption.textContent=m.caption||'';renderDetail(m,selected)
 }
 modes.forEach((m,i)=>{const b=el('button',i===0?'active':'',m.name||String(i+1));b.type='button';b.addEventListener('click',()=>{mi=i;selected=0;bar.querySelectorAll('button').forEach((x,j)=>x.classList.toggle('active',j===i));draw()});bar.append(b)});if(modes.length)draw();return root;
}

function generationClock(config){
 const root=vizHead(config,'generation-viz',config.eyebrow||'Neljä käännettä',config.title||'Neljä käännettä');
 const turns=(config.turns||[]).slice(0,6);let current=Math.max(0,turns.length-1);
 const layout=el('div','generation-viz__layout'),dial=el('div','generation-viz__dial'),detail=el('div','generation-viz__detail');layout.append(dial,detail);root.append(layout,el('p','viz-note',config.note||''));
 const cx=170,cy=170,ro=145,ri=84,cols=['teal','ochre','rust','blue','red'],pt=(a,r)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
 function seg(i,n){const a0=-Math.PI/2+i/n*Math.PI*2+.025,a1=-Math.PI/2+(i+1)/n*Math.PI*2-.025,p0=pt(a0,ro),p1=pt(a1,ro),p2=pt(a1,ri),p3=pt(a0,ri);return{d:`M${p0} A${ro} ${ro} 0 0 1 ${p1} L${p2} A${ri} ${ri} 0 0 0 ${p3} Z`,mid:pt((a0+a1)/2,(ro+ri)/2)}}
 function draw(){
  const svg=svgEl('svg',{viewBox:'0 0 340 340',role:'img','aria-label':'Neljä käännettä'});
  turns.forEach((t,i)=>{const s=seg(i,turns.length),c=tone(cols[i%cols.length]),on=i===current,g=svgEl('g',{class:'generation-viz__seg'+(on?' active':''),tabindex:'0',role:'button'});g.append(svgEl('path',{d:s.d,fill:on?c:'transparent',stroke:c,'stroke-width':1.6,opacity:on?1:.62}));const tx=svgEl('text',{x:s.mid[0],y:s.mid[1]+3,'text-anchor':'middle',class:'generation-viz__label',fill:on?'#fffdf8':'#142631'});tx.textContent=(t.label||'').toUpperCase();g.append(tx);const choose=()=>{current=i;draw()};g.addEventListener('click',choose);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}});svg.append(g)});
  const t=turns[current]||{};const y=svgEl('text',{x:cx,y:cy-5,'text-anchor':'middle',class:'feedback-viz__center-title',fill:'#142631'});y.textContent=t.years||'';const s=svgEl('text',{x:cx,y:cy+18,class:'feedback-viz__center-sub'});s.textContent=`KÄÄNNE ${current+1}/${turns.length}`;svg.append(y,s);dial.replaceChildren(svg);
  detail.replaceChildren(el('small','',t.years||''),el('h4','',t.label||''),el('p','generation-viz__mood',t.mood||''),el('p','generation-viz__caption',t.caption||''));const ul=el('ul','generation-viz__signals');(t.signals||[]).forEach(x=>ul.append(el('li','',x)));detail.append(ul)
 }
 if(turns.length)draw();return root;
}

function layerStack(config){
 const root=vizHead(config,'layer-stack-viz',config.eyebrow||'Kerrostuminen',config.title||'Kerrokset');
 const layers=(config.layers||[]).slice(0,8),list=el('div','layer-stack-viz__list');root.append(list,el('p','viz-note',config.note||''));let open=layers.findIndex(x=>x.current);if(open<0)open=0;
 function render(){
  list.replaceChildren();
  layers.forEach((l,i)=>{const item=el('article','layer-stack-viz__item'+(i===open?' open':'')),head=el('button','layer-stack-viz__head');head.type='button';head.setAttribute('aria-expanded',String(i===open));const mid=el('span','layer-stack-viz__name',l.title||'');if(l.lead)mid.append(el('span','layer-stack-viz__lead',l.lead));head.append(el('span','layer-stack-viz__era',l.era||''),mid,el('span','layer-stack-viz__chev','›'));item.append(head);
    if(i===open){const body=el('div','layer-stack-viz__body');body.append(el('p','',l.text||''));if(l.tags?.length){const tags=el('div','layer-stack-viz__tags');l.tags.forEach(t=>tags.append(el('span','',t)));body.append(tags)}const gc=el('div','layer-stack-viz__gaincost'),gain=el('div'),cost=el('div','cost');gain.append(el('small','','Mitä lisäsi'),text(l.gain||''));cost.append(el('small','','Mitä maksoi'),text(l.cost||''));gc.append(gain,cost);body.append(gc);item.append(body)}
    head.addEventListener('click',()=>{open=open===i?-1:i;render()});list.append(item)
  })
 } render();return root;
}

function renderVisualization(config){if(!config)return null;switch(config.type){case'feedback-loop':return feedbackLoop(config);case'generation-clock':return generationClock(config);case'layer-stack':return layerStack(config);case'curve':return curveChart(config);case'pie':return pieChart(config);case'donut':return pieChart(config);case'flow-split':return flowSplit(config);case'model-sliders':return modelSliders(config);case'radar-compare':return radarCompare(config);case'phase-clock':return phaseClock(config);case'matrix-map':return matrixMap(config);case'causal-chain':return storyChain(config);case'timeline':return timeline(config);case'compare-chains':return compareChains(config);case'layered-network':return layeredNetwork(config);case'intervention':return intervention(config);case'two-systems':return twoSystems(config);default:return el('div','viz-placeholder',`Visualisointityyppiä "${config.type||'?'}" ei vielä tunnisteta.`)}}

function applyVisualizationConfig(article,configData){
 const entries=Array.isArray(configData)?configData:(configData&&configData.articles)||[];
 const entry=entries.find(x=>x&&(x.id===article.id||x.slug===article.slug));
 if(!entry||!entry.sections)return article;
 const byId=entry.sections;
 (article.sections||[]).forEach(section=>{
   const extra=byId[section.id];
   if(!extra)return;
   const list=Array.isArray(extra)?extra:[extra];
   section.visualizations=[...(section.visualizations||[]),...list];
 });
 return article;
}

function render(article){document.title=article.title;$('reading-time').textContent=`LUKUAIKA ${article.readingTime||'--'}`;$('kicker').textContent=(article.tags||[]).join(' · ');$('subtitle').textContent=article.subtitle||'';const title=$('title');title.replaceChildren();const parts=article.titleParts||[article.title];title.append(text(parts[0]||article.title));if(parts[1])title.append(el('em','',parts[1]));const content=$('article-content'),toc=$('toc');content.replaceChildren();toc.replaceChildren();appendParagraphs(content,article.intro,true);(article.sections||[]).forEach((section,index)=>{const id=section.id||`osa-${index+1}`,number=String(index+1).padStart(2,'0');const link=el('a');link.href=`#${id}`;link.append(el('span','',number),text(section.title));toc.append(link);const node=el('section');node.id=id;node.append(el('p','num',number),el('h2','',section.title));appendParagraphs(node,section.paragraphs);if(section.bullets?.length){const ul=el('ul','bullets');section.bullets.forEach(x=>ul.append(el('li','',x)));node.append(ul)}if(section.quote)node.append(el('blockquote',section.closing?'closing':'',section.quote));content.append(node);const configs=[];if(Array.isArray(section.visualizations))configs.push(...section.visualizations);else if(section.visualization)configs.push(section.visualization);configs.forEach(cfg=>{const v=renderVisualization(cfg);if(v)content.append(v)})});setupInfographic(article);$('status').classList.add('hidden');$('app').classList.remove('hidden')}
$('copy-link').addEventListener('click',async()=>{const b=$('copy-link');try{const slug=new URLSearchParams(location.search).get('id');const shareUrl=slug?`${location.origin}/kirjoitukset/${encodeURIComponent(slug)}.html`:location.href.split('#')[0];await navigator.clipboard.writeText(shareUrl);b.textContent='LINKKI KOPIOITU';b.classList.add('copied');setTimeout(()=>{b.textContent='KOPIOI LINKKI';b.classList.remove('copied')},1800)}catch{b.textContent='KOPIOINTI EI ONNISTUNUT';setTimeout(()=>b.textContent='KOPIOI LINKKI',1800)}});
Promise.all([
 fetch(DATA_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}),
 fetch(VIZ_DATA_URL,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)
]).then(([data,vizData])=>{
 const articles=Array.isArray(data)?data:data.kirjoitukset;
 if(!Array.isArray(articles))throw new Error('kirjoitukset-taulukko puuttuu');
 const article=articles.find(x=>x.id===requestedId||x.slug===requestedId);
 if(!article)throw new Error(`Kirjoitusta "${requestedId}" ei löytynyt`);
 render(applyVisualizationConfig(article,vizData));
}).catch(error=>{$('status').classList.add('error');$('status').textContent=`Kirjoituksen lataaminen epäonnistui: ${error.message}`});
})();
</script>
