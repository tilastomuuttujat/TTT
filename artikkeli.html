    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 18% 4%,rgba(255,255,255,.72),transparent 32rem),var(--paper);color:var(--ink);font-family:Fraunces,Georgia,serif;text-rendering:optimizeLegibility}a{color:inherit}.hidden{display:none!important}
    .masthead{display:flex;align-items:center;justify-content:space-between;max-width:1240px;margin:auto;padding:28px 32px;border-bottom:1px solid var(--line);font:700 11px/1.2 Inter,sans-serif;letter-spacing:.16em}.brand{display:flex;align-items:center;gap:12px;text-decoration:none}.brand-mark{display:grid;width:30px;height:30px;place-items:center;border-radius:50%;background:var(--ink);color:var(--paper);font-size:14px;letter-spacing:0}.masthead-meta{color:rgba(20,38,49,.62)}
    .hero{max-width:1100px;margin:auto;padding:104px 32px 88px;text-align:center}.kicker,.num{margin:0 0 25px;color:var(--rust);font:800 12px/1.2 Inter,sans-serif;letter-spacing:.2em}.hero h1{max-width:1000px;margin:auto;font-size:clamp(3.1rem,8.4vw,7.5rem);font-weight:500;line-height:.89;letter-spacing:-.055em}.hero h1 em{display:block;color:var(--red);font-weight:500}.dek{max-width:760px;margin:38px auto 0;color:rgba(20,38,49,.76);font-size:clamp(1.25rem,2.2vw,1.8rem);line-height:1.42}.spectrum{display:flex;justify-content:center;gap:5px;margin-top:55px}.spectrum i{display:block;width:54px;height:5px}.spectrum i:nth-child(1){background:var(--teal)}.spectrum i:nth-child(2){background:var(--blue)}.spectrum i:nth-child(3){background:var(--ochre)}.spectrum i:nth-child(4){background:var(--rust)}.spectrum i:nth-child(5){background:var(--red)}
    .shell{display:grid;grid-template-columns:230px minmax(0,720px);gap:76px;max-width:1100px;margin:auto;padding:0 32px 120px;align-items:start}.toc{position:sticky;top:28px;padding-top:8px;font-family:Inter,sans-serif}.toc>p{margin:0 0 18px;font-size:10px;font-weight:800;letter-spacing:.18em}.toc nav{border-top:1px solid var(--line)}.toc a{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);color:rgba(20,38,49,.69);font-size:11px;line-height:1.3;text-decoration:none;transition:.2s}.toc a:hover{color:var(--red);padding-left:4px}.toc a span{color:var(--rust);font-weight:800}.infographic-thumb{display:block;width:100%;margin-top:22px;padding:8px;border:1px solid var(--line);background:#e7dfd1;color:var(--ink);font:700 10px/1.35 Inter,sans-serif;letter-spacing:.06em;text-align:left;cursor:zoom-in;transition:transform .2s,border-color .2s}.infographic-thumb:hover,.infographic-thumb:focus-visible{transform:translateY(-2px);border-color:var(--rust);outline:0}.infographic-thumb img{display:block;width:100%;height:auto}.infographic-thumb span{display:flex;justify-content:space-between;gap:8px;padding:9px 2px 1px}.infographic-thumb span::after{content:'↗';color:var(--rust);font-size:14px}

    figure{margin:70px 0 16px;padding:14px;background:#e7dfd1;border:1px solid rgba(20,38,49,.12)}figure img{display:block;width:100%;height:auto}figcaption{padding:14px 6px 3px;color:rgba(20,38,49,.68);font:12px/1.5 Inter,sans-serif}blockquote{margin:48px 0;padding:8px 0 8px 30px;border-left:5px solid var(--rust);color:var(--blue);font-size:1.55rem;font-style:italic;line-height:1.48}.bullets{margin:40px 0;padding:30px 34px;background:var(--ink);color:var(--paper)}.bullets li{margin:.75em 0;line-height:1.5}.closing{margin-top:55px;padding:42px 46px;border:0;background:var(--ink);color:var(--paper);font-size:clamp(1.45rem,2.8vw,2rem);line-height:1.45}
    .lightbox{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:28px;background:rgba(10,22,29,.91);cursor:zoom-out;opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}.lightbox.open{opacity:1;visibility:visible}.lightbox-inner{position:relative;display:grid;max-width:min(94vw,960px);max-height:94vh;cursor:default}.lightbox img{display:block;max-width:100%;max-height:90vh;width:auto;height:auto;box-shadow:0 20px 70px rgba(0,0,0,.42)}.lightbox-close{position:absolute;top:10px;right:10px;display:grid;width:44px;height:44px;place-items:center;border:1px solid rgba(255,255,255,.5);border-radius:50%;background:rgba(20,38,49,.86);color:#fff;font:500 25px/1 Inter,sans-serif;cursor:pointer}.lightbox-close:focus-visible{outline:3px solid #fff;outline-offset:3px}body.lightbox-open{overflow:hidden}
    .status{max-width:720px;margin:80px auto;padding:24px;border:1px solid var(--line);font:600 14px/1.6 Inter,sans-serif}.status.error{border-color:var(--red);color:var(--red)}footer{display:flex;justify-content:space-between;max-width:1240px;margin:auto;padding:30px 32px 42px;border-top:1px solid var(--line);font:800 10px/1.2 Inter,sans-serif;letter-spacing:.16em}footer a{text-decoration:none}
    @media(max-width:880px){.shell{grid-template-columns:1fr;gap:0;max-width:760px}.toc{position:static;margin-bottom:54px;padding-top:0}.toc>p,.toc nav{display:none}.infographic-thumb{max-width:260px;margin:0 auto}.hero{padding-top:78px}}
    @media(max-width:600px){.masthead{padding:20px}.masthead-meta{display:none}.hero{padding:66px 20px 58px;text-align:left}.hero h1{font-size:clamp(3rem,15vw,5rem)}.dek{margin-top:28px;font-size:1.18rem}.spectrum{justify-content:flex-start;margin-top:36px}.spectrum i{width:34px}.shell{padding:0 20px 80px}.prose p{font-size:1.08rem;line-height:1.72}.prose .lead{font-size:1.27rem}.prose section{padding-top:62px}figure{margin:50px -20px 0;padding:8px}blockquote{font-size:1.3rem}.bullets,.closing{margin-left:-20px;margin-right:-20px;padding:30px 24px}.lightbox{padding:10px}.lightbox img{max-height:96vh}.lightbox-close{top:7px;right:7px}footer{padding:24px 20px 32px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

</head>
<body>
  <header class="masthead">
    <a class="brand" href="./"><span class="brand-mark">T</span><span>TTT · KIRJOITUKSET</span></a>
    <span class="masthead-meta" id="reading-time">LADATAAN…</span>
  </header>

  <main id="app" class="hidden">
    <article id="alku">
      <header class="hero">
        <p class="kicker" id="kicker"></p>
        <h1 id="title"></h1>
        <p class="dek" id="subtitle"></p>
        <div class="spectrum" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </header>
      <div class="shell">
        <aside class="toc"><p>SISÄLTÖ</p><nav id="toc"></nav><div id="infographic-slot"></div></aside>
        <div class="prose" id="article-content"></div>
      </div>
    </article>
  </main>
  <p id="status" class="status">Ladataan kirjoitusta…</p>
  <div class="lightbox" id="infographic-lightbox" role="dialog" aria-modal="true" aria-label="Infografiikka suurennettuna" aria-hidden="true">
    <div class="lightbox-inner">
      <img id="infographic-large" alt="">
      <button class="lightbox-close" id="infographic-close" type="button" aria-label="Sulje suurennettu kuva">×</button>
    </div>
  </div>
  <footer><span>TTT · TAAKKA · TOTUUS · TEKO</span><a href="#alku">TAKAISIN ALKUUN ↑</a></footer>

  <noscript><p class="status error">Sivu tarvitsee JavaScriptin kirjoituksen lataamiseen.</p></noscript>
  <script>
  (() => {
    'use strict';
    const DATA_URL = './kirjoitukset.json';
    const DEFAULT_ID = 'siilot-ja-sisapiirit';
    const qs = new URLSearchParams(location.search);
    const requestedId = qs.get('id') || qs.get('slug') || DEFAULT_ID;
    const $ = id => document.getElementById(id);

    const text = value => document.createTextNode(value == null ? '' : String(value));
    const el = (tag, className, value) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (value != null) node.append(text(value));
      return node;
    };
    const setMeta = (selector, value) => {
      const node = document.querySelector(selector);
      if (node && value) node.setAttribute('content', value);
    };
    const assetUrl = value => {
      if (!value) return '';
      const source = /^(?:https?:\/\/|images\/|\.\/images\/)/.test(value)
        ? value
        : `./images/${String(value).replace(/^\/+/, '')}`;
      try { const url = new URL(source, location.href); return /^(https?:)$/.test(url.protocol) ? url.href : ''; }
      catch { return ''; }
    };

    function updateMetadata(article) {
      document.title = article.title;
      setMeta('meta[name="description"]', article.subtitle);
      setMeta('meta[property="og:title"]', article.title);
      setMeta('meta[property="og:description"]', article.subtitle);
      setMeta('meta[property="og:url"]', location.href);
      setMeta('meta[property="og:image"]', assetUrl(article.ogImage || article.image));
      setMeta('meta[property="og:image:alt"]', article.imageAlt || article.title);
      setMeta('meta[name="twitter:title"]', article.title);
      setMeta('meta[name="twitter:description"]', article.subtitle);
      setMeta('meta[name="twitter:image"]', assetUrl(article.ogImage || article.image));
      const canonical = document.querySelector('link[rel="canonical"]');
      if (canonical) canonical.href = location.href.split('#')[0];
    }

    function appendParagraphs(target, paragraphs, firstLead = false) {
      (paragraphs || []).forEach((paragraph, index) => {
        target.append(el('p', firstLead && index === 0 ? 'lead' : '', paragraph));
      });
    }

    function setupInfographic(article) {
      const slot = $('infographic-slot');
      slot.replaceChildren();
      if (!article.image) return;
      const source = assetUrl(article.image);
      const alt = article.imageAlt || article.title || 'Artikkelin infografiikka';
      const button = el('button', 'infographic-thumb');
      button.type = 'button';
      button.setAttribute('aria-label', 'Suurenna artikkelin infografiikka');
      const thumb = document.createElement('img');
      thumb.src = source; thumb.alt = alt; thumb.loading = 'eager'; thumb.decoding = 'async';
      button.append(thumb, el('span', '', 'AVAA INFOGRAFIIKKA'));
      slot.append(button);

      const lightbox = $('infographic-lightbox');
      const large = $('infographic-large');
      const close = $('infographic-close');
      large.src = source; large.alt = alt;
      const open = () => {
        lightbox.classList.add('open'); lightbox.setAttribute('aria-hidden', 'false');
        document.body.classList.add('lightbox-open'); close.focus();
      };
      const shut = () => {
        lightbox.classList.remove('open'); lightbox.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('lightbox-open'); button.focus();
      };
      button.addEventListener('click', open);
      close.addEventListener('click', shut);
      large.addEventListener('click', shut);
      lightbox.addEventListener('click', event => { if (event.target === lightbox) shut(); });
      document.addEventListener('keydown', event => { if (event.key === 'Escape' && lightbox.classList.contains('open')) shut(); });
    }

    function render(article) {
      updateMetadata(article);
      $('reading-time').textContent = `LUKUAIKA ${article.readingTime || '—'}`;
      $('kicker').textContent = (article.tags || []).join(' · ');
      $('subtitle').textContent = article.subtitle || '';

      const title = $('title');
      title.replaceChildren();
      const parts = article.titleParts || [article.title];
      title.append(text(parts[0] || article.title));
      if (parts[1]) title.append(el('em', '', parts[1]));

      const content = $('article-content');
      const toc = $('toc');
      content.replaceChildren(); toc.replaceChildren();
      appendParagraphs(content, article.intro, true);

      (article.sections || []).forEach((section, index) => {
        const id = section.id || `osa-${index + 1}`;
        const number = String(index + 1).padStart(2, '0');
        const link = el('a'); link.href = `#${id}`;
        link.append(el('span', '', number), text(section.title));
        toc.append(link);

        const node = el('section'); node.id = id;
        node.append(el('p', 'num', number), el('h2', '', section.title));
        appendParagraphs(node, section.paragraphs);
        if (section.bullets?.length) {
          const list = el('ul', 'bullets');
          section.bullets.forEach(item => list.append(el('li', '', item)));
          node.append(list);
        }
        if (section.quote) node.append(el('blockquote', section.closing ? 'closing' : '', section.quote));
        content.append(node);
      });
      setupInfographic(article);

      const schema = { '@context':'https://schema.org', '@type':'Article', headline:article.title, description:article.subtitle, image:assetUrl(article.ogImage || article.image), inLanguage:'fi-FI' };
      const script = document.createElement('script'); script.type = 'application/ld+json'; script.textContent = JSON.stringify(schema); document.head.append(script);
      $('status').classList.add('hidden'); $('app').classList.remove('hidden');
    }

    fetch(DATA_URL, { cache: 'no-store' })
      .then(response => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); })
      .then(data => {
        const articles = Array.isArray(data) ? data : data.kirjoitukset;
        if (!Array.isArray(articles)) throw new Error('kirjoitukset-taulukko puuttuu');
        const article = articles.find(item => item.id === requestedId || item.slug === requestedId);
        if (!article) throw new Error(`Kirjoitusta “${requestedId}” ei löytynyt`);
        render(article);
      })
      .catch(error => {
        $('status').classList.add('error');
        $('status').textContent = `Kirjoituksen lataaminen epäonnistui: ${error.message}. Avaa sivu verkkopalvelimen kautta, ei suoraan tiedostona.`;
      });
  })();
  </script>
</body>
