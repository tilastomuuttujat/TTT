<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTT · Premium</title>
<meta name="description" content="TTT-artikkeli, jossa narratiivia voidaan täydentää kevyillä interaktiivisilla visualisoinneilla.">
<meta name="theme-color" content="#f4f0e7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#101927;--paper:#f7f3eb;--ivory:#fffdf8;--navy:#111d2d;
  --gold:#b69255;--gold2:#d6bd8c;--sage:#73857d;--muted:#77746e;
  --line:rgba(16,25,39,.13);--line2:rgba(16,25,39,.28)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--paper)}
body{margin:0;background:linear-gradient(180deg,#fbf8f1 0,#f5f1e8 46%,#f8f5ef 100%);color:var(--ink);font-family:Fraunces,Georgia,serif;text-rendering:optimizeLegibility}
a{color:inherit}.hidden{display:none!important}
.masthead{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;max-width:1420px;margin:auto;padding:30px 42px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:13px;text-decoration:none;font:700 10px/1 Inter,sans-serif;letter-spacing:.16em}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--ink);border-radius:50%;font:700 12px Inter,sans-serif}
.masthead-actions{display:flex;align-items:center;gap:22px}.masthead-meta{font:700 9px/1 Inter,sans-serif;letter-spacing:.15em;color:var(--muted)}
.copy-link{min-height:38px;padding:0 15px;border:1px solid var(--line2);border-radius:999px;background:rgba(255,255,255,.35);color:var(--ink);font:700 9px/1 Inter,sans-serif;letter-spacing:.1em;cursor:pointer;transition:.25s}
.copy-link:hover,.copy-link:focus-visible{background:var(--navy);border-color:var(--navy);color:white;outline:none}.copy-link.copied{background:var(--gold);border-color:var(--gold);color:white}

.hero{position:relative;max-width:1240px;margin:auto;padding:122px 42px 110px;text-align:center}
.hero:before{content:"";position:absolute;left:50%;top:50px;width:1px;height:44px;background:var(--gold)}
.kicker,.num{margin:0 0 22px;color:var(--gold);font:700 9px/1.2 Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase}
.hero h1{max-width:1100px;margin:auto;font:500 clamp(4.2rem,9vw,9.2rem)/.87 Fraunces,Georgia,serif;letter-spacing:-.055em}
.hero h1 em{display:block;color:var(--ink);font-weight:500;font-style:italic}
.dek{max-width:720px;margin:38px auto 0;font:500 clamp(1.22rem,2vw,1.55rem)/1.55 Fraunces,serif;color:#5e5c57}
.spectrum{display:flex;justify-content:center;gap:4px;margin-top:50px}.spectrum i{display:block;width:42px;height:2px;background:var(--gold2)}.spectrum i:nth-child(3){width:90px;background:var(--gold)}

.shell{display:grid;grid-template-columns:220px minmax(0,760px);gap:90px;max-width:1120px;margin:auto;padding:0 32px 150px;align-items:start}
.toc{position:sticky;top:28px;padding-top:8px;font-family:Inter,sans-serif}
.toc>p{margin:24px 0 13px;font-size:8px;font-weight:700;letter-spacing:.18em;color:var(--muted)}
.toc nav{border-top:1px solid var(--line2)}
.toc a{display:grid;grid-template-columns:25px 1fr;gap:9px;padding:11px 0;border-bottom:1px solid var(--line);font-size:9.5px;line-height:1.38;text-decoration:none;color:#77736d;transition:.2s}
.toc a:hover{color:var(--gold)}
.infographic-thumb{display:block;width:100%;padding:8px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.55);box-shadow:0 18px 45px rgba(29,33,38,.06);font:700 8px/1.4 Inter,sans-serif;letter-spacing:.08em;text-align:left;cursor:zoom-in}
.infographic-thumb img{display:block;width:100%;height:auto;border-radius:11px}.infographic-thumb span{display:flex;justify-content:space-between;padding:11px 5px 3px}.infographic-thumb span:after{content:"↗";color:var(--gold)}

.prose{min-width:0}
.prose>p,.prose section>p{margin:0 0 1.5em;font-size:1.2rem;line-height:1.86;color:#2c3440}
.prose>.lead{font-size:1.52rem;line-height:1.68;color:var(--ink)}
.lead:first-child::first-letter{float:left;margin:.07em .12em 0 0;color:var(--gold);font-size:5.4rem;font-weight:500;line-height:.76}
.prose section{scroll-margin-top:30px;padding-top:96px}
.prose section:before{content:"";display:block;width:1px;height:38px;margin:0 0 25px;background:var(--gold)}
.prose h2{margin:0 0 32px;font-size:clamp(2.4rem,4.4vw,3.8rem);font-weight:500;line-height:1.04;letter-spacing:-.035em}
.prose .num{margin-bottom:12px}
.bullets{margin:46px 0;padding:34px 38px;border:1px solid rgba(182,146,85,.35);border-radius:18px;background:rgba(255,253,248,.65);box-shadow:0 20px 50px rgba(35,31,25,.04);color:var(--ink)}
.bullets li{margin:.82em 0;line-height:1.55}
blockquote{position:relative;margin:54px 0;padding:30px 36px;border:0;border-top:1px solid var(--gold2);border-bottom:1px solid var(--gold2);color:var(--navy);font-size:1.62rem;font-style:italic;line-height:1.5}
blockquote:before{content:"“";position:absolute;left:0;top:12px;color:var(--gold);font-size:3.8rem;line-height:1}
.closing{margin-top:62px;padding:44px 46px;border:0;border-radius:22px;background:var(--navy);color:#f7f3eb;box-shadow:0 25px 70px rgba(16,25,39,.16)}

.story-viz{margin:78px 0 14px;padding:30px;border:1px solid rgba(182,146,85,.3);border-radius:22px;background:rgba(255,253,248,.74);box-shadow:0 24px 70px rgba(39,33,24,.07);font-family:Inter,sans-serif}
.story-viz__eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:var(--gold);font-size:8px;font-weight:700;letter-spacing:.17em;text-transform:uppercase}.story-viz__eyebrow:before{content:"";width:28px;height:1px;background:var(--gold)}
.story-viz h3{margin:0;max-width:650px;font:500 clamp(1.9rem,4vw,2.9rem)/1.04 Fraunces,serif;letter-spacing:-.03em}
.story-viz__intro{margin:14px 0 24px!important;max-width:620px;color:#72706a;font:500 12.5px/1.65 Inter,sans-serif!important}
.story-viz__canvas{position:relative;overflow:hidden;padding:20px;border:1px solid var(--line);border-radius:16px;background:rgba(247,243,235,.72)}
.story-viz button{min-height:40px;padding:0 14px;border:1px solid var(--line2);border-radius:999px;background:transparent;color:var(--ink);font:700 8.5px/1 Inter,sans-serif;letter-spacing:.08em;cursor:pointer}
.story-viz button:hover{border-color:var(--gold);color:var(--gold)}.story-viz button.primary,.timeline-viz__years button.active,.intervention-viz__choices button.active{background:var(--navy);border-color:var(--navy);color:white}
.story-viz__controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px}.story-viz__buttons{display:flex;gap:7px}.story-viz__progress{font-size:8px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.story-viz__takeaway{margin:17px 0 0!important;padding:16px 18px;border-left:2px solid var(--gold);background:rgba(182,146,85,.08);font:600 12px/1.6 Inter,sans-serif!important}.story-viz__atlas{display:inline-flex;margin-top:15px;color:var(--gold);font:700 8.5px/1.2 Inter,sans-serif;letter-spacing:.1em;text-decoration:none}

.story-viz__chain{display:grid;gap:9px}.chain-step{display:grid;grid-template-columns:38px 1fr;gap:12px;padding:13px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.55);opacity:.3;transition:.28s}.chain-step.is-visible{opacity:1}.chain-step.is-current{border-color:rgba(182,146,85,.65);box-shadow:0 10px 26px rgba(39,33,24,.05)}.chain-step__n{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;background:var(--navy);color:white;font-size:9px;font-weight:700}.chain-step__label,.compare-step__kicker{font-size:7.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}.chain-step__title,.compare-step__title{font-size:12px;font-weight:700}.chain-step__text,.compare-step__text{margin:4px 0 0!important;color:#73706b;font:500 10.5px/1.52 Inter,sans-serif!important}

.timeline-viz__years,.layer-viz__nav,.intervention-viz__choices{display:flex;gap:7px;overflow:auto}.timeline-viz__years button,.layer-viz__nav button{flex:1;min-width:68px}.timeline-viz__panel{margin-top:15px;padding:20px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid var(--line)}.timeline-viz__year{color:var(--gold);font-size:9px;font-weight:700;letter-spacing:.12em}.timeline-viz__title{margin:8px 0 5px!important;font:500 23px/1.15 Fraunces,serif!important}.timeline-viz__text{margin:0!important;color:#73706b;font:500 11.5px/1.58 Inter,sans-serif!important}

.compare-viz__selector{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:10px;margin:19px 0}.compare-viz__selector button{width:46px;height:46px;padding:0}.compare-viz__variable{text-align:center}.compare-viz__variable small{display:block;margin-bottom:5px;color:var(--muted);font-size:7.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}.compare-viz__variable strong{display:block;font:500 1.7rem/1.08 Fraunces,serif}.compare-viz__question{margin:6px 0 0!important;color:#77746e;font:500 10.5px/1.5 Inter,sans-serif!important}
.compare-viz__grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare-lane{padding:15px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.52)}.compare-lane--a{border-top:2px solid var(--sage)}.compare-lane--b{border-top:2px solid var(--gold)}.compare-lane__head{padding-bottom:11px;border-bottom:1px solid var(--line)}.compare-lane__tag{color:var(--muted);font-size:7.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.compare-lane__title{margin-top:6px;font-size:12px;font-weight:700}.compare-lane__sub{margin:4px 0 0!important;color:#77746e;font:500 10px/1.45 Inter,sans-serif!important}.compare-chain{padding-top:8px}.compare-step{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:9px 0;opacity:.2;transition:.3s}.compare-step.is-visible{opacity:1}.compare-step__dot{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:var(--navy);color:white;font-size:8px;font-weight:700}.compare-viz__synthesis{display:grid;grid-template-columns:90px 1fr;gap:12px;margin-top:13px;padding:15px 16px;border-radius:13px;background:var(--navy);color:white}.compare-viz__synthesis b{color:var(--gold2);font-size:7.5px;letter-spacing:.13em;text-transform:uppercase}.compare-viz__synthesis p{margin:0!important;font:500 10.8px/1.58 Inter,sans-serif!important}.compare-viz__dots{display:flex;justify-content:center;gap:6px;margin-top:11px}.compare-viz__dots i{width:5px;height:5px;border-radius:50%;background:#d2cec5}.compare-viz__dots i.active{background:var(--gold)}

.layer-viz__stage{margin-top:15px;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#f1eee7}.layer-viz__stage svg{display:block;width:100%;height:auto}.layer-edge{stroke:#69717a;stroke-width:1.1;opacity:.55}.layer-edge.repair{stroke:var(--gold);stroke-dasharray:5 5}.layer-node circle{fill:#fbf9f4;stroke:var(--navy);stroke-width:1.1}.layer-node.core circle{fill:var(--navy)}.layer-node.repair circle{stroke:var(--gold)}.layer-node text{font:700 8.5px Inter,sans-serif;text-anchor:middle;fill:var(--navy)}.layer-node.core text{fill:white}.layer-viz__toggle{display:flex;align-items:center;gap:8px;margin:12px 0;color:#6f6c66;font-size:9px;font-weight:600}.layer-viz__meta{display:grid;grid-template-columns:1fr 180px;gap:16px;align-items:end}.layer-viz__caption{color:#72706a;font-size:10.5px;line-height:1.5}.pressure__label{display:flex;justify-content:space-between;margin-bottom:6px;font-size:7.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.pressure__bar{height:4px;background:#ded9cf}.pressure__fill{height:100%;background:var(--gold);transition:width .35s}

.intervention-viz__choices{margin:19px 0}.intervention-flow{display:grid;grid-template-columns:1fr 24px 1fr 24px 1fr;align-items:stretch;gap:6px}.impact-card{padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.48);opacity:.28;transform:translateY(5px);transition:.35s}.impact-card.visible{opacity:1;transform:none}.impact-card small{display:block;margin-bottom:9px;color:var(--muted);font-size:7.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.impact-card strong{display:block;font:500 1.16rem/1.2 Fraunces,serif}.impact-card p{margin:7px 0 0!important;color:#74716c;font:500 10px/1.5 Inter,sans-serif!important}.impact-card.primary{border-top:2px solid var(--navy)}.impact-card.secondary{border-top:2px solid var(--sage)}.impact-card.tradeoff{border-top:2px solid var(--gold)}.impact-arrow{display:grid;place-items:center;color:var(--gold);font-size:17px}.intervention-viz__balance{margin-top:13px;padding:14px 16px;border-radius:12px;background:rgba(182,146,85,.1);border:1px solid rgba(182,146,85,.25);font-size:10.8px;font-weight:600;line-height:1.55}.intervention-viz__note{margin:10px 0 0!important;color:var(--muted);font:500 8.5px/1.45 Inter,sans-serif!important}

.lightbox{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:30px;background:rgba(11,17,26,.93)}.lightbox.open{display:grid}.lightbox img{max-width:min(92vw,1000px);max-height:90vh;border-radius:12px}.lightbox-close{position:fixed;right:22px;top:18px;width:44px;height:44px;border:1px solid rgba(255,255,255,.45);border-radius:50%;background:transparent;color:white;font-size:26px;cursor:pointer}
.status{padding:80px 30px;text-align:center;font:700 11px Inter,sans-serif}.status.error{color:#a12424}
footer{display:flex;justify-content:space-between;gap:20px;max-width:1420px;margin:auto;padding:32px 42px;border-top:1px solid var(--line);font:700 8.5px/1.4 Inter,sans-serif;letter-spacing:.14em;color:#77746e}footer a{text-decoration:none}

@media(max-width:800px){
 .masthead{padding:22px 20px}.masthead-meta{display:none}.hero{padding:90px 20px 74px}.hero h1{font-size:clamp(3.4rem,16vw,6rem)}
 .shell{display:block;padding:0 20px 95px}.toc{position:static;margin-bottom:52px}.infographic-thumb{max-width:320px}.toc nav{display:grid;grid-template-columns:1fr 1fr}
 .compare-viz__grid{grid-template-columns:1fr}.layer-viz__meta{grid-template-columns:1fr}.intervention-flow{grid-template-columns:1fr}.impact-arrow{transform:rotate(90deg)}
 .story-viz{padding:20px;border-radius:17px}.prose>p,.prose section>p{font-size:1.08rem}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>

</head>

<script>
(() => {

function appendParagraphs(target,paragraphs,lead=false){(paragraphs||[]).forEach((p,i)=>target.append(el('p',lead&&i===0?'lead':'',p)))}
function setupInfographic(article){const slot=$('infographic-slot');slot.replaceChildren();if(!article.image)return;const src=assetUrl(article.image),alt=article.imageAlt||article.title;const b=el('button','infographic-thumb');b.type='button';const img=document.createElement('img');img.src=src;img.alt=alt;b.append(img,el('span','', 'AVAA INFOGRAFIIKKA'));slot.append(b);const box=$('infographic-lightbox'),large=$('infographic-large'),close=$('infographic-close');large.src=src;large.alt=alt;const open=()=>{box.classList.add('open');box.setAttribute('aria-hidden','false');document.body.classList.add('lightbox-open')};const shut=()=>{box.classList.remove('open');box.setAttribute('aria-hidden','true');document.body.classList.remove('lightbox-open')};b.addEventListener('click',open);close.addEventListener('click',shut);box.addEventListener('click',e=>{if(e.target===box||e.target===large)shut()});document.addEventListener('keydown',e=>{if(e.key==='Escape')shut()})}
function storyChain(config){const root=el('aside','story-viz');root.setAttribute('aria-label',config.title||'Päättelyketju');root.append(el('div','story-viz__eyebrow',config.eyebrow||'Näe mekanismi'),el('h3','',config.title||'Näin mekanismi etenee'));if(config.intro)root.append(el('p','story-viz__intro',config.intro));const canvas=el('div','story-viz__canvas'),chain=el('div','story-viz__chain');const steps=(config.steps||[]).slice(0,8);steps.forEach((s,i)=>{const row=el('div','chain-step');row.dataset.index=i;const num=el('div','chain-step__n',String(i+1));const body=el('div');body.append(el('div','chain-step__label',s.label||`Vaihe ${i+1}`),el('div','chain-step__title',s.title||''));if(s.text)body.append(el('p','chain-step__text',s.text));row.append(num,body);chain.append(row)});canvas.append(chain);root.append(canvas);const controls=el('div','story-viz__controls'),progress=el('div','story-viz__progress');const buttons=el('div','story-viz__buttons'),prev=el('button','', 'EDELLINEN'),next=el('button','primary','SEURAAVA');prev.type=next.type='button';buttons.append(prev,next);controls.append(progress,buttons);root.append(controls);if(config.takeaway)root.append(el('p','story-viz__takeaway',config.takeaway));if(config.atlasUrl){const a=el('a','story-viz__atlas',config.atlasLabel||'Tutki syvemmin Murrosatlaksessa →');a.href=config.atlasUrl;root.append(a)}let current=0;const rows=[...chain.children];function update(){rows.forEach((r,i)=>{r.classList.toggle('is-visible',i<=current);r.classList.toggle('is-current',i===current)});progress.textContent=`VAIHE ${Math.min(current+1,steps.length)} / ${steps.length}`;prev.disabled=current===0;next.disabled=current>=steps.length-1;next.textContent=current>=steps.length-1?'KETJU VALMIS':'SEURAAVA'}prev.addEventListener('click',()=>{if(current>0){current--;update()}});next.addEventListener('click',()=>{if(current<steps.length-1){current++;update()}});if(steps.length)update();return root}
function timeline(config){const root=el('aside','story-viz');root.append(el('div','story-viz__eyebrow',config.eyebrow||'Aikamuutos'),el('h3','',config.title||'Miten rakenne muuttui'));if(config.intro)root.append(el('p','story-viz__intro',config.intro));const canvas=el('div','story-viz__canvas timeline-viz'),years=el('div','timeline-viz__years'),panel=el('div','timeline-viz__panel'),year=el('div','timeline-viz__year'),title=el('p','timeline-viz__title'),body=el('p','timeline-viz__text');panel.append(year,title,body);canvas.append(years,panel);root.append(canvas);const points=(config.points||[]).slice(0,10);function select(i){[...years.children].forEach((b,j)=>b.classList.toggle('active',i===j));const p=points[i]||{};year.textContent=p.year||'';title.textContent=p.title||'';body.textContent=p.text||''}points.forEach((p,i)=>{const b=el('button','',p.year||String(i+1));b.type='button';b.addEventListener('click',()=>select(i));years.append(b)});if(points.length)select(0);if(config.takeaway)root.append(el('p','story-viz__takeaway',config.takeaway));return root}
function compareChains(config){
 const root=el('aside','story-viz compare-viz');root.setAttribute('aria-label',config.title||'Muuttujavertailu');
 root.append(el('div','story-viz__eyebrow',config.eyebrow||'Vertaa kehityspolkuja'),el('h3','',config.title||'Sama muuttuja, kaksi mahdollista ketjua'));
 if(config.intro)root.append(el('p','story-viz__intro',config.intro));
 const vars=(config.variables||[]).slice(0,10);let vi=0,timer=null;
 const selector=el('div','compare-viz__selector'),prev=el('button','', '←'),center=el('div','compare-viz__variable'),next=el('button','', '→');prev.type=next.type='button';prev.setAttribute('aria-label','Edellinen muuttuja');next.setAttribute('aria-label','Seuraava muuttuja');
 const small=el('small','', 'Selattava muuttuja'),vname=el('strong'),question=el('p','compare-viz__question');center.append(small,vname,question);selector.append(prev,center,next);root.append(selector);
 const canvas=el('div','story-viz__canvas'),grid=el('div','compare-viz__grid');canvas.append(grid);root.append(canvas);
 const dots=el('div','compare-viz__dots');root.append(dots);const synthesis=el('div','compare-viz__synthesis');synthesis.append(el('b','', 'Mitä vertailu paljastaa'),el('p'));root.append(synthesis);
 function lane(data,side){const box=el('div',`compare-lane compare-lane--${side}`),head=el('div','compare-lane__head');head.append(el('div','compare-lane__tag',data.label||''),el('div','compare-lane__title',data.title||''));if(data.subtitle)head.append(el('p','compare-lane__sub',data.subtitle));box.append(head);const chain=el('div','compare-chain');(data.steps||[]).slice(0,6).forEach((s,i)=>{const row=el('div','compare-step');const dot=el('div','compare-step__dot',String(i+1)),body=el('div');body.append(el('div','compare-step__kicker',s.label||`Vaihe ${i+1}`),el('div','compare-step__title',s.title||''));if(s.text)body.append(el('p','compare-step__text',s.text));row.append(dot,body);chain.append(row)});box.append(chain);return box}
 function stop(){if(timer){clearTimeout(timer);timer=null}}
 function animate(){stop();const steps=[...grid.querySelectorAll('.compare-step')];steps.forEach(x=>x.classList.remove('is-visible','is-current'));const lanes=[...grid.querySelectorAll('.compare-chain')].map(x=>[...x.children]);const max=Math.max(0,...lanes.map(x=>x.length));let i=0;const tick=()=>{lanes.forEach(arr=>{arr.forEach(x=>x.classList.remove('is-current'));if(arr[i]){arr[i].classList.add('is-visible','is-current')}});i++;if(i<max)timer=setTimeout(tick,520)};tick()}
 function render(){stop();const v=vars[vi]||{};vname.textContent=v.name||'';question.textContent=v.question||'';grid.replaceChildren(lane(v.left||{},'a'),lane(v.right||{},'b'));synthesis.querySelector('p').textContent=v.synthesis||'';dots.replaceChildren();vars.forEach((_,i)=>{const d=document.createElement('i');d.classList.toggle('active',i===vi);dots.append(d)});animate()}
 prev.addEventListener('click',()=>{if(vars.length){vi=(vi-1+vars.length)%vars.length;render()}});next.addEventListener('click',()=>{if(vars.length){vi=(vi+1)%vars.length;render()}});if(vars.length)render();return root}

function layeredNetwork(config){
 const root=el('aside','story-viz layer-viz');root.append(el('div','story-viz__eyebrow',config.eyebrow||'Ymmärrä historia'),el('h3','',config.title||'Kun ratkaisut alkavat muodostaa järjestelmän'));
 if(config.intro)root.append(el('p','story-viz__intro',config.intro));
 const periods=config.periods||[];let pi=0;const nav=el('div','layer-viz__nav'),stage=el('div','layer-viz__stage'),svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 680 390');svg.setAttribute('role','img');svg.setAttribute('aria-label','Rakenteiden ja korjauskerrosten verkko');stage.append(svg);root.append(nav,stage);
 const toggle=el('label','layer-viz__toggle');const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;toggle.append(cb,text('Näytä korjaus- ja koordinointikerrokset'));root.append(toggle);
 const meta=el('div','layer-viz__meta'),caption=el('div','layer-viz__caption'),pressure=el('div','pressure'),plabel=el('div','pressure__label'),pbar=el('div','pressure__bar'),pfill=el('div','pressure__fill');plabel.append(el('span','', 'Rakenteellinen paine'),el('span'));pbar.append(pfill);pressure.append(plabel,pbar);meta.append(caption,pressure);root.append(meta);
 const NS='http://www.w3.org/2000/svg';
 function draw(){const d=periods[pi]||{};nav.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===pi));svg.replaceChildren();const nodes=d.nodes||[],map=new Map(nodes.map(n=>[n.id,n]));(d.edges||[]).forEach(e=>{if(e.repair&&!cb.checked)return;const a=map.get(e.a),b=map.get(e.b);if(!a||!b)return;const line=document.createElementNS(NS,'line');line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);line.setAttribute('class','layer-edge'+(e.repair?' repair':''));svg.append(line)});nodes.forEach(n=>{if(n.repair&&!cb.checked)return;const g=document.createElementNS(NS,'g');g.setAttribute('class','layer-node'+(n.core?' core':'')+(n.repair?' repair':''));const c=document.createElementNS(NS,'circle');c.setAttribute('cx',n.x);c.setAttribute('cy',n.y);c.setAttribute('r',n.core?34:28);const t=document.createElementNS(NS,'text');t.setAttribute('x',n.x);t.setAttribute('y',n.y+4);t.textContent=n.label;g.append(c,t);svg.append(g)});caption.textContent=d.caption||'';const val=Math.max(0,Math.min(100,d.pressure||0));pfill.style.width=val+'%';plabel.lastChild.textContent=val+'/100'}
 periods.forEach((d,i)=>{const b=el('button','',d.year||String(i+1));b.type='button';b.addEventListener('click',()=>{pi=i;draw()});nav.append(b)});cb.addEventListener('change',draw);draw();return root}
function intervention(config){
 const root=el('aside','story-viz intervention-viz');root.append(el('div','story-viz__eyebrow',config.eyebrow||'Kokeile muutosta'),el('h3','',config.title||'Jos voisit muuttaa vain yhtä kohtaa'));
 if(config.intro)root.append(el('p','story-viz__intro',config.intro));const opts=config.options||[];let oi=0,timer=null;const choices=el('div','intervention-viz__choices'),flow=el('div','intervention-flow'),balance=el('div','intervention-viz__balance'),note=el('p','intervention-viz__note',config.note||'Havainnollistava päättelyketju, ei ennustemalli.');root.append(choices,flow,balance,note);
 function card(cls,kicker,title,body){const c=el('div','impact-card '+cls);c.append(el('small','',kicker),el('strong','',title));if(body)c.append(el('p','',body));return c}
 function render(){if(timer)clearTimeout(timer);const o=opts[oi]||{};choices.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===oi));flow.replaceChildren();const cards=[card('primary','1. kertaluku',o.first?.title||'',o.first?.text||''),card('secondary','2. kertaluku',o.second?.title||'',o.second?.text||''),card('tradeoff','3. kertaluku / vastavaikutus',o.third?.title||'',o.third?.text||'')];flow.append(cards[0],el('div','impact-arrow','→'),cards[1],el('div','impact-arrow','→'),cards[2]);balance.textContent=o.balance||'';cards.forEach((c,i)=>{timer=setTimeout(()=>c.classList.add('visible'),120+i*430)})}
 opts.forEach((o,i)=>{const b=el('button','',o.name||String(i+1));b.type='button';b.addEventListener('click',()=>{oi=i;render()});choices.append(b)});render();return root}

function renderVisualization(config){if(!config)return null;switch(config.type){case'causal-chain':return storyChain(config);case'timeline':return timeline(config);case'compare-chains':return compareChains(config);case'layered-network':return layeredNetwork(config);case'intervention':return intervention(config);default:return el('div','viz-placeholder',`Visualisointityyppiä “${config.type||'?'}” ei vielä tunnisteta.`)}}

function applyVisualizationConfig(article,configData){
 const entries=Array.isArray(configData)?configData:(configData&&configData.articles)||[];
 const entry=entries.find(x=>x&&(x.id===article.id||x.slug===article.slug));
 if(!entry||!entry.sections)return article;
 const byId=entry.sections;
 (article.sections||[]).forEach(section=>{
   const extra=byId[section.id];
   if(!extra)return;
   const list=Array.isArray(extra)?extra:[extra];
   section.visualizations=[...(section.visualizations||[]),...list];
 });
 return article;
}

function render(article){document.title=article.title;$('reading-time').textContent=`LUKUAIKA ${article.readingTime||'—'}`;$('kicker').textContent=(article.tags||[]).join(' · ');$('subtitle').textContent=article.subtitle||'';const title=$('title');title.replaceChildren();const parts=article.titleParts||[article.title];title.append(text(parts[0]||article.title));if(parts[1])title.append(el('em','',parts[1]));const content=$('article-content'),toc=$('toc');content.replaceChildren();toc.replaceChildren();appendParagraphs(content,article.intro,true);(article.sections||[]).forEach((section,index)=>{const id=section.id||`osa-${index+1}`,number=String(index+1).padStart(2,'0');const link=el('a');link.href=`#${id}`;link.append(el('span','',number),text(section.title));toc.append(link);const node=el('section');node.id=id;node.append(el('p','num',number),el('h2','',section.title));appendParagraphs(node,section.paragraphs);if(section.bullets?.length){const ul=el('ul','bullets');section.bullets.forEach(x=>ul.append(el('li','',x)));node.append(ul)}if(section.quote)node.append(el('blockquote',section.closing?'closing':'',section.quote));content.append(node);const configs=[];if(Array.isArray(section.visualizations))configs.push(...section.visualizations);else if(section.visualization)configs.push(section.visualization);configs.forEach(cfg=>{const v=renderVisualization(cfg);if(v)content.append(v)})});setupInfographic(article);$('status').classList.add('hidden');$('app').classList.remove('hidden')}
$('copy-link').addEventListener('click',async()=>{const b=$('copy-link');try{await navigator.clipboard.writeText(location.href.split('#')[0]);b.textContent='LINKKI KOPIOITU';b.classList.add('copied');setTimeout(()=>{b.textContent='KOPIOI LINKKI';b.classList.remove('copied')},1800)}catch{b.textContent='KOPIOINTI EI ONNISTUNUT';setTimeout(()=>b.textContent='KOPIOI LINKKI',1800)}});
Promise.all([
 fetch(DATA_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}),
 fetch(VIZ_DATA_URL,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)
]).then(([data,vizData])=>{
 const articles=Array.isArray(data)?data:data.kirjoitukset;
 if(!Array.isArray(articles))throw new Error('kirjoitukset-taulukko puuttuu');
 const article=articles.find(x=>x.id===requestedId||x.slug===requestedId);
 if(!article)throw new Error(`Kirjoitusta “${requestedId}” ei löytynyt`);
 render(applyVisualizationConfig(article,vizData));
}).catch(error=>{$('status').classList.add('error');$('status').textContent=`Kirjoituksen lataaminen epäonnistui: ${error.message}`});
})();
</script>
