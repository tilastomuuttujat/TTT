<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTT · Laajennettu artikkeli</title>
<meta name="description" content="TTT-artikkeli, jossa narratiivia voidaan täydentää kevyillä interaktiivisilla visualisoinneilla.">
<meta name="theme-color" content="#f4f0e7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#142631;--paper:#f4f0e7;--teal:#1f6f71;--blue:#245878;--ochre:#b57a22;--rust:#b54c2a;--red:#912e27;--line:rgba(20,38,49,.18);--soft:#e7dfd1;--white:#fffdf8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 18% 4%,rgba(255,255,255,.72),transparent 32rem),var(--paper);color:var(--ink);font-family:Fraunces,Georgia,serif;text-rendering:optimizeLegibility}a{color:inherit}.hidden{display:none!important}
.masthead{display:flex;align-items:center;justify-content:space-between;max-width:1240px;margin:auto;padding:28px 32px;border-bottom:1px solid var(--line);font:700 11px/1.2 Inter,sans-serif;letter-spacing:.16em}.brand{display:flex;align-items:center;gap:12px;text-decoration:none}.brand-mark{display:grid;width:30px;height:30px;place-items:center;border-radius:50%;background:var(--ink);color:var(--paper);font-size:14px;letter-spacing:0}.masthead-actions{display:flex;align-items:center;gap:24px}.masthead-meta{color:rgba(20,38,49,.62)}.copy-link{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:800 10px/1 Inter,sans-serif;letter-spacing:.12em;cursor:pointer}.copy-link:hover,.copy-link:focus-visible{border-color:var(--ink);background:var(--ink);color:var(--paper);outline:0}.copy-link.copied{border-color:var(--teal);background:var(--teal);color:#fff}
.hero{max-width:1100px;margin:auto;padding:104px 32px 88px;text-align:center}.kicker,.num{margin:0 0 25px;color:var(--rust);font:800 12px/1.2 Inter,sans-serif;letter-spacing:.2em}.hero h1{max-width:1000px;margin:auto;font-size:clamp(3.1rem,8.4vw,7.5rem);font-weight:500;line-height:.89;letter-spacing:-.055em}.hero h1 em{display:block;color:var(--red);font-weight:500}.dek{max-width:760px;margin:38px auto 0;color:rgba(20,38,49,.76);font-size:clamp(1.25rem,2.2vw,1.8rem);line-height:1.42}.spectrum{display:flex;justify-content:center;gap:5px;margin-top:55px}.spectrum i{display:block;width:54px;height:5px}.spectrum i:nth-child(1){background:var(--teal)}.spectrum i:nth-child(2){background:var(--blue)}.spectrum i:nth-child(3){background:var(--ochre)}.spectrum i:nth-child(4){background:var(--rust)}.spectrum i:nth-child(5){background:var(--red)}
.shell{display:grid;grid-template-columns:230px minmax(0,720px);gap:76px;max-width:1100px;margin:auto;padding:0 32px 120px;align-items:start}.toc{position:sticky;top:28px;padding-top:8px;font-family:Inter,sans-serif}.toc>p{margin:0 0 18px;font-size:10px;font-weight:800;letter-spacing:.18em}.toc nav{border-top:1px solid var(--line)}.toc a{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);color:rgba(20,38,49,.69);font-size:11px;line-height:1.3;text-decoration:none}.toc a:hover{color:var(--red)}.infographic-thumb{display:block;width:100%;margin:0 0 22px;padding:8px;border:1px solid var(--line);background:var(--soft);font:700 10px/1.35 Inter,sans-serif;letter-spacing:.06em;text-align:left;cursor:zoom-in}.infographic-thumb img{display:block;width:100%;height:auto}.infographic-thumb span{display:flex;justify-content:space-between;gap:8px;padding:9px 2px 1px}.infographic-thumb span::after{content:'↗';color:var(--rust);font-size:14px}
.prose{min-width:0}.prose>p,.prose section>p{margin:0 0 1.45em;font-size:1.19rem;line-height:1.78;hyphens:auto}.prose>.lead{font-size:1.5rem;line-height:1.62}.lead:first-child::first-letter{float:left;margin:.08em .12em 0 0;color:var(--red);font-size:5.2rem;font-weight:600;line-height:.75}.prose section{scroll-margin-top:28px;padding-top:78px}.prose h2{margin:0 0 32px;font-size:clamp(2.15rem,4.2vw,3.35rem);font-weight:500;line-height:1.03;letter-spacing:-.035em}.prose .num{margin-bottom:13px;font-size:12px;line-height:1.2}.bullets{margin:40px 0;padding:30px 34px;background:var(--ink);color:var(--paper)}.bullets li{margin:.75em 0;line-height:1.5}blockquote{margin:48px 0;padding:8px 0 8px 30px;border-left:5px solid var(--rust);color:var(--blue);font-size:1.55rem;font-style:italic;line-height:1.48}.closing{margin-top:55px;padding:42px 46px;border:0;background:var(--ink);color:var(--paper)}
.story-viz{margin:64px 0 8px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:28px 0 30px;font-family:Inter,sans-serif}.story-viz__eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:var(--rust);font-size:10px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}.story-viz__eyebrow::before{content:'';width:26px;height:3px;background:var(--rust)}.story-viz h3{margin:0;max-width:650px;font:500 clamp(1.8rem,4vw,2.8rem)/1.03 Fraunces,serif;letter-spacing:-.035em}.story-viz__intro{margin:14px 0 24px!important;max-width:620px;color:rgba(20,38,49,.72);font:500 14px/1.6 Inter,sans-serif!important}.story-viz__canvas{position:relative;overflow:hidden;background:rgba(255,253,248,.54);border:1px solid var(--line);padding:22px}.story-viz__chain{display:grid;gap:10px}.chain-step{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr);gap:13px;align-items:start;padding:13px 14px;border:1px solid rgba(20,38,49,.14);background:rgba(255,255,255,.54);opacity:.32;transition:opacity .25s,border-color .25s,transform .25s,background .25s}.chain-step.is-visible{opacity:1}.chain-step.is-current{border-color:var(--rust);background:#fffaf2;transform:translateX(3px)}.chain-step:not(:last-child)::after{content:'';position:absolute;left:34px;bottom:-11px;width:1px;height:11px;background:rgba(20,38,49,.3)}.chain-step__n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:11px;font-weight:800}.chain-step__label{margin:1px 0 3px;color:var(--rust);font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.chain-step__title{font:700 14px/1.3 Inter,sans-serif}.chain-step__text{margin:4px 0 0!important;color:rgba(20,38,49,.72);font:500 12px/1.48 Inter,sans-serif!important}.story-viz__controls{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px}.story-viz__progress{font-size:10px;font-weight:800;letter-spacing:.12em;color:rgba(20,38,49,.58)}.story-viz__buttons{display:flex;gap:8px}.story-viz button{min-height:42px;padding:0 15px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:800 10px/1 Inter,sans-serif;letter-spacing:.09em;cursor:pointer}.story-viz button.primary{background:var(--ink);color:var(--paper)}.story-viz button:disabled{opacity:.35;cursor:not-allowed}.story-viz__takeaway{margin:18px 0 0!important;padding:16px 18px;border-left:4px solid var(--teal);background:rgba(31,111,113,.08);font:600 13px/1.55 Inter,sans-serif!important}.story-viz__atlas{display:inline-flex;margin-top:15px;color:var(--blue);font:800 10px/1.2 Inter,sans-serif;letter-spacing:.1em;text-decoration:none}.story-viz__atlas:hover{text-decoration:underline}
.timeline-viz__years{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.timeline-viz__years button{flex:1;min-width:72px;border-color:var(--line)}.timeline-viz__years button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}.timeline-viz__panel{margin-top:15px;padding:19px;border-left:4px solid var(--ochre);background:rgba(181,122,34,.08)}.timeline-viz__year{font:800 11px/1 Inter,sans-serif;letter-spacing:.12em;color:var(--rust)}.timeline-viz__title{margin:8px 0 5px!important;font:600 22px/1.15 Fraunces,serif!important}.timeline-viz__text{margin:0!important;font:500 13px/1.55 Inter,sans-serif!important;color:rgba(20,38,49,.72)}
.viz-placeholder{margin:42px 0;padding:20px;border:1px dashed var(--line);font:600 12px/1.5 Inter,sans-serif;color:rgba(20,38,49,.65)}
.lightbox{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:28px;background:rgba(10,22,29,.91);opacity:0;visibility:hidden;transition:.2s}.lightbox.open{opacity:1;visibility:visible}.lightbox img{display:block;max-width:94vw;max-height:90vh}.lightbox-close{position:absolute;top:18px;right:18px;width:44px;height:44px;border:1px solid rgba(255,255,255,.5);border-radius:50%;background:rgba(20,38,49,.86);color:#fff;font-size:25px;cursor:pointer}body.lightbox-open{overflow:hidden}.status{max-width:720px;margin:80px auto;padding:24px;border:1px solid var(--line);font:600 14px/1.6 Inter,sans-serif}.status.error{border-color:var(--red);color:var(--red)}footer{display:flex;justify-content:space-between;max-width:1240px;margin:auto;padding:30px 32px 42px;border-top:1px solid var(--line);font:800 10px/1.2 Inter,sans-serif;letter-spacing:.16em}
@media(max-width:880px){.shell{grid-template-columns:1fr;gap:0;max-width:760px}.toc{position:static;margin-bottom:54px}.toc>p,.toc nav{display:none}.infographic-thumb{max-width:260px;margin:0 auto}.hero{padding-top:78px}}
@media(max-width:600px){.masthead{padding:16px 20px}.brand>span:last-child,.masthead-meta{display:none}.hero{padding:66px 20px 58px;text-align:left}.hero h1{font-size:clamp(3rem,15vw,5rem)}.spectrum{justify-content:flex-start}.shell{padding:0 20px 80px}.prose>p,.prose section>p{font-size:1.08rem;line-height:1.72}.prose>.lead{font-size:1.27rem}.story-viz{margin:48px -20px 8px;padding:24px 20px}.story-viz__canvas{padding:13px}.chain-step{grid-template-columns:36px minmax(0,1fr);padding:12px 10px}.chain-step__n{width:30px;height:30px}.story-viz__controls{align-items:flex-start;flex-direction:column}.story-viz__buttons{width:100%}.story-viz__buttons button{flex:1}.closing,.bullets{margin-left:-20px;margin-right:-20px}.lightbox{padding:10px}footer{padding:24px 20px 32px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.chain-step{transition:none}}
</style>
</head>
<body>
<header class="masthead"><a class="brand" href="./"><span class="brand-mark">T</span><span>TTT · KIRJOITUKSET</span></a><div class="masthead-actions"><button class="copy-link" id="copy-link" type="button">KOPIOI LINKKI</button><span class="masthead-meta" id="reading-time">LADATAAN…</span></div></header>
<main id="app" class="hidden"><article id="alku"><header class="hero"><p class="kicker" id="kicker"></p><h1 id="title"></h1><p class="dek" id="subtitle"></p><div class="spectrum" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></header><div class="shell"><aside class="toc"><div id="infographic-slot"></div><p>SISÄLTÖ</p><nav id="toc"></nav></aside><div class="prose" id="article-content"></div></div></article></main>
<p id="status" class="status">Ladataan kirjoitusta…</p>
<div class="lightbox" id="infographic-lightbox" role="dialog" aria-modal="true" aria-hidden="true"><img id="infographic-large" alt=""><button class="lightbox-close" id="infographic-close" type="button" aria-label="Sulje">×</button></div>
<footer><span>TTT · TAAKKA · TOTUUS · TEKO</span><a href="#alku">TAKAISIN ALKUUN ↑</a></footer>
<script>
(() => {
'use strict';
const DATA_URL='./kirjoitukset.json';
const DEFAULT_ID='siilot-ja-sisapiirit';
const requestedId=new URLSearchParams(location.search).get('id')||DEFAULT_ID;
const $=id=>document.getElementById(id);
const text=v=>document.createTextNode(v==null?'':String(v));
const el=(tag,cls,val)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(val!=null)n.append(text(val));return n};
const assetUrl=value=>{if(!value)return'';const source=/^(?:https?:\/\/|images\/|\.\/images\/)/.test(value)?value:`./images/${String(value).replace(/^\/+/, '')}`;try{return new URL(source,location.href).href}catch{return''}};
function appendParagraphs(target,paragraphs,lead=false){(paragraphs||[]).forEach((p,i)=>target.append(el('p',lead&&i===0?'lead':'',p)))}
function setupInfographic(article){const slot=$('infographic-slot');slot.replaceChildren();if(!article.image)return;const src=assetUrl(article.image),alt=article.imageAlt||article.title;const b=el('button','infographic-thumb');b.type='button';const img=document.createElement('img');img.src=src;img.alt=alt;b.append(img,el('span','', 'AVAA INFOGRAFIIKKA'));slot.append(b);const box=$('infographic-lightbox'),large=$('infographic-large'),close=$('infographic-close');large.src=src;large.alt=alt;const open=()=>{box.classList.add('open');box.setAttribute('aria-hidden','false');document.body.classList.add('lightbox-open')};const shut=()=>{box.classList.remove('open');box.setAttribute('aria-hidden','true');document.body.classList.remove('lightbox-open')};b.addEventListener('click',open);close.addEventListener('click',shut);box.addEventListener('click',e=>{if(e.target===box||e.target===large)shut()});document.addEventListener('keydown',e=>{if(e.key==='Escape')shut()})}
function storyChain(config){const root=el('aside','story-viz');root.setAttribute('aria-label',config.title||'Päättelyketju');root.append(el('div','story-viz__eyebrow',config.eyebrow||'Näe mekanismi'),el('h3','',config.title||'Näin mekanismi etenee'));if(config.intro)root.append(el('p','story-viz__intro',config.intro));const canvas=el('div','story-viz__canvas'),chain=el('div','story-viz__chain');const steps=(config.steps||[]).slice(0,8);steps.forEach((s,i)=>{const row=el('div','chain-step');row.dataset.index=i;const num=el('div','chain-step__n',String(i+1));const body=el('div');body.append(el('div','chain-step__label',s.label||`Vaihe ${i+1}`),el('div','chain-step__title',s.title||''));if(s.text)body.append(el('p','chain-step__text',s.text));row.append(num,body);chain.append(row)});canvas.append(chain);root.append(canvas);const controls=el('div','story-viz__controls'),progress=el('div','story-viz__progress');const buttons=el('div','story-viz__buttons'),prev=el('button','', 'EDELLINEN'),next=el('button','primary','SEURAAVA');prev.type=next.type='button';buttons.append(prev,next);controls.append(progress,buttons);root.append(controls);if(config.takeaway)root.append(el('p','story-viz__takeaway',config.takeaway));if(config.atlasUrl){const a=el('a','story-viz__atlas',config.atlasLabel||'Tutki syvemmin Murrosatlaksessa →');a.href=config.atlasUrl;root.append(a)}let current=0;const rows=[...chain.children];function update(){rows.forEach((r,i)=>{r.classList.toggle('is-visible',i<=current);r.classList.toggle('is-current',i===current)});progress.textContent=`VAIHE ${Math.min(current+1,steps.length)} / ${steps.length}`;prev.disabled=current===0;next.disabled=current>=steps.length-1;next.textContent=current>=steps.length-1?'KETJU VALMIS':'SEURAAVA'}prev.addEventListener('click',()=>{if(current>0){current--;update()}});next.addEventListener('click',()=>{if(current<steps.length-1){current++;update()}});if(steps.length)update();return root}
function timeline(config){const root=el('aside','story-viz');root.append(el('div','story-viz__eyebrow',config.eyebrow||'Aikamuutos'),el('h3','',config.title||'Miten rakenne muuttui'));if(config.intro)root.append(el('p','story-viz__intro',config.intro));const canvas=el('div','story-viz__canvas timeline-viz'),years=el('div','timeline-viz__years'),panel=el('div','timeline-viz__panel'),year=el('div','timeline-viz__year'),title=el('p','timeline-viz__title'),body=el('p','timeline-viz__text');panel.append(year,title,body);canvas.append(years,panel);root.append(canvas);const points=(config.points||[]).slice(0,10);function select(i){[...years.children].forEach((b,j)=>b.classList.toggle('active',i===j));const p=points[i]||{};year.textContent=p.year||'';title.textContent=p.title||'';body.textContent=p.text||''}points.forEach((p,i)=>{const b=el('button','',p.year||String(i+1));b.type='button';b.addEventListener('click',()=>select(i));years.append(b)});if(points.length)select(0);if(config.takeaway)root.append(el('p','story-viz__takeaway',config.takeaway));return root}
function renderVisualization(config){if(!config)return null;switch(config.type){case'causal-chain':return storyChain(config);case'timeline':return timeline(config);default:return el('div','viz-placeholder',`Visualisointityyppiä “${config.type||'?'}” ei vielä tunnisteta.`)}}
function demoModule(article,index){if(article.id!=='siilot-ja-sisapiirit'||index!==1)return null;return {type:'causal-chain',eyebrow:'Narratiivinen visualisointi',title:'Kun korjaus alkaa kasvattaa korjattavaa rakennetta',intro:'Avaa ketju vaihe kerrallaan. Tarkoitus ei ole korvata tekstiä vaan pysäyttää lukija juuri siihen mekanismiin, jonka artikkeli haluaa tehdä näkyväksi.',steps:[{label:'Lähtötilanne',title:'Tehtävät eriytyvät',text:'Yhteiskunnan monimutkaistuessa vastuut ja erityisosaaminen jaetaan yhä useammille toimijoille.'},{label:'Ratkaisu',title:'Rakennetaan uusia organisaatioita',text:'Eri ongelmille syntyy omat yksikkönsä, sääntönsä ja rahoituskanavansa.'},{label:'Sivuvaikutus',title:'Rajapintojen määrä kasvaa',text:'Jokainen uusi toimija tarvitsee suhteet muihin toimijoihin, jolloin koordinaation tarve kasvaa.'},{label:'Korjaus',title:'Lisätään ohjausta ja sääntelyä',text:'Yhteensovittamisen ongelmaa ratkaistaan uusilla menettelyillä, mittareilla ja valvonnalla.'},{label:'Kierre',title:'Korjaus kasvattaa verkkoa',text:'Korjaus ei poista alkuperäistä rakennetta vaan lisää sen päälle uuden kerroksen.'},{label:'Nykytila',title:'Järjestelmä korjaa toimintaansa helpommin kuin suuntaansa',text:'Yksittäiset osat voivat toimia hyvin, vaikka kokonaisuuden muuttaminen vaikeutuu.'}],takeaway:'Oleellinen havainto: ongelma ei ole yksittäinen sääntö tai organisaatio, vaan se, että korjaamisen tapa voi itse lisätä järjestelmän kerroksellisuutta.',atlasUrl:'./atlas/murros/index.html',atlasLabel:'Avaa koko Murrosatlas →'} }
function render(article){document.title=article.title;$('reading-time').textContent=`LUKUAIKA ${article.readingTime||'—'}`;$('kicker').textContent=(article.tags||[]).join(' · ');$('subtitle').textContent=article.subtitle||'';const title=$('title');title.replaceChildren();const parts=article.titleParts||[article.title];title.append(text(parts[0]||article.title));if(parts[1])title.append(el('em','',parts[1]));const content=$('article-content'),toc=$('toc');content.replaceChildren();toc.replaceChildren();appendParagraphs(content,article.intro,true);(article.sections||[]).forEach((section,index)=>{const id=section.id||`osa-${index+1}`,number=String(index+1).padStart(2,'0');const link=el('a');link.href=`#${id}`;link.append(el('span','',number),text(section.title));toc.append(link);const node=el('section');node.id=id;node.append(el('p','num',number),el('h2','',section.title));appendParagraphs(node,section.paragraphs);if(section.bullets?.length){const ul=el('ul','bullets');section.bullets.forEach(x=>ul.append(el('li','',x)));node.append(ul)}if(section.quote)node.append(el('blockquote',section.closing?'closing':'',section.quote));content.append(node);const configs=[];if(Array.isArray(section.visualizations))configs.push(...section.visualizations);else if(section.visualization)configs.push(section.visualization);const demo=demoModule(article,index);if(demo)configs.push(demo);configs.forEach(cfg=>{const v=renderVisualization(cfg);if(v)content.append(v)})});setupInfographic(article);$('status').classList.add('hidden');$('app').classList.remove('hidden')}
$('copy-link').addEventListener('click',async()=>{const b=$('copy-link');try{await navigator.clipboard.writeText(location.href.split('#')[0]);b.textContent='LINKKI KOPIOITU';b.classList.add('copied');setTimeout(()=>{b.textContent='KOPIOI LINKKI';b.classList.remove('copied')},1800)}catch{b.textContent='KOPIOINTI EI ONNISTUNUT';setTimeout(()=>b.textContent='KOPIOI LINKKI',1800)}});
fetch(DATA_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(data=>{const articles=Array.isArray(data)?data:data.kirjoitukset;if(!Array.isArray(articles))throw new Error('kirjoitukset-taulukko puuttuu');const article=articles.find(x=>x.id===requestedId||x.slug===requestedId);if(!article)throw new Error(`Kirjoitusta “${requestedId}” ei löytynyt`);render(article)}).catch(error=>{$('status').classList.add('error');$('status').textContent=`Kirjoituksen lataaminen epäonnistui: ${error.message}`});
})();
</script>
</body>
