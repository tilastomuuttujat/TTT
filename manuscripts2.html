      // ─── Pyörä: 3-tasoinen argumenttikartta ──────────────────────────
      function renderWheel(lenses, center) {
        const CX = 360, CY = 360;
        const R_OUT = 196, R_IN = 96, R_CTR = 86;
        const R_MID = (R_OUT + R_IN) / 2;
        const PAD = 0.03;
        const N = lenses.length;
        const colors = ["#ead9c0","#e0cdb0","#d3bd9d","#c6ac88","#b89a73","#a98a64"];
        const polar = (r, a) => [CX + r * Math.cos(a), CY + r * Math.sin(a)];
        const wrap = (text, max) => {
          const words = text.split(" "); const out = []; let cur = "";
          words.forEach((w) => {
            if ((cur + " " + w).trim().length > max) { if (cur) out.push(cur.trim()); cur = w; }
            else cur = (cur + " " + w).trim();
          });
          if (cur) out.push(cur.trim());
          return out;
        };

        // Sektorit (klikattavat): muoto + numero + kirjannimi + linssi
        const sectors = lenses.map((p, i) => {
          const a0 = (i / N) * Math.PI * 2 - Math.PI / 2 + PAD;
          const a1 = ((i + 1) / N) * Math.PI * 2 - Math.PI / 2 - PAD;
          const aM = (a0 + a1) / 2;
          const [x0o, y0o] = polar(R_OUT, a0);
          const [x1o, y1o] = polar(R_OUT, a1);
          const [x0i, y0i] = polar(R_IN, a0);
          const [x1i, y1i] = polar(R_IN, a1);
          const d = `M ${x0o} ${y0o} A ${R_OUT} ${R_OUT} 0 0 1 ${x1o} ${y1o} L ${x1i} ${y1i} A ${R_IN} ${R_IN} 0 0 0 ${x0i} ${y0i} Z`;
          const [lx, ly] = polar(R_MID, aM);
          const words = p.book.split(" ");
          let titleLines = [p.book];
          if (p.book.length > 13 && words.length > 1) {
            const h = Math.ceil(words.length / 2);
            titleLines = [words.slice(0, h).join(" "), words.slice(h).join(" ")];
          }
          const lh = 15;
          const topY = ly - ((titleLines.length - 1) * lh) / 2 - 5;
          const titleSpans = titleLines.map((ln, k) =>
            `<text class="wheel-label" x="${lx}" y="${topY + k * lh}" text-anchor="middle" dominant-baseline="middle">${esc(ln)}</text>`
          ).join("");
          const lensY = topY + (titleLines.length - 1) * lh + 16;
          return `
            <g class="wheel-sector" data-idx="${i}" tabindex="0" role="button"
               aria-label="${esc(p.book)} -- ${esc(p.lens)}: ${esc(p.claim)}">
              <path class="wheel-sector-shape" d="${d}" fill="${colors[i % colors.length]}"></path>
              <text class="wheel-bignum" x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle">${i + 1}</text>
              ${titleSpans}
              <text class="wheel-sublabel" x="${lx}" y="${lensY}" text-anchor="middle" dominant-baseline="middle">${esc(p.lens)}</text>
            </g>`;
        }).join("");

        // Ulkokehä: kunkin sektorin väite usealla kaarevalla rivillä
        const rBase = R_OUT + 20, dr = 17;
        let defsStr = "", claimStr = "";
        lenses.forEach((p, i) => {
          const a0 = (i / N) * Math.PI * 2 - Math.PI / 2;
          const a1 = ((i + 1) / N) * Math.PI * 2 - Math.PI / 2;
          const aM = (a0 + a1) / 2;
          const flip = Math.sin(aM) > 0.001;
          const lines = wrap(p.claim, 28);
          const n = lines.length;
          lines.forEach((ln, k) => {
            const r = flip ? rBase + k * dr : rBase + (n - 1 - k) * dr;
            const pad = 0.07;
            let S = a0 + pad, E = a1 - pad, sweep = 1;
            if (flip) { S = a1 - pad; E = a0 + pad; sweep = 0; }
            const [sx, sy] = polar(r, S);
            const [ex, ey] = polar(r, E);
            const id = `wheelArc_${i}_${k}`;
            defsStr += `<path id="${id}" d="M ${sx} ${sy} A ${r} ${r} 0 0 ${sweep} ${ex} ${ey}" fill="none"></path>`;
            claimStr += `<text class="wheel-claim"><textPath href="#${id}" startOffset="50%" text-anchor="middle">${esc(ln)}</textPath></text>`;
          });
        });

        // Keskusotsikko enintään 3 riville
        const ctWords = center.title.split(" ");
        const ctLines = [];
        let cur = "";
        ctWords.forEach((w) => {
          if ((cur + " " + w).trim().length > 18) { ctLines.push(cur.trim()); cur = w; }
          else cur = (cur + " " + w).trim();
        });
        if (cur) ctLines.push(cur);
        const centerLines = ctLines.slice(0, 3);
        const lineH = 16;
        const startY = CY - ((centerLines.length - 1) * lineH) / 2 - 8;
        const centerText = centerLines.map((l, i) =>
          `<text class="wheel-center-claim" x="${CX}" y="${startY + i * lineH}" dominant-baseline="middle">${esc(l)}</text>`
        ).join("");

        return `
          <section class="wheel-section" aria-labelledby="wheelHeading">
            <div class="wheel-eyebrow">Argumenttikartta</div>
            <h2 id="wheelHeading">Kuusi linssiä, yksi järjestelmäkriisi</h2>
            <p class="wheel-lede">
              Aloita keskeltä tai valitse linssi. <strong>Ulkokehä tiivistää kunkin näkökulman väitteen</strong>;
              klikkaa sektoria nähdäksesi sen tarkemmin.
            </p>
            <div class="wheel-wrap">
              <svg viewBox="0 0 720 720" role="img" aria-label="Linssien argumenttikartta">
                <defs>${defsStr}</defs>
                ${sectors}
                ${claimStr}
                <g class="wheel-sector" data-center="1" tabindex="0" role="button"
                   aria-label="Avaa kooste: ${esc(center.title)}">
                  <circle class="wheel-center-circle" cx="${CX}" cy="${CY}" r="${R_CTR}"></circle>
                  <circle class="wheel-center-ring" cx="${CX}" cy="${CY}" r="${R_CTR - 7}"></circle>
                  ${centerText}
                  <text class="wheel-center-sub" x="${CX}" y="${startY + centerLines.length * lineH + 6}" dominant-baseline="middle">→ Avaa kooste ←</text>
                </g>
              </svg>
            </div>
            <div class="wheel-detail" id="wheelDetail" role="region" aria-live="polite"></div>
            <p class="wheel-caption">Keskus: kokoava väite · Sektorit: kuusi käsikirjoitusta · Ulkokehä: kunkin väite</p>
          </section>`;
      }

      // Sektorien klikkien sidonta tarkennuspaneeliin
      function wireWheel(lenses, center) {
        const detail = document.getElementById("wheelDetail");
        if (!detail) return;
        const open = (html) => { detail.innerHTML = html; detail.classList.add("is-open"); };
        document.querySelectorAll(".wheel-section .wheel-sector").forEach((el) => {
          const handler = (e) => {
            e.preventDefault();
            if (el.dataset.center) {
              open(`
                <div class="wd-eyebrow">Kooste</div>
                <h3>${esc(center.title)}</h3>
                <p class="wd-claim">${esc(center.sub)}</p>
                <p class="wd-expand">${esc(center.bridge)} Kooste lukee kuuden käsikirjoituksen havainnot yhdessä ja kysyy, millaisen kuvan ne yhdessä piirtävät Suomen hyvinvointijärjestelmän ohjauksesta.</p>
                <div class="wd-actions">
                  ${center.available ? `<a href="#/books/${esc(center.slug)}">Lue kooste →</a>` : `<a href="#linssimatriisi" aria-disabled="true">Tulossa</a>`}
                </div>`);
            } else {
              const i = +el.dataset.idx;
              const p = lenses[i];
              open(`
                <div class="wd-eyebrow">Linssi ${i + 1} · ${esc(p.lens)}</div>
                <h3>${esc(p.book)}</h3>
                <p class="wd-claim">${esc(p.claim)}</p>
                <p class="wd-expand">${esc(p.expand)}</p>
                <div class="wd-actions">
                  ${p.available ? `<a href="#/books/${esc(p.slug)}">Lue käsikirjoitus →</a>` : `<a href="#linssimatriisi" aria-disabled="true">Tulossa</a>`}
                  <a href="#linssimatriisi">Vertaa linssejä</a>
                </div>`);
            }
            detail.scrollIntoView({ behavior: "smooth", block: "nearest" });
          };
          el.addEventListener("click", handler);
          el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") handler(e); });
        });
      }

      async function chapter(slug, chapterSlug) {
        setStatus("Ladataan…");
        let data, appendixPayload;
        try {
          [data, appendixPayload] = await Promise.all([loadBook(slug), loadAppendices(slug)]);
        } catch (e) { return setError(e.message || "Kirjaa ei löytynyt."); }

        // VAIHE 5: rakenna evidence_key -> series_link -mappi appendices-payloadista.
        // Lukija näyttää research-cardin evidence-rivillä "Data saatavilla", jos
        // avain löytyy. Ei tietokantayhteyttä -- tieto tulee staattisesta JSON:ista.
        buildSeriesLinkMap(appendixPayload);
        buildEvidenceAppendixMap(appendixPayload);
        

        const all = (data.chapters || []).slice().sort((a, b) => (a.position ?? 0) - (b.position ?? 0));
        const current = all.find((c) => c.slug === chapterSlug);
        if (!current) return setError("Lukua ei löytynyt.");

        const sections = (current.sections || []).slice().sort((a, b) => (a.position ?? 0) - (b.position ?? 0));
        const idx = all.indexOf(current);
        const prev = idx > 0 ? all[idx - 1] : null;
        const next = idx < all.length - 1 ? all[idx + 1] : null;
        const prevHref = prev ? `#/books/${esc(slug)}/${esc(prev.slug)}` : "";
        const nextHref = next ? `#/books/${esc(slug)}/${esc(next.slug)}` : "";

        const { sectionMap, chapterMap } = indexAppendices(appendixPayload);
        const chapterPos = Number(current.position);
        const chapterAppendices = chapterMap.get(chapterPos) || [];

        setMeta(
          `${current.title} – ${data.title}`,
          (current.summary && current.summary[0]) || data.description || current.title
        );

        // Save resume
        try {
          localStorage.setItem(LASTREAD_KEY, JSON.stringify({
            bookSlug: slug, chapterSlug, title: current.title, bookTitle: data.title, t: Date.now(),
          }));
          const readMap = JSON.parse(localStorage.getItem(`hk-read-${slug}`) || "{}");
          readMap[chapterSlug] = true;
          localStorage.setItem(`hk-read-${slug}`, JSON.stringify(readMap));
        } catch {}

        const mins = readingTimeMinutes(current);
        const themes = current.themes || [];
        const summary = Array.isArray(current.summary || current.tldr) ? (current.summary || current.tldr) : [];
        const figures = Array.isArray(current.key_figures) ? current.key_figures : [];

        const metaHtml = `
          <div class="chapter-meta">
            <span class="read-time">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              Lukuaika ≈ ${mins} min
            </span>
            ${themes.length ? `<span class="theme-tags">${themes.map((t) => `<span class="theme-tag">${esc(t)}</span>`).join("")}</span>` : ""}

        const summaryHtml = summary.length ? `

            <div class="summary-label" id="summary-label">Päättäjätiivistelmä</div>

        const figuresHtml = figures.length ? `
          <section class="figures" aria-labelledby="figures-label">
            <div class="figures-label" id="figures-label">Avainluvut</div>
            <div class="figures-grid">
              ${figures.map((f) => `
                <div class="figure-card">
                  <div class="figure-value">${esc(f.value)}</div>
                  <div class="figure-label">${esc(f.label)}</div>
                  ${f.source ? `<div class="figure-source">${esc(f.source)}</div>` : ""}
                </div>`).join("")}
            </div>
            ${figures.some((f) => !f.source) && figures.find((f) => f.source) ? "" : ""}
          </section>` : "";

        const sectionsWithApps = [];
        const sectionsHtml = sections.map((s) => {
          const sp = Number(s.position);
          const key = `${chapterPos}:${sp}`;
          const apps = sectionMap.get(key) || [];
          let appHtml = "";
          if (apps.length) {
            sectionsWithApps.push({ sectionPos: sp, appendices: apps });
            appHtml = buildInlineAppendixHtml(apps, "section");
          }
          // Ambient: liitteet menevät sivupaneeliin, ei tekstin perään
          const hasApps = apps.length > 0;
          return `
            <section data-section-pos="${sp}" class="${hasApps ? 'section-wrap' : ''}">
              <div class="reader-content">
                ${s.title ? `<h2>${esc(s.title)}</h2>` : ""}
                <div>${renderDoc(s.content)}</div>
              </div>
              ${hasApps ? `<div class="section-apps" data-apps-for="${sp}">${buildAmbientCards(apps)}</div>` : ""}
              ${appHtml}
            </section>`;
        }).join("");

        const chapterAppHtml = chapterAppendices.length ? buildInlineAppendixHtml(chapterAppendices, "chapter") : "";

        const mPager = `
          <nav class="m-pager" aria-label="Lukunavigaatio">
            ${prev ? `<a href="${prevHref}"><span class="label">← Edellinen</span><span class="title">${esc(prev.title)}</span></a>`
                   : `<span class="empty">Alku</span>`}
            ${next ? `<a class="next" href="${nextHref}"><span class="label">Seuraava →</span><span class="title">${esc(next.title)}</span></a>`
                   : `<span class="empty">Loppu</span>`}

        app.innerHTML = `
          <article id="chapterArticle">
            <a class="back" href="#/books/${esc(slug)}">← ${esc(data.title)}</a>
            ${metaHtml}
            <h1 class="chapter-title">${esc(current.title)}</h1>
            ${summaryHtml}
            ${figuresHtml}
            <div class="reader">${sectionsHtml}</div>
            ${chapterAppHtml}
            <nav class="pager" aria-label="Lukunavigaatio">
              ${prev ? `<a href="${prevHref}">← ${esc(prev.title)}</a>` : `<span></span>`}
              ${next ? `<a class="right" href="${nextHref}">${esc(next.title)} →</a>` : `<span></span>`}
            </nav>
          </article>
          ${mPager}`;

        for (const { sectionPos, appendices } of sectionsWithApps) {
          const sectionEl = document.querySelector(`section[data-section-pos="${sectionPos}"]`);
          if (!sectionEl) continue;
          const container = sectionEl.querySelector(".app-inline");
          if (container) wireInlineToggles(container, appendices);
        }
        if (chapterAppendices.length) {
          const article = document.getElementById("chapterArticle");
          const chCont = article.querySelector(".app-inline.chapter-level");
          if (chCont) wireInlineToggles(chCont, chapterAppendices);
        }

        // Käynnistä ambient reveal ja toggle
        requestAnimationFrame(() => initAmbientReveal());

        // JSON-LD per chapter
        const ld = document.getElementById("chapter-ld");
        if (ld) ld.remove();
        const script = document.createElement("script");
        script.type = "application/ld+json";
        script.id = "chapter-ld";
        script.textContent = JSON.stringify({
          "@context": "https://schema.org",
          "@type": "Chapter",
          "name": current.title,
          "isPartOf": { "@type": "Book", "name": data.title, "author": { "@type": "Person", "name": data.author || "Harri Käyhkö" } },
          "inLanguage": "fi-FI",
        });
        document.head.appendChild(script);

        initChapterUx(prevHref, nextHref);
      }

      function initChapterUx(prevHref, nextHref) {
        const bar = document.getElementById("progress");
        const updateProgress = () => {
          if (!bar) return;
          const h = document.documentElement;
          const max = h.scrollHeight - h.clientHeight;
          const pct = max > 0 ? Math.min(100, Math.max(0, (h.scrollTop || window.scrollY) / max * 100)) : 0;
          bar.style.width = pct + "%";
        };
        updateProgress();
        window.addEventListener("scroll", updateProgress, { passive: true });

        const article = document.getElementById("chapterArticle");
        if (!article || !window.matchMedia("(max-width: 720px)").matches) return;

        let sx = 0, sy = 0, tracking = false;
        article.addEventListener("touchstart", (e) => {
          if (e.touches.length !== 1) { tracking = false; return; }
          const t = e.target;
          if (t && t.closest && t.closest(".app-body, .app-inline, .m-pager")) { tracking = false; return; }
          sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
        }, { passive: true });
        article.addEventListener("touchend", (e) => {
          if (!tracking) return;
          tracking = false;
          const t = e.changedTouches[0];
          const dx = t.clientX - sx, dy = t.clientY - sy;
          if (Math.abs(dx) < 80 || Math.abs(dy) > 50) return;
          if (dx < 0 && nextHref) location.hash = nextHref;
          else if (dx > 0 && prevHref) location.hash = prevHref;
        }, { passive: true });
      }

      function route() {
        window.scrollTo(0, 0);
        toggleSettings(false);
        closeSearch();
        const parts = path().split("/").filter(Boolean).map(decodeURIComponent);
        try {
          if (!parts.length || (parts[0] === "books" && !parts[1])) return home();
          if (parts[0] === "books" && parts[1] && parts[2]) return chapter(parts[1], parts[2]);
          if (parts[0] === "books" && parts[1]) return book(parts[1]);
          setError("Sivua ei löytynyt.");
        } catch (e) { setError(e.message || "Tuntematon virhe"); }
      }

      // ═══════════════════════════════════════════════════════════════════════
      //  Search
      // ═══════════════════════════════════════════════════════════════════════
      const searchOverlay = document.getElementById("searchOverlay");
      const searchInput = document.getElementById("searchInput");
      const searchResults = document.getElementById("searchResults");
      const searchBtn = document.getElementById("searchBtn");

      async function buildSearchIndex() {
        if (allChaptersCache) return allChaptersCache;
        let books;
        try { books = allBooksCache || await loadIndex(); } catch { return []; }
        allBooksCache = books;
        const out = [];
        for (const b of books) {
          let bd;
          try { bd = await loadBook(b.slug); } catch { continue; }
          for (const c of (bd.chapters || [])) {
            out.push({
              bookSlug: b.slug, bookTitle: bd.title,
              chapterSlug: c.slug, chapterTitle: c.title,
              themes: (c.themes || []).join(" "),
              summary: (c.summary || []).join(" "),
              haystack: [c.title, (c.themes || []).join(" "), (c.summary || []).join(" ")].join(" ").toLowerCase(),
            });
          }
        }
        allChaptersCache = out;
        return out;
      }
      function renderSearch(query) {
        const q = query.trim().toLowerCase();
        if (!allChaptersCache) { searchResults.innerHTML = `<div class="search-empty">Indeksoidaan…</div>`; return; }
        if (!q) { searchResults.innerHTML = `<div class="search-empty">Aloita kirjoittamalla. Hakee lukuja, teemoja ja tiivistelmiä.</div>`; return; }
        const hits = allChaptersCache.filter((c) => c.haystack.includes(q)).slice(0, 20);
        if (!hits.length) { searchResults.innerHTML = `<div class="search-empty">Ei osumia haulle "${esc(query)}".</div>`; return; }
        searchResults.innerHTML = hits.map((h, i) => `
          <a class="search-result" ${i === 0 ? 'data-active="true"' : ""} href="#/books/${esc(h.bookSlug)}/${esc(h.chapterSlug)}">
            <div class="r-title">${esc(h.chapterTitle)}</div>
            <div class="r-sub">${esc(h.bookTitle)}${h.themes ? " · " + esc(h.themes) : ""}</div>
          </a>`).join("");
      }
      async function openSearch() {
        searchOverlay.dataset.open = "true";
        setTimeout(() => searchInput.focus(), 30);
        renderSearch("");
        await buildSearchIndex();
        renderSearch(searchInput.value);
      }
      function closeSearch() {
        searchOverlay.dataset.open = "false";
        searchInput.value = "";
      }
      searchBtn.addEventListener("click", openSearch);
      searchInput.addEventListener("input", (e) => renderSearch(e.target.value));
      searchOverlay.addEventListener("click", (e) => { if (e.target === searchOverlay) closeSearch(); });
      window.addEventListener("keydown", (e) => {
        if (e.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) {
          e.preventDefault(); openSearch();
        }
        if (e.key === "Escape") { closeSearch(); toggleSettings(false); }
      });
      
      document.addEventListener("click", (e) => {
  const row = e.target.closest(".pcard-evidence-row");
  if (!row) return;

  const key = row.dataset.evidenceKey;
  if (!key) return;

  openEvidenceAppendicesModal(key);
});

      window.addEventListener("hashchange", route);
      route();
    </script>
  </body>
</html>
