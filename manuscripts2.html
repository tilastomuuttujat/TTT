<!doctype html>
<html lang="fi" data-theme="paper" data-fontsize="m">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Harri Käyhkö – Käsikirjoitukset</title>
    <meta name="description" content="Harri Käyhkön käsikirjoitukset luettavaksi verkossa: analyysi Suomen hyvinvointijärjestelmästä kirjojen esiinnostamilla linsseillä." />
    <meta name="theme-color" content="#fdfbf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110d" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Harri Käyhkö – Käsikirjoitukset" />
    <meta property="og:description" content="Suomen hyvinvointijärjestelmän analyysi kirjojen linsseillä -- lukijalle ja päättäjälle." />
    <meta property="og:locale" content="fi_FI" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@300;400;500;600;700&display=swap"
    />

    <!-- JSON-LD: site -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Harri Käyhkö – Käsikirjoitukset",
        "inLanguage": "fi-FI",
        "author": { "@type": "Person", "name": "Harri Käyhkö" }
      }
    </script>

    <style>
      /* ─── Theme tokens ─────────────────────────────────────────────────── */
      :root,
      [data-theme="paper"] {
        --bg: #fdfbf7;
        --bg-soft: #f4efe5;
        --card: #ffffff;
        --fg: #1f1b15;
        --fg-soft: #3a332a;
        --muted: #6b6356;
        --muted-2: #8a8276;
        --line: #e6dfd0;
        --line-strong: #c9bfa9;
        --accent: #1f1b15;
        --accent-soft: #4a4034;
        --pill-bg: #ffffff;
        --pill-fg: #2a2620;
        --summary-bg: #f1eadb;
        --summary-bar: #1f1b15;
        --shadow-sm: 0 1px 0 rgba(31, 27, 21, 0.04), 0 1px 3px rgba(31, 27, 21, 0.04);
        --shadow-md: 0 1px 0 rgba(31, 27, 21, 0.04), 0 4px 18px rgba(31, 27, 21, 0.06);
        --danger: #a3271a;
        --focus: #1f1b15;
      }
      [data-theme="light"] {
        --bg: #ffffff;
        --bg-soft: #f3f4f6;
        --card: #ffffff;
        --fg: #0f172a;
        --fg-soft: #1e293b;
        --muted: #475569;
        --muted-2: #64748b;
        --line: #e2e8f0;
        --line-strong: #cbd5e1;
        --accent: #0f172a;
        --accent-soft: #334155;
        --pill-bg: #ffffff;
        --pill-fg: #0f172a;
        --summary-bg: #f1f5f9;
        --summary-bar: #0f172a;
        --shadow-sm: 0 1px 0 rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.04);
        --shadow-md: 0 1px 0 rgba(15, 23, 42, 0.04), 0 4px 18px rgba(15, 23, 42, 0.06);
        --danger: #b42318;
        --focus: #0f172a;
      }
      [data-theme="dark"] {
        --bg: #14110d;
        --bg-soft: #1c1814;
        --card: #1c1814;
        --fg: #f1ebdd;
        --fg-soft: #d8d1c0;
        --muted: #9a9182;
        --muted-2: #7a7264;
        --line: #2c2620;
        --line-strong: #3d362c;
        --accent: #f1ebdd;
        --accent-soft: #c9bfa9;
        --pill-bg: #1c1814;
        --pill-fg: #e8e1cf;
        --summary-bg: #1c1814;
        --summary-bar: #c9a86a;
        --shadow-sm: 0 1px 0 rgba(0, 0, 0, 0.3), 0 1px 3px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 1px 0 rgba(0, 0, 0, 0.3), 0 4px 18px rgba(0, 0, 0, 0.4);
        --danger: #e07a72;
        --focus: #f1ebdd;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) { color-scheme: dark; }
      }

      /* ─── Font size scale ──────────────────────────────────────────────── */
      [data-fontsize="s"] { --reader-fs: 16.5px; --reader-lh: 1.72; }
      [data-fontsize="m"] { --reader-fs: 18.5px; --reader-lh: 1.78; }
      [data-fontsize="l"] { --reader-fs: 20.5px; --reader-lh: 1.78; }
      [data-fontsize="xl"] { --reader-fs: 22.5px; --reader-lh: 1.8; }

      * { box-sizing: border-box; }
      html { color-scheme: light; }
      [data-theme="dark"] { color-scheme: dark; }
      html, body { background: var(--bg); }
      body {
        margin: 0;
        color: var(--fg);
        font-family: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        min-height: 100dvh;
        transition: background-color .2s ease, color .2s ease;
      }
      h1, h2, h3, h4 {
        font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
        font-weight: 400;
        line-height: 1.06;
        margin: 0;
        color: var(--fg);
        letter-spacing: -0.01em;
      }
      a { color: inherit; text-decoration: none; }
      a:focus-visible, button:focus-visible, [role="button"]:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
        border-radius: 6px;
      }

      /* ─── Skip link ────────────────────────────────────────────────────── */
      .skip-link {
        position: absolute;
        left: 12px;
        top: -100px;
        background: var(--fg);
        color: var(--bg);
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 100;
        transition: top .15s ease;
      }
      .skip-link:focus { top: 12px; }

      /* ─── Layout ───────────────────────────────────────────────────────── */
      .container { width: min(100% - 40px, 760px); margin: 0 auto; }
      .container-wide { width: min(100% - 40px, 980px); margin: 0 auto; }

      /* ─── Header ───────────────────────────────────────────────────────── */
      header.site {
        position: sticky;
        top: 0;
        z-index: 30;
        background: color-mix(in srgb, var(--bg) 90%, transparent);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
      }
      .brand {
        font-family: "Work Sans", system-ui, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .brand:hover { color: var(--fg); }
      .bar-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-width: 40px;
        height: 40px;
        padding: 0 10px;
        border-radius: 999px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        transition: background-color .15s, color .15s, border-color .15s;
      }
      .icon-btn:hover { background: var(--bg-soft); color: var(--fg); }
      .icon-btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
      .icon-btn svg { width: 18px; height: 18px; }

      /* ─── Progress bar ─────────────────────────────────────────────────── */
      .progress-bar {
        position: fixed;
        top: 0; left: 0;
        height: 2px;
        background: var(--accent);
        width: 0;
        z-index: 50;
        transition: width .12s linear;
        pointer-events: none;
      }

      /* ─── Settings panel ───────────────────────────────────────────────── */
      .settings-panel {
        position: fixed;
        top: 64px;
        right: 16px;
        width: min(320px, calc(100vw - 32px));
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow-md);
        padding: 18px;
        z-index: 40;
        display: none;
      }
      .settings-panel[data-open="true"] { display: block; }
      .settings-panel h3 {
        font-family: "Work Sans", sans-serif;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .settings-row { margin-bottom: 14px; }
      .settings-row:last-child { margin-bottom: 0; }
      .settings-label {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
        display: block;
      }
      .settings-group {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 4px;
        background: var(--bg-soft);
        padding: 4px;
        border-radius: 10px;
      }
      .settings-group button {
        border: none;
        background: transparent;
        padding: 8px 4px;
        border-radius: 7px;
        font: inherit;
        font-size: 13px;
        color: var(--muted);
        cursor: pointer;
        transition: background .15s, color .15s;
        min-height: 36px;
      }
      .settings-group button[aria-pressed="true"] {
        background: var(--card);
        color: var(--fg);
        box-shadow: var(--shadow-sm);
        font-weight: 500;
      }

      /* ─── Main / footer ────────────────────────────────────────────────── */
      main { padding: 40px 0 88px; min-height: calc(100dvh - 140px); }
      footer.site {
        border-top: 1px solid var(--line);
        padding: 24px 0 calc(24px + env(safe-area-inset-bottom));
        text-align: center;
        color: var(--muted-2);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      /* ─── Home / hero ──────────────────────────────────────────────────── */
      .hero { margin-bottom: 40px; }
      .hero-eyebrow {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .hero h1 {
        font-size: clamp(44px, 8.5vw, 76px);
        margin-bottom: 18px;
      }
      .hero-lede {
        max-width: 560px;
        color: var(--muted);
        line-height: 1.65;
        font-size: 17px;
      }
      .hero-lede strong { color: var(--fg); font-weight: 500; }

      .resume-card {
        margin: 32px 0 8px;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--bg-soft);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .resume-card .label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
      }
      .resume-card .title {
        font-family: "Instrument Serif", serif;
        font-size: 20px;
        line-height: 1.2;
        color: var(--fg);
      }
      .resume-card a { margin-left: auto; flex-shrink: 0; }

      .section-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
        margin-bottom: 14px;
        margin-top: 36px;
      }

      .theme-filter {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 24px;
      }
      .theme-chip {
        font: inherit;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: all .15s;
      }
      .theme-chip:hover { color: var(--fg); border-color: var(--line-strong); }
      .theme-chip[aria-pressed="true"] {
        background: var(--fg);
        color: var(--bg);
        border-color: var(--fg);
      }

      /* ─── Pyörä: Kuusi ennustetta ─────────────────────────────────────── */
      .wheel-section {
        margin: 8px 0 44px;
        padding: 28px 20px 24px;
        background: var(--bg-soft);
        border: 1px solid var(--line);
        border-radius: 18px;
        text-align: center;
      }
      .wheel-section .wheel-eyebrow {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .wheel-section h2 {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: clamp(22px, 3.4vw, 30px);
        margin: 0 0 6px;
      }
      .wheel-section .wheel-lede {
        max-width: 56ch;
        margin: 0 auto 18px;
        color: var(--fg-soft);
        font-size: 15px;
        line-height: 1.55;
      }
      .wheel-wrap {
        position: relative;
        width: min(560px, 100%);
        aspect-ratio: 1 / 1;
        margin: 0 auto;
      }
      .wheel-wrap svg { width: 100%; height: 100%; display: block; }
      .wheel-sector { transition: opacity .18s, transform .18s; transform-origin: 300px 300px; cursor: pointer; }
      .wheel-sector:hover { opacity: .92; }
      .wheel-sector:hover .wheel-sector-shape { filter: brightness(1.04); }
      .wheel-sector-shape {
        stroke: rgba(94,79,59,0.30);
        stroke-width: 0.75;
        stroke-linejoin: round;
      }
      .wheel-label {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 15px;
        font-weight: 400;
        fill: #3d3326;
        pointer-events: none;
      }
      .wheel-sublabel {
        font-family: "Work Sans", system-ui, sans-serif;
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        fill: #7b6a52;
        pointer-events: none;
      }
      .wheel-bignum {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 74px;
        font-style: normal;
        font-weight: 700;
        fill: #ffffff;
        fill-opacity: 0.30;
        pointer-events: none;
      }
      .wheel-claim {
        font-family: "Work Sans", system-ui, sans-serif;
        font-size: 12.5px;
        fill: #4a3f31;
        pointer-events: none;
      }
      .wheel-center-ring { fill: none; stroke: rgba(255,255,255,0.14); stroke-width: 0.75; pointer-events: none; }
      .wheel-center-circle {
        fill: var(--accent);
        cursor: pointer;
        transition: filter .15s;
      }
      .wheel-center-circle:hover { filter: brightness(1.12); }
      .wheel-center-title {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 26px;
        fill: var(--bg);
        text-anchor: middle;
        pointer-events: none;
      }
      .wheel-center-sub {
        font-family: "Work Sans", system-ui, sans-serif;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: var(--bg);
        opacity: .72;
        text-anchor: middle;
        pointer-events: none;
      }
      .wheel-caption {
        margin-top: 14px;
        font-size: 13px;
        color: var(--muted);
      }
      @media (max-width: 560px) {
        .wheel-label { font-size: 13px; }
        .wheel-sublabel { font-size: 10px; }
        .wheel-bignum { font-size: 60px; }
        .wheel-claim { font-size: 11px; }
      }

      /* ─── Pyörän 3. taso: ulkokehän väitteet ─────────────────────────── */
      .wheel-outer-text {
        font-family: "Work Sans", system-ui, sans-serif;
        font-size: 11.5px;
        font-weight: 500;
        fill: var(--fg-soft);
        letter-spacing: 0.01em;
        pointer-events: none;
      }
      .wheel-outer-arc { fill: none; stroke: none; }
      .wheel-center-claim {
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-size: 13.5px;
        fill: var(--bg);
        text-anchor: middle;
        pointer-events: none;
      }

      /* ─── Sektorin tarkennuspaneeli ──────────────────────────────────── */
      .wheel-detail {
        margin: 18px auto 0;
        max-width: 640px;
        background: var(--card);
        border: 1px solid var(--line);
        border-left: 4px solid var(--accent);
        border-radius: 12px;
        padding: 16px 20px;
        text-align: left;
        box-shadow: var(--shadow-sm);
        display: none;
      }
      .wheel-detail.is-open { display: block; }
      .wheel-detail .wd-eyebrow {
        font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted);
      }
      .wheel-detail h3 {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400; font-size: 22px; margin: 4px 0 6px;
      }
      .wheel-detail .wd-claim {
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic; font-size: 17px; color: var(--fg); margin: 0 0 8px;
      }
      .wheel-detail .wd-expand { color: var(--fg-soft); font-size: 14.5px; line-height: 1.6; margin: 0 0 12px; }
      .wheel-detail .wd-actions a {
        display: inline-block; background: var(--accent); color: var(--bg);
        padding: 8px 14px; border-radius: 8px; font-size: 13px; text-decoration: none; font-weight: 500;
      }
      .wheel-detail .wd-actions a + a {
        background: transparent; color: var(--fg);
        border: 1px solid var(--line-strong); margin-left: 8px;
      }
      .wheel-detail .wd-actions a[aria-disabled="true"] {
        background: var(--bg-soft); color: var(--muted); border: 1px solid var(--line); cursor: default;
      }

      /* ─── Valitse huolesi -osio ──────────────────────────────────────── */
      .concern-section {
        margin: 0 0 36px; padding: 26px 22px;
        background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      }
      .concern-section .ce {
        font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 6px;
      }
      .concern-section h2 {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400; font-size: clamp(20px, 3vw, 26px); margin: 0 0 14px;
      }
      .concern-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px;
      }
      .concern-card {
        display: block; text-decoration: none; color: var(--fg);
        background: var(--bg-soft); border: 1px solid var(--line);
        border-radius: 12px; padding: 14px 16px;
        transition: transform .15s, border-color .15s, background .15s;
      }
      .concern-card:hover {
        transform: translateY(-2px); border-color: var(--line-strong); background: var(--card);
      }
      .concern-card .cq {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 16px; line-height: 1.35; margin-bottom: 6px;
      }
      .concern-card .ca {
        font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em;
      }

      /* ─── Linssimatriisi (avattava) ──────────────────────────────────── */
      .matrix-section {
        margin: 0 0 44px; padding: 0;
        background: var(--bg-soft); border: 1px solid var(--line); border-radius: 16px;
        overflow: hidden;
      }
      .matrix-section > summary {
        list-style: none; cursor: pointer; padding: 22px 22px;
        display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      }
      .matrix-section > summary::-webkit-details-marker { display: none; }
      .matrix-section > summary .ce {
        font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
      }
      .matrix-section > summary h2 {
        display: inline; font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400; font-size: clamp(20px, 3vw, 26px); margin: 0;
      }
      .matrix-section > summary .matrix-toggle {
        margin-left: auto; font-size: 13px; color: var(--accent); white-space: nowrap;
      }
      .matrix-section[open] > summary .matrix-toggle-open { display: none; }
      .matrix-section:not([open]) > summary .matrix-toggle-close { display: none; }
      .matrix-body { padding: 0 22px 26px; }
      .matrix-section .lede {
        max-width: 60ch; color: var(--fg-soft); font-size: 14.5px; margin: 0 0 16px;
      }
      .matrix-table-wrap { overflow-x: auto; }
      .matrix-table {
        width: 100%; border-collapse: collapse; font-size: 14px;
        background: var(--card); border-radius: 10px; overflow: hidden;
      }
      .matrix-table th, .matrix-table td {
        padding: 12px 14px; text-align: left;
        border-bottom: 1px solid var(--line); vertical-align: top;
      }
      .matrix-table thead th {
        background: var(--summary-bg); font-size: 11px;
        text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600;
      }
      .matrix-table tbody tr:last-child td { border-bottom: 0; }
      .matrix-table td.lens-name {
        font-family: "Instrument Serif", Georgia, serif; font-size: 16px; white-space: nowrap;
      }
      .matrix-table td.lens-name a {
        color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line-strong);
      }
      .matrix-table td.lens-name a:hover { border-color: var(--accent); }
      @media (max-width: 640px) {
        .matrix-table thead { display: none; }
        .matrix-table, .matrix-table tbody, .matrix-table tr, .matrix-table td { display: block; width: 100%; }
        .matrix-table tr { border-bottom: 1px solid var(--line); padding: 10px 0; }
        .matrix-table td { border: 0; padding: 6px 14px; }
        .matrix-table td::before {
          content: attr(data-label); display: block;
          font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
          color: var(--muted); margin-bottom: 2px;
        }
        .matrix-table td.lens-name::before { display: none; }
      }

      .books-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .book-card {
        display: block;
        padding: 22px 22px 24px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--card);
        transition: border-color .15s, transform .15s, box-shadow .15s;
        position: relative;
      }
      .book-card:hover {
        border-color: var(--line-strong);
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }
      .book-card h2 {
        font-size: 26px;
        margin-bottom: 6px;
      }
      .book-card .author {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 12px;
      }
      .book-card .desc {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      /* ─── Book / TOC ───────────────────────────────────────────────────── */
      .back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 22px;
        color: var(--muted);
        font-size: 13px;
        padding: 6px 10px 6px 6px;
        border-radius: 8px;
        margin-left: -6px;
      }
      .back:hover { color: var(--fg); background: var(--bg-soft); }
      .book-title { font-size: clamp(40px, 7vw, 64px); margin-bottom: 8px; }
      .book-author { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 18px; }
      .book-desc { color: var(--fg-soft); line-height: 1.65; max-width: 60ch; font-size: 17px; }

      /* ─── Tutkimuskortit (Kuusi ennustetta) ──────────────────────────── */
      .research-cards { display: grid; gap: 18px; margin: 24px 0 8px; }
      .pcard {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 22px 22px 18px;
        background: var(--card);
        position: relative;
      }
      .pcard-toplabel {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--muted-2);
        display: flex; align-items: center; gap: 8px;
      }
      .pcard-status-dot {
        width: 9px; height: 9px; border-radius: 50%;
        display: inline-block;
      }
      .pcard-status-dot.ready { background: #1d9e75; }
      .pcard-status-dot.partial { background: #d99a1d; }
      .pcard-status-dot.requires_collection { background: var(--muted-2); }
      .pcard-lens {
        font-family: var(--font-serif, Georgia), serif;
        font-size: 26px; line-height: 1.15; margin: 4px 0 2px;
        color: var(--fg);
      }
      .pcard-claim {
        font-size: 17px; line-height: 1.5; color: var(--fg-soft);
        margin: 8px 0 16px;
      }
      .pcard-falsification {
        border-left: 3px solid var(--accent, #185fa5);
        background: var(--bg-soft);
        border-radius: 0 8px 8px 0;
        padding: 12px 16px;
        margin: 0 0 16px;
      }
      .pcard-falsification .label {
        font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
        text-transform: uppercase; color: var(--accent, #185fa5);
        margin-bottom: 6px;
      }
      .pcard-falsification .text { font-size: 15px; line-height: 1.55; color: var(--fg); }
      .pcard-falsification .op {
        font-size: 13.5px; line-height: 1.5; color: var(--muted);
        margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line);
      }
      .pcard-falsification .status-line {
        font-size: 12px; color: var(--muted-2); margin-top: 8px;
        display: flex; align-items: center; gap: 6px;
      }
      .pcard-evidence-label {
        font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
        text-transform: uppercase; color: var(--muted);
        margin-bottom: 8px;
      }
      .pcard-evidence-list { display: flex; flex-direction: column; gap: 6px; }
      .pcard-evidence-row {
        text-align: left; width: 100%;
        border: 1px solid var(--line); border-radius: 8px;
        padding: 10px 12px; background: transparent;
        transition: background-color .12s, border-color .12s;
        font-family: inherit;
      }
      .pcard-evidence-row .ev-title { font-size: 14.5px; color: var(--fg); line-height: 1.4; }
      .pcard-evidence-row .ev-meta {
        font-size: 12px; color: var(--muted-2); margin-top: 3px;
        display: flex; gap: 8px; flex-wrap: wrap;
      }
      .pcard-evidence-row .ev-key {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px; color: var(--muted-2); opacity: 0.7;
      }
      /* VAIHE 5: "Data saatavilla" -merkki evidence-rivillä */
      .ev-data-available {
        display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        margin-top: 6px; font-size: 12px;
      }
      .ev-data-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: #1d9e75; display: inline-block; flex-shrink: 0;
      }
      .ev-data-label {
        color: #1d9e75; font-weight: 600; letter-spacing: 0.02em;
      }
      .ev-data-sub { color: var(--muted-2); }
      .pcard-evidence-empty {
        font-size: 13px; color: var(--muted); font-style: italic;
        padding: 8px 0;
      }
      .pcard-falsification-missing {
        border-left-color: #d99a1d;
      }
      .pcard-falsification-missing .label { color: #d99a1d; }
      .research-cards-intro {
        color: var(--fg-soft); line-height: 1.65; max-width: 60ch;
        font-size: 16px; margin: 4px 0 0;
      }
      /* Evidence-liitteen avausmodaali */
      .ev-modal-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,0.5);
        display: flex; align-items: center; justify-content: center;
        padding: 24px; z-index: 5000; opacity: 0; pointer-events: none;
        transition: opacity .15s;
      }
      .ev-modal-backdrop.show { opacity: 1; pointer-events: auto; }
      .ev-modal {
        background: var(--bg); border-radius: 14px; max-width: 680px;
        width: 100%; max-height: 85vh; overflow-y: auto;
        padding: 28px; position: relative;
      }
      .ev-modal h3 { font-family: var(--font-serif, Georgia), serif; font-size: 22px; margin: 0 0 4px; }
      .ev-modal .ev-modal-close {
        position: absolute; top: 16px; right: 16px;
        background: var(--bg-soft); border: none; border-radius: 8px;
        width: 32px; height: 32px; cursor: pointer; font-size: 18px;
        color: var(--fg);
      }
      .ev-modal-item { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
      .ev-modal-item:first-of-type { border-top: none; }

      /* Evidence-rivi: klikattava painike */
      button.pcard-evidence-row { cursor: pointer; }
      button.pcard-evidence-row:hover { background: var(--bg-soft); border-color: var(--muted-2); }
      .toc { list-style: none; padding: 0; margin: 18px 0 0; }
      .toc li {
        border-bottom: 1px solid var(--line);
      }
      .toc li:last-child { border-bottom: none; }
      .toc a {
        display: grid;
        grid-template-columns: 32px 1fr auto;
        gap: 16px;
        align-items: baseline;
        padding: 18px 10px;
        border-radius: 10px;
        transition: background-color .12s;
      }
      .toc a:hover { background: var(--bg-soft); }
      .toc .num {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: var(--muted-2);
        font-feature-settings: "tnum";
      }
      .toc .title {
        font-family: "Instrument Serif", serif;
        font-size: 22px;
        color: var(--fg);
      }
      .toc .meta {
        font-size: 11px;
        color: var(--muted-2);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }
      .toc .read-dot {
        display: inline-block;
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--accent);
        margin-right: 6px;
        vertical-align: middle;
      }

      /* ─── Chapter ─────────────────────────────────────────────────────── */
      .chapter-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
        margin-bottom: 18px;
        font-size: 13px;
        color: var(--muted);
      }
      .chapter-meta .read-time {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .chapter-meta .read-time svg { width: 14px; height: 14px; }
      .chapter-meta .theme-tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .theme-tag {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--accent-soft);
      }
      .chapter-title { font-size: clamp(38px, 7vw, 60px); margin-bottom: 32px; }

      /* ─── Päättäjätiivistelmä ──────────────────────────────────────────── */
      .summary-box {
        background: var(--summary-bg);
        border-left: 3px solid var(--summary-bar);
        padding: 22px 24px;
        margin-bottom: 36px;
        border-radius: 0 12px 12px 0;
      }
      .summary-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .summary-box ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .summary-box li {
        display: flex;
        gap: 12px;
        font-size: 15.5px;
        line-height: 1.55;
        color: var(--fg);
      }
      .summary-box li::before {
        content: "--";
        color: var(--muted-2);
        flex-shrink: 0;
        font-weight: 500;
      }

      /* ─── Avainluvut ───────────────────────────────────────────────────── */
      .figures {
        margin-bottom: 40px;
      }
      .figures-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .figures-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }
      .figure-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
        box-shadow: var(--shadow-sm);
      }
      .figure-value {
        font-family: "Instrument Serif", serif;
        font-size: 32px;
        line-height: 1.05;
        color: var(--fg);
        margin-bottom: 8px;
        font-feature-settings: "tnum";
      }
      .figure-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        line-height: 1.3;
      }
      .figure-source {
        font-size: 11px;
        color: var(--muted-2);
        font-style: italic;
        margin-top: 6px;
      }
      .figures-source {
        font-size: 11px;
        color: var(--muted-2);
        font-style: italic;
        margin-top: 10px;
        text-align: right;
      }

      /* ─── Reader ───────────────────────────────────────────────────────── */
      .reader {
        font-size: var(--reader-fs, 18.5px);
        line-height: var(--reader-lh, 1.78);
        color: var(--fg-soft);
        max-width: 68ch;
        hyphens: auto;
        -webkit-hyphens: auto;
        overflow-wrap: break-word;
      }
      .reader p { margin: 0 0 1.2em; }
      .reader h1, .reader h2, .reader h3 { margin: 1.8em 0 .55em; color: var(--fg); }
      .reader h1 { font-size: 1.55em; }
      .reader h2 { font-size: 1.35em; }
      .reader h3 { font-size: 1.18em; }
      .reader blockquote {
        margin: 1.4em 0;
        padding-left: 1.1em;
        border-left: 3px solid var(--line-strong);
        color: var(--muted);
        font-style: italic;
      }
      .reader ul, .reader ol { padding-left: 1.4em; }
      .reader li { margin-bottom: .4em; }
      .reader strong { color: var(--fg); font-weight: 600; }
      .reader code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.92em;
        background: var(--bg-soft);
        padding: 1px 5px;
        border-radius: 4px;
      }

      /* ─── Pager (desktop) ──────────────────────────────────────────────── */
      .pager {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        margin-top: 60px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
      }
      .pager a { padding: 8px 12px; border-radius: 8px; }
      .pager a:hover { background: var(--bg-soft); color: var(--fg); }
      .right { text-align: right; margin-left: auto; }
      .m-pager { display: none; }

      /* ─── Status / error ───────────────────────────────────────────────── */
      .status { color: var(--muted); padding: 40px 0; text-align: center; }
      .error {
        color: var(--danger);
        white-space: pre-wrap;
        font-family: inherit;
        padding: 24px;
        background: var(--bg-soft);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      /* ─── Ambient appendices ───────────────────────────────────────────── */

      /* Osion wrapper jolla on sivumarginaali desktopilla */
      .section-wrap {
        position: relative;
      }

      /* Liite kelluu oikeassa marginaalissa desktopilla */
      @media (min-width: 1100px) {
        .section-wrap { display: grid; grid-template-columns: 68ch 1fr; gap: 0 48px; align-items: start; }
        .section-wrap .reader-content { grid-column: 1; }
        .section-wrap .section-apps  { grid-column: 2; padding-top: 0.4em; }
      }
      @media (max-width: 1099px) {
        .section-apps { margin-top: 2em; }
      }

      /* Ambient card -- alkaa näkymättömänä, paljastuu scrollatessa */
      .ambient-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px 20px 20px;
        margin-bottom: 20px;
        box-shadow: 0 1px 0 rgba(31,27,21,0.03), 0 3px 14px rgba(31,27,21,0.04);
        opacity: 0;
        transform: translateY(10px);
        transition: opacity .5s ease, transform .5s ease;
        cursor: default;
      }
      .ambient-card.revealed {
        opacity: 1;
        transform: translateY(0);
      }
      /* Otsikko */
      .ambient-card-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .ambient-card-icon {
        width: 28px; height: 28px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 7px;
        background: var(--bg-soft);
        color: var(--muted);
        flex-shrink: 0;
      }
      .ambient-card-icon svg { width: 14px; height: 14px; }
      .ambient-card-title {
        font-family: "Instrument Serif", serif;
        font-size: 15px;
        line-height: 1.25;
        color: var(--fg);
        flex: 1;
      }
      /* Expand/collapse -- mobiilissa ja kun marginaalissa ei ole tilaa */
      .ambient-card-toggle {
        width: 26px; height: 26px;
        display: none;
        align-items: center; justify-content: center;
        border: none; background: none; cursor: pointer;
        color: var(--muted); border-radius: 6px;
        flex-shrink: 0;
      }
      .ambient-card-toggle:hover { background: var(--bg-soft); color: var(--fg); }
      @media (max-width: 1099px) { .ambient-card-toggle { display: flex; } }
      .ambient-card-body { }
      .ambient-card-body[hidden] { display: none; }
      @media (max-width: 1099px) { .ambient-card-body { display: none; } }
      .ambient-card-body.open { display: block !important; }

      /* Sisältö */
      .ambient-card .lead {
        font-family: "Instrument Serif", serif;
        font-size: 15px;
        line-height: 1.55;
        color: var(--fg-soft);
        margin: 0 0 14px;
      }
      .ambient-card .chart-wrap {
        margin: 0 0 12px;
        border-radius: 8px;
        overflow: hidden;
        background: var(--bg-soft);
        padding: 12px;
        min-height: 180px;
        position: relative;
      }
      .ambient-card .chart-wrap canvas { width: 100% !important; }
      .ambient-card .note {
        font-size: 12.5px;
        color: var(--muted);
        background: var(--bg-soft);
        border-left: 2px solid var(--line-strong);
        padding: 8px 12px;
        margin: 0 0 10px;
        line-height: 1.55;
        border-radius: 0 5px 5px 0;
      }
      .ambient-card .key-insight {
        font-size: 13px;
        font-weight: 600;
        color: var(--fg);
        margin: 12px 0 0;
        padding: 10px 14px;
        background: var(--bg-soft);
        border-radius: 8px;
        line-height: 1.5;
      }
      .ambient-card .source {
        font-size: 11px;
        color: var(--muted-2);
        font-style: italic;
        margin: 10px 0 0;
        padding-top: 8px;
        border-top: 1px solid var(--line);
      }
      /* Findings */
      .ambient-card .findings { margin: 12px 0 0; }
      .ambient-card .finding {
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .ambient-card .finding:first-child { border-top: none; padding-top: 0; }
      .ambient-card .finding-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--fg);
        margin-bottom: 3px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .ambient-card .finding-text { font-size: 13px; color: var(--fg-soft); line-height: 1.5; }
      .ambient-card .finding-note { font-size: 12px; color: var(--muted); margin-top: 2px; font-style: italic; }

      /* Taulukko ambient-kortissa */
      .ambient-card table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 8px 0; }
      .ambient-card th { text-align: left; font-weight: 600; color: var(--fg); padding: 5px 8px; border-bottom: 1px solid var(--line-strong); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
      .ambient-card td { padding: 5px 8px; border-bottom: 1px solid var(--line); color: var(--fg-soft); vertical-align: top; }
      .ambient-card tr:last-child td { border-bottom: none; }

      /* Vanha toggle-rakenne -- pidetään toimivana fallbackina */
      .app-inline { margin-top: 0; }
      .app-inline.chapter-level { margin-top: 2em; }
      .app-inline-label { display: none; }
      .app-inline-toggles { display: flex; flex-wrap: wrap; gap: 6px; }
      .app-toggle {
        position: relative;
        display: inline-flex; align-items: center; justify-content: center;
        width: 32px; height: 32px; padding: 0;
        border: 1px solid var(--line); border-radius: 8px;
        background: var(--card); cursor: pointer; color: var(--muted);
        font-family: inherit; transition: border-color .15s, color .15s, background .15s;
      }
      .app-toggle:hover { border-color: var(--line-strong); color: var(--fg); }
      .app-toggle[aria-expanded="true"] { border-color: var(--fg); color: var(--bg); background: var(--fg); }
      .app-toggle svg { width: 15px; height: 15px; }
      .app-toggle .app-toggle-title {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }
      .app-body {
        margin-top: 14px; padding: 20px 22px 22px;
        background: var(--card); border: 1px solid var(--line); border-radius: 12px;
        box-shadow: 0 1px 0 rgba(31,27,21,0.03), 0 3px 14px rgba(31,27,21,0.05);
        animation: appBodyIn .2s ease;
      }
      @keyframes appBodyIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: translateY(0); } }
      .app-body[hidden] { display: none; }
      .app-body-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
      .app-body-head .kind { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted-2); flex-shrink: 0; background: var(--bg-soft); padding: 3px 7px; border-radius: 4px; }
      .app-body-head h3 { flex: 1; font-family: "Instrument Serif", serif; font-size: 19px; line-height: 1.2; color: var(--fg); }
      .app-body .lead { font-family: "Instrument Serif", serif; font-size: 17px; line-height: 1.55; color: var(--fg-soft); margin: 0 0 14px; }
      .app-body .note { font-size: 13px; color: var(--muted); background: var(--bg-soft); border-left: 2px solid var(--line-strong); padding: 9px 12px; margin: 0 0 12px; line-height: 1.6; border-radius: 0 5px 5px 0; }
      .app-body .source { font-size: 11.5px; color: var(--muted-2); font-style: italic; margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }

      /* Timeline */
      .app-timeline { list-style: none; padding: 0; margin: 0; }
      .app-timeline li { padding: 12px 0; border-bottom: 1px solid var(--line); }
      .app-timeline li:last-child { border-bottom: none; }
      .app-timeline .period {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .app-timeline .event {
        font-family: "Instrument Serif", serif;
        font-size: 19px;
        line-height: 1.25;
        margin-bottom: 6px;
      }
      .app-timeline .desc { font-size: 14px; line-height: 1.6; color: var(--muted); }

      /* Chain */
      .app-path-set { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 10px; }
      .app-path { border: 1px solid var(--line); border-left: 3px solid var(--accent-soft); border-radius: 8px; padding: 10px 12px; background: var(--bg-soft); }
      .app-path-cond { font-weight: 600; color: var(--accent); font-size: 0.9rem; margin-bottom: 4px; }
      .app-path-claim { color: var(--accent-soft); margin-bottom: 8px; }
      .app-path-facets { margin: 0; display: grid; gap: 6px; }
      .app-path-facet { display: grid; grid-template-columns: 70px 1fr; gap: 8px; align-items: baseline; }

    <script>
      // FOUC-esto: aseta teema ja fonttikoko ENNEN rungon renderöintiä.

      (function () {

          var s = JSON.parse(localStorage.getItem("hk-settings-v1") || "{}");
          var prefersDark = window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = s.theme || (prefersDark ? "dark" : "paper");
          var fontSize = s.fontSize || "m";
          document.documentElement.setAttribute("data-theme", theme);

      })();

    <script>
      // ═══════════════════════════════════════════════════════════════════════
      //  Storage & Settings
      // ═══════════════════════════════════════════════════════════════════════
      const STORE_KEY = "hk-settings-v1";
      const LASTREAD_KEY = "hk-last-read-v1";
      const loadSettings = () => {
        try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }
        catch { return {}; }
      };
      const saveSettings = (s) => {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch {}
      };
      const settings = loadSettings();

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        settings.theme = theme;
        saveSettings(settings);
        document.querySelectorAll("[data-theme-set]").forEach((b) => {
          b.setAttribute("aria-pressed", b.dataset.themeSet === theme ? "true" : "false");
        });
      }
      function applyFontSize(fs) {
        document.documentElement.setAttribute("data-fontsize", fs);
        settings.fontSize = fs;
        saveSettings(settings);
        document.querySelectorAll("[data-fs]").forEach((b) => {
          b.setAttribute("aria-pressed", b.dataset.fs === fs ? "true" : "false");
        });
      }

      // Initial: stored > system preference > paper default
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      applyTheme(settings.theme || (prefersDark ? "dark" : "paper"));
      applyFontSize(settings.fontSize || "m");

      // Settings panel toggle
      const settingsBtn = document.getElementById("settingsBtn");
      const settingsPanel = document.getElementById("settingsPanel");
      function toggleSettings(force) {
        const open = force !== undefined ? force : settingsPanel.dataset.open !== "true";
        settingsPanel.dataset.open = open ? "true" : "false";
        settingsBtn.setAttribute("aria-expanded", open ? "true" : "false");
        settingsBtn.setAttribute("aria-pressed", open ? "true" : "false");
      }
      settingsBtn.addEventListener("click", () => toggleSettings());
      document.addEventListener("click", (e) => {
        if (settingsPanel.dataset.open === "true" &&
            !settingsPanel.contains(e.target) && e.target !== settingsBtn && !settingsBtn.contains(e.target)) {
          toggleSettings(false);
        }
      });
      document.querySelectorAll("[data-theme-set]").forEach((b) => {
        b.addEventListener("click", () => applyTheme(b.dataset.themeSet));
      });
      document.querySelectorAll("[data-fs]").forEach((b) => {
        b.addEventListener("click", () => applyFontSize(b.dataset.fs));
      });

      // ═══════════════════════════════════════════════════════════════════════
      //  Utilities
      // ═══════════════════════════════════════════════════════════════════════
      const app = document.getElementById("main-content");
      document.getElementById("year").textContent = new Date().getFullYear();

      const esc = (v) =>
        String(v ?? "").replace(/[&<>'"]/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;",
        })[c]);

      const path = () => {
        const h = location.hash.replace(/^#/, "");
        return h ? (h.startsWith("/") ? h : `/${h}`) : "/";
      };

      const setStatus = (text) => { app.innerHTML = `<p class="status">${esc(text)}</p>`; };
      const setError = (text) => {
        app.innerHTML = `<pre class="error">${esc(text)}</pre>`;
      };

      function setMeta(title, description) {

          for (const row of rows) for (const k of Object.keys(row)) if (!seen.has(k)) { seen.add(k); keys.push(k); }
          const head = keys.map((k) => `<th>${esc(k.replace(/_/g, " "))}</th>`).join("");
          const body = rows.map((r) => `<tr>${keys.map((k) => `<td>${esc(r[k] ?? "")}</td>`).join("")}</tr>`).join("");
          table = `<div style="overflow-x:auto"><table class="app-calc-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
        }
        return [
          c.body ? `<p class="lead">${esc(c.body)}</p>` : "",
          c.note ? `<div class="note">${esc(c.note)}</div>` : "",
          table,
          renderAnalysisFields(c),
          c.source ? `<div class="source">${esc(c.source)}</div>` : "",
        ].join("");
      }
      function renderEvidence(c) {
        const commentaryFields = ["consensus", "honest_assessment", "pattern", "deeper_pattern", "current_relevance", "controversy", "relevance", "implication", "ai_question", "neuroscience_link", "open_question"];
        const objectFields = ["distinction"];
        let listVal = null;
        for (const [, v] of Object.entries(c)) if (Array.isArray(v)) { listVal = v; break; }
        const lead = c.body ? `<p class="lead">${esc(c.body)}</p>` : "";
        const note = c.note ? `<div class="note">${esc(c.note)}</div>` : "";
        const commentary = commentaryFields
          .filter((k) => typeof c[k] === "string" && c[k].trim())
          .map((k) => `<div class="app-chain-extra"><div class="label">${esc(k.replace(/_/g, " "))}</div><div>${esc(c[k])}</div></div>`).join("");
        const objects = objectFields
          .filter((k) => c[k] && typeof c[k] === "object" && !Array.isArray(c[k]))
          .map((k) => {
            const obj = c[k];
            const rows = Object.entries(obj).map(([key, val]) => `<dt>${esc(key.replace(/_/g, " "))}</dt><dd>${esc(val)}</dd>`).join("");
            return `<dl class="app-kv">${rows}</dl>`;
          }).join("");
        let list = "";
        if (listVal && listVal.length) {
          list = `<ul class="app-items">${listVal.map((item) => renderEvidenceItem(item)).join("")}</ul>`;
        }
        return [lead, note, objects, list, commentary, c.source ? `<div class="source">${esc(c.source)}</div>` : ""].join("");
      }
      function renderEvidenceItem(item) {
        if (typeof item === "string") return `<li><div class="app-item-body">${esc(item)}</div></li>`;
        if (!item || typeof item !== "object") return "";
        const titleKeys = ["domain", "aihe", "tapaus", "murros", "mittari", "kanta", "kyky", "lähestymistapa", "kuvaus", "taso", "aalto", "löytö"];
        const bodyKeys = ["example", "havainto", "kuvaus", "vääristymä", "tila", "consequence", "tulos", "huoli", "rajoitus", "idea"];
        let titleKey = titleKeys.find((k) => typeof item[k] === "string" && item[k].trim());
        let bodyKey = bodyKeys.find((k) => k !== titleKey && typeof item[k] === "string" && item[k].trim());
        const stringKeys = Object.keys(item).filter((k) => typeof item[k] === "string" && item[k].trim());
        if (!titleKey && stringKeys.length) titleKey = stringKeys[0];
        if (!bodyKey && stringKeys.length > 1) bodyKey = stringKeys.find((k) => k !== titleKey);
        const titleHtml = titleKey ? `<div class="app-item-head">${esc(item[titleKey])}</div>` : "";
        const bodyHtml = bodyKey ? `<div class="app-item-body"><p>${esc(item[bodyKey])}</p></div>` : "";
        const restKeys = stringKeys.filter((k) => k !== titleKey && k !== bodyKey);
        const rest = restKeys.length
          ? `<dl class="app-kv">${restKeys.map((k) => `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${esc(item[k])}</dd>`).join("")}</dl>`
          : "";
        return `<li>${titleHtml}${bodyHtml}${rest}</li>`;
      }

      // ─── note ─────────────────────────────────────────────────────────────
      function renderNote(c) {
        const body = c.body ? `<p class="lead">${esc(c.body)}</p>` : "";
        const note = c.note ? `<div class="note">${esc(c.note)}</div>` : "";
        const text = c.text ? `<div class="app-note-text">${esc(c.text)}</div>` : "";
        const source = c.source ? `<div class="source">${esc(c.source)}</div>` : "";
        return [body, note, text, source].join("");
      }

      // ─── list ─────────────────────────────────────────────────────────────
      function renderList(c) {
        const items = Array.isArray(c.items) ? c.items : [];
        const isOrdered = c.ordered === true;
        const tag = isOrdered ? "ol" : "ul";
        const lead = c.body ? `<p class="lead">${esc(c.body)}</p>` : "";
        const note = c.note ? `<div class="note">${esc(c.note)}</div>` : "";
        const listHtml = items.length
          ? `<${tag} class="app-list">${items.map((it) => {
              if (typeof it === "string") return `<li>${esc(it)}</li>`;
              if (it && typeof it === "object") {
                const head = it.title || it.label || it.name;
                const body = it.body || it.text || it.description;
                return `<li>${head ? `<div class="app-list-head">${esc(head)}</div>` : ""}${body ? `<div class="app-list-body">${esc(body)}</div>` : ""}</li>`;
              }
              return "";
            }).join("")}</${tag}>`
          : "";
        const source = c.source ? `<div class="source">${esc(c.source)}</div>` : "";
        return [lead, note, listHtml, source].join("");
      }

      // ─── table ────────────────────────────────────────────────────────────
      function renderTable(c) {
        const headers = Array.isArray(c.headers) ? c.headers : null;
        const rows = Array.isArray(c.rows) ? c.rows : [];
        const lead = c.body ? `<p class="lead">${esc(c.body)}</p>` : "";
        const note = c.note ? `<div class="note">${esc(c.note)}</div>` : "";
        let table = "";
        if (rows.length) {
          let keys = headers;
          // Jos headers ei annettu: kerää avaimet riveistä (jos rivit ovat objekteja)
          if (!keys && rows.every(r => r && typeof r === "object" && !Array.isArray(r))) {
            const seen = new Set();
            keys = [];
            for (const r of rows) for (const k of Object.keys(r)) if (!seen.has(k)) { seen.add(k); keys.push(k); }
          }
          // Tapaus 1: rivit ovat objekteja → käytä avaimia sarakkeisiin
          // Tapaus 2: rivit ovat taulukoita → käytä headers-otsikoita jos on
          const isObjectRows = rows[0] && typeof rows[0] === "object" && !Array.isArray(rows[0]);
          const head = keys
            ? `<thead><tr>${keys.map(k => `<th>${esc(String(k).replace(/_/g, " "))}</th>`).join("")}</tr></thead>`
            : "";
          const body = `<tbody>${rows.map(r => {
            if (Array.isArray(r)) {
              return `<tr>${r.map(cell => `<td>${esc(cell ?? "")}</td>`).join("")}</tr>`;
            }
            if (isObjectRows && keys) {
              return `<tr>${keys.map(k => `<td>${esc(r[k] ?? "")}</td>`).join("")}</tr>`;
            }
            return "";
          }).join("")}</tbody>`;
          table = `<div style="overflow-x:auto"><table class="app-table">${head}${body}</table></div>`;
        }
        const source = c.source ? `<div class="source">${esc(c.source)}</div>` : "";
        return [lead, note, table, renderAnalysisFields(c), source].join("");
      }

      // ─── paperdoll ────────────────────────────────────────────────────────
      // Yleinen rakenne: yksi tai useampi hahmo vierekkäin tai ruudukossa.
      // Jokainen hahmo: kuva (image), nimi/ajankohta (label, sublabel), ja
      // joukko kiteytettyjä tunnuslukuja (stats).
      //
      // Esimerkki content-rakenne:
      // {
      //   "body": "Kuvaava johdanto",
      //   "layout": "side-by-side" | "grid",
      //   "subjects": [
      //     {
      //       "label": "Vilho",
      //       "sublabel": "1925",
      //       "image": "images/vilho-1925.png",
      //       "alt": "Maatyöläinen viikate kädessään",
      //       "stats": [
      //         { "label": "Elinajanodote", "value": "51 v" },
      //         { "label": "Koulutus", "value": "4 v" }
      //       ],
      //       "caption": "Vapaa lisäteksti hahmon alle"
      //     }
      //   ],
      //   "source": "Lähde"
      // }
      function renderPaperdollBlock(b) {
        if (!b || typeof b !== "object") return "";
        const intro = b.intro ? `<p class="paperdoll-block-intro">${esc(b.intro)}</p>` : "";
        const rows = Array.isArray(b.rows) ? b.rows : [];
        let table = "";
        if (rows.length) {
          const head = Array.isArray(b.headers) && b.headers.length
            ? `<thead><tr>${b.headers.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead>` : "";
          const body = `<tbody>${rows.map((r) => `<tr>${(Array.isArray(r) ? r : [r]).map((cell, i) => i === 0 ? `<th>${esc(cell)}</th>` : `<td>${esc(cell)}</td>`).join("")}</tr>`).join("")}</tbody>`;
          table = `<div class="paperdoll-table-wrap"><table class="paperdoll-table">${head}${body}</table></div>`;
        }
        const reading = b.reading ? `<div class="note">${esc(b.reading)}</div>` : "";
        const sources = b.sources ? `<div class="source">${esc(b.sources)}</div>` : "";
        return intro + table + reading + sources;
      }
      function renderPaperdoll(c) {
        const subjects = Array.isArray(c.subjects) ? c.subjects : [];
        const lead = c.body ? `<p class="lead">${esc(c.body)}</p>` : "";
        const note = c.note ? `<div class="note">${esc(c.note)}</div>` : "";
        const layoutClass = c.layout === "grid" ? "paperdoll-grid" : "paperdoll-row";
        const backdrop = c.backdrop === true && subjects.length === 1;
        const bgOpacity = (typeof c.bg_opacity === "number") ? c.bg_opacity : 0.4;
        const figures = subjects.map((s) => {
          const head = (s.label || s.sublabel) ? `
            <div class="paperdoll-head">
              ${s.label ? `<div class="paperdoll-label">${esc(s.label)}</div>` : ""}
              ${s.sublabel ? `<div class="paperdoll-sublabel">${esc(s.sublabel)}</div>` : ""}
            </div>` : "";
          const stats = Array.isArray(s.stats) && s.stats.length
            ? `<dl class="paperdoll-stats">${s.stats.map((st) => `
                <div class="paperdoll-stat">
                  <dt>${esc(st.label || "")}</dt>
                  <dd>${esc(st.value || "")}</dd>
                </div>`).join("")}</dl>`
            : "";
          const caption = s.caption ? `<div class="paperdoll-caption">${esc(s.caption)}</div>` : "";
          if (backdrop && s.image) {
            return `<figure class="paperdoll paperdoll-backdrop">`
              + `<div class="paperdoll-bg" style="background-image:url('${esc(s.image)}'); opacity:${bgOpacity};" role="img" aria-label="${esc(s.alt || s.label || "")}"></div>`
              + `<div class="paperdoll-fg">${head}${stats}${caption}</div>`
              + `</figure>`;
          }
          const img = s.image
            ? `<div class="paperdoll-image"><img src="${esc(s.image)}" alt="${esc(s.alt || s.label || "")}" loading="lazy"></div>`
            : `<div class="paperdoll-image paperdoll-image-empty" aria-hidden="true"></div>`;
          return `<figure class="paperdoll">${img}${head}${stats}${caption}</figure>`;
        }).join("");
        const wrap = subjects.length ? `<div class="paperdoll-set ${layoutClass}">${figures}</div>` : "";
        const eraContext = c.era_context ? `<p class="paperdoll-era-context">${esc(c.era_context)}</p>` : "";
        const eraStats = renderPaperdollBlock(c.era_stats);
        const cousins = renderPaperdollBlock(c.cousins);
        const cousinsNote = c.cousins_note ? `<div class="note">${esc(c.cousins_note)}</div>` : "";
        const source = c.source ? `<div class="source">${esc(c.source)}</div>` : "";
        return [lead, note, wrap, eraContext, eraStats, cousins, cousinsNote, source].join("");
      }

      // ─── chart-chartjs ────────────────────────────────────────────────────
      // Sisältö voi olla joko:
      //   a) "raw"-muoto: { kind: "raw", config: {...} }  -- kokonainen Chart.js-config
      //   b) "preset-fi-nordic"-muoto:
      //      {
      //        kind: "preset-fi-nordic",
      //        chartType: "line" | "bar",
      //        yearsFrom: 1860, yearsTo: 2024, yearsStep: 2,
      //        yMin: 0, yMax: 100, yLabel: "%", xStep: 20,
      //        yFmt: "percent" | "raw" | "decimal",
      //        crisisYears: [1918, 1991, 2008],
      //        series: [
      //          { label: "Suomi", color: "fi", dashed: false, data: { "1860": 72, ... } },
      //          { label: "Pohjoismaat", color: "nordic", dashed: true, data: { ... } }
      //        ]
      //      }
      let _chartJsLoadPromise = null;
      function loadChartJsOnce() {
        if (window.Chart) return Promise.resolve();
        if (_chartJsLoadPromise) return _chartJsLoadPromise;
        _chartJsLoadPromise = new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js";
          s.onload = () => {
            // Lataa myös annotation-plugin (käytetään kriisivuosiin)
            const a = document.createElement("script");
            a.src = "https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js";
            a.onload = () => resolve();
            a.onerror = () => resolve(); // jatka silti ilman annotation-pluginia
            document.head.appendChild(a);
          };
          s.onerror = () => reject(new Error("Chart.js ei latautunut"));
          document.head.appendChild(s);
        });
        return _chartJsLoadPromise;
      }

      function chartPalette() {
        const cs = getComputedStyle(document.documentElement);
        const tok = (n, fb) => { const v = cs.getPropertyValue(n).trim(); return v || fb; };
        // Sivun pääväreistä, erot sävyillä -- ei vieraita sävyjä.
        return {
          fi: tok('--accent', '#1f1b15'),
          nordic: tok('--muted', '#6b6356'),
          replacement: tok('--accent-soft', '#4a4034'),
          peer3: tok('--line-strong', '#c9bfa9'),
          crisis: tok('--accent-soft', '#4a4034'),
          grid: tok('--line', '#e6dfd0'),
          text: tok('--muted', '#6b6356')
        };
      }

      function chartFormatter(kind) {
        if (kind === "percent") return (v) => v + ' %';
        if (kind === "decimal") return (v) => Number(v).toFixed(1);
        return (v) => v;
      }

      function buildChartPreset(content) {
        const C = chartPalette();
        const from = Number(content.yearsFrom);
        const to = Number(content.yearsTo);
        const step = Number(content.yearsStep) || 2;
        const years = [];
        for (let y = from; y <= to; y += step) years.push(y);
        const yFmt = chartFormatter(content.yFmt);

        const datasets = (content.series || []).map((s) => {
          const color = s.color === "nordic" ? C.nordic
            : s.color === "crisis" ? C.crisis
            : s.color === "replacement" ? C.replacement
            : (typeof s.color === "string" && s.color.startsWith("#")) ? s.color
            : C.fi;
          const dataObj = s.data || {};
          const data = years.map(y => dataObj[y] !== undefined ? dataObj[y] : null);
          return {
            label: s.label || "",
            data,
            borderColor: color,
            backgroundColor: content.chartType === "bar" ? color : 'transparent',
            borderWidth: s.dashed ? 1.4 : (color === C.fi ? 2.2 : 1.6),
            borderDash: s.dashed ? [5, 4] : [],
            pointRadius: 0,
            pointHoverRadius: 3,
            tension: 0.25,
            ...(content.chartType === "bar" ? { borderRadius: 3, barPercentage: 0.7, categoryPercentage: 0.75 } : {})
          };
        });

        const annotations = {};
        (content.crisisYears || []).forEach((y, i) => {
          annotations["crisis_" + i] = {
            type: 'line', xMin: y, xMax: y,
            borderColor: C.crisis, borderWidth: 1, borderDash: [3, 3]
          };
        });

        const opts = {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: content.showLegend !== false, labels: { color: C.text, font: { size: 11 } } },
            tooltip: {
              callbacks: {
                title: (items) => 'Vuosi ' + items[0].label,
                label: (item) => item.dataset.label + ': ' + yFmt(item.parsed.y)
              }
            },
            ...(Object.keys(annotations).length ? { annotation: { annotations } } : {})
          },
          scales: {
            x: {
              type: content.chartType === "bar" ? 'category' : 'linear',
              ...(content.chartType === "bar" ? {} : { min: from, max: to }),
              ticks: {
                stepSize: content.xStep || 20,
                color: C.text, font: { size: 10 },
                callback: content.chartType === "bar" ? undefined : (v) => String(Math.round(v))
              },
              grid: { color: C.grid, display: content.chartType !== "bar" }
            },
            y: {
              min: content.yMin ?? undefined,
              max: content.yMax ?? undefined,
              ticks: { color: C.text, font: { size: 10 }, callback: (v) => yFmt(v) },
              grid: { color: C.grid },
              title: content.yLabel ? { display: true, text: content.yLabel, color: C.text, font: { size: 10 } } : { display: false }
            }
          }
        };

        return {
          type: content.chartType || "line",
          data: { labels: years, datasets },
          options: opts
        };
      }

      // Täydentää valmiin Chart.js-datan värit teemapaletista, jos datasetit
      // eivät määrittele niitä. Käytetään kun liite tuo oman content.chart-rakenteen
      // (esim. COFOG-liitteet): { data: { labels, datasets:[{label, data}] }, type, options }
      // Ensimmäinen sarja korostetaan (Suomi-väri), muut himmeämpiä -- paitsi jos
      // label viittaa tunnettuun maahan, jolloin Suomi saa korostuksen.
      function colorizeDatasets(config) {
        const C = chartPalette();
        if (!config || !config.data || !Array.isArray(config.data.datasets)) return config;
        const nordicFallback = [C.nordic, C.replacement, C.peer3];
        let fallbackIdx = 0;
        config.data.datasets.forEach((ds) => {
          const label = (ds.label || "").toLowerCase();
          const isFinland = label.includes("suomi") || label.includes("finland");
          if (ds.borderColor === undefined) {
            ds.borderColor = isFinland ? C.fi : nordicFallback[fallbackIdx++ % nordicFallback.length];
          }
          if (ds.backgroundColor === undefined) {
            ds.backgroundColor = (config.type === "bar") ? ds.borderColor : 'transparent';
          }
          if (ds.borderWidth === undefined) ds.borderWidth = isFinland ? 2.0 : 1.5;
          if (ds.pointRadius === undefined) ds.pointRadius = 0;
          if (ds.pointHoverRadius === undefined) ds.pointHoverRadius = 3;
          if (ds.tension === undefined && config.type !== "bar") ds.tension = 0.25;
        });
        return config;
      }

      // Täydentää valmiin configin options-osan teemaväreillä (akselit, legenda,
      // ruudukko), jos niitä ei ole asetettu. Säilyttää liitteen omat asetukset.
      function applyChartTheme(config) {
        const C = chartPalette();
        config.options = config.options || {};
        const o = config.options;
        if (o.responsive === undefined) o.responsive = true;
        if (o.maintainAspectRatio === undefined) o.maintainAspectRatio = false;
        o.plugins = o.plugins || {};
        o.plugins.legend = o.plugins.legend || {};
        o.plugins.legend.labels = Object.assign({ color: C.text, font: { size: 11 } }, o.plugins.legend.labels || {});
        o.scales = o.scales || {};
        ["x", "y"].forEach((ax) => {
          o.scales[ax] = o.scales[ax] || {};
          o.scales[ax].ticks = Object.assign({ color: C.text, font: { size: 10 } }, o.scales[ax].ticks || {});
          o.scales[ax].grid = Object.assign({ color: C.grid }, o.scales[ax].grid || {});
          if (o.scales[ax].title) {
            o.scales[ax].title = Object.assign({ color: C.text, font: { size: 10 } }, o.scales[ax].title);
          }
        });
        return config;
      }

      function renderChartJs(app) {
        const c = app.content || {};
        const id = "chartjs_" + Math.random().toString(36).slice(2, 10);
        const lead = c.body ? `<p class="lead">${esc(c.body)}</p>` : "";
        const note = c.note ? `<div class="note">${esc(c.note)}</div>` : "";
        const source = c.source ? `<div class="source">${esc(c.source)}</div>` : "";
        const analysis = renderAnalysisFields(c);
        const height = Number(c.height) || 360;
        const canvas = `
          <div class="app-chart-wrap" style="height:${height}px">
            <canvas id="${id}"></canvas>
          </div>`;
        // Lataa Chart.js ja piirrä kun DOM on valmis
        setTimeout(() => {
          loadChartJsOnce().then(() => {
            const canvasEl = document.getElementById(id);
            if (!canvasEl) return; // näkymä vaihtunut välissä
            try {
              let config;
              if (c.kind === "raw" && c.config) {
                config = c.config;
              } else if (c.chart && c.chart.data) {
                // Liite tuo valmiin Chart.js-rakenteen content.chart-kentässä
                // (esim. COFOG-liitteet). Täydennä värit ja teema jos puuttuvat.
                config = applyChartTheme(colorizeDatasets(c.chart));
              } else {
                // oletuksena preset-fi-nordic
                config = buildChartPreset(c);
              }
              new Chart(canvasEl, config);
            } catch (err) {
              canvasEl.outerHTML = `<div class="note">Kuvaajan piirto epäonnistui: ${esc(err.message)}</div>`;
            }
          }).catch((err) => {
            const w = document.getElementById(id);
            if (w) w.outerHTML = `<div class="note">Chart.js-kirjastoa ei voitu ladata: ${esc(err.message)}</div>`;
          });
        }, 0);
        return [lead, note, canvas, analysis, source].join("");
      }

      function renderChartUnsupported(app, name) {
        const c = app.content || {};
        const lead = c.body ? `<p class="lead">${esc(c.body)}</p>` : "";
        return `${lead}<div class="note">${name}-pohjaisten kuvaajien lukijatuki on tulossa. Tiedot ovat tallessa tietokannassa.</div>`;
      }

      // Tutkimuskortti: luvun loppuun sijoittuva tiivistelmä.
      // Kokoaa väitteen, kumoutumisehdon (periaate + operationalisointi + datan tila)
      // ja näyttölistan yhteen jäsenneltyyn korttiin. Kumoutumisehto näytetään
      // yhtä näkyvästi kuin näyttö -- tutkimusprotokollan ydinperiaate.
      // VAIHE 5: evidence_key -> series_link -mappi (täytetään latauksessa)
      let seriesLinkMap = {};
      function buildSeriesLinkMap(appendixPayload) {
        seriesLinkMap = {};
        const links = appendixPayload && Array.isArray(appendixPayload.series_links)
          ? appendixPayload.series_links : [];
        for (const l of links) {
          if (l && l.evidence_key) seriesLinkMap[l.evidence_key] = l;
        }
      }

      // Pieni "Data saatavilla" -merkki yhdelle series-linkille
      function renderSeriesAvailability(link) {
        if (!link) return "";
        const years = (link.year_start && link.year_end)
          ? `${link.year_start}–${link.year_end}` : "";
        const codes = Array.isArray(link.expected_j_codes) && link.expected_j_codes.length
          ? link.expected_j_codes.join(" / ") : "";

        // Chart
        if (a.type === 'chart-chartjs' && c.chart) {
          const cid = 'ac-' + Math.random().toString(36).slice(2);
          parts.push(`<div class="chart-wrap"><canvas id="${cid}" height="180"></canvas></div>`);

          setTimeout(() => {
            loadChartJsOnce().then(() => {

              if (!el) return;
              try {
                const cfg = applyChartTheme(colorizeDatasets(c.chart));
                const inst = new Chart(el, cfg);
                // Touch support
                const wrap = el.parentElement;
                if (wrap) {
                  wrap.addEventListener('touchstart', e => { if (e.touches.length===1) e.preventDefault(); }, {passive:false});
                  wrap.addEventListener('touchmove', e => {
                    if (e.touches.length===1) {
                      e.preventDefault();
                      const t = e.touches[0];
                      el.dispatchEvent(new MouseEvent('mousemove', {clientX: t.clientX, clientY: t.clientY, bubbles: true}));
                    }
                  }, {passive:false});
                  wrap.addEventListener('touchend', () => {
                    setTimeout(() => el.dispatchEvent(new MouseEvent('mouseout', {bubbles:true})), 1800);
                  }, {passive:true});
                }
              } catch(e) { console.warn('Ambient chart error', e); }

      function initAmbientReveal() {
        const cards = document.querySelectorAll('.ambient-card');
        if (!cards.length) return;

        // IntersectionObserver: paljasta kortti kun se tulee näkyviin
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const card = entry.target;
              // Pieni viive jotta efekti tuntuu luontevalta
              const idx = parseInt(card.dataset.ambientIdx || '0');
              setTimeout(() => card.classList.add('revealed'), idx * 80);
              obs.unobserve(card);
              // Desktopilla avaa body automaattisesti
              if (window.matchMedia('(min-width: 1100px)').matches) {
                const body = card.querySelector('.ambient-card-body');
                if (body) body.classList.add('open');
              }
            }
          });
        }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });

        cards.forEach(card => obs.observe(card));

        // Toggle mobiilissa
        document.querySelectorAll('.ambient-card-toggle').forEach(btn => {
          btn.addEventListener('click', () => {
            const expanded = btn.getAttribute('aria-expanded') === 'true';
            const bodyId = btn.getAttribute('aria-controls');
            const body = document.getElementById(bodyId);
            if (!body) return;
            if (expanded) {
              body.classList.remove('open');
              btn.setAttribute('aria-expanded', 'false');
              btn.querySelector('svg path').setAttribute('d', 'M4 6l4 4 4-4');
            } else {
              body.classList.add('open');
              btn.setAttribute('aria-expanded', 'true');
              btn.querySelector('svg path').setAttribute('d', 'M4 10l4-4 4 4');
            }
          });
        });
      }
