<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTT · Artikkelieditori</title><style>:root{--ink:#142631;--paper:#f4f0e7;--rust:#b54c2a;--line:rgba(20,38,49,.18)}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}#view{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--paper)}.bar{position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:8px;border:1px solid var(--line);border-radius:999px;background:rgba(255,253,248,.95);box-shadow:0 16px 45px rgba(20,38,49,.18);backdrop-filter:blur(12px)}button{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font:800 9px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}button.primary{background:var(--ink);border-color:var(--ink);color:white}button:disabled{opacity:.35;cursor:not-allowed}.status{padding:0 8px;font-size:10px;font-weight:700;color:#697079;white-space:nowrap}.login{position:fixed;z-index:30;inset:0;display:grid;place-items:center;padding:20px;background:rgba(20,38,49,.52);backdrop-filter:blur(8px)}.login[hidden]{display:none}.card{width:min(520px,100%);padding:26px;border-radius:18px;background:#fffdf8;box-shadow:0 24px 70px rgba(20,38,49,.3)}h1{margin:0 0 8px;font:600 28px/1.1 Georgia,serif}.card p{font-size:12px;line-height:1.6;color:#59616a}.card input{width:100%;height:46px;padding:0 12px;border:1px solid var(--line);font-size:13px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:700px){.bar{left:8px;right:8px;bottom:8px;transform:none;justify-content:center}.status{display:none}button{min-height:44px}}</style></head><body><iframe id="view" title="Artikkelin WYSIWYG-esikatselu"></iframe><div class="bar"><button id="edit" class="primary">Muokkaa</button><button id="preview">Esikatsele</button><button id="cancel" disabled>Peruuta</button><button id="save" disabled>Julkaise</button><span class="status" id="status">ADMIN · lukutila</span></div><div class="login" id="login"><div class="card"><h1>TTT · Admin</h1><p>Anna GitHub fine-grained access token, jolla on repositoryn <b>Contents: write</b> -oikeus. Token säilytetään vain selaimen sessionStorage-muistissa eikä sitä kirjoiteta sivustolle tai GitHubiin.</p><input id="token" type="password" autocomplete="off" placeholder="github_pat_…"><div class="actions"><button id="readOnly">Lukutilaan</button><button id="loginBtn" class="primary">Avaa editori</button></div></div></div><script>(()=>{const REPO='tilastomuuttujat/TTT',BRANCH='main',FILE='kirjoitukset.json';const q=new URLSearchParams(location.search),slug=q.get('id')||'siilot-ja-sisapiirit';const view=document.getElementById('view'),editBtn=document.getElementById('edit'),previewBtn=document.getElementById('preview'),saveBtn=document.getElementById('save'),cancelBtn=document.getElementById('cancel'),status=document.getElementById('status'),login=document.getElementById('login');let token=sessionStorage.getItem('ttt_github_token')||'',data,article,index,dirty=false,editing=false;view.src='./artikkeli.html?id='+encodeURIComponent(slug);login.hidden=!!token;document.getElementById('loginBtn').onclick=()=>{const v=document.getElementById('token').value.trim();if(!v)return;token=v;sessionStorage.setItem('ttt_github_token',v);login.hidden=true};document.getElementById('readOnly').onclick=()=>login.hidden=true;const listOf=d=>Array.isArray(d)?d:(d.kirjoitukset||[]),clone=x=>JSON.parse(JSON.stringify(x));function mark(){dirty=true;saveBtn.disabled=false;cancelBtn.disabled=false;status.textContent='ADMIN · julkaisemattomia muutoksia'}function editable(el,path){if(!el)return;el.dataset.path=JSON.stringify(path);el.contentEditable=editing?'plaintext-only':'false';el.spellcheck=true;if(el.dataset.bound)return;el.dataset.bound='1';el.addEventListener('input',()=>{let a=article,p=JSON.parse(el.dataset.path);for(let i=0;i<p.length-1;i++)a=a[p[i]];a[p[p.length-1]]=el.innerText.trim();mark()})}function bind(){const d=view.contentDocument;if(!d||!article)return;editable(d.querySelector('.hero h1,.doc-title'),['title']);editable(d.querySelector('.dek,.doc-sub'),['subtitle']);const intro=[...d.querySelectorAll('.prose>.lead,.prose>.doc-intro,.doc-head .doc-intro')];(article.intro||[]).forEach((_,i)=>editable(intro[i],['intro',i]));(article.sections||[]).forEach((s,si)=>{const sec=d.getElementById(s.id);if(!sec)return;editable(sec.querySelector('h2,.doc-h2'),['sections',si,'title']);const ps=[...sec.children].filter(x=>x.tagName==='P'&&!x.classList.contains('num'));(s.paragraphs||[]).forEach((_,pi)=>editable(ps[pi],['sections',si,'paragraphs',pi]));if(s.quote!=null)editable(sec.querySelector('blockquote'),['sections',si,'quote']);if(s.closing!=null)editable(sec.querySelector('.closing,.doc-closing'),['sections',si,'closing'])});toggle(editing)}function toggle(on){editing=on;const d=view.contentDocument;if(!d)return;d.body.classList.toggle('ttt-admin-editing',on);d.querySelectorAll('[data-path]').forEach(el=>el.contentEditable=on?'plaintext-only':'false');let style=d.getElementById('ttt-admin-style');if(!style){style=d.createElement('style');style.id='ttt-admin-style';style.textContent='.ttt-admin-editing [data-path]{outline:1px dashed transparent;outline-offset:5px;border-radius:2px;transition:.15s}.ttt-admin-editing [data-path]:hover{outline-color:rgba(181,76,42,.55);background:rgba(255,253,248,.55)}.ttt-admin-editing [data-path]:focus{outline:2px solid #b54c2a;background:#fffdf8}';d.head.append(style)}status.textContent=on?'ADMIN · muokkaustila':(dirty?'ADMIN · esikatselu':'ADMIN · lukutila');editBtn.textContent=on?'Muokkaus päällä':'Muokkaa'}async function load(){data=await fetch('./'+FILE+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());const l=listOf(data);index=l.findIndex(a=>(a.slug||a.id)===slug);if(index<0)throw Error('Artikkelia ei löytynyt');article=clone(l[index]);bind()}view.addEventListener('load',()=>load().catch(e=>{console.error(e);status.textContent='Editorin lataus epäonnistui'}));editBtn.onclick=()=>toggle(!editing);previewBtn.onclick=()=>toggle(false);cancelBtn.onclick=()=>{if(dirty&&confirm('Hylätäänkö julkaisemattomat muutokset?'))location.reload()};async function gh(path,opt={}){const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path+(opt.get?'?ref='+BRANCH:''),{method:opt.method||'GET',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});if(!r.ok)throw Error('GitHub '+r.status+': '+await r.text());return r.json()}const b64=s=>btoa(unescape(encodeURIComponent(s)));saveBtn.onclick=async()=>{if(!token){login.hidden=false;return}saveBtn.disabled=true;status.textContent='Tallennetaan GitHubiin…';try{const live=await fetch('./'+FILE+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()),l=listOf(live),i=l.findIndex(a=>(a.slug||a.id)===(article.slug||article.id));if(i<0)throw Error('Artikkelia ei löytynyt nykyisestä JSONista');l[i]=article;const meta=await gh(FILE,{get:true});await gh(FILE,{method:'PUT',body:{message:'Update '+article.title+' [WYSIWYG]',content:b64(JSON.stringify(live,null,2)+'\n'),sha:meta.sha,branch:BRANCH}});dirty=false;cancelBtn.disabled=true;status.textContent='Julkaistu GitHubiin ✓';setTimeout(()=>status.textContent='ADMIN · lukutila',2200)}catch(e){console.error(e);alert('Julkaisu epäonnistui:\n'+e.message);saveBtn.disabled=false;status.textContent='Tallennus epäonnistui'}};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}})})();</script></body></html>
