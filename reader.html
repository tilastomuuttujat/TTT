<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTT · Lukija</title>
<meta name="theme-color" content="#f3f1eb">
<style>
:root{--ink:#10151d;--paper:#f3f1eb;--surface:#f7f5ef;--line:rgba(16,21,29,.14);--blue:#1e4bd1;--muted:#787873}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);font-family:Inter,system-ui,sans-serif}
.frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--paper)}
.nav-tab{position:fixed;left:0;top:50%;z-index:1100;transform:translateY(-50%);width:31px;height:140px;border:0;background:var(--ink);color:white;writing-mode:vertical-rl;cursor:pointer;font:800 8px/1 system-ui;letter-spacing:.16em}
.nav-tab span{display:block;transform:rotate(180deg)}
.nav-shade{position:fixed;inset:0;z-index:900;background:rgba(15,18,22,.36);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s}
.nav-shade.open{opacity:1;pointer-events:auto}
.nav-drawer{position:fixed;inset:0 auto 0 0;z-index:1000;width:min(420px,90vw);background:var(--surface);transform:translateX(-102%);transition:transform .26s;box-shadow:18px 0 60px rgba(0,0,0,.14);overflow:auto}
.nav-drawer.open{transform:none}
.nav-drawer-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}
.nav-drawer-title{display:flex;align-items:center;gap:11px;font-size:9px;font-weight:800;letter-spacing:.13em}
.nav-drawer-title b{display:grid;place-items:center;width:36px;height:36px;background:var(--ink);color:white}
.nav-drawer-head button{width:40px;height:40px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:23px;cursor:pointer}
.nav-drawer-body{padding:20px 22px 34px}
.article-search{display:block;position:sticky;top:0;z-index:2;padding:0 0 16px;background:var(--surface)}
.article-search input{width:100%;height:46px;padding:0 14px;border:1px solid rgba(16,21,29,.28);background:white;color:var(--ink);font:600 12px/1 system-ui;outline:none}
.article-search input:focus{border-color:var(--ink)}
.article-search input::placeholder{color:#8b8984}
.article-index{border-top:1px solid var(--line)}
.article-index a{display:block;padding:15px 0 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.article-index a.active{padding-left:10px;border-left:3px solid var(--blue)}
.article-index a:hover .article-index-title,.article-index a.active .article-index-title{color:var(--blue)}
.article-index-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:5px;color:#8a8178;font-size:7.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.article-index-title{display:block;font:600 1.05rem/1.18 Georgia,serif;letter-spacing:-.015em}
.article-index-ingress{display:block;margin-top:5px;color:#777a7f;font-size:9.5px;line-height:1.45}
.article-index-empty{padding:26px 0;color:#7c7a75;font-size:11px}
.home-link{display:block;margin-bottom:16px;padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:9px;font-weight:800;letter-spacing:.08em}
.home-link:hover{color:var(--blue)}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:620px){
 .nav-tab{top:auto;left:12px;bottom:14px;transform:none;width:48px;height:48px;border-radius:50%;writing-mode:horizontal-tb}
 .nav-tab span{font-size:0;transform:none}.nav-tab span:after{content:'☰';font-size:18px}
 .nav-drawer{width:min(92vw,390px)}
}
@media(prefers-reduced-motion:reduce){.nav-drawer,.nav-shade{transition:none}}
</style>
</head>
<body>
<iframe class="frame" id="frame" title="TTT artikkeli"></iframe>

<button class="nav-tab" id="nav-tab" type="button" aria-label="Avaa navigaatio" aria-expanded="false"><span>NAVIGOI · TTT</span></button>
<div class="nav-shade" id="shade" aria-hidden="true"></div>

<aside class="nav-drawer" id="drawer" aria-label="Artikkelihakemisto" aria-hidden="true">
  <div class="nav-drawer-head">
    <div class="nav-drawer-title"><b>TTT</b><span>ARTIKKELIT</span></div>
    <button id="nav-close" aria-label="Sulje navigaatio">×</button>
  </div>
  <div class="nav-drawer-body">
    <a class="home-link" href="./blog-modern-v5.html">← TOIMITUKSEN NOSTOT</a>
    <label class="article-search">
      <span class="sr-only">Hae artikkeleita</span>
      <input id="article-search-input" type="search" placeholder="Hae artikkeleita…" autocomplete="off">
    </label>
    <nav class="article-index" id="article-index" aria-label="Artikkelit"></nav>
    <div class="article-index-empty hidden" id="article-index-empty">Ei hakua vastaavia artikkeleita.</div>
  </div>
</aside>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search);
const currentId=params.get('id')||'siilot-ja-sisapiirit';
const currentView=params.get('view')==='living'?'living':'article';
const frame=$('#frame');
frame.src=currentView==='living'
  ? `./artikkeli-living.html?id=${encodeURIComponent(currentId)}`
  : `./artikkeli.html?id=${encodeURIComponent(currentId)}`;

let allArticles=[];
const slug=a=>a.slug||a.id;
const readerUrl=a=>`./reader.html?id=${encodeURIComponent(slug(a))}`;
const ingress=a=>a.ingress||(Array.isArray(a.intro)&&a.intro[0])||a.subtitle||'';

function articleIndexItem(a){
  const tags=(a.tags||[]).slice(0,2).map(esc).join(' · ');
  const active=slug(a)===currentId?' active':'';
  return `<a class="${active.trim()}" href="${readerUrl(a)}">
    <span class="article-index-meta">${tags?`<span>${tags}</span>`:''}${a.readingTime?`<span>· ${esc(a.readingTime)}</span>`:''}</span>
    <span class="article-index-title">${esc(a.title)}</span>
    <span class="article-index-ingress">${esc(ingress(a))}</span>
  </a>`;
}
function renderIndex(list){
  $('#article-index').innerHTML=list.map(articleIndexItem).join('');
  $('#article-index-empty').classList.toggle('hidden',list.length>0);
}
const drawer=$('#drawer'),shade=$('#shade'),tab=$('#nav-tab');
function setDrawer(open){
  drawer.classList.toggle('open',open);
  shade.classList.toggle('open',open);
  drawer.setAttribute('aria-hidden',String(!open));
  shade.setAttribute('aria-hidden',String(!open));
  tab.setAttribute('aria-expanded',String(open));
  if(open)setTimeout(()=>$('#article-search-input')?.focus(),100);
}
tab.addEventListener('click',()=>setDrawer(!drawer.classList.contains('open')));
$('#nav-close').addEventListener('click',()=>setDrawer(false));
shade.addEventListener('click',()=>setDrawer(false));
addEventListener('keydown',e=>{if(e.key==='Escape')setDrawer(false)});

$('#article-search-input').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  renderIndex(!q?allArticles:allArticles.filter(a=>
    [a.title,a.subtitle,ingress(a),...(a.tags||[])].filter(Boolean).join(' ').toLowerCase().includes(q)
  ));
});

fetch('./kirjoitukset.json',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()})
  .then(d=>{allArticles=Array.isArray(d)?d:(d.kirjoitukset||[]);renderIndex(allArticles)})
  .catch(()=>{});
</script>
</body>
</html>
