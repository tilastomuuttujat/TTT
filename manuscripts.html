    </header>

    <div id="settingsPanel" class="settings-panel" role="dialog" aria-label="Lukuasetukset" aria-modal="false">
      <h3>Lukuasetukset</h3>
      <div class="settings-row">
        <label class="settings-label">Fonttikoko</label>
        <div class="settings-group" role="group" aria-label="Fonttikoko">
          <button data-fs="s" aria-pressed="false">S</button>
          <button data-fs="m" aria-pressed="true">M</button>
          <button data-fs="l" aria-pressed="false">L</button>
          <button data-fs="xl" aria-pressed="false">XL</button>
        </div>
      </div>
      <div class="settings-row">
        <label class="settings-label">Teema</label>
        <div class="settings-group" role="group" aria-label="Teema">
          <button data-theme-set="paper" aria-pressed="true">Paperi</button>
          <button data-theme-set="light" aria-pressed="false">Valoisa</button>
          <button data-theme-set="dark" aria-pressed="false">Tumma</button>
        </div>
      </div>
    </div>

    <main id="main-content" class="container"></main>
    <footer class="site">© <span id="year"></span> Harri Käyhkö · Käsikirjoitukset</footer>

    <div id="searchOverlay" class="search-overlay" role="dialog" aria-label="Haku" aria-modal="true">
      <div class="search-box">
        <input id="searchInput" class="search-input" type="search" placeholder="Hae luvuista, teemoista, avainluvuista…" autocomplete="off" aria-label="Hakukenttä" />
        <div id="searchResults" class="search-results"></div>
      </div>
    </div>

    <script>
      // ═══════════════════════════════════════════════════════════════════════
      //  Storage & Settings
      // ═══════════════════════════════════════════════════════════════════════
      const STORE_KEY = "hk-settings-v1";
      const LASTREAD_KEY = "hk-last-read-v1";
      const loadSettings = () => {
        try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }
        catch { return {}; }
      };
      const saveSettings = (s) => {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch {}
      };
      const settings = loadSettings();

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        settings.theme = theme;
        saveSettings(settings);
        document.querySelectorAll("[data-theme-set]").forEach((b) => {
          b.setAttribute("aria-pressed", b.dataset.themeSet === theme ? "true" : "false");
        });
      }
      function applyFontSize(fs) {
        document.documentElement.setAttribute("data-fontsize", fs);
        settings.fontSize = fs;
        saveSettings(settings);
        document.querySelectorAll("[data-fs]").forEach((b) => {
          b.setAttribute("aria-pressed", b.dataset.fs === fs ? "true" : "false");
        });
      }

      // Initial: stored > system preference > paper default
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      applyTheme(settings.theme || (prefersDark ? "dark" : "paper"));
      applyFontSize(settings.fontSize || "m");

      // Settings panel toggle
      const settingsBtn = document.getElementById("settingsBtn");
      const settingsPanel = document.getElementById("settingsPanel");
      function toggleSettings(force) {
        const open = force !== undefined ? force : settingsPanel.dataset.open !== "true";
        settingsPanel.dataset.open = open ? "true" : "false";
        settingsBtn.setAttribute("aria-expanded", open ? "true" : "false");
        settingsBtn.setAttribute("aria-pressed", open ? "true" : "false");
      }
      settingsBtn.addEventListener("click", () => toggleSettings());
      document.addEventListener("click", (e) => {
        if (settingsPanel.dataset.open === "true" &&
            !settingsPanel.contains(e.target) && e.target !== settingsBtn && !settingsBtn.contains(e.target)) {
          toggleSettings(false);
        }
      });
      document.querySelectorAll("[data-theme-set]").forEach((b) => {
        b.addEventListener("click", () => applyTheme(b.dataset.themeSet));
      });
      document.querySelectorAll("[data-fs]").forEach((b) => {
        b.addEventListener("click", () => applyFontSize(b.dataset.fs));
      });

      // ═══════════════════════════════════════════════════════════════════════
      //  Utilities
      // ═══════════════════════════════════════════════════════════════════════
      const app = document.getElementById("main-content");
      document.getElementById("year").textContent = new Date().getFullYear();

      const esc = (v) =>
        String(v ?? "").replace(/[&<>'"]/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;",
        })[c]);

      const path = () => {
        const h = location.hash.replace(/^#/, "");
        return h ? (h.startsWith("/") ? h : `/${h}`) : "/";
      };

      const setStatus = (text) => { app.innerHTML = `<p class="status">${esc(text)}</p>`; };
      const setError = (text) => {
        app.innerHTML = `<pre class="error">${esc(text)}</pre>`;
      };

      function setMeta(title, description) {
        document.title = title;
        let m = document.querySelector('meta[name="description"]');
        if (m && description) m.setAttribute("content", description);
        let og = document.querySelector('meta[property="og:title"]');
        if (og) og.setAttribute("content", title);
        let ogd = document.querySelector('meta[property="og:description"]');
        if (ogd && description) ogd.setAttribute("content", description);
      }

      // Reading time estimator
      function readingTimeMinutes(chapter) {
        if (chapter.reading_time_minutes) return chapter.reading_time_minutes;
        const sections = chapter.sections || [];
        let words = 0;
        const walk = (n) => {
          if (!n) return;
          if (typeof n.text === "string") words += n.text.split(/\s+/).filter(Boolean).length;
          if (Array.isArray(n.content)) n.content.forEach(walk);
        };
        sections.forEach((s) => walk(s.content));
        return Math.max(1, Math.round(words / 220));
      }

      // ═══════════════════════════════════════════════════════════════════════
      //  Data loaders (preserved from original)
      // ═══════════════════════════════════════════════════════════════════════
      const jsonCache = new Map();
      const BASE_DIR = location.pathname.replace(/[^/]*$/, "");

      function jsonCandidates(file) {
        const clean = String(file).replace(/^\/+/, "");
        const list = [
          `${location.origin}${BASE_DIR}${clean}`,
          `${location.origin}/book-haven/${clean}`,
          `${location.origin}/${clean}`,
        ];
        return [...new Set(list)];
      }

      async function loadJson(file) {
        if (jsonCache.has(file)) return jsonCache.get(file);
        const tried = [];
        for (const url of jsonCandidates(file)) {
          try {
            const res = await fetch(url, { cache: "default" });
            if (!res.ok) { tried.push(`${url} → ${res.status}`); continue; }
            const data = await res.json();
            jsonCache.set(file, data);
            return data;
          } catch (e) {
            tried.push(`${url} → ${e.message || "fetch epäonnistui"}`);
          }
        }
        throw new Error(`Tiedostoa ei löytynyt: ${file}\n\nKokeillut osoitteet:\n${tried.join("\n")}`);
      }
      async function loadJsonOptional(file) {
        try { return await loadJson(file); } catch { return null; }
      }
      const loadIndex = async () => {
        const idx = await loadJson("books/index1.json");
        return Array.isArray(idx) ? idx : (idx.books || []);
      };
      const loadBook = (slug) => loadJson(`books/${slug}.json`);
      const loadAppendices = (slug) => loadJsonOptional(`books/${slug}-appendices.json`);

      function indexAppendices(payload) {
        const sectionMap = new Map();
        const chapterMap = new Map();
        if (!payload || !Array.isArray(payload.chapters)) return { sectionMap, chapterMap };
        for (const ch of payload.chapters) {
          const apps = Array.isArray(ch.appendices) ? ch.appendices.slice() : [];
          if (!apps.length) continue;
          apps.sort((a, b) => (a.position ?? 0) - (b.position ?? 0));
          for (const a of apps) {
            const cp = Number(a.chapter_position);
            const sp = a.section_position;
            if (sp === null || sp === undefined) {
              if (!chapterMap.has(cp)) chapterMap.set(cp, []);
              chapterMap.get(cp).push(a);
            } else {
              const key = `${cp}:${Number(sp)}`;
              if (!sectionMap.has(key)) sectionMap.set(key, []);
              sectionMap.get(key).push(a);
            }
          }
        }
        return { sectionMap, chapterMap };
      }

      // ═══════════════════════════════════════════════════════════════════════
      //  Appendix renderers (preserved)
      // ═══════════════════════════════════════════════════════════════════════
      const APPENDIX_ICONS = {
        timeline: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"/><circle cx="7" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="17" cy="12" r="1.8" fill="currentColor"/></svg>`,
        evidence: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="17" x2="13" y2="17"/></svg>`,
        chain: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 1 0-5.66l3-3a4 4 0 0 1 5.66 5.66l-1.5 1.5"/><path d="M14 10a4 4 0 0 1 0 5.66l-3 3a4 4 0 0 1-5.66-5.66l1.5-1.5"/></svg>`,
        calculation: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="14" x2="20" y2="14"/><line x1="10" y1="9" x2="10" y2="20"/><line x1="15" y1="9" x2="15" y2="20"/></svg>`,
        path: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c3-1 4-4 7-4s4 3 7 4"/><circle cx="5" cy="19" r="1.5" fill="currentColor"/><circle cx="12" cy="15" r="1.5" fill="currentColor"/><circle cx="19" cy="19" r="1.5" fill="currentColor"/></svg>`,
        sector: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l5.5 5.5"/></svg>`,
        table: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="9" y1="4" x2="9" y2="20"/></svg>`,
        list: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="7" r="1" fill="currentColor"/><line x1="9" y1="7" x2="20" y2="7"/><circle cx="5" cy="12" r="1" fill="currentColor"/><line x1="9" y1="12" x2="20" y2="12"/><circle cx="5" cy="17" r="1" fill="currentColor"/><line x1="9" y1="17" x2="20" y2="17"/></svg>`,
        note: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>`,
        "chart-chartjs": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 16l4-5 4 3 6-8"/><circle cx="5" cy="16" r="1.4" fill="currentColor"/><circle cx="9" cy="11" r="1.4" fill="currentColor"/><circle cx="13" cy="14" r="1.4" fill="currentColor"/><circle cx="19" cy="6" r="1.4" fill="currentColor"/></svg>`,
        "chart-d3": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16" opacity=".5"/></svg>`,
        "chart-three": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5v8l-9 5-9-5V8z"/><path d="M12 3v18M3 8l9 5 9-5" opacity=".5"/></svg>`,
        paperdoll: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="2.5"/><path d="M7 21v-6a5 5 0 0 1 10 0v6"/><path d="M9 13l-3 2M15 13l3 2"/></svg>`,
        "research-card": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><circle cx="7" cy="6.5" r="0.8" fill="currentColor"/><line x1="6" y1="13" x2="13" y2="13"/><line x1="6" y1="16.5" x2="18" y2="16.5"/></svg>`,
      };
      const APPENDIX_LABEL = {
        timeline: "Aikajana", evidence: "Tausta", chain: "Ketju",
        calculation: "Laskelma", path: "Polku", sector: "Sektori",
        table: "Taulukko", list: "Luettelo", note: "Muistiinpano",
        "chart-chartjs": "Kuvaaja", "chart-d3": "Visualisointi", "chart-three": "3D-näkymä",
        paperdoll: "Paperinukke", "research-card": "Tutkimuskortti",
      };
      const iconFor = (t) => APPENDIX_ICONS[t] || APPENDIX_ICONS.evidence;
      const labelFor = (t) => APPENDIX_LABEL[t] || "Liite";

      function renderInline(nodes = []) {
        return nodes.map((n) => {
          if (n.type === "hardBreak") return "<br>";
          let out = esc(n.text ?? "");
          for (const m of n.marks ?? []) {
            if (m.type === "bold") out = `<strong>${out}</strong>`;
            if (m.type === "italic") out = `<em>${out}</em>`;
            if (m.type === "code") out = `<code>${out}</code>`;
          }
          return out;
        }).join("");
      }
      function renderDoc(doc) {
        const nodes = doc && typeof doc === "object" ? doc.content ?? [] : [];
        return nodes.map((n) => {
          if (n.type === "paragraph") return `<p>${renderInline(n.content)}</p>`;
          if (n.type === "heading") {
            const level = Math.min(Math.max(Number(n.attrs?.level || 2), 1), 3);
            return `<h${level}>${renderInline(n.content)}</h${level}>`;
          }
          if (n.type === "blockquote") return `<blockquote>${renderDoc({ content: n.content })}</blockquote>`;
          if (n.type === "bulletList")
            return `<ul>${(n.content ?? []).map((li) => `<li>${renderDoc({ content: li.content })}</li>`).join("")}</ul>`;
          if (n.type === "orderedList")
            return `<ol>${(n.content ?? []).map((li) => `<li>${renderDoc({ content: li.content })}</li>`).join("")}</ol>`;
          return "";
        }).join("");
      }

      function renderAppendixBody(app) {
        const c = app.content || {};
        switch (app.type) {
          case "timeline":      return renderTimeline(c);
          case "chain":         return renderChain(c);
          case "calculation":   return renderCalculation(c);
          case "path":          return renderChain(c);
          case "sector":        return renderEvidence(c);
          case "table":         return renderTable(c);
          case "list":          return renderList(c);
          case "note":          return renderNote(c);
          case "chart-chartjs": return renderChartJs(app);
          case "chart-d3":      return renderChartUnsupported(app, "D3");
          case "chart-three":   return renderChartUnsupported(app, "Three.js");
          case "paperdoll":     return renderPaperdoll(c);
          case "research-card": return renderResearchCard(c);
          case "evidence":
          default:              return renderEvidence(c);
        }
      }
      function renderTimeline(c) {
        const entries = Array.isArray(c.entries) ? c.entries : [];
        return [
          c.body ? `<p class="lead">${esc(c.body)}</p>` : "",
          c.note ? `<div class="note">${esc(c.note)}</div>` : "",
          entries.length ? `<ul class="app-timeline">${entries.map((e) => `
            <li>
              ${e.period ? `<div class="period">${esc(e.period)}</div>` : ""}
              ${e.event ? `<div class="event">${esc(e.event)}</div>` : ""}
              ${e.description ? `<div class="desc">${esc(e.description)}</div>` : ""}
            </li>`).join("")}</ul>` : "",
          c.source ? `<div class="source">${esc(c.source)}</div>` : "",
        ].join("");
      }
      function renderChain(c) {
        const steps = Array.isArray(c.steps) ? c.steps : [];
        const extraKeys = ["reflection", "lesson", "paradox", "open_question", "current_relevance", "controversy", "relevance", "implication", "underlying_logic"];
        const extras = extraKeys
          .filter((k) => typeof c[k] === "string" && c[k].trim())
          .map((k) => `<div class="app-chain-extra"><div class="label">${esc(k.replace(/_/g, " "))}</div><div>${esc(c[k])}</div></div>`).join("");
        return [
          c.body ? `<p class="lead">${esc(c.body)}</p>` : "",
          c.note ? `<div class="note">${esc(c.note)}</div>` : "",
          steps.length ? `<ol class="app-chain">${steps.map((s) => `
            <li>
              ${s.event ? `<div class="event">${esc(s.event)}</div>` : ""}
              ${s.consequence ? `<div class="consequence">${esc(s.consequence)}</div>` : ""}
            </li>`).join("")}</ol>` : "",
          extras,
          c.source ? `<div class="source">${esc(c.source)}</div>` : "",
        ].join("");
      }
      function renderCalculation(c) {
        const rows = Array.isArray(c.rows) ? c.rows : [];
        let table = "";
        if (rows.length) {
          const keys = [];
          const seen = new Set();
          for (const row of rows) for (const k of Object.keys(row)) if (!seen.has(k)) { seen.add(k); keys.push(k); }
          const head = keys.map((k) => `<th>${esc(k.replace(/_/g, " "))}</th>`).join("");
          const body = rows.map((r) => `<tr>${keys.map((k) => `<td>${esc(r[k] ?? "")}</td>`).join("")}</tr>`).join("");
          table = `<div style="overflow-x:auto"><table class="app-calc-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
        }
        return [
          c.body ? `<p class="lead">${esc(c.body)}</p>` : "",
          c.note ? `<div class="note">${esc(c.note)}</div>` : "",
          table,
          c.source ? `<div class="source">${esc(c.source)}</div>` : "",
        ].join("");
      }
      function renderEvidence(c) {
        const commentaryFields = ["consensus", "honest_assessment", "pattern", "deeper_pattern", "current_relevance", "controversy", "relevance", "implication", "ai_question", "neuroscience_link", "open_question"];
        const objectFields = ["distinction"];
        let listVal = null;
        for (const [, v] of Object.entries(c)) if (Array.isArray(v)) { listVal = v; break; }
        const lead = c.body ? `<p class="lead">${esc(c.body)}</p>` : "";
        const note = c.note ? `<div class="note">${esc(c.note)}</div>` : "";
        const commentary = commentaryFields
          .filter((k) => typeof c[k] === "string" && c[k].trim())
          .map((k) => `<div class="app-chain-extra"><div class="label">${esc(k.replace(/_/g, " "))}</div><div>${esc(c[k])}</div></div>`).join("");
        const objects = objectFields
          .filter((k) => c[k] && typeof c[k] === "object" && !Array.isArray(c[k]))
          .map((k) => {
            const obj = c[k];
            const rows = Object.entries(obj).map(([key, val]) => `<dt>${esc(key.replace(/_/g, " "))}</dt><dd>${esc(val)}</dd>`).join("");
            return `<dl class="app-kv">${rows}</dl>`;
          }).join("");
        let list = "";
        if (listVal && listVal.length) {
          list = `<ul class="app-items">${listVal.map((item) => renderEvidenceItem(item)).join("")}</ul>`;
        }
        return [lead, note, objects, list, commentary, c.source ? `<div class="source">${esc(c.source)}</div>` : ""].join("");
      }
      function renderEvidenceItem(item) {
        if (typeof item === "string") return `<li><div class="app-item-body">${esc(item)}</div></li>`;
        if (!item || typeof item !== "object") return "";
        const titleKeys = ["domain", "aihe", "tapaus", "murros", "mittari", "kanta", "kyky", "lähestymistapa", "kuvaus", "taso", "aalto", "löytö"];
        const bodyKeys = ["example", "havainto", "kuvaus", "vääristymä", "tila", "consequence", "tulos", "huoli", "rajoitus", "idea"];
        let titleKey = titleKeys.find((k) => typeof item[k] === "string" && item[k].trim());
        let bodyKey = bodyKeys.find((k) => k !== titleKey && typeof item[k] === "string" && item[k].trim());
        const stringKeys = Object.keys(item).filter((k) => typeof item[k] === "string" && item[k].trim());
        if (!titleKey && stringKeys.length) titleKey = stringKeys[0];
        if (!bodyKey && stringKeys.length > 1) bodyKey = stringKeys.find((k) => k !== titleKey);
        const titleHtml = titleKey ? `<div class="app-item-head">${esc(item[titleKey])}</div>` : "";
        const bodyHtml = bodyKey ? `<div class="app-item-body"><p>${esc(item[bodyKey])}</p></div>` : "";
        const restKeys = stringKeys.filter((k) => k !== titleKey && k !== bodyKey);
        const rest = restKeys.length
          ? `<dl class="app-kv">${restKeys.map((k) => `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${esc(item[k])}</dd>`).join("")}</dl>`
          : "";
        return `<li>${titleHtml}${bodyHtml}${rest}</li>`;
      }

      // ─── note ─────────────────────────────────────────────────────────────
      function renderNote(c) {
        const body = c.body ? `<p class="lead">${esc(c.body)}</p>` : "";
        const note = c.note ? `<div class="note">${esc(c.note)}</div>` : "";
        const text = c.text ? `<div class="app-note-text">${esc(c.text)}</div>` : "";
        const source = c.source ? `<div class="source">${esc(c.source)}</div>` : "";
        return [body, note, text, source].join("");
      }

      // ─── list ─────────────────────────────────────────────────────────────
      function renderList(c) {
        const items = Array.isArray(c.items) ? c.items : [];
        const isOrdered = c.ordered === true;
        const tag = isOrdered ? "ol" : "ul";
        const lead = c.body ? `<p class="lead">${esc(c.body)}</p>` : "";
        const note = c.note ? `<div class="note">${esc(c.note)}</div>` : "";
        const listHtml = items.length
          ? `<${tag} class="app-list">${items.map((it) => {
              if (typeof it === "string") return `<li>${esc(it)}</li>`;
              if (it && typeof it === "object") {
                const head = it.title || it.label || it.name;
                const body = it.body || it.text || it.description;
                return `<li>${head ? `<div class="app-list-head">${esc(head)}</div>` : ""}${body ? `<div class="app-list-body">${esc(body)}</div>` : ""}</li>`;
              }
              return "";
            }).join("")}</${tag}>`
          : "";
        const source = c.source ? `<div class="source">${esc(c.source)}</div>` : "";
        return [lead, note, listHtml, source].join("");
      }

      // ─── table ────────────────────────────────────────────────────────────
      function renderTable(c) {
        const headers = Array.isArray(c.headers) ? c.headers : null;
        const rows = Array.isArray(c.rows) ? c.rows : [];
        const lead = c.body ? `<p class="lead">${esc(c.body)}</p>` : "";
        const note = c.note ? `<div class="note">${esc(c.note)}</div>` : "";
        let table = "";
        if (rows.length) {
          let keys = headers;
          // Jos headers ei annettu: kerää avaimet riveistä (jos rivit ovat objekteja)
          if (!keys && rows.every(r => r && typeof r === "object" && !Array.isArray(r))) {
            const seen = new Set();
            keys = [];
            for (const r of rows) for (const k of Object.keys(r)) if (!seen.has(k)) { seen.add(k); keys.push(k); }
          }
          // Tapaus 1: rivit ovat objekteja → käytä avaimia sarakkeisiin
          // Tapaus 2: rivit ovat taulukoita → käytä headers-otsikoita jos on
          const isObjectRows = rows[0] && typeof rows[0] === "object" && !Array.isArray(rows[0]);
          const head = keys
            ? `<thead><tr>${keys.map(k => `<th>${esc(String(k).replace(/_/g, " "))}</th>`).join("")}</tr></thead>`
            : "";
          const body = `<tbody>${rows.map(r => {
            if (Array.isArray(r)) {
              return `<tr>${r.map(cell => `<td>${esc(cell ?? "")}</td>`).join("")}</tr>`;
            }
            if (isObjectRows && keys) {
              return `<tr>${keys.map(k => `<td>${esc(r[k] ?? "")}</td>`).join("")}</tr>`;
            }
            return "";
          }).join("")}</tbody>`;
          table = `<div style="overflow-x:auto"><table class="app-table">${head}${body}</table></div>`;
        }
        const source = c.source ? `<div class="source">${esc(c.source)}</div>` : "";
        return [lead, note, table, source].join("");
      }

      // ─── paperdoll ────────────────────────────────────────────────────────
      // Yleinen rakenne: yksi tai useampi hahmo vierekkäin tai ruudukossa.
      // Jokainen hahmo: kuva (image), nimi/ajankohta (label, sublabel), ja
      // joukko kiteytettyjä tunnuslukuja (stats).
      //
      // Esimerkki content-rakenne:
      // {
      //   "body": "Kuvaava johdanto",
      //   "layout": "side-by-side" | "grid",
      //   "subjects": [
      //     {
      //       "label": "Vilho",
      //       "sublabel": "1925",
      //       "image": "images/vilho-1925.png",
      //       "alt": "Maatyöläinen viikate kädessään",
      //       "stats": [
      //         { "label": "Elinajanodote", "value": "51 v" },
      //         { "label": "Koulutus", "value": "4 v" }
      //       ],
      //       "caption": "Vapaa lisäteksti hahmon alle"
      //     }
      //   ],
      //   "source": "Lähde"
      // }
      function renderPaperdoll(c) {
        const subjects = Array.isArray(c.subjects) ? c.subjects : [];
        const lead = c.body ? `<p class="lead">${esc(c.body)}</p>` : "";
        const note = c.note ? `<div class="note">${esc(c.note)}</div>` : "";
        const layoutClass = c.layout === "grid" ? "paperdoll-grid" : "paperdoll-row";
        const figures = subjects.map((s) => {
          const img = s.image
            ? `<div class="paperdoll-image"><img src="${esc(s.image)}" alt="${esc(s.alt || s.label || "")}" loading="lazy"></div>`
            : `<div class="paperdoll-image paperdoll-image-empty" aria-hidden="true"></div>`;
          const head = (s.label || s.sublabel) ? `
            <div class="paperdoll-head">
              ${s.label ? `<div class="paperdoll-label">${esc(s.label)}</div>` : ""}
              ${s.sublabel ? `<div class="paperdoll-sublabel">${esc(s.sublabel)}</div>` : ""}
            </div>` : "";
          const stats = Array.isArray(s.stats) && s.stats.length
            ? `<dl class="paperdoll-stats">${s.stats.map((st) => `
                <div class="paperdoll-stat">
                  <dt>${esc(st.label || "")}</dt>
                  <dd>${esc(st.value || "")}</dd>
                </div>`).join("")}</dl>`
            : "";
          const caption = s.caption ? `<div class="paperdoll-caption">${esc(s.caption)}</div>` : "";
          return `<figure class="paperdoll">${img}${head}${stats}${caption}</figure>`;
        }).join("");
        const wrap = subjects.length ? `<div class="paperdoll-set ${layoutClass}">${figures}</div>` : "";
        const source = c.source ? `<div class="source">${esc(c.source)}</div>` : "";
        return [lead, note, wrap, source].join("");
      }

      // ─── chart-chartjs ────────────────────────────────────────────────────
      // Sisältö voi olla joko:
      //   a) "raw"-muoto: { kind: "raw", config: {...} }  -- kokonainen Chart.js-config
      //   b) "preset-fi-nordic"-muoto:
      //      {
      //        kind: "preset-fi-nordic",
      //        chartType: "line" | "bar",
      //        yearsFrom: 1860, yearsTo: 2024, yearsStep: 2,
      //        yMin: 0, yMax: 100, yLabel: "%", xStep: 20,
      //        yFmt: "percent" | "raw" | "decimal",
      //        crisisYears: [1918, 1991, 2008],
      //        series: [
      //          { label: "Suomi", color: "fi", dashed: false, data: { "1860": 72, ... } },
      //          { label: "Pohjoismaat", color: "nordic", dashed: true, data: { ... } }
      //        ]
      //      }
      let _chartJsLoadPromise = null;
      function loadChartJsOnce() {
        if (window.Chart) return Promise.resolve();
        if (_chartJsLoadPromise) return _chartJsLoadPromise;
        _chartJsLoadPromise = new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js";
          s.onload = () => {
            // Lataa myös annotation-plugin (käytetään kriisivuosiin)
            const a = document.createElement("script");
            a.src = "https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js";
            a.onload = () => resolve();
            a.onerror = () => resolve(); // jatka silti ilman annotation-pluginia
            document.head.appendChild(a);
          };
          s.onerror = () => reject(new Error("Chart.js ei latautunut"));
          document.head.appendChild(s);
        });
        return _chartJsLoadPromise;
      }

      function chartPalette() {
        const isDark = (document.documentElement.getAttribute("data-theme") === "dark");
        return {
          fi: isDark ? '#5b9ee0' : '#185fa5',
          nordic: isDark ? '#b4b2a9' : '#888780',
          crisis: isDark ? 'rgba(224,120,120,0.55)' : 'rgba(163,45,45,0.5)',
          replacement: isDark ? '#5dcaa5' : '#1d9e75',
          grid: isDark ? 'rgba(180,178,169,0.12)' : 'rgba(180,178,169,0.18)',
          text: isDark ? '#b4b2a9' : '#5f5e5a'
        };
      }

      function chartFormatter(kind) {
        if (kind === "percent") return (v) => v + ' %';
        if (kind === "decimal") return (v) => Number(v).toFixed(1);
        return (v) => v;
      }

      function buildChartPreset(content) {
        const C = chartPalette();
        const from = Number(content.yearsFrom);
        const to = Number(content.yearsTo);
        const step = Number(content.yearsStep) || 2;
        const years = [];
        for (let y = from; y <= to; y += step) years.push(y);
        const yFmt = chartFormatter(content.yFmt);

        const datasets = (content.series || []).map((s) => {
          const color = s.color === "nordic" ? C.nordic
            : s.color === "crisis" ? C.crisis
            : s.color === "replacement" ? C.replacement
            : (typeof s.color === "string" && s.color.startsWith("#")) ? s.color
            : C.fi;
          const dataObj = s.data || {};
          const data = years.map(y => dataObj[y] !== undefined ? dataObj[y] : null);
          return {
            label: s.label || "",
            data,
            borderColor: color,
            backgroundColor: content.chartType === "bar" ? color : 'transparent',
            borderWidth: s.dashed ? 1.4 : 1.8,
            borderDash: s.dashed ? [5, 4] : [],
            pointRadius: 0,
            pointHoverRadius: 3,
            tension: 0.25,
            ...(content.chartType === "bar" ? { borderRadius: 3, barPercentage: 0.7, categoryPercentage: 0.75 } : {})
          };
        });

        const annotations = {};
        (content.crisisYears || []).forEach((y, i) => {
          annotations["crisis_" + i] = {
            type: 'line', xMin: y, xMax: y,
            borderColor: C.crisis, borderWidth: 1, borderDash: [3, 3]
          };
        });

        const opts = {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: content.showLegend !== false, labels: { color: C.text, font: { size: 11 } } },
            tooltip: {
              callbacks: {
                title: (items) => 'Vuosi ' + items[0].label,
                label: (item) => item.dataset.label + ': ' + yFmt(item.parsed.y)
              }
            },
            ...(Object.keys(annotations).length ? { annotation: { annotations } } : {})
          },
          scales: {
            x: {
              type: content.chartType === "bar" ? 'category' : 'linear',
              ...(content.chartType === "bar" ? {} : { min: from, max: to }),
              ticks: {
                stepSize: content.xStep || 20,
                color: C.text, font: { size: 10 },
                callback: content.chartType === "bar" ? undefined : (v) => String(Math.round(v))
              },
              grid: { color: C.grid, display: content.chartType !== "bar" }
            },
            y: {
              min: content.yMin ?? undefined,
              max: content.yMax ?? undefined,
              ticks: { color: C.text, font: { size: 10 }, callback: (v) => yFmt(v) },
              grid: { color: C.grid },
              title: content.yLabel ? { display: true, text: content.yLabel, color: C.text, font: { size: 10 } } : { display: false }
            }
          }
        };

        return {
          type: content.chartType || "line",
          data: { labels: years, datasets },
          options: opts
        };
      }

      function renderChartJs(app) {
        const c = app.content || {};
        const id = "chartjs_" + Math.random().toString(36).slice(2, 10);
        const lead = c.body ? `<p class="lead">${esc(c.body)}</p>` : "";
        const note = c.note ? `<div class="note">${esc(c.note)}</div>` : "";
        const source = c.source ? `<div class="source">${esc(c.source)}</div>` : "";
        const height = Number(c.height) || 360;
        const canvas = `
          <div class="app-chart-wrap" style="height:${height}px">
            <canvas id="${id}"></canvas>
          </div>`;
        // Lataa Chart.js ja piirrä kun DOM on valmis
        setTimeout(() => {
          loadChartJsOnce().then(() => {
            const canvasEl = document.getElementById(id);
            if (!canvasEl) return; // näkymä vaihtunut välissä
            try {
              let config;
              if (c.kind === "raw" && c.config) {
                config = c.config;
              } else {
                // oletuksena preset-fi-nordic
                config = buildChartPreset(c);
              }
              new Chart(canvasEl, config);
            } catch (err) {
              canvasEl.outerHTML = `<div class="note">Kuvaajan piirto epäonnistui: ${esc(err.message)}</div>`;
            }
          }).catch((err) => {
            const w = document.getElementById(id);
            if (w) w.outerHTML = `<div class="note">Chart.js-kirjastoa ei voitu ladata: ${esc(err.message)}</div>`;
          });
        }, 0);
        return [lead, note, canvas, source].join("");
      }

      function renderChartUnsupported(app, name) {
        const c = app.content || {};
        const lead = c.body ? `<p class="lead">${esc(c.body)}</p>` : "";
        return `${lead}<div class="note">${name}-pohjaisten kuvaajien lukijatuki on tulossa. Tiedot ovat tallessa tietokannassa.</div>`;
      }

      // Tutkimuskortti: luvun loppuun sijoittuva tiivistelmä.
      // Kokoaa väitteen, kumoutumisehdon (periaate + operationalisointi + datan tila)
      // ja näyttölistan yhteen jäsenneltyyn korttiin. Kumoutumisehto näytetään
      // yhtä näkyvästi kuin näyttö -- tutkimusprotokollan ydinperiaate.
      function renderResearchCard(c) {
        const num = c.prediction_number;
        const lens = c.lens || "";
        const claim = c.prediction || "";
        const fals = c.falsification || "";
        const falsOp = c.falsification_operationalized || "";
        const status = c.data_status || "";
        const statusFi = c.data_status_fi || "";
        const evidence = Array.isArray(c.evidence) ? c.evidence : [];

        const topLabel = (num ? `Ennuste ${num} / 6` : "Tutkimuskortti");
        const statusDot = status
          ? `<span class="pcard-status-dot ${esc(status)}" title="${esc(statusFi)}"></span>`
          : "";

        const falsBlock = fals
          ? `<div class="pcard-falsification">
               <div class="label">Mikä heikentäisi tätä ennustetta?</div>
               <div class="text">${esc(fals)}</div>
               ${falsOp ? `<div class="op">${esc(falsOp)}</div>` : ""}
               ${statusFi ? `<div class="status-line">${statusDot}${esc(statusFi)}</div>` : ""}
             </div>`
          : `<div class="pcard-falsification pcard-falsification-missing">
               <div class="label">Kumoutumisehto puuttuu</div>
               <div class="text">Tälle ennusteelle ei ole vielä määritelty ehtoa joka heikentäisi sitä.</div>
             </div>`;

        const evidenceBlock = evidence.length
          ? `<div class="pcard-evidence-label">Liitetty näyttö</div>
             <div class="pcard-evidence-list">
               ${evidence.map((e) => {
                 const meta = [e.source, labelFor(e.type)].filter(Boolean).map(esc).join(" · ");
                 return `<div class="pcard-evidence-row">
                   <div class="ev-title">${esc(e.title || "")}</div>
                   <div class="ev-meta">${meta ? `<span>${meta}</span>` : ""}${e.evidence_key ? `<span class="ev-key">${esc(e.evidence_key)}</span>` : ""}</div>
                 </div>`;
               }).join("")}
             </div>`
          : `<div class="pcard-evidence-empty">Tälle ennusteelle ei ole vielä liitetty näyttöaineistoa.</div>`;

        return `
          <div class="pcard">
            <div class="pcard-toplabel">${statusDot}${esc(topLabel)}</div>
            ${lens ? `<div class="pcard-lens">${esc(lens)}</div>` : ""}
            ${claim ? `<div class="pcard-claim">${esc(claim)}</div>` : ""}
            ${falsBlock}
            ${evidenceBlock}
          </div>`;
      }

      function buildInlineAppendixHtml(appendices, region) {
        if (!appendices || !appendices.length) return "";
        const label = region === "chapter" ? "Tämän luvun liitteet" : "Liitteet";
        const toggles = appendices.map((a, i) => `
          <button type="button" class="app-toggle" data-app-idx="${i}"
            aria-expanded="false" title="${esc(a.title || labelFor(a.type))}">
            ${iconFor(a.type)}
            <span class="app-toggle-title">${esc(a.title || labelFor(a.type))}</span>
          </button>`).join("");
        return `
          <div class="app-inline ${region === "chapter" ? "chapter-level" : ""}">
            <div class="app-inline-label">${esc(label)}</div>
            <div class="app-inline-toggles">${toggles}</div>
            <div class="app-body" hidden></div>
          </div>`;
      }
      function wireInlineToggles(container, appendices) {
        const buttons = container.querySelectorAll(".app-toggle");
        const body = container.querySelector(".app-body");
        let openIdx = -1;
        const closeBody = () => {
          body.hidden = true; body.innerHTML = "";
          buttons.forEach((b) => b.setAttribute("aria-expanded", "false"));
          openIdx = -1;
        };
        const openBody = (idx) => {
          const a = appendices[idx];
          if (!a) return;
          body.innerHTML = `
            <div class="app-body-head">
              <span class="kind">${esc(labelFor(a.type))}</span>
              <h3>${esc(a.title || labelFor(a.type))}</h3>
            </div>
            ${renderAppendixBody(a)}`;
          body.hidden = false;
          buttons.forEach((b, i) => b.setAttribute("aria-expanded", i === idx ? "true" : "false"));
          openIdx = idx;
        };
        buttons.forEach((btn, i) => {
          btn.addEventListener("click", () => {
            if (openIdx === i) {
              const rect = btn.getBoundingClientRect();
              closeBody();
              const newRect = btn.getBoundingClientRect();
              window.scrollBy(0, newRect.top - rect.top);
            } else openBody(i);
          });
        });
      }

      // ─── Pyörä: Kuusi käsikirjoitusta → kuusi ennustetta ─────────────────
      function renderWheel(books) {
        const PREDICTIONS = [
          { slug: "laajenemisen-logiikka",    book: "Laajenemisen logiikka",       pred: "Tehostamis\u00ADparadoksi" },
          { slug: "hyvinvointi-rajat",        book: "Hyvinvointivaltion rajat",    pred: "Systeeminen sokeus" },
          { slug: "nakyvaksi",                book: "Näkyväksi",                    pred: "Ihmisen näkymättömyys" },
          { slug: "itseohjautuvuus",          book: "Itseohjautuvuus",              pred: "Itseohjautuvuus\u00ADongelma" },
          { slug: "katalyytti",               book: "Katalyytti",                   pred: "Muutoksen kitka" },
          { slug: "sukupolvien-tilinpaatos",  book: "Sukupolvien tilinpäätös",     pred: "Sukupolvi\u00ADseuraukset" },
        ];
        const haveSlugs = new Set((books || []).map(b => b.slug));
        const CX = 300, CY = 300, R_OUT = 280, R_IN = 130;
        const N = PREDICTIONS.length;
        const colors = ["#e8d9c4","#d4c4b0","#c9b69a","#bca684","#b0967a","#9d8467"];
        const polar = (r, a) => [CX + r * Math.cos(a), CY + r * Math.sin(a)];

        const sectors = PREDICTIONS.map((p, i) => {
          const a0 = (i / N) * Math.PI * 2 - Math.PI / 2;
          const a1 = ((i + 1) / N) * Math.PI * 2 - Math.PI / 2;
          const aM = (a0 + a1) / 2;
          const [x0o, y0o] = polar(R_OUT, a0);
          const [x1o, y1o] = polar(R_OUT, a1);
          const [x0i, y0i] = polar(R_IN, a0);
          const [x1i, y1i] = polar(R_IN, a1);
          const d = [
            `M ${x0o} ${y0o}`,
            `A ${R_OUT} ${R_OUT} 0 0 1 ${x1o} ${y1o}`,
            `L ${x1i} ${y1i}`,
            `A ${R_IN} ${R_IN} 0 0 0 ${x0i} ${y0i}`,
            "Z"
          ].join(" ");
          const rLabel = (R_OUT + R_IN) / 2;
          const [lx, ly] = polar(rLabel, aM);
          const [nx, ny] = polar(R_IN + 22, aM);
          const href = haveSlugs.has(p.slug) ? `#/books/${p.slug}` : "#";
          const safeBook = esc(p.book);
          const safePred = esc(p.pred);
          const bookParts = p.book.split(" ");
          const bookLine1 = esc(bookParts[0] || "");
          const bookLine2 = esc(bookParts.slice(1).join(" "));
          const predParts = p.pred.split(" ");
          const predLine1 = esc(predParts[0] || "");
          const predLine2 = esc(predParts.slice(1).join(" "));
          return `
            <a class="wheel-sector" href="${href}" aria-label="${safeBook} — ennuste: ${safePred}">
              <path class="wheel-sector-shape" d="${d}" fill="${colors[i]}"></path>
              <text class="wheel-num" x="${nx}" y="${ny}" text-anchor="middle" dominant-baseline="middle">${i + 1}</text>
              <text class="wheel-label" x="${lx}" y="${ly - 18}" text-anchor="middle">
                <tspan x="${lx}" dy="0">${bookLine1}</tspan>${bookLine2 ? `<tspan x="${lx}" dy="16">${bookLine2}</tspan>` : ""}
              </text>
              <text class="wheel-sublabel" x="${lx}" y="${ly + 18}" text-anchor="middle">
                <tspan x="${lx}" dy="0">${predLine1}</tspan>${predLine2 ? `<tspan x="${lx}" dy="13">${predLine2}</tspan>` : ""}
              </text>
            </a>`;
        }).join("");

        return `
          <section class="wheel-section" aria-labelledby="wheelHeading">
            <div class="wheel-eyebrow">Kokonaiskuva</div>
            <h2 id="wheelHeading">Kuusi käsikirjoitusta → kuusi ennustetta</h2>
            <p class="wheel-lede">
              Kuusi käsikirjoitusta tarkastelevat Suomen hyvinvointijärjestelmää eri linsseistä.
              Kustakin syntyy yksi <strong>falsifioituva ennuste</strong>. Klikkaa sektoria avataksesi käsikirjoituksen,
              tai keskustaa nähdäksesi ennusteiden kooste.
            </p>
            <div class="wheel-wrap">
              <svg viewBox="0 0 600 600" role="img" aria-label="Käsikirjoitukset ja ennusteet">
                ${sectors}
                <a class="wheel-sector" href="ennusteet.html" aria-label="Avaa kuuden ennusteen kooste">
                  <circle class="wheel-center-circle" cx="${CX}" cy="${CY}" r="${R_IN - 8}"></circle>
                  <text class="wheel-center-title" x="${CX}" y="${CY - 10}">6 ennustetta</text>
                  <text class="wheel-center-sub" x="${CX}" y="${CY + 22}">→ katso kooste tästä ←</text>
                </a>
              </svg>
            </div>
            <p class="wheel-caption">Ulkokehä: käsikirjoitukset · Keskus: ennusteiden kooste</p>
          </section>`;
      }

          <div class="theme-filter" role="group" aria-label="Teemasuodatin">
            <button class="theme-chip" aria-pressed="true" data-theme-filter="">Kaikki</button>
            ${[...themes].map((t) => `<button class="theme-chip" aria-pressed="false" data-theme-filter="${esc(t)}">${esc(t)}</button>`).join("")}
          </div>` : "";

        app.innerHTML = `
          <section class="hero">
            <div class="hero-eyebrow">Käsikirjoitukset · Hyvinvointivaltion linssit</div>
            <h1>Suomen hyvinvointi&shy;järjestelmä luettavissa.</h1>
            <p class="hero-lede">
              Harri Käyhkön kirjoituksia <strong>Suomen hyvinvointijärjestelmästä</strong> -- kirjojen tarjoamilla linsseillä.
              Jokaisesta luvusta löytyy <strong>päättäjätiivistelmä</strong>, <strong>avainluvut</strong> ja lähteet.
            </p>
            ${resumeHtml}
          </section>
          ${renderWheel(books)}
          ${filterHtml}
          <div class="section-label">${books.length ? "Kirjat" : ""}</div>
          <section class="books-grid" id="booksGrid">
            ${books.length
              ? books.map((b) => `
                <a class="book-card" href="#/books/${esc(b.slug)}" data-book-themes="${esc((b.themes || []).join("|"))}">
                  <h2>${esc(b.title)}</h2>
                  <div class="author">${esc(b.author || "Harri Käyhkö")}</div>
                  ${b.description ? `<p class="desc">${esc(b.description)}</p>` : ""}
                </a>`).join("")
              : `<p class="status">Ei vielä kirjoja.</p>`}
          </section>`;

        // Theme filter behavior
        document.querySelectorAll("[data-theme-filter]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const t = btn.dataset.themeFilter;
            document.querySelectorAll("[data-theme-filter]").forEach((b) =>
              b.setAttribute("aria-pressed", b === btn ? "true" : "false")
            );
            document.querySelectorAll(".book-card").forEach((c) => {
              const tags = (c.dataset.bookThemes || "").split("|");
              c.style.display = !t || tags.includes(t) ? "" : "none";
            });
          });
        });
      }

      async function book(slug) {
        setStatus("Ladataan…");
        let data;
        try { data = await loadBook(slug); }
        catch (e) { return setError(e.message || "Kirjaa ei löytynyt."); }

        const chapters = (data.chapters || []).slice().sort((a, b) => (a.position ?? 0) - (b.position ?? 0));
        setMeta(
          `${data.title} – Harri Käyhkö`,
          data.description || `${data.title} -- luettavissa verkossa.`
        );

        // Read state per chapter
        let readMap = {};
        try { readMap = JSON.parse(localStorage.getItem(`hk-read-${slug}`) || "{}"); } catch {}

        app.innerHTML = `
          <a class="back" href="#/">← Käsikirjoitukset</a>
          <h1 class="book-title">${esc(data.title)}</h1>
          <div class="book-author">${esc(data.author || "Harri Käyhkö")}</div>
          ${data.description ? `<p class="book-desc">${esc(data.description)}</p>` : ""}
          <div class="section-label">Sisällysluettelo</div>
          <ol class="toc">
            ${chapters.length
              ? chapters.map((c, i) => {
                  const read = readMap[c.slug];
                  const mins = readingTimeMinutes(c);
                  const themes = (c.themes || []).slice(0, 2);
                  return `
                    <li>
                      <a href="#/books/${esc(slug)}/${esc(c.slug)}">
                        <span class="num">${String(i + 1).padStart(2, "0")}</span>
                        <span class="title">${read ? '<span class="read-dot" title="Luettu"></span>' : ""}${esc(c.title)}</span>
                        <span class="meta">${mins} min${themes.length ? " · " + themes.map(esc).join(" · ") : ""}</span>
                      </a>
                    </li>`;
                }).join("")
              : `<li class="status">Ei vielä lukuja.</li>`}
          </ol>`;
      }

      async function chapter(slug, chapterSlug) {
        setStatus("Ladataan…");
        let data, appendixPayload;
        try {
          [data, appendixPayload] = await Promise.all([loadBook(slug), loadAppendices(slug)]);
        } catch (e) { return setError(e.message || "Kirjaa ei löytynyt."); }

        const all = (data.chapters || []).slice().sort((a, b) => (a.position ?? 0) - (b.position ?? 0));
        const current = all.find((c) => c.slug === chapterSlug);
        if (!current) return setError("Lukua ei löytynyt.");

        const sections = (current.sections || []).slice().sort((a, b) => (a.position ?? 0) - (b.position ?? 0));
        const idx = all.indexOf(current);
        const prev = idx > 0 ? all[idx - 1] : null;
        const next = idx < all.length - 1 ? all[idx + 1] : null;
        const prevHref = prev ? `#/books/${esc(slug)}/${esc(prev.slug)}` : "";
        const nextHref = next ? `#/books/${esc(slug)}/${esc(next.slug)}` : "";

        const { sectionMap, chapterMap } = indexAppendices(appendixPayload);
        const chapterPos = Number(current.position);
        const chapterAppendices = chapterMap.get(chapterPos) || [];

        setMeta(
          `${current.title} – ${data.title}`,
          (current.summary && current.summary[0]) || data.description || current.title
        );

        // Save resume
        try {
          localStorage.setItem(LASTREAD_KEY, JSON.stringify({
            bookSlug: slug, chapterSlug, title: current.title, bookTitle: data.title, t: Date.now(),
          }));
          const readMap = JSON.parse(localStorage.getItem(`hk-read-${slug}`) || "{}");
          readMap[chapterSlug] = true;
          localStorage.setItem(`hk-read-${slug}`, JSON.stringify(readMap));
        } catch {}

        const mins = readingTimeMinutes(current);
        const themes = current.themes || [];
        const summary = Array.isArray(current.summary || current.tldr) ? (current.summary || current.tldr) : [];
        const figures = Array.isArray(current.key_figures) ? current.key_figures : [];

        const metaHtml = `
          <div class="chapter-meta">
            <span class="read-time">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              Lukuaika ≈ ${mins} min
            </span>
            ${themes.length ? `<span class="theme-tags">${themes.map((t) => `<span class="theme-tag">${esc(t)}</span>`).join("")}</span>` : ""}
          </div>`;

        const summaryHtml = summary.length ? `
          <section class="summary-box" aria-labelledby="summary-label">
            <div class="summary-label" id="summary-label">Päättäjätiivistelmä</div>
            <ul>${summary.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>
          </section>` : "";

        const figuresHtml = figures.length ? `
          <section class="figures" aria-labelledby="figures-label">
            <div class="figures-label" id="figures-label">Avainluvut</div>
            <div class="figures-grid">
              ${figures.map((f) => `
                <div class="figure-card">
                  <div class="figure-value">${esc(f.value)}</div>
                  <div class="figure-label">${esc(f.label)}</div>
                  ${f.source ? `<div class="figure-source">${esc(f.source)}</div>` : ""}
                </div>`).join("")}
            </div>
            ${figures.some((f) => !f.source) && figures.find((f) => f.source) ? "" : ""}
          </section>` : "";

        const sectionsWithApps = [];
        const sectionsHtml = sections.map((s) => {
          const sp = Number(s.position);
          const key = `${chapterPos}:${sp}`;
          const apps = sectionMap.get(key) || [];
          let appHtml = "";
          if (apps.length) {
            sectionsWithApps.push({ sectionPos: sp, appendices: apps });
            appHtml = buildInlineAppendixHtml(apps, "section");
          }
          return `
            <section data-section-pos="${sp}">
              ${s.title ? `<h2>${esc(s.title)}</h2>` : ""}
              <div>${renderDoc(s.content)}</div>
              ${appHtml}
            </section>`;
        }).join("");

        const chapterAppHtml = chapterAppendices.length ? buildInlineAppendixHtml(chapterAppendices, "chapter") : "";

        const mPager = `
          <nav class="m-pager" aria-label="Lukunavigaatio">
            ${prev ? `<a href="${prevHref}"><span class="label">← Edellinen</span><span class="title">${esc(prev.title)}</span></a>`
                   : `<span class="empty">Alku</span>`}
            ${next ? `<a class="next" href="${nextHref}"><span class="label">Seuraava →</span><span class="title">${esc(next.title)}</span></a>`
                   : `<span class="empty">Loppu</span>`}
          </nav>`;

        app.innerHTML = `
          <article id="chapterArticle">
            <a class="back" href="#/books/${esc(slug)}">← ${esc(data.title)}</a>
            ${metaHtml}
            <h1 class="chapter-title">${esc(current.title)}</h1>
            ${summaryHtml}
            ${figuresHtml}
            <div class="reader">${sectionsHtml}</div>
            ${chapterAppHtml}
            <nav class="pager" aria-label="Lukunavigaatio">
              ${prev ? `<a href="${prevHref}">← ${esc(prev.title)}</a>` : `<span></span>`}
              ${next ? `<a class="right" href="${nextHref}">${esc(next.title)} →</a>` : `<span></span>`}
            </nav>
          </article>
          ${mPager}`;

        for (const { sectionPos, appendices } of sectionsWithApps) {
          const sectionEl = document.querySelector(`section[data-section-pos="${sectionPos}"]`);
          if (!sectionEl) continue;
          const container = sectionEl.querySelector(".app-inline");
          if (container) wireInlineToggles(container, appendices);
        }
        if (chapterAppendices.length) {
          const article = document.getElementById("chapterArticle");
          const chCont = article.querySelector(".app-inline.chapter-level");
          if (chCont) wireInlineToggles(chCont, chapterAppendices);
        }

        // JSON-LD per chapter
        const ld = document.getElementById("chapter-ld");
        if (ld) ld.remove();
        const script = document.createElement("script");
        script.type = "application/ld+json";
        script.id = "chapter-ld";
        script.textContent = JSON.stringify({
          "@context": "https://schema.org",
          "@type": "Chapter",
          "name": current.title,
          "isPartOf": { "@type": "Book", "name": data.title, "author": { "@type": "Person", "name": data.author || "Harri Käyhkö" } },
          "inLanguage": "fi-FI",
        });
        document.head.appendChild(script);

        initChapterUx(prevHref, nextHref);
      }

      function initChapterUx(prevHref, nextHref) {
        const bar = document.getElementById("progress");
        const updateProgress = () => {
          if (!bar) return;
          const h = document.documentElement;
          const max = h.scrollHeight - h.clientHeight;
          const pct = max > 0 ? Math.min(100, Math.max(0, (h.scrollTop || window.scrollY) / max * 100)) : 0;
          bar.style.width = pct + "%";
        };
        updateProgress();
        window.addEventListener("scroll", updateProgress, { passive: true });

        const article = document.getElementById("chapterArticle");
        if (!article || !window.matchMedia("(max-width: 720px)").matches) return;

        let sx = 0, sy = 0, tracking = false;
        article.addEventListener("touchstart", (e) => {
          if (e.touches.length !== 1) { tracking = false; return; }
          const t = e.target;
          if (t && t.closest && t.closest(".app-body, .app-inline, .m-pager")) { tracking = false; return; }
          sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
        }, { passive: true });
        article.addEventListener("touchend", (e) => {
          if (!tracking) return;
          tracking = false;
          const t = e.changedTouches[0];
          const dx = t.clientX - sx, dy = t.clientY - sy;
          if (Math.abs(dx) < 80 || Math.abs(dy) > 50) return;
          if (dx < 0 && nextHref) location.hash = nextHref;
          else if (dx > 0 && prevHref) location.hash = prevHref;
        }, { passive: true });
      }

      function route() {
        window.scrollTo(0, 0);
        toggleSettings(false);
        closeSearch();
        const parts = path().split("/").filter(Boolean).map(decodeURIComponent);
        try {
          if (!parts.length || (parts[0] === "books" && !parts[1])) return home();
          if (parts[0] === "books" && parts[1] && parts[2]) return chapter(parts[1], parts[2]);
          if (parts[0] === "books" && parts[1]) return book(parts[1]);
          setError("Sivua ei löytynyt.");
        } catch (e) { setError(e.message || "Tuntematon virhe"); }
      }

      // ═══════════════════════════════════════════════════════════════════════
      //  Search
      // ═══════════════════════════════════════════════════════════════════════
      const searchOverlay = document.getElementById("searchOverlay");
      const searchInput = document.getElementById("searchInput");
      const searchResults = document.getElementById("searchResults");
      const searchBtn = document.getElementById("searchBtn");

      async function buildSearchIndex() {
        if (allChaptersCache) return allChaptersCache;
        let books;
        try { books = allBooksCache || await loadIndex(); } catch { return []; }
        allBooksCache = books;
        const out = [];
        for (const b of books) {
          let bd;
          try { bd = await loadBook(b.slug); } catch { continue; }
          for (const c of (bd.chapters || [])) {
            out.push({
              bookSlug: b.slug, bookTitle: bd.title,
              chapterSlug: c.slug, chapterTitle: c.title,
              themes: (c.themes || []).join(" "),
              summary: (c.summary || []).join(" "),
              haystack: [c.title, (c.themes || []).join(" "), (c.summary || []).join(" ")].join(" ").toLowerCase(),
            });
          }
        }
        allChaptersCache = out;
        return out;
      }
      function renderSearch(query) {
        const q = query.trim().toLowerCase();
        if (!allChaptersCache) { searchResults.innerHTML = `<div class="search-empty">Indeksoidaan…</div>`; return; }
        if (!q) { searchResults.innerHTML = `<div class="search-empty">Aloita kirjoittamalla. Hakee lukuja, teemoja ja tiivistelmiä.</div>`; return; }
        const hits = allChaptersCache.filter((c) => c.haystack.includes(q)).slice(0, 20);
        if (!hits.length) { searchResults.innerHTML = `<div class="search-empty">Ei osumia haulle "${esc(query)}".</div>`; return; }
        searchResults.innerHTML = hits.map((h, i) => `
          <a class="search-result" ${i === 0 ? 'data-active="true"' : ""} href="#/books/${esc(h.bookSlug)}/${esc(h.chapterSlug)}">
            <div class="r-title">${esc(h.chapterTitle)}</div>
            <div class="r-sub">${esc(h.bookTitle)}${h.themes ? " · " + esc(h.themes) : ""}</div>
          </a>`).join("");
      }
      async function openSearch() {
        searchOverlay.dataset.open = "true";
        setTimeout(() => searchInput.focus(), 30);
        renderSearch("");
        await buildSearchIndex();
        renderSearch(searchInput.value);
      }
      function closeSearch() {
        searchOverlay.dataset.open = "false";
        searchInput.value = "";
      }
      searchBtn.addEventListener("click", openSearch);
      searchInput.addEventListener("input", (e) => renderSearch(e.target.value));
      searchOverlay.addEventListener("click", (e) => { if (e.target === searchOverlay) closeSearch(); });
      window.addEventListener("keydown", (e) => {
        if (e.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) {
          e.preventDefault(); openSearch();
        }
        if (e.key === "Escape") { closeSearch(); toggleSettings(false); }
      });

      window.addEventListener("hashchange", route);
      route();
    </script>
  </body>
</html>

  <body>
    <header>
      <div class="bar">
        <a class="brand" href="#/">Harri Käyhkö</a>
      </div>
    </header>
    <main id="app"></main>
    <footer>© <span id="year"></span> Harri Käyhkö</footer>

    <script>
      const app = document.getElementById("app");
      document.getElementById("year").textContent = new Date().getFullYear();

      const esc = (v) =>
        String(v ?? "").replace(/[&<>'"]/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;",
        })[c]);

      const path = () => {
        const h = location.hash.replace(/^#/, "");
        return h ? (h.startsWith("/") ? h : `/${h}`) : "/";
      };

      const setStatus = (text) => { app.innerHTML = `<p class="status">${esc(text)}</p>`; };
      const setError = (text) => {
        app.innerHTML = `<pre class="error" style="white-space:pre-wrap;font-family:inherit;margin:0">${esc(text)}</pre>`;
      };

      const jsonCache = new Map();
      const BASE_DIR = location.pathname.replace(/[^/]*$/, "");

      function jsonCandidates(file) {
        const clean = String(file).replace(/^\/+/, "");
        const list = [
          `${location.origin}${BASE_DIR}${clean}`,
          `${location.origin}/book-haven/${clean}`,
          `${location.origin}/${clean}`,
        ];
        return [...new Set(list)];
      }

      async function loadJson(file) {
        if (jsonCache.has(file)) return jsonCache.get(file);
        const tried = [];
        for (const url of jsonCandidates(file)) {
          try {
            const res = await fetch(url, { cache: "default" });
            if (!res.ok) {
              tried.push(`${url} → ${res.status}`);
              continue;
            }
            const data = await res.json();
            jsonCache.set(file, data);
            return data;
          } catch (e) {
            tried.push(`${url} → ${e.message || "fetch epäonnistui"}`);
          }
        }
        throw new Error(
          `Tiedostoa ei löytynyt: ${file}\n\nKokeillut osoitteet:\n${tried.join("\n")}`
        );
      }

      const loadIndex = async () => {
        const idx = await loadJson("books/index.json");
        return Array.isArray(idx) ? idx : (idx.books || []);
      };
      const loadBook = (slug) => loadJson(`books/${slug}.json`);

      function renderInline(nodes = []) {
        return nodes.map((n) => {
          if (n.type === "hardBreak") return "<br>";
          let out = esc(n.text ?? "");
          for (const m of n.marks ?? []) {
            if (m.type === "bold") out = `<strong>${out}</strong>`;
            if (m.type === "italic") out = `<em>${out}</em>`;
            if (m.type === "code") out = `<code>${out}</code>`;
          }
          return out;
        }).join("");
      }

      function renderDoc(doc) {
        const nodes = doc && typeof doc === "object" ? doc.content ?? [] : [];
        return nodes.map((n) => {
          if (n.type === "paragraph") return `<p>${renderInline(n.content)}</p>`;
          if (n.type === "heading") {
            const level = Math.min(Math.max(Number(n.attrs?.level || 2), 1), 3);
            return `<h${level}>${renderInline(n.content)}</h${level}>`;
          }
          if (n.type === "blockquote") return `<blockquote>${renderDoc({ content: n.content })}</blockquote>`;
          if (n.type === "bulletList")
            return `<ul>${(n.content ?? []).map((li) => `<li>${renderDoc({ content: li.content })}</li>`).join("")}</ul>`;
          if (n.type === "orderedList")
            return `<ol>${(n.content ?? []).map((li) => `<li>${renderDoc({ content: li.content })}</li>`).join("")}</ol>`;
          return "";
        }).join("");
      }

      async function home() {
        setStatus("Ladataan…");
        let books;
        try { books = await loadIndex(); }
        catch (e) {
          return setError(
            `${e.message}\n\nTarkista että public/books/index.json on repossa ja GitHub Actions -build on onnistunut.`
          );
        }

        app.innerHTML = `
          <section class="hero">
            <h1>Käsikirjoitukset</h1>
            <p>Harri Käyhkön julkaisemat tekstit – luettavissa verkossa.</p>
          </section>
          <section class="grid">
            ${books.length
              ? books.map((b) => `
                <a class="card" href="#/books/${esc(b.slug)}">
                  <h2>${esc(b.title)}</h2>
                  <p class="muted small">${esc(b.author)}</p>
                  ${b.description ? `<p>${esc(b.description)}</p>` : ""}
                </a>`).join("")
              : `<p class="muted">Ei vielä kirjoja.</p>`}
          </section>`;
      }

      async function book(slug) {
        setStatus("Ladataan…");
        let data;
        try { data = await loadBook(slug); }
        catch (e) { return setError(e.message || "Kirjaa ei löytynyt."); }

        const chapters = (data.chapters || []).slice().sort(
          (a, b) => (a.position ?? 0) - (b.position ?? 0)
        );

        app.innerHTML = `
          <a class="back" href="#/">← Käsikirjoitukset</a>
          <h1 class="book-title">${esc(data.title)}</h1>
          <p class="muted">${esc(data.author)}</p>
          ${data.description ? `<p class="reader">${esc(data.description)}</p>` : ""}
          <h2 style="margin-top:48px;font-size:32px">Sisällysluettelo</h2>
          <ol class="toc">
            ${chapters.length
              ? chapters.map((c, i) => `
                <li>
                  <a href="#/books/${esc(slug)}/${esc(c.slug)}">
                    <span class="num">${String(i + 1).padStart(2, "0")}</span>
                    <span style="font-family:Instrument Serif,Georgia,serif;font-size:22px">${esc(c.title)}</span>
                  </a>
                </li>`).join("")
              : `<li class="muted">Ei vielä lukuja.</li>`}
          </ol>`;
      }

      async function chapter(slug, chapterSlug) {
        setStatus("Ladataan…");
        let data;
        try { data = await loadBook(slug); }
        catch (e) { return setError(e.message || "Kirjaa ei löytynyt."); }

        const all = (data.chapters || []).slice().sort(
          (a, b) => (a.position ?? 0) - (b.position ?? 0)
        );
        const current = all.find((c) => c.slug === chapterSlug);
        if (!current) return setError("Lukua ei löytynyt.");

        const sections = (current.sections || []).slice().sort(
          (a, b) => (a.position ?? 0) - (b.position ?? 0)
        );
        const idx = all.indexOf(current);
        const prev = idx > 0 ? all[idx - 1] : null;
        const next = idx < all.length - 1 ? all[idx + 1] : null;
        const prevHref = prev ? `#/books/${esc(slug)}/${esc(prev.slug)}` : "";
        const nextHref = next ? `#/books/${esc(slug)}/${esc(next.slug)}` : "";

        const sectionsHtml = sections.map((s) => `
          <section>
            ${s.title ? `<h2>${esc(s.title)}</h2>` : ""}
            <div>${renderDoc(s.content)}</div>
          </section>`).join("");

        const mPager = `
          <nav class="m-pager">
            ${prev
              ? `<a href="${prevHref}"><span class="label">← Edellinen</span><span class="title">${esc(prev.title)}</span></a>`
              : `<span class="empty">Alku</span>`}
            ${next
              ? `<a class="next" href="${nextHref}"><span class="label">Seuraava →</span><span class="title">${esc(next.title)}</span></a>`
              : `<span class="empty">Loppu</span>`}
          </nav>`;

        app.innerHTML = `
          <div class="progress-bar" id="progress"></div>
          <article id="chapterArticle">
            <a class="back" href="#/books/${esc(slug)}">← ${esc(data.title)}</a>
            <h1 class="chapter-title">${esc(current.title)}</h1>
            <div class="reader" style="margin-top:40px">${sectionsHtml}</div>
            <nav class="pager">
              ${prev ? `<a href="${prevHref}">← ${esc(prev.title)}</a>` : `<span></span>`}
              ${next ? `<a class="right" href="${nextHref}">${esc(next.title)} →</a>` : `<span></span>`}
            </nav>
          </article>
          ${mPager}`;

        initChapterUx(prevHref, nextHref);
      }

      function initChapterUx(prevHref, nextHref) {
        const bar = document.getElementById("progress");
        const updateProgress = () => {
          if (!bar) return;
          const h = document.documentElement;
          const max = h.scrollHeight - h.clientHeight;
          const pct = max > 0 ? Math.min(100, Math.max(0, (h.scrollTop || window.scrollY) / max * 100)) : 0;
          bar.style.width = pct + "%";
        };
        updateProgress();
        window.addEventListener("scroll", updateProgress, { passive: true });

        const article = document.getElementById("chapterArticle");
        if (!article || !window.matchMedia("(max-width: 720px)").matches) return;

        let sx = 0, sy = 0, tracking = false;
        article.addEventListener("touchstart", (e) => {
          if (e.touches.length !== 1) { tracking = false; return; }
          sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
        }, { passive: true });
        article.addEventListener("touchend", (e) => {
          if (!tracking) return;
          tracking = false;
          const t = e.changedTouches[0];
          const dx = t.clientX - sx, dy = t.clientY - sy;
          if (Math.abs(dx) < 70 || Math.abs(dy) > 50) return;
          if (dx < 0 && nextHref) location.hash = nextHref;
          else if (dx > 0 && prevHref) location.hash = prevHref;
        }, { passive: true });
      }

      function route() {
        window.scrollTo(0, 0);
        const parts = path().split("/").filter(Boolean).map(decodeURIComponent);
        try {
          if (!parts.length || (parts[0] === "books" && !parts[1])) return home();
          if (parts[0] === "books" && parts[1] && parts[2]) return chapter(parts[1], parts[2]);
          if (parts[0] === "books" && parts[1]) return book(parts[1]);
          setError("Sivua ei löytynyt.");
        } catch (e) {
          setError(e.message || "Tuntematon virhe");
        }
      }

      window.addEventListener("hashchange", route);
      route();
    </script>
  </body>
</html>
