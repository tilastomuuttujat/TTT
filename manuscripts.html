<!doctype html><!doctype html>
<html lang="fi" data-theme="paper" data-fontsize="m">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Harri Käyhkö – Käsikirjoitukset</title>

    <meta name="theme-color" content="#fdfbf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110d" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Harri Käyhkö – Käsikirjoitukset" />
    <meta property="og:description" content="Suomen hyvinvointijärjestelmän analyysi kirjojen linsseillä -- lukijalle ja päättäjälle." />
    <meta property="og:locale" content="fi_FI" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@300;400;500;600;700&display=swap"
    />

    <!-- JSON-LD: site -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Harri Käyhkö – Käsikirjoitukset",
        "inLanguage": "fi-FI",
        "author": { "@type": "Person", "name": "Harri Käyhkö" }
      }
    </script>

    <style>
      /* ─── Theme tokens ─────────────────────────────────────────────────── */
      :root,
      [data-theme="paper"] {
        --bg: #fdfbf7;
        --bg-soft: #f4efe5;
        --card: #ffffff;
        --fg: #1f1b15;
        --fg-soft: #3a332a;
        --muted: #6b6356;
        --muted-2: #8a8276;
        --line: #e6dfd0;
        --line-strong: #c9bfa9;
        --accent: #1f1b15;
        --accent-soft: #4a4034;
        --pill-bg: #ffffff;
        --pill-fg: #2a2620;
        --summary-bg: #f1eadb;
        --summary-bar: #1f1b15;
        --shadow-sm: 0 1px 0 rgba(31, 27, 21, 0.04), 0 1px 3px rgba(31, 27, 21, 0.04);
        --shadow-md: 0 1px 0 rgba(31, 27, 21, 0.04), 0 4px 18px rgba(31, 27, 21, 0.06);
        --danger: #a3271a;
        --focus: #1f1b15;
      }
      [data-theme="light"] {
        --bg: #ffffff;
        --bg-soft: #f3f4f6;
        --card: #ffffff;
        --fg: #0f172a;
        --fg-soft: #1e293b;
        --muted: #475569;
        --muted-2: #64748b;
        --line: #e2e8f0;
        --line-strong: #cbd5e1;
        --accent: #0f172a;
        --accent-soft: #334155;
        --pill-bg: #ffffff;
        --pill-fg: #0f172a;
        --summary-bg: #f1f5f9;
        --summary-bar: #0f172a;
        --shadow-sm: 0 1px 0 rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.04);
        --shadow-md: 0 1px 0 rgba(15, 23, 42, 0.04), 0 4px 18px rgba(15, 23, 42, 0.06);
        --danger: #b42318;
        --focus: #0f172a;
      }
      [data-theme="dark"] {
        --bg: #14110d;
        --bg-soft: #1c1814;
        --card: #1c1814;
        --fg: #f1ebdd;
        --fg-soft: #d8d1c0;
        --muted: #9a9182;
        --muted-2: #7a7264;
        --line: #2c2620;
        --line-strong: #3d362c;
        --accent: #f1ebdd;
        --accent-soft: #c9bfa9;
        --pill-bg: #1c1814;
        --pill-fg: #e8e1cf;
        --summary-bg: #1c1814;
        --summary-bar: #c9a86a;
        --shadow-sm: 0 1px 0 rgba(0, 0, 0, 0.3), 0 1px 3px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 1px 0 rgba(0, 0, 0, 0.3), 0 4px 18px rgba(0, 0, 0, 0.4);
        --danger: #e07a72;
        --focus: #f1ebdd;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) { color-scheme: dark; }
      }

      /* ─── Font size scale ──────────────────────────────────────────────── */
      [data-fontsize="s"] { --reader-fs: 16.5px; --reader-lh: 1.72; }
      [data-fontsize="m"] { --reader-fs: 18.5px; --reader-lh: 1.78; }
      [data-fontsize="l"] { --reader-fs: 20.5px; --reader-lh: 1.78; }
      [data-fontsize="xl"] { --reader-fs: 22.5px; --reader-lh: 1.8; }

      * { box-sizing: border-box; }
      html { color-scheme: light; }
      [data-theme="dark"] { color-scheme: dark; }
      html, body { background: var(--bg); }
      body {
        margin: 0;
        color: var(--fg);
        font-family: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        min-height: 100dvh;
        transition: background-color .2s ease, color .2s ease;
      }
      h1, h2, h3, h4 {
        font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
        font-weight: 400;
        line-height: 1.06;
        margin: 0;
        color: var(--fg);
        letter-spacing: -0.01em;
      }
      a { color: inherit; text-decoration: none; }
      a:focus-visible, button:focus-visible, [role="button"]:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
        border-radius: 6px;
      }

      /* ─── Skip link ────────────────────────────────────────────────────── */
      .skip-link {
        position: absolute;
        left: 12px;
        top: -100px;
        background: var(--fg);
        color: var(--bg);
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 100;
        transition: top .15s ease;
      }
      .skip-link:focus { top: 12px; }

      /* ─── Layout ───────────────────────────────────────────────────────── */
      .container { width: min(100% - 40px, 760px); margin: 0 auto; }
      .container-wide { width: min(100% - 40px, 980px); margin: 0 auto; }

      /* ─── Header ───────────────────────────────────────────────────────── */
      header.site {
        position: sticky;
        top: 0;
        z-index: 30;
        background: color-mix(in srgb, var(--bg) 90%, transparent);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
      }
      .brand {
        font-family: "Work Sans", system-ui, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .brand:hover { color: var(--fg); }
      .bar-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-width: 40px;
        height: 40px;
        padding: 0 10px;
        border-radius: 999px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        transition: background-color .15s, color .15s, border-color .15s;
      }
      .icon-btn:hover { background: var(--bg-soft); color: var(--fg); }
      .icon-btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
      .icon-btn svg { width: 18px; height: 18px; }

      /* ─── Progress bar ─────────────────────────────────────────────────── */
      .progress-bar {
        position: fixed;
        top: 0; left: 0;
        height: 2px;
        background: var(--accent);
        width: 0;
        z-index: 50;
        transition: width .12s linear;
        pointer-events: none;
      }

      /* ─── Settings panel ───────────────────────────────────────────────── */
      .settings-panel {
        position: fixed;
        top: 64px;
        right: 16px;
        width: min(320px, calc(100vw - 32px));
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow-md);
        padding: 18px;
        z-index: 40;
        display: none;
      }
      .settings-panel[data-open="true"] { display: block; }
      .settings-panel h3 {
        font-family: "Work Sans", sans-serif;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .settings-row { margin-bottom: 14px; }
      .settings-row:last-child { margin-bottom: 0; }
      .settings-label {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
        display: block;
      }
      .settings-group {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 4px;
        background: var(--bg-soft);
        padding: 4px;
        border-radius: 10px;
      }
      .settings-group button {
        border: none;
        background: transparent;
        padding: 8px 4px;
        border-radius: 7px;
        font: inherit;
        font-size: 13px;
        color: var(--muted);
        cursor: pointer;
        transition: background .15s, color .15s;
        min-height: 36px;
      }
      .settings-group button[aria-pressed="true"] {
        background: var(--card);
        color: var(--fg);
        box-shadow: var(--shadow-sm);
        font-weight: 500;
      }

      /* ─── Main / footer ────────────────────────────────────────────────── */
      main { padding: 40px 0 88px; min-height: calc(100dvh - 140px); }
      footer.site {
        border-top: 1px solid var(--line);
        padding: 24px 0 calc(24px + env(safe-area-inset-bottom));
        text-align: center;
        color: var(--muted-2);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      /* ─── Home / hero ──────────────────────────────────────────────────── */
      .hero { margin-bottom: 40px; }
      .hero-eyebrow {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .hero h1 {
        font-size: clamp(44px, 8.5vw, 76px);
        margin-bottom: 18px;
      }
      .hero-lede {
        max-width: 560px;
        color: var(--muted);
        line-height: 1.65;
        font-size: 17px;
      }
      .hero-lede strong { color: var(--fg); font-weight: 500; }

      .resume-card {
        margin: 32px 0 8px;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--bg-soft);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .resume-card .label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
      }
      .resume-card .title {
        font-family: "Instrument Serif", serif;
        font-size: 20px;
        line-height: 1.2;
        color: var(--fg);
      }
      .resume-card a { margin-left: auto; flex-shrink: 0; }

      .section-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
        margin-bottom: 14px;
        margin-top: 36px;
      }

      .theme-filter {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 24px;
      }
      .theme-chip {
        font: inherit;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: all .15s;
      }
      .theme-chip:hover { color: var(--fg); border-color: var(--line-strong); }
      .theme-chip[aria-pressed="true"] {
        background: var(--fg);
        color: var(--bg);
        border-color: var(--fg);
      }

      /* ─── Pyörä: Kuusi ennustetta ─────────────────────────────────────── */
      .wheel-section {
        margin: 8px 0 44px;
        padding: 28px 20px 24px;
        background: var(--bg-soft);
        border: 1px solid var(--line);
        border-radius: 18px;
        text-align: center;
      }
      .wheel-section .wheel-eyebrow {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .wheel-section h2 {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: clamp(22px, 3.4vw, 30px);
        margin: 0 0 6px;
      }
      .wheel-section .wheel-lede {
        max-width: 56ch;
        margin: 0 auto 18px;
        color: var(--fg-soft);
        font-size: 15px;
        line-height: 1.55;
      }
      .wheel-wrap {
        position: relative;
        width: min(560px, 100%);
        aspect-ratio: 1 / 1;
        margin: 0 auto;
      }
      .wheel-wrap svg { width: 100%; height: 100%; display: block; }
      .wheel-sector { transition: opacity .18s, transform .18s; transform-origin: 300px 300px; cursor: pointer; }
      .wheel-sector:hover { opacity: .92; }
      .wheel-sector:hover .wheel-sector-shape { filter: brightness(1.04); }
      .wheel-sector-shape {
        stroke: var(--bg-soft);
        stroke-width: 2;
      }
      .wheel-label {
        font-family: "Work Sans", system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: var(--fg);
        pointer-events: none;
      }
      .wheel-sublabel {
        font-family: "Work Sans", system-ui, sans-serif;
        font-size: 11px;
        fill: var(--fg-soft);
        pointer-events: none;
      }
      .wheel-num {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 18px;
        fill: var(--fg);
        font-style: italic;
        pointer-events: none;
      }
      .wheel-center-circle {
        fill: var(--accent);
        cursor: pointer;
        transition: filter .15s;
      }
      .wheel-center-circle:hover { filter: brightness(1.12); }
      .wheel-center-title {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 26px;
        fill: var(--bg);
        text-anchor: middle;
        pointer-events: none;
      }
      .wheel-center-sub {
        font-family: "Work Sans", system-ui, sans-serif;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: var(--bg);
        opacity: .72;
        text-anchor: middle;
        pointer-events: none;
      }
      .wheel-caption {
        margin-top: 14px;
        font-size: 13px;
        color: var(--muted);
      }
      @media (max-width: 560px) {
        .wheel-label { font-size: 12px; }
        .wheel-sublabel { font-size: 10px; }
        .wheel-center-title { font-size: 22px; }
      }

      .books-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .book-card {
        display: block;
        padding: 22px 22px 24px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--card);
        transition: border-color .15s, transform .15s, box-shadow .15s;
        position: relative;
      }
      .book-card:hover {
        border-color: var(--line-strong);
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }
      .book-card h2 {
        font-size: 26px;
        margin-bottom: 6px;
      }
      .book-card .author {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 12px;
      }
      .book-card .desc {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      /* ─── Book / TOC ───────────────────────────────────────────────────── */
      .back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 22px;
        color: var(--muted);
        font-size: 13px;
        padding: 6px 10px 6px 6px;
        border-radius: 8px;
        margin-left: -6px;
      }
      .back:hover { color: var(--fg); background: var(--bg-soft); }
      .book-title { font-size: clamp(40px, 7vw, 64px); margin-bottom: 8px; }
      .book-author { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 18px; }
      .book-desc { color: var(--fg-soft); line-height: 1.65; max-width: 60ch; font-size: 17px; }

      /* ─── Tutkimuskortit (Kuusi ennustetta) ──────────────────────────── */
      .research-cards { display: grid; gap: 18px; margin: 24px 0 8px; }
      .pcard {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 22px 22px 18px;
        background: var(--card);
        position: relative;
      }
      .pcard-toplabel {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--muted-2);
        display: flex; align-items: center; gap: 8px;
      }
      .pcard-status-dot {
        width: 9px; height: 9px; border-radius: 50%;
        display: inline-block;
      }
      .pcard-status-dot.ready { background: #1d9e75; }
      .pcard-status-dot.partial { background: #d99a1d; }
      .pcard-status-dot.requires_collection { background: var(--muted-2); }
      .pcard-lens {
        font-family: var(--font-serif, Georgia), serif;
        font-size: 26px; line-height: 1.15; margin: 4px 0 2px;
        color: var(--fg);
      }
      .pcard-claim {
        font-size: 17px; line-height: 1.5; color: var(--fg-soft);
        margin: 8px 0 16px;
      }
      .pcard-falsification {
        border-left: 3px solid var(--accent, #185fa5);
        background: var(--bg-soft);
        border-radius: 0 8px 8px 0;
        padding: 12px 16px;
        margin: 0 0 16px;
      }
      .pcard-falsification .label {
        font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
        text-transform: uppercase; color: var(--accent, #185fa5);
        margin-bottom: 6px;
      }
      .pcard-falsification .text { font-size: 15px; line-height: 1.55; color: var(--fg); }
      .pcard-falsification .op {
        font-size: 13.5px; line-height: 1.5; color: var(--muted);
        margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line);
      }
      .pcard-falsification .status-line {
        font-size: 12px; color: var(--muted-2); margin-top: 8px;
        display: flex; align-items: center; gap: 6px;
      }
      .pcard-evidence-label {
        font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
        text-transform: uppercase; color: var(--muted);
        margin-bottom: 8px;
      }
      .pcard-evidence-list { display: flex; flex-direction: column; gap: 6px; }
      .pcard-evidence-row {
        text-align: left; width: 100%;
        border: 1px solid var(--line); border-radius: 8px;
        padding: 10px 12px; background: transparent;
        transition: background-color .12s, border-color .12s;
        font-family: inherit;
      }
      .pcard-evidence-row .ev-title { font-size: 14.5px; color: var(--fg); line-height: 1.4; }
      .pcard-evidence-row .ev-meta {
        font-size: 12px; color: var(--muted-2); margin-top: 3px;
        display: flex; gap: 8px; flex-wrap: wrap;
      }
      .pcard-evidence-row .ev-key {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px; color: var(--muted-2); opacity: 0.7;
      }
      .pcard-evidence-empty {
        font-size: 13px; color: var(--muted); font-style: italic;
        padding: 8px 0;
      }
      .pcard-falsification-missing {
        border-left-color: #d99a1d;
      }
      .pcard-falsification-missing .label { color: #d99a1d; }
      .research-cards-intro {
        color: var(--fg-soft); line-height: 1.65; max-width: 60ch;
        font-size: 16px; margin: 4px 0 0;
      }
      /* Evidence-liitteen avausmodaali */
      .ev-modal-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,0.5);
        display: flex; align-items: center; justify-content: center;
        padding: 24px; z-index: 5000; opacity: 0; pointer-events: none;
        transition: opacity .15s;
      }
      .ev-modal-backdrop.show { opacity: 1; pointer-events: auto; }
      .ev-modal {
        background: var(--bg); border-radius: 14px; max-width: 680px;
        width: 100%; max-height: 85vh; overflow-y: auto;
        padding: 28px; position: relative;
      }
      .ev-modal h3 { font-family: var(--font-serif, Georgia), serif; font-size: 22px; margin: 0 0 4px; }
      .ev-modal .ev-modal-close {
        position: absolute; top: 16px; right: 16px;
        background: var(--bg-soft); border: none; border-radius: 8px;
        width: 32px; height: 32px; cursor: pointer; font-size: 18px;
        color: var(--fg);
      }
      .ev-modal-item { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
      .ev-modal-item:first-of-type { border-top: none; }
      .toc { list-style: none; padding: 0; margin: 18px 0 0; }
      .toc li {
        border-bottom: 1px solid var(--line);
      }
      .toc li:last-child { border-bottom: none; }
      .toc a {
        display: grid;
        grid-template-columns: 32px 1fr auto;
        gap: 16px;
        align-items: baseline;
        padding: 18px 10px;
        border-radius: 10px;
        transition: background-color .12s;
      }
      .toc a:hover { background: var(--bg-soft); }
      .toc .num {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: var(--muted-2);
        font-feature-settings: "tnum";
      }
      .toc .title {
        font-family: "Instrument Serif", serif;
        font-size: 22px;
        color: var(--fg);
      }
      .toc .meta {
        font-size: 11px;
        color: var(--muted-2);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }
      .toc .read-dot {
        display: inline-block;
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--accent);
        margin-right: 6px;
        vertical-align: middle;
      }

      /* ─── Chapter ─────────────────────────────────────────────────────── */
      .chapter-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
        margin-bottom: 18px;
        font-size: 13px;
        color: var(--muted);
      }
      .chapter-meta .read-time {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .chapter-meta .read-time svg { width: 14px; height: 14px; }
      .chapter-meta .theme-tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .theme-tag {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--accent-soft);
      }
      .chapter-title { font-size: clamp(38px, 7vw, 60px); margin-bottom: 32px; }

      /* ─── Päättäjätiivistelmä ──────────────────────────────────────────── */
      .summary-box {
        background: var(--summary-bg);
        border-left: 3px solid var(--summary-bar);
        padding: 22px 24px;
        margin-bottom: 36px;
        border-radius: 0 12px 12px 0;
      }
      .summary-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .summary-box ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .summary-box li {
        display: flex;
        gap: 12px;
        font-size: 15.5px;
        line-height: 1.55;
        color: var(--fg);
      }
      .summary-box li::before {
        content: "--";
        color: var(--muted-2);
        flex-shrink: 0;
        font-weight: 500;
      }

      /* ─── Avainluvut ───────────────────────────────────────────────────── */
      .figures {
        margin-bottom: 40px;
      }
      .figures-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .figures-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }
      .figure-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
        box-shadow: var(--shadow-sm);
      }
      .figure-value {
        font-family: "Instrument Serif", serif;
        font-size: 32px;
        line-height: 1.05;
        color: var(--fg);
        margin-bottom: 8px;
        font-feature-settings: "tnum";
      }
      .figure-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        line-height: 1.3;
      }
      .figure-source {
        font-size: 11px;
        color: var(--muted-2);
        font-style: italic;
        margin-top: 6px;
      }
      .figures-source {
        font-size: 11px;
        color: var(--muted-2);
        font-style: italic;
        margin-top: 10px;
        text-align: right;
      }

      /* ─── Reader ───────────────────────────────────────────────────────── */
      .reader {
        font-size: var(--reader-fs, 18.5px);
        line-height: var(--reader-lh, 1.78);
        color: var(--fg-soft);
      }
      .reader p { margin: 0 0 1.2em; }
      .reader h1, .reader h2, .reader h3 { margin: 1.8em 0 .55em; color: var(--fg); }
      .reader h1 { font-size: 1.55em; }
      .reader h2 { font-size: 1.35em; }
      .reader h3 { font-size: 1.18em; }
      .reader blockquote {
        margin: 1.4em 0;
        padding-left: 1.1em;
        border-left: 3px solid var(--line-strong);
        color: var(--muted);
        font-style: italic;
      }
      .reader ul, .reader ol { padding-left: 1.4em; }
      .reader li { margin-bottom: .4em; }
      .reader strong { color: var(--fg); font-weight: 600; }
      .reader code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.92em;
        background: var(--bg-soft);
        padding: 1px 5px;
        border-radius: 4px;
      }

      /* ─── Pager (desktop) ──────────────────────────────────────────────── */
      .pager {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        margin-top: 60px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;

      .pager a { padding: 8px 12px; border-radius: 8px; }
      .pager a:hover { background: var(--bg-soft); color: var(--fg); }
      .right { text-align: right; margin-left: auto; }
      .m-pager { display: none; }

      /* ─── Status / error ───────────────────────────────────────────────── */
      .status { color: var(--muted); padding: 40px 0; text-align: center; }
      .error {
        color: var(--danger);
        white-space: pre-wrap;
        font-family: inherit;
        padding: 24px;
        background: var(--bg-soft);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      /* ─── Inline appendices (preserved from original) ──────────────────── */
      .app-inline {
        margin-top: 2.4em;
        padding-top: 1.6em;
        border-top: 1px solid var(--line);
      }
      .app-inline.chapter-level {
        margin-top: 3em;
        padding-top: 2em;
      }
      .app-inline-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .app-inline-toggles {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .app-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px 9px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        cursor: pointer;
        color: var(--muted);
        font-family: inherit;
        font-size: 13px;
        line-height: 1;
        min-height: 36px;
        transition: border-color .15s, color .15s, background .15s;
      }
      .app-toggle:hover { border-color: var(--line-strong); color: var(--fg); }
      .app-toggle[aria-expanded="true"] {
        border-color: var(--fg);
        color: var(--bg);
        background: var(--fg);
      }
      .app-toggle svg { width: 14px; height: 14px; flex-shrink: 0; }
      .app-toggle .app-toggle-title {
        white-space: nowrap;
        max-width: 280px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .app-body {
        margin-top: 18px;
        padding: 22px 24px 24px;
        background: var(--bg-soft);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .app-body[hidden] { display: none; }
      .app-body-head {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }
      .app-body-head .kind {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
        flex-shrink: 0;
      }
      .app-body-head h3 {
        flex: 1;
        font-family: "Instrument Serif", serif;
        font-size: 22px;
        line-height: 1.2;
      }
      .app-body .lead {
        font-family: "Instrument Serif", serif;
        font-size: 19px;
        line-height: 1.5;
        color: var(--fg);
        margin: 0 0 16px;
      }
      .app-body .note {
        font-size: 14px;
        color: var(--muted);
        background: var(--card);
        border-left: 2px solid var(--line-strong);
        padding: 10px 12px;
        margin: 0 0 16px;
        line-height: 1.55;
        border-radius: 0 6px 6px 0;
      }
      .app-body .source {
        font-size: 12px;
        color: var(--muted-2);
        font-style: italic;
        margin: 16px 0 0;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }

      /* Timeline */
      .app-timeline { list-style: none; padding: 0; margin: 0; }
      .app-timeline li { padding: 12px 0; border-bottom: 1px solid var(--line); }
      .app-timeline li:last-child { border-bottom: none; }
      .app-timeline .period {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .app-timeline .event {
        font-family: "Instrument Serif", serif;
        font-size: 19px;
        line-height: 1.25;
        margin-bottom: 6px;
      }
      .app-timeline .desc { font-size: 14px; line-height: 1.6; color: var(--muted); }

      /* Chain */
      .app-chain { list-style: none; padding: 0; margin: 0; counter-reset: chainstep; }
      .app-chain li { position: relative; padding: 0 0 18px 38px; counter-increment: chainstep; }
      .app-chain li::before {
        content: counter(chainstep);
        position: absolute; left: 0; top: 0;
        width: 26px; height: 26px; border-radius: 50%;
        background: var(--card);
        border: 1px solid var(--line-strong);
        color: var(--fg);
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 600;
      }
      .app-chain li::after {
        content: ""; position: absolute;
        left: 12px; top: 28px; bottom: 0;
        width: 2px; background: var(--line);
      }
      .app-chain li:last-child::after { display: none; }
      .app-chain .event { font-weight: 500; font-size: 15px; margin-bottom: 4px; line-height: 1.45; }
      .app-chain .consequence { font-size: 14px; color: var(--muted); line-height: 1.55; }
      .app-chain-extra {
        margin-top: 14px;
        padding: 12px 14px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.6;
      }
      .app-chain-extra .label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: 4px;
      }

      /* Calculation table */
      .app-calc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .app-calc-table th, .app-calc-table td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      .app-calc-table th {
        font-weight: 600;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        background: var(--card);
      }
      .app-calc-table td { line-height: 1.5; }
      .app-calc-table tr:last-child td { border-bottom: none; }

      /* Evidence */
      .app-items { list-style: none; padding: 0; margin: 0; }
      .app-items > li { padding: 14px 0; border-bottom: 1px solid var(--line); }
      .app-items > li:last-child { border-bottom: none; }
      .app-item-head {
        font-family: "Instrument Serif", serif;
        font-size: 17px;
        line-height: 1.3;
        margin-bottom: 6px;
        color: var(--fg);
      }
      .app-item-body { font-size: 14px; line-height: 1.6; color: var(--muted); }
      .app-item-body p { margin: 0 0 .6em; }
      .app-item-body p:last-child { margin-bottom: 0; }
      .app-kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 6px 14px;
        font-size: 13px;
        margin: 8px 0 0;
      }
      .app-kv dt {
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 10px;
        color: var(--muted);
        padding-top: 3px;
      }
      .app-kv dd { margin: 0; line-height: 1.55; color: var(--fg-soft); }

      /* ─── note ───────────────────────────────────────────────────────────── */
      .app-note-text {
        font-size: 15px;
        line-height: 1.7;
        color: var(--fg-soft);
        margin-top: 4px;
        white-space: pre-wrap;
      }

      /* ─── list ───────────────────────────────────────────────────────────── */
      .app-list { padding-left: 18px; margin: 8px 0; }
      .app-list li { padding: 6px 0; line-height: 1.55; color: var(--fg-soft); }
      .app-list li::marker { color: var(--muted); }
      .app-list .app-list-head { font-weight: 500; color: var(--fg); margin-bottom: 2px; }
      .app-list .app-list-body { font-size: 14px; color: var(--muted); line-height: 1.55; }

      /* ─── table (generic) ────────────────────────────────────────────────── */
      .app-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .app-table th, .app-table td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      .app-table th {
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 11px;
        color: var(--muted);
        background: var(--bg-soft);
      }
      .app-table td { line-height: 1.5; color: var(--fg-soft); }
      .app-table tr:last-child td { border-bottom: none; }

      /* ─── chart-chartjs ──────────────────────────────────────────────────── */
      .app-chart-wrap {
        position: relative;
        width: 100%;
        margin: 12px 0;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
      }

      /* ─── paperdoll ──────────────────────────────────────────────────────── */
      .paperdoll-set {
        display: grid;
        gap: 20px;
        margin: 12px 0;
      }
      .paperdoll-set.paperdoll-row {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .paperdoll-set.paperdoll-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      @media (max-width: 520px) {
        .paperdoll-set.paperdoll-grid { grid-template-columns: 1fr; }
      }
      .paperdoll {
        margin: 0;
        padding: 14px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .paperdoll-image {
        width: 100%;
        max-width: 220px;
        aspect-ratio: 2/3;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-soft);
        border-radius: 8px;
        overflow: hidden;
      }
      .paperdoll-image img {
        width: 100%; height: 100%;
        object-fit: contain;
        display: block;
      }
      .paperdoll-image-empty::before {
        content: "--";
        color: var(--muted-2);
        font-size: 28px;
      }
      .paperdoll-head { margin-top: 12px; }
      .paperdoll-label {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 22px;
        line-height: 1.15;
        color: var(--fg);
      }
      .paperdoll-sublabel {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 2px;
      }
      .paperdoll-stats {
        margin: 14px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
      }
      .paperdoll-stat {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        padding: 6px 8px;
        border-radius: 6px;
        background: var(--bg-soft);
      }
      .paperdoll-stat dt {
        font-size: 12px;
        color: var(--muted);
        text-align: left;
        flex: 1;
      }
      .paperdoll-stat dd {
        margin: 0;
        font-weight: 500;
        font-size: 14px;
        color: var(--fg);
        text-align: right;
        white-space: nowrap;
      }
      .paperdoll-caption {
        margin-top: 10px;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.5;
      }

      /* ─── Search overlay ───────────────────────────────────────────────── */
      .search-overlay {
        position: fixed; inset: 0;
        background: color-mix(in srgb, var(--bg) 80%, transparent);
        backdrop-filter: blur(8px);
        z-index: 60;
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding: 80px 16px 16px;
      }
      .search-overlay[data-open="true"] { display: flex; }
      .search-box {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow-md);
        width: min(560px, 100%);
        max-height: calc(100dvh - 120px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .search-input {
        border: none;
        background: transparent;
        padding: 18px 20px;
        font: inherit;
        font-size: 17px;
        color: var(--fg);
        border-bottom: 1px solid var(--line);
        outline: none;
      }
      .search-input::placeholder { color: var(--muted-2); }
      .search-results { overflow-y: auto; padding: 6px; }
      .search-result {
        display: block;
        padding: 12px 14px;
        border-radius: 10px;
        color: var(--fg);
      }
      .search-result:hover, .search-result[data-active="true"] { background: var(--bg-soft); }
      .search-result .r-title {
        font-family: "Instrument Serif", serif;
        font-size: 17px;
        margin-bottom: 2px;
      }
      .search-result .r-sub {
        font-size: 12px;
        color: var(--muted);
      }
      .search-empty { padding: 24px; color: var(--muted); text-align: center; font-size: 14px; }

      /* ─── Mobile ───────────────────────────────────────────────────────── */
      @media (max-width: 720px) {
        .container, .container-wide { width: min(100% - 28px, 980px); }
        main { padding: 24px 0 110px; min-height: calc(100dvh - 120px); }
        .hero h1 { font-size: clamp(40px, 11vw, 58px); }
        .hero-lede { font-size: 16px; }
        .books-grid { grid-template-columns: 1fr; }
        .book-card { padding: 20px; }
        .book-card h2 { font-size: 24px; }
        .book-title { font-size: clamp(36px, 10vw, 48px); }
        .chapter-title { font-size: clamp(32px, 9vw, 44px); }
        .summary-box { padding: 18px 20px; border-radius: 0 10px 10px 0; }
        .summary-box li { font-size: 15px; }
        .figure-value { font-size: 28px; }
        .toc a { grid-template-columns: 26px 1fr; padding: 16px 8px; }
        .toc .meta { grid-column: 2; padding-top: 4px; }
        .toc .title { font-size: 20px; }
        .pager { display: none; }
        .m-pager {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 8px;
          position: fixed;
          bottom: 0; left: 0; right: 0;
          padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
          background: color-mix(in srgb, var(--bg) 94%, transparent);
          backdrop-filter: blur(12px);
          border-top: 1px solid var(--line);
          z-index: 20;
        }
        .m-pager a, .m-pager span {
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 8px 12px;
          border: 1px solid var(--line);
          border-radius: 10px;
          background: var(--card);
          color: var(--fg);
          font-size: 14px;
          min-height: 52px;
          overflow: hidden;
        }
        .m-pager .label {
          font-size: 10px;
          color: var(--muted);
          margin-bottom: 2px;
          text-transform: uppercase;
          letter-spacing: 0.08em;
        }
        .m-pager .title {
          font-family: "Instrument Serif", serif;
          font-size: 16px;
          line-height: 1.1;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .m-pager a.next { text-align: right; }
        .m-pager span.empty { opacity: 0.45; justify-content: center; align-items: center; }
        .app-toggle .app-toggle-title { max-width: 200px; }
      }

      /* ─── Motion ───────────────────────────────────────────────────────── */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* ─── Print ───────────────────────────────────────────────────────── */
      @media print {
        header.site, footer.site, .m-pager, .pager, .progress-bar,
        .settings-panel, .search-overlay, .back, .app-inline-toggles { display: none !important; }

        .reader { font-size: 11pt; line-height: 1.55; max-width: 100%; }
        .summary-box, .figure-card, .app-body { break-inside: avoid; border: 1px solid #999; background: white; }
        a { color: black; text-decoration: none; }
        .app-body { display: block !important; }
      }
    </style>
