name: Deploy static site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate article share pages
        run: node tools/generate-article-share-pages.mjs

      - name: Fix copied article share URLs
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'artikkeli.html';
          let s = fs.readFileSync(file, 'utf8');
          const before = s;
          s = s.replace(/\/kirjoitukset\/\$\{encodeURIComponent\(slug\)\}\//g, '/kirjoitukset/${encodeURIComponent(slug)}.html');
          s = s.replace(/\/kirjoitukset\/\$\{encodeURIComponent\(article\.slug\|\|article\.id\)\}\//g, '/kirjoitukset/${encodeURIComponent(article.slug||article.id)}.html');
          if (s !== before) fs.writeFileSync(file, s, 'utf8');
          NODE

      - name: Persist generated article share pages to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kirjoitukset/*.html artikkeli.html
          git add -u kirjoitukset
          if ! git diff --cached --quiet; then
            git commit -m "Update generated article share pages [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
