name: Replace margin lab with boundary map
# registered; trigger migration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/replace-margin-lab-with-boundary-map.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artikkeli.html artikkeli-visualisoinnit.json
          if ! git diff --cached --quiet; then
            git commit -m "Replace liikkumavara laboratory with boundary map [skip ci]"
            git push
          fi
