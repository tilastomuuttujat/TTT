name: Fix margin lab section
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/fix-margin-lab-section.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artikkeli-visualisoinnit.json
          if ! git diff --cached --quiet; then
            git commit -m "Fix liikkumavara laboratory placement [skip ci]"
            git push
          fi
