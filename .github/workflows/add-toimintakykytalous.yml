name: Add toimintakykytalous article

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add article to kirjoitukset.json
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'kirjoitukset.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const list = Array.isArray(data) ? data : data.kirjoitukset;
          if (!Array.isArray(list)) throw new Error('kirjoitukset-taulukkoa ei löytynyt');
          const id = 'toimintakykytalous';
          if (list.some(a => a && (a.id === id || a.slug === id))) {
            console.log('Article already exists; nothing to do.');
            process.exit(0);
          }
          const article = {
            id,
            slug: id,
            title: 'Toimintakykytalous uutena suuntana',
            titleParts: ['Toimintakykytalous', 'uutena suuntana'],
            subtitle: 'Entä jos talouden onnistumista ei arvioitaisi vain sillä, kuinka paljon se tuottaa, vaan sillä, kuinka hyvin syntynyt arvo palautuu ihmisten, yhteisöjen ja yhteiskunnan kyvyksi toimia?',
            tags: ['Toimintakykytalous', 'Hyvinvointivaltio', 'Talous'],
            readingTime: '26 MIN',
            image: 'toimintakykytalous.png',
            imageAlt: 'Pystysuuntainen infografiikka toimintakykytaloudesta uutena taloussuuntana',
            imageCaption: 'Toimintakykytaloudessa talouden tehtävä ei ole vain tuottaa arvoa, vaan palauttaa sitä korvauksena, turvana, oppimisena, omistuksena ja yhteiskunnan uusiutuvana toimintakykynä.',
