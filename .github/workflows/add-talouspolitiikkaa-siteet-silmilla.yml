name: Add talouspolitiikkaa siteet silmilla article

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-talouspolitiikkaa-siteet-silmilla.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add article
        run: node tools/add-talouspolitiikkaa-siteet-silmilla.mjs
      - name: Commit article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add kirjoitukset.json
          if ! git diff --cached --quiet; then
            git commit -m "Add talouspolitiikkaa siteet silmilla article"
            git push
          fi
