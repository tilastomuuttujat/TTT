name: Add toimintakykyvaltio article

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add article to kirjoitukset.json
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'kirjoitukset.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const list = Array.isArray(data) ? data : data.kirjoitukset;
          if (!Array.isArray(list)) throw new Error('kirjoitukset-taulukkoa ei löytynyt');
          const id = 'toimintakykyvaltio';
          if (list.some(a => a && (a.id === id || a.slug === id))) {
            console.log('Article already exists; nothing to do.');
            process.exit(0);
          }
          const article = {
            id,
            slug: id,
            title: 'Hyvinvointivaltio toimintakyvyn rakentajana',
            titleParts: ['Hyvinvointivaltio', 'toimintakyvyn rakentajana'],
