name: Add liikkumavara laboratory

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply laboratory migration
        run: node tools/add-margin-lab.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artikkeli.html artikkeli-visualisoinnit.json
          if ! git diff --cached --quiet; then
            git commit -m "Add liikkumavara laboratory [skip ci]"
            git push
          fi
