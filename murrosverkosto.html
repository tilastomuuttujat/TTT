:root{

html,body{height:100%;margin:0}

.grow{flex:1}

.results{position:absolute;z-index:40;top:110%;left:0;width:22rem;max-width:80vw;background:#fff;border:1px solid var(--hairline);max-height:16rem;overflow:auto}

main{position:relative;flex:1;overflow:hidden}
svg{width:100%;height:100%;display:block;touch-action:none;background:
  radial-gradient(circle at 30% 20%, #f7f4ed 0%, var(--paper) 55%)}
svg:active{cursor:grabbing}
.controls{position:absolute;top:.75rem;right:.75rem;display:flex;flex-direction:column;gap:.35rem;z-index:20}

.crumb{font-size:.8rem;border:1px solid var(--hairline);border-radius:2px;padding:.2rem .5rem}
.crumb.cur{background:var(--petrol);color:#f7f4ed;border-color:var(--petrol)}
.sep{color:var(--ink-soft);font-size:.75rem}

<script>
async function start(DATA) {
validateData(DATA);
document.getElementById('loadbox').hidden = true;
document.querySelectorAll('header input,header select,footer button,.controls button').forEach(el=>el.disabled=false);
const LENSES = DATA.lenses;
const N = DATA.nodes, E = DATA.edges;
const byId = new Map(N.map(n => [n.id, n]));
const out = new Map(), inc = new Map(), und = new Map();
for (const n of N) { out.set(n.id, []); inc.set(n.id, []); und.set(n.id, []); }
for (const e of E) {
  out.get(e.from).push(e); inc.get(e.to).push(e);
  und.get(e.from).push(e); und.get(e.to).push(e);
}
const edgeById = new Map(E.map(e => [e.id, e]));
const directed = e => e.type === "dokumentoitu" || e.type === "tulkittu" || e.type === "ajallinen";
const other = (e, id) => (e.from === id ? e.to : e.from);
const outgoing = id => (und.get(id)||[]).filter(e=>!directed(e)||e.from===id);
const degree = new Map(N.map(n => [n.id, und.get(n.id).length]));

let profileMode=true,explainMode=false;
let state = { lens: "talous", path: [], steps: [], sel: null, hover: null, depth: false, yaw: -.48, pitch: .7 };
// ---- URL-tila
function readUrl() {
  const p = new URLSearchParams(location.hash.slice(1));
  const l = p.get("linssi"); if (l && LENSES.some(x => x.id === l)) state.lens = l;
  const pa = p.get("polku"); state.path = pa ? pa.split(",").filter(id => byId.has(id)) : [];
  const ids = (p.get("yhteydet") || "").split(",");
  state.steps = [];
  for(let i=1;i<state.path.length;i++) {
    const valid=outgoing(state.path[i-1]).filter(e=>other(e,state.path[i-1])===state.path[i]);
    const e=valid.find(e=>e.id===ids[i-1]) || (valid.length===1 ? valid[0] : null);
    if(!e){state.path=state.path.slice(0,i);break;}
    state.steps.push(e.id);
  }
  const sel=p.get("valinta");
  state.sel=sel && (sel.startsWith('solmu:') ? byId.has(sel.slice(6)) : sel.startsWith('yhteys:') && edgeById.has(sel.slice(7))) ? sel : null;
  state.depth=p.get("nakyma")==="3d";
  const yaw=p.has("kierto")?Number(p.get("kierto")):NaN,pitch=p.has("kallistus")?Number(p.get("kallistus")):NaN;
  if(Number.isFinite(yaw))state.yaw=Math.max(-3.14,Math.min(3.14,yaw));
  if(Number.isFinite(pitch))state.pitch=Math.max(.22,Math.min(1.22,pitch));
  state.hover=null;
}
function writeUrl(push) {
  const p = new URLSearchParams();
  p.set("linssi", state.lens);
  if (state.path.length) p.set("polku", state.path.join(","));
  if(state.steps.length) p.set("yhteydet",state.steps.join(","));
  if (state.sel) p.set("valinta", state.sel);
  p.set("nakyma",state.depth?"3d":"2d");
  if(state.depth&&(Math.abs(state.yaw+.48)>.01||Math.abs(state.pitch-.7)>.01)){
    p.set("kierto",state.yaw.toFixed(2));p.set("kallistus",state.pitch.toFixed(2));
  }
  const url = "#" + p.toString();
  if (push) history.pushState(null, "", url); else history.replaceState(null, "", url);
}
// ---- kamera
const svg = document.getElementById("svg");
let cam = { k: 0.1, tx: 0, ty: 0 }, W = 100, H = 100, anim = null;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const clampK = k => Math.min(2.4, Math.max(0.015, k));
const w2s = (x, y) => [x * cam.k + cam.tx, y * cam.k + cam.ty];
const s2w = (x, y) => [(x - cam.tx) / cam.k, (y - cam.ty) / cam.k];
const nodeYear = n => Math.max(1800, Math.min(2030, (n.yearStart + n.yearEnd) / 2));
const nodeDepth = n => state.depth ? (nodeYear(n) - 1800) / 230 : 0;
const temporalZ=(year)=>((Math.max(1800,Math.min(2030,year))-1915)/115)*3000;
function project3(x,y,z){
  if(!state.depth)return {x,y,z:0,d:0,scale:1};
  const cy=Math.cos(state.yaw),sy=Math.sin(state.yaw),cp=Math.cos(state.pitch),sp=Math.sin(state.pitch);
  const rx=x*cy-y*sy, ry=x*sy+y*cy;
  const py=ry*cp-z*sp, d=ry*sp+z*cp;
  const scale=15000/Math.max(6500,15000-d);
  return {x:rx*scale,y:py*scale,z:(z+3000)/6000,d,scale};
}
function projectedPos(n){
  return project3(n.pos.x,n.pos.y,temporalZ(nodeYear(n)));
}
const node2s = n => { const p=projectedPos(n); return [...w2s(p.x,p.y),p.z]; };
function projectedBounds(){
  const ps=N.map(projectedPos),xs=ps.map(p=>p.x),ys=ps.map(p=>p.y);
  return {minX:Math.min(...xs),maxX:Math.max(...xs),minY:Math.min(...ys),maxY:Math.max(...ys)};
}

function preview(focusId) {

  const limits = [3, 2, 1];
  for (let d = 0; d < 3; d++) {

      const cands = und.get(id).filter(e => !directed(e) || e.from === id).sort((a, b) => score(b) - score(a));
      if (cands.length > limits[d]) branch.add(id);

function routeChoices(id){
 const routes=outgoing(id).sort((a,b)=>score(b)-score(a));
 const card=e=>{const n=byId.get(other(e,id)),risk=n.lenses?.[state.lens];const type={dokumentoitu:'Dokumentoitu vaikutussuhde',tulkittu:'Tulkittu vaikutussuhde',ajallinen:'Ajallinen seuraanto',temaattinen:'Temaattinen yhteys'}[e.type]||e.type;
 return `<li class="routecard"><span class="meta">${esc(type)}${e.lenses?.includes(state.lens)?' · valittu tarkastelukulma':''}</span><button class="route-title" data-route="${e.id}" data-from="${id}">${esc(n.label)} →</button><p>${esc(e.label)}</p>${risk?.mechanism?`<p class="route-risk">${esc(risk.mechanism)}</p>`:'<p class="hint">Kohteen riskiä ei ole arvioitu tästä tarkastelukulmasta.</p>'}<button data-edge2="${e.id}">Mihin yhteys perustuu?</button></li>`;};
 return routes.slice(0,4).map(card).join('')+(routes.length>4?`<li class="more-routes"><details><summary>Kaikki muut reitit (${routes.length-4})</summary><ul>${routes.slice(4).map(card).join('')}</ul></details></li>`:'');
}

function renderGuide(){

 const relevant=N.filter(n=>n.lenses?.[state.lens]);const pool=relevant.length?relevant:N;
 const picks=[...pool].sort((a,b)=>(b.prominence||0)-(a.prominence||0)||outgoing(b.id).length-outgoing(a.id).length).slice(0,4);
 el.innerHTML=`<div class="meta">Aloita yhdestä ilmiöstä</div><h2>Mihin muutos voi johtaa?</h2><p>Valitse lähtökohta. Seuraa yhteyksiä ja tarkastele, millaisia riskejä niiden varrella on kuvattu.</p><div class="entrylist">${picks.map(n=>`<button data-start="${esc(n.id)}"><strong>${esc(n.label)}</strong><span>${esc(n.timeframe||'')} · ${outgoing(n.id).length} jatkoyhteyttä →</span></button>`).join('')}</div><p class="hint">Aloituskohdat painottavat aineiston näkyviä ilmiöitä. Ne eivät ole riskien suuruusjärjestys. Voit myös hakea ilmiötä yläreunasta.</p>`;
 el.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>selectNode(b.dataset.start,true));
}

function mapTheme(n){
 const t=String(n.theme||'').toLowerCase();
 if(/talous/.test(t))return 'talous';
 if(/työ|tyo/.test(t))return 'tyo';
 if(/väest|vaest|sukupolv/.test(t))return 'vaesto';
 const hay=[n.theme,...(n.domains||[])].join(' ').toLowerCase();
 if(/työ|tyoll|työttöm/.test(hay))return 'tyo';
 if(/tulo|eriarvo|köyh|toimeentulo/.test(hay))return 'tulot';
 if(/talous|elinkeino|vienti|teollisuus/.test(hay))return 'talous';
 if(/ennuste|skenaario/.test(hay))return 'ennusteet';
 return 'vaesto';
}

function mapOptions(n){
 if(!Number.isFinite(n.yearStart))return [];
 const end=Number.isFinite(n.yearEnd)?n.yearEnd:n.yearStart,theme=mapTheme(n);
 return MAP_CATALOG.filter(s=>s.theme===theme).map(s=>({s,years:s.years.filter(y=>y>=n.yearStart&&y<=end)})).filter(x=>x.years.length>=2);
}
function mapLink(n){
 const options=mapOptions(n);
 if(!options.length)return '<p class="hint">Tämän ilmiön ajanjaksolle ei löydy teemasta vähintään kahta alueellisen sarjan havaintovuotta. Karttavertailua ei tarjota.</p>';
 const link=({s,years})=>{const a=years[0],b=years.at(-1),q=new URLSearchParams({teema:s.theme,sarja:s.key,linssi:state.lens,jakso:a+'-'+b,murros:n.id,nimi:n.label});return `<a class="maplink" href="alueellinen-eriytyminen.html#${esc(q.toString())}">${esc(s.title)} · ${a}–${b} →</a>`;};
 return '<div class="map-options"><p class="hint">Alueellinen taustavertailu: valitse todellinen tilastosarja. Muutos ei osoita tämän murroksen vaikutusta.</p>'+options.slice(0,3).map(link).join('')+(options.length>3?'<details><summary>Lisää karttasarjoja ('+(options.length-3)+')</summary>'+options.slice(3).map(link).join('')+'</details>':'')+'</div>';
}

function assessRow(label, value) {
  return `<p><strong>${label}:</strong> ${value ? esc(value) : "Ei arvioitu"}</p>`;
}
function renderPanel() {
  const panel = document.getElementById("panel");
  const controls = document.getElementById("controls");
  const followBtn = document.getElementById("follow");
  const nid = selNodeId(), eid = selEdgeId();
  if (!nid && !eid) { panel.hidden = true; controls.classList.remove("shift"); followBtn.hidden = true; return; }
  panel.hidden = false; controls.classList.add("shift");
  let h = '<button class="close" id="closep" aria-label="Sulje">Sulje</button>';
  if (eid) {
    const e = edgeById.get(eid);
    if (!e) { panel.hidden = true; return; }
    followBtn.hidden = true;
    h += `<div class="meta">Yhteys</div><h2>${esc(e.label)}</h2>`;
    h += `<p>${esc(byId.get(e.from).label)} ${directed(e) ? "→" : "--"} ${esc(byId.get(e.to).label)}</p>`;
    h += `<h3>Suhteen laji</h3><p>${{ dokumentoitu: "Dokumentoitu vaikutussuhde", tulkittu: "Tulkittu tai oletettu vaikutussuhde", ajallinen: "Ajallinen seuraanto", temaattinen: "Temaattinen yhteys (ei syy–seuraussuhde)" }[e.type]}</p>`;
    h += `<h3>Perustelu</h3><p>${e.rationale ? esc(e.rationale) : "Ei perustelua aineistossa."}</p>`;
    h += `<h3>Aineiston merkinnät</h3><p><span class="tag">${esc(e.rawType)}</span><span class="tag">${esc(e.relClass)}</span><span class="tag">luottamus: ${esc(e.confidence || "ei arvioitu")}</span>${e.pressureSignal ? '<span class="tag">painesignaali</span>' : ""}</p>`;
    h += `<p>Linssiosumat: ${e.lenses.length ? e.lenses.map(l => esc(LENSES.find(x => x.id === l).short)).join(", ") : "ei osumia"}</p>`;
    h += `<h3>Tutki yhteyttä</h3><ul><li><button data-open="${e.from}">Avaa lähtöilmiö</button></li><li><button data-route="${e.id}" data-from="${e.from}">Seuraa tätä yhteyttä → ${esc(byId.get(e.to).label)}</button></li></ul>`;

  } else {
    const n = byId.get(nid);
    if (!n) { panel.hidden = true; return; }
    followBtn.hidden = false;
    followBtn.textContent = state.path.length ? "Näytä jatkovaihtoehdot" : "Aloita polku tästä";
    const lens = n.lenses[state.lens];
    h += `<div class="meta">${esc(n.kind)}${n.timeframe ? " · " + esc(n.timeframe) : ""}</div><h2>${esc(n.label)}</h2>`;
    h += `<p>${esc(n.summary)}</p>`;
    h += mapLink(n);
    h += `<h3>Miksi tämä liittyy tarkastelukulmaan: ${esc(LENSES.find(x => x.id === state.lens).label)}</h3>`;
    h += `<p>${lens ? esc(lens.mechanism) : "Ei arvioitu tälle tarkastelukulmalle."}</p>`;
    h += assessRow("Riskin vakavuus", lens && lens.severity);
    h += assessRow("Riskin todennäköisyys", lens && lens.likelihood);
    h += assessRow("Ilmiötä koskevan näytön vahvuus", n.evidenceConfidence);
    h += assessRow("Riskitulkinnan näyttö", lens && lens.riskEvidence);
    h += `<details class="supporting"><summary>Taustat, mekanismit ja lähteet</summary><h3>Verkostollinen keskeisyys</h3><p>${degree.get(n.id)} yhteyttä. Keskeisyys ei ole riskin vakavuuden mitta.</p>`;
    if (n.mechanism) h += `<h3>Mekanismi</h3><p>${esc(n.mechanism)}</p>`;
    if (n.longEffect) h += `<h3>Pitkä vaikutus</h3><p>${esc(n.longEffect)}</p>`;
    const cl = DATA.clusters.filter(c => c.lens===state.lens && c.nodeIds.includes(n.id));
    if (cl.length) h += `<h3>Verkostolliset yhtymäkohdat</h3><p>Yhteyksien kohtaaminen ei yksin osoita riskin kasautumista.</p>` + cl.map(c => `<p><strong>${esc(c.name.replace("Kasautuminen:","Yhtymäkohta:"))}</strong><br/>${esc(c.basis)}</p>`).join("");
    h += `</details>`;
    h += `<h3>Minne tästä voi edetä?</h3><p class="hint">Reitit on järjestetty valitun tarkastelukulman mukaan. Yhteys ei yksin osoita syy-seurausta tai riskin todennäköisyyttä.</p><ul class="routes">${routeChoices(n.id)}</ul>`;
    const ins = inc.get(n.id), outs = [];
    if (ins.length) h += `<details class="supporting"><summary>Mistä tähän tullaan? (${ins.length})</summary><ul>` + ins.slice(0, 14).map(e => `<li><button data-edge2="${e.id}">${esc(e.label)}</button> -- ${esc(byId.get(e.from).label)}</li>`).join("") + "</ul></details>";
    if (outs.length) h += `<h3>Lähtevät yhteydet (${outs.length})</h3><ul>` + outs.slice(0, 14).map(e => `<li><button data-edge2="${e.id}">${esc(e.label)}</button> -- ${esc(byId.get(e.to).label)}</li>`).join("") + "</ul>";
    if (n.domains && n.domains.length) h += `<h3>Aiheet</h3><p>${n.domains.map(d => `<span class="tag">${esc(d)}</span>`).join("")}</p>`;
    if (n.statuteTitle) h += `<h3>Säädöskytkentä</h3><p>${esc(n.statuteTitle)}${n.statuteYear ? " (" + n.statuteYear + ")" : ""}</p>`;
    h += `<h3>Lähde</h3><p class="meta">${esc(DATA.origin.label)}</p>`;
  }
  panel.innerHTML = h;
}

function selectNode(id, move) {
  state.sel = "solmu:" + id; state.hover=null; kbIndex = 0; writeUrl(true);
  if (move) go(centerOn(byId.get(id))); else render();
}
function selectEdge(id) { state.sel = "yhteys:" + id; writeUrl(true); render(); }
function followEdge(edgeId,from){
 const e=edgeById.get(edgeId);
 if(!e||!outgoing(from).includes(e))return;
 const last=state.path.at(-1);
 if(last!==from){
   const i=state.path.lastIndexOf(from);
   if(i>=0){state.path=state.path.slice(0,i+1);state.steps=state.steps.slice(0,i);}
   else if(last){notice('Aloita uusi polku valitsemalla lähtöilmiö ja Tyhjennä, tai palaa kuljetulle polulle.');return;}
   else state.path=[from];
 }
 state.path.push(other(e,from));state.steps.push(e.id);
 state.sel='solmu:'+state.path.at(-1);state.hover=null;kbIndex=0;
 writeUrl(true);go(fitNodes([...state.path,...preview(state.path.at(-1)).nodes]));
}
function follow(id){
 if(!state.path.length){state.path=[id];state.steps=[];state.sel='solmu:'+id;state.hover=null;writeUrl(true);go(fitNodes([...preview(id).nodes]));return;}
 const opts=outgoing(state.path.at(-1)).filter(e=>other(e,state.path.at(-1))===id);
 if(opts.length===1){followEdge(opts[0].id,state.path.at(-1));return;}
 notice(opts.length>1?'Valitse jatkovaihtoehdoista täsmällinen yhteys.':'Valitse jatkovaihtoehto sivupaneelista.');
}
function notice(message){document.getElementById('status').textContent=message;}
document.getElementById("zin").onclick = () => go({ ...cam, k: clampK(cam.k * 1.5), tx: W / 2 - (W / 2 - cam.tx) * 1.5, ty: H / 2 - (H / 2 - cam.ty) * 1.5 });
document.getElementById("zout").onclick = () => go({ ...cam, k: clampK(cam.k / 1.5), tx: W / 2 - (W / 2 - cam.tx) / 1.5, ty: H / 2 - (H / 2 - cam.ty) / 1.5 });
document.getElementById("depth").onclick=()=>{state.depth=!state.depth;writeUrl(false);go(state.path.length?fitNodes(state.path):selNodeId()?centerOn(byId.get(selNodeId())):fit());};
function orbit(dyaw,dpitch){
  if(!state.depth)return;
  state.yaw=Math.max(-3.14,Math.min(3.14,state.yaw+dyaw));
  state.pitch=Math.max(.22,Math.min(1.22,state.pitch+dpitch));
  writeUrl(false);go(state.path.length?fitNodes(state.path):selNodeId()?centerOn(byId.get(selNodeId())):fit());
}
document.getElementById("orbitl").onclick=()=>orbit(-.16,0);
document.getElementById("orbitr").onclick=()=>orbit(.16,0);
document.getElementById("orbitt").onclick=()=>orbit(0,.1);
document.getElementById("orbitb").onclick=()=>orbit(0,-.1);
document.getElementById("fit").onclick = () => go(fit());
document.getElementById("back").onclick = () => { if (state.path.length) { state.path = state.path.slice(0, -1); state.steps=state.steps.slice(0,-1); state.hover=null; const l = state.path[state.path.length - 1]; state.sel = l ? "solmu:" + l : null; writeUrl(true); l ? go(centerOn(byId.get(l))) : render(); } };
document.getElementById("clear").onclick = () => { state.path = []; state.steps=[]; state.hover=null; state.sel = null; writeUrl(true); go(fit()); };
document.getElementById("full").onclick=()=>{if(state.path.length){state.hover=null;state.sel=null;writeUrl(true);go(fitNodes(state.path));}};
document.getElementById("follow").onclick = () => { const id=selNodeId(); if(!id)return; if(!state.path.length)follow(id); else { const first=document.querySelector("#panel [data-route]"); if(first){first.scrollIntoView({block:"center"});first.focus();}else notice("Tästä ilmiöstä ei ole lähteviä yhteyksiä."); } };

const lensSel = document.getElementById("lens");
lensSel.innerHTML = LENSES.map(l => `<option value="${l.id}">${esc(l.label)}</option>`).join("");
lensSel.onchange = () => { state.lens = lensSel.value; writeUrl(true); render(); };

const search = document.getElementById("search"), results = document.getElementById("results");
search.oninput = () => {
  const q = search.value.trim().toLowerCase();
  if (q.length < 2) { results.hidden = true; return; }
  const hits = N.filter(n => n.label.toLowerCase().includes(q) || (n.domains || []).some(d => d.toLowerCase().includes(q))).slice(0, 8);
  results.hidden = hits.length === 0;
  results.innerHTML = hits.map(n => `<button data-find="${n.id}">${esc(n.label)}<br><span class="meta">${esc((n.domains || []).slice(0, 3).join(" · "))}</span></button>`).join("");
};

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-find],[data-crumb],[data-open],[data-follow],[data-edge2],[data-route],#closep");
  if (!t) return;
  if (t.id === "closep") { state.sel = null; writeUrl(true); render(); return; }
  if (t.dataset.find) { results.hidden = true; search.value = ""; selectNode(t.dataset.find, true); return; }
  if(t.hasAttribute('data-crumb')){const i=Number(t.dataset.crumb);state.path=state.path.slice(0,i+1);state.steps=state.steps.slice(0,i);state.hover=null;selectNode(state.path[i],true);return;}
  if(t.dataset.route){followEdge(t.dataset.route,t.dataset.from);return;}
  if (t.dataset.open) { selectNode(t.dataset.open, true); return; }
  if (t.dataset.follow) { follow(t.dataset.follow); return; }
  if (t.dataset.edge2) { selectEdge(t.dataset.edge2); }
});

let drag = null, moved = false, pointers = new Map(), pinch = null;
svg.addEventListener("pointerdown", ev => {
  svg.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId, [ev.clientX, ev.clientY]);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), k: cam.k, cx:(a[0]+b[0])/2, cy:(a[1]+b[1])/2, tx:cam.tx, ty:cam.ty };
  }
  drag = { x: ev.clientX, y: ev.clientY, tx: cam.tx, ty: cam.ty, yaw:state.yaw, pitch:state.pitch, pan:!state.depth||ev.shiftKey||ev.button===2 }; moved = false;
});
svg.addEventListener("pointermove", ev => {
  if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, [ev.clientX, ev.clientY]);
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    const nk = clampK(pinch.k * (d / pinch.d));
    const cxs = (a[0] + b[0]) / 2 - svg.getBoundingClientRect().left, cys = (a[1] + b[1]) / 2 - svg.getBoundingClientRect().top;
    const dx=(a[0]+b[0])/2-pinch.cx,dy=(a[1]+b[1])/2-pinch.cy;
    const wx=(cxs-pinch.tx)/pinch.k,wy=(cys-pinch.ty)/pinch.k;
    cam = { k: nk, tx: cxs-wx*nk+dx, ty: cys-wy*nk+dy }; moved = true; render(); return;
  }
  if (drag) {
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    if(drag.pan){cam = { ...cam, tx: drag.tx + dx, ty: drag.ty + dy };}
    else {state.yaw=Math.max(-3.14,Math.min(3.14,drag.yaw+dx*.005));state.pitch=Math.max(.22,Math.min(1.22,drag.pitch-dy*.004));}
    render(); return;
  }
  const el = document.elementFromPoint(ev.clientX, ev.clientY);
  const id = el && el.getAttribute && el.getAttribute("data-node");
  if (id !== state.hover) { state.hover = id || null; kbIndex = 0; render(); }
});
function endPointer(ev) {
  pointers.delete(ev.pointerId);
  if (pointers.size < 2) pinch = null;
  if (drag && moved && state.depth && !drag.pan) writeUrl(false);
  if (drag && !moved) {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const nid = el && el.getAttribute && el.getAttribute("data-node");
    const eid = el && el.getAttribute && el.getAttribute("data-edge");
    if (nid) selectNode(nid, false); else if (eid) selectEdge(eid);
  }
  drag = null;
}
svg.addEventListener("pointerup", endPointer);
svg.addEventListener("pointercancel", () => {pointers.clear();pinch=null;drag=null;});
svg.addEventListener("contextmenu",ev=>ev.preventDefault());
svg.addEventListener("pointerleave",()=>{if(!drag){state.hover=null;render();}});
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect(), sx = ev.clientX - r.left, sy = ev.clientY - r.top;
  const [wx, wy] = s2w(sx, sy);
  const nk = clampK(cam.k * Math.pow(1.0015, -ev.deltaY));
  cam = { k: nk, tx: sx - wx * nk, ty: sy - wy * nk }; render();
}, { passive: false });

document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT" || ev.target.closest("button,a,textarea")) return;
  const fid = focusId(); if (!fid) return;
  const cs = candidates(fid);
  if (ev.key === "ArrowRight" || ev.key === "ArrowDown") { kbIndex = (kbIndex + 1) % Math.max(1, cs.length); render(); ev.preventDefault(); }
  else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") { kbIndex = (kbIndex - 1 + cs.length) % Math.max(1, cs.length); render(); ev.preventDefault(); }
  else if (ev.key === "Enter") { const e = cs[kbIndex]; if (e) followEdge(e.id,fid); ev.preventDefault(); }
  else if (ev.key === "Backspace") { document.getElementById("back").click(); ev.preventDefault(); }
  else if (ev.key === "Escape") { state.sel = null; writeUrl(true); render(); }
});

window.addEventListener("resize", () => render());
window.addEventListener("popstate", () => { readUrl(); lensSel.value = state.lens; go(state.path.length?fitNodes(state.path):selNodeId()?centerOn(byId.get(selNodeId())):fit()); });

document.getElementById("origin").textContent = DATA.origin.label + " · " + DATA.origin.nodeCount + " ilmiötä · " + DATA.origin.edgeCount + " yhteyttä";
readUrl(); lensSel.value = state.lens; writeUrl(false);
requestAnimationFrame(() => {
  const r = svg.getBoundingClientRect(); W = r.width; H = r.height;
  const nid = selNodeId();
  cam = state.path.length ? fitNodes(state.path) : nid && byId.has(nid) ? centerOn(byId.get(nid)) : fit();
  render();
});

}
function validateData(d){
 if(!d||!Array.isArray(d.nodes)||!Array.isArray(d.edges)||!Array.isArray(d.lenses)||!d.nodes.length||!d.bounds)throw Error('JSON-aineiston rakenne ei ole kelvollinen.');
 const ids=new Set(d.nodes.map(n=>n.id));
 if(ids.size!==d.nodes.length||d.nodes.some(n=>!n.pos||!Number.isFinite(n.pos.x)||!Number.isFinite(n.pos.y)))throw Error('Solmujen tunnisteissa tai sijainneissa on virhe.');
 if(d.edges.some(e=>!ids.has(e.from)||!ids.has(e.to))||new Set(d.edges.map(e=>e.id)).size!==d.edges.length)throw Error('Yhteyksien tunnisteissa tai kohteissa on virhe.');
}
let initialized=false;
async function boot(data){if(initialized)return;validateData(data);await start(data);initialized=true;}
function loadError(e){document.getElementById('loadmessage').textContent='Aineistoa ei voitu avata. Sijoita HTML ja murrosverkosto.json samaan verkkokansioon, tai valitse JSON-tiedosto alta. '+e.message;}
document.querySelectorAll('header input,header select,footer button,.controls button').forEach(el=>el.disabled=true);
document.getElementById('datafile').onchange=async ev=>{try{const file=ev.target.files[0];if(file)await boot(JSON.parse(await file.text()));}catch(e){loadError(e);}};
if(location.protocol==='file:')loadError(new Error('Paikallisesti avattaessa valitse aineistotiedosto.'));
else fetch(new URL('murrosverkosto.json',location.href)).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json();}).then(boot).catch(loadError);
</script>
