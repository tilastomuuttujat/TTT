<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTT · Moderni artikkeli</title>
<meta name="description" content="TTT-artikkelin moderni rinnakkaisversio.">
<meta name="theme-color" content="#ff5a36">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#101010;--paper:#f7f5ef;--card:#fff;--hot:#ff5a36;--lime:#d9ff55;--lav:#d9d0ff;--sky:#bfe9ff;--line:#171717;--muted:#696963;--radius:28px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif}a{color:inherit}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px clamp(18px,4vw,56px);background:rgba(247,245,239,.94);border-bottom:2px solid var(--line);backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:10px;font:800 17px Manrope,sans-serif;text-decoration:none}.brandmark{display:grid;place-items:center;width:38px;height:38px;border:2px solid var(--ink);border-radius:50%;background:var(--lime)}.topactions{display:flex;align-items:center;gap:10px}.pill,.copy{border:2px solid var(--ink);border-radius:999px;background:var(--card);padding:10px 15px;font:700 12px Manrope,sans-serif;text-decoration:none;cursor:pointer}.copy{background:var(--ink);color:#fff}.copy.copied{background:var(--lime);color:var(--ink)}
.hero{min-height:72vh;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:40px;align-items:end;padding:clamp(60px,9vw,130px) clamp(20px,6vw,90px) 70px;border-bottom:2px solid var(--line);background:var(--hot)}.hero-copy{max-width:1000px}.eyebrow{display:inline-flex;padding:9px 14px;border:2px solid var(--ink);border-radius:999px;background:var(--lime);font:800 11px Manrope,sans-serif;letter-spacing:.08em;text-transform:uppercase}.hero h1{margin:24px 0 0;font:800 clamp(3.4rem,9vw,9rem)/.86 Manrope,sans-serif;letter-spacing:-.075em}.hero h1 em{display:block;font-style:normal;color:#fff}.dek{max-width:760px;margin:30px 0 0;font-size:clamp(1.2rem,2vw,1.65rem);line-height:1.42}.hero-side{display:grid;gap:14px;align-self:stretch;align-content:end}.fact{padding:22px;border:2px solid var(--ink);border-radius:var(--radius);background:var(--card);box-shadow:7px 7px 0 var(--ink)}.fact:nth-child(2){background:var(--lav)}.fact b{display:block;font:800 12px Manrope,sans-serif;text-transform:uppercase;letter-spacing:.08em}.fact span{display:block;margin-top:8px;font-size:1.05rem;line-height:1.4}
.layout{display:grid;grid-template-columns:260px minmax(0,760px);gap:70px;max-width:1160px;margin:auto;padding:70px 28px 130px}.rail{position:sticky;top:92px;align-self:start}.rail-label{margin:0 0 14px;font:800 11px Manrope,sans-serif;letter-spacing:.12em;text-transform:uppercase}.infographic{display:block;width:100%;padding:0;border:2px solid var(--ink);border-radius:22px;overflow:hidden;background:var(--card);cursor:zoom-in}.infographic img{display:block;width:100%}.infographic span{display:flex;justify-content:space-between;padding:12px 14px;font:800 10px Manrope,sans-serif}.toc{margin-top:26px;border-top:2px solid var(--ink)}.toc a{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:12px 2px;border-bottom:1px solid rgba(0,0,0,.22);font-size:12px;line-height:1.35;text-decoration:none}.toc a:hover{font-weight:700}.prose{min-width:0}.prose>p,.prose section>p{margin:0 0 1.45em;font-size:1.16rem;line-height:1.75}.prose>.lead{font-size:1.45rem;line-height:1.58}.prose section{padding-top:82px;scroll-margin-top:60px}.section-num{display:inline-grid;place-items:center;min-width:46px;height:30px;padding:0 10px;border:2px solid var(--ink);border-radius:999px;background:var(--sky);font:800 11px Manrope,sans-serif}.prose h2{margin:16px 0 30px;font:800 clamp(2.3rem,5vw,4.3rem)/.98 Manrope,sans-serif;letter-spacing:-.055em}.bullets{margin:38px 0;padding:28px 34px;border:2px solid var(--ink);border-radius:var(--radius);background:var(--lime);box-shadow:7px 7px 0 var(--ink)}.bullets li{margin:.8em 0;line-height:1.5}blockquote{margin:45px 0;padding:30px;border:2px solid var(--ink);border-radius:var(--radius);background:var(--lav);font:700 1.45rem/1.45 Manrope,sans-serif;letter-spacing:-.02em}.closing{background:var(--ink);color:#fff}
.viz-card{margin:55px 0;padding:28px;border:2px solid var(--ink);border-radius:var(--radius);background:var(--card);box-shadow:7px 7px 0 var(--ink)}.viz-card h3{margin:0 0 12px;font:800 1.7rem/1.05 Manrope,sans-serif}.viz-card p{margin:0!important;font-size:.98rem!important;line-height:1.55!important}.viz-steps{display:grid;gap:10px;margin-top:20px}.viz-step{padding:15px 17px;border:2px solid var(--ink);border-radius:16px;background:var(--paper)}.viz-step b{display:block;font:800 12px Manrope,sans-serif}.viz-step span{display:block;margin-top:4px;font-size:13px;line-height:1.45}.viz-step:nth-child(2n){background:var(--sky)}
.lightbox{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:28px;background:rgba(0,0,0,.86)}.lightbox.open{display:grid}.lightbox img{max-width:min(94vw,1100px);max-height:90vh}.lightbox button{position:fixed;right:22px;top:20px;width:46px;height:46px;border:2px solid #fff;border-radius:50%;background:#000;color:#fff;font-size:24px;cursor:pointer}.status{padding:80px;text-align:center;font:700 16px Manrope,sans-serif}.status.error{color:#a00}footer{display:flex;justify-content:space-between;gap:20px;padding:35px clamp(20px,6vw,90px);border-top:2px solid var(--ink);background:var(--lime);font:800 11px Manrope,sans-serif;letter-spacing:.08em}
@media(max-width:850px){.hero{grid-template-columns:1fr;min-height:auto}.hero-side{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr;gap:35px}.rail{position:static;display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:25px}.toc{margin-top:0}}
@media(max-width:580px){.topbar{padding:12px 14px}.pill{display:none}.hero{padding:65px 18px 48px}.hero h1{font-size:clamp(3.2rem,17vw,5.5rem)}.hero-side{grid-template-columns:1fr}.layout{padding:40px 17px 90px}.rail{grid-template-columns:1fr}.infographic{max-width:220px}.prose>p,.prose section>p{font-size:1.08rem}.prose>.lead{font-size:1.28rem}.prose section{padding-top:62px}footer{flex-direction:column}}
</style>
</head>
<body id="alku">
<header class="topbar"><a class="brand" href="./"><span class="brandmark">T</span><span>TTT</span></a><div class="topactions"><a class="pill" href="./artikkeli.html">KLASSINEN NÄKYMÄ</a><button class="copy" id="copy-link" type="button">KOPIOI LINKKI</button></div></header>
<main id="app" class="hidden"><section class="hero"><div class="hero-copy"><div class="eyebrow" id="kicker"></div><h1 id="title"></h1><p class="dek" id="subtitle"></p></div><div class="hero-side"><div class="fact"><b>Lukuaika</b><span id="reading-time">—</span></div><div class="fact"><b>Ajatus</b><span>Yksi pitkä teksti. Selkeä rytmi. Vähemmän käyttöliittymää, enemmän sisältöä.</span></div></div></section><div class="layout"><aside class="rail"><div><p class="rail-label">Infografiikka</p><div id="infographic-slot"></div></div><div><p class="rail-label">Sisältö</p><nav class="toc" id="toc"></nav></div></aside><article class="prose" id="article-content"></article></div></main>
<p id="status" class="status">Ladataan kirjoitusta…</p><div class="lightbox" id="lightbox"><img id="large" alt=""><button id="close" type="button">×</button></div><footer><span>TTT · TAAKKA · TOTUUS · TEKO</span><a href="#alku">TAKAISIN ALKUUN ↑</a></footer>
<script>
(()=>{'use strict';const DATA='./kirjoitukset.json',VIZ='./artikkeli-visualisoinnit.json',DEFAULT='siilot-ja-sisapiirit';const requested=new URLSearchParams(location.search).get('id')||DEFAULT,$=id=>document.getElementById(id),txt=v=>document.createTextNode(v==null?'':String(v)),el=(t,c,v)=>{const n=document.createElement(t);if(c)n.className=c;if(v!=null)n.append(txt(v));return n};const asset=v=>{if(!v)return'';const s=/^(?:https?:\/\/|images\/|\.\/images\/)/.test(v)?v:`./images/${String(v).replace(/^\/+/, '')}`;return new URL(s,location.href).href};function paras(to,list,lead=false){(list||[]).forEach((p,i)=>to.append(el('p',lead&&i===0?'lead':'',p)))}function info(a){const slot=$('infographic-slot');if(!a.image)return;const b=el('button','infographic'),im=document.createElement('img');im.src=asset(a.image);im.alt=a.imageAlt||a.title;b.append(im,el('span','', 'AVAA KOKO KUVA ↗'));slot.append(b);const box=$('lightbox'),large=$('large');large.src=im.src;large.alt=im.alt;b.onclick=()=>box.classList.add('open');$('close').onclick=()=>box.classList.remove('open');box.onclick=e=>{if(e.target===box)box.classList.remove('open')}}function simpleViz(cfg){const box=el('aside','viz-card');box.append(el('h3','',cfg.title||cfg.eyebrow||'Tutki mekanismia'));if(cfg.intro)box.append(el('p','',cfg.intro));const steps=cfg.steps||cfg.points||[];if(steps.length){const list=el('div','viz-steps');steps.slice(0,8).forEach((s,i)=>{const row=el('div','viz-step');row.append(el('b','',s.title||s.year||s.label||`Vaihe ${i+1}`),el('span','',s.text||''));list.append(row)});box.append(list)}if(cfg.takeaway)box.append(el('blockquote','',cfg.takeaway));return box}function apply(a,v){const entries=Array.isArray(v)?v:(v&&v.articles)||[],entry=entries.find(x=>x&&(x.id===a.id||x.slug===a.slug));if(entry&&entry.sections)(a.sections||[]).forEach(s=>{const x=entry.sections[s.id];if(x)s.visualizations=[...(s.visualizations||[]),...(Array.isArray(x)?x:[x])]});return a}function render(a){document.title=`${a.title} · TTT`;$('kicker').textContent=(a.tags||[]).join(' · ');$('subtitle').textContent=a.subtitle||'';$('reading-time').textContent=a.readingTime||'—';const h=$('title'),parts=a.titleParts||[a.title];h.append(txt(parts[0]||a.title));if(parts[1])h.append(el('em','',parts[1]));const content=$('article-content'),toc=$('toc');paras(content,a.intro,true);(a.sections||[]).forEach((s,i)=>{const id=s.id||`osa-${i+1}`,num=String(i+1).padStart(2,'0'),link=el('a');link.href=`#${id}`;link.append(el('span','',num),txt(s.title));toc.append(link);const sec=el('section');sec.id=id;sec.append(el('span','section-num',num),el('h2','',s.title));paras(sec,s.paragraphs);if(s.bullets?.length){const ul=el('ul','bullets');s.bullets.forEach(x=>ul.append(el('li','',x)));sec.append(ul)}if(s.quote)sec.append(el('blockquote',s.closing?'closing':'',s.quote));content.append(sec);const vs=Array.isArray(s.visualizations)?s.visualizations:(s.visualization?[s.visualization]:[]);vs.forEach(v=>content.append(simpleViz(v)))});info(a);$('status').classList.add('hidden');$('app').classList.remove('hidden')}$('copy-link').onclick=async()=>{try{await navigator.clipboard.writeText(location.href.split('#')[0]);const b=$('copy-link');b.textContent='KOPIOITU';b.classList.add('copied');setTimeout(()=>{b.textContent='KOPIOI LINKKI';b.classList.remove('copied')},1500)}catch{}};Promise.all([fetch(DATA,{cache:'no-store'}).then(r=>r.json()),fetch(VIZ,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)]).then(([d,v])=>{const arr=Array.isArray(d)?d:d.kirjoitukset,a=arr.find(x=>x.id===requested||x.slug===requested);if(!a)throw Error('Kirjoitusta ei löytynyt');render(apply(a,v))}).catch(e=>{$('status').classList.add('error');$('status').textContent=`Lataus epäonnistui: ${e.message}`})})();
</script>
</body></html>
