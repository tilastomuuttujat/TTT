<head>

<style>
:root{--ink:#142d27;--dark:#122722;--teal:#087f77;--orange:#c66a2b;--red:#b94335;--paper:#fff;--bg:#edf1ef;--line:#d7e0dd;--muted:#687873}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.45 Arial,sans-serif;background-color:var(--bg);background-image:linear-gradient(#d9e0dd55 1px,transparent 1px),linear-gradient(90deg,#d9e0dd55 1px,transparent 1px);background-size:28px 28px}button,select,input{font:inherit}button{cursor:pointer}header{height:76px;padding:12px 24px;display:flex;align-items:center;gap:14px;color:#f5fbf8;background:var(--dark);border-bottom:3px solid #d07834}.logo{width:44px;height:44px;display:grid;place-items:center;border:1px solid #4f6a63;font:700 24px Georgia}.brand small,.kicker{display:block;font-size:11px;font-weight:800;letter-spacing:.17em;color:#91aaa3}.brand h1{margin:2px 0 0;font:700 21px Georgia}.status{margin-left:auto;color:#bdd0ca;font-size:13px}.status:before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:#46b89b}.reset{margin-left:12px;border:1px solid #49625b;background:transparent;color:#e4eeeb;padding:8px 11px}.scenario{min-height:72px;padding:12px 24px;display:grid;grid-template-columns:150px minmax(200px,420px) 1fr;gap:16px;align-items:center;background:#fff;border-bottom:1px solid var(--line)}.year{display:flex;align-items:baseline;gap:12px}.year span{font-size:12px;font-weight:700;color:var(--muted)}.year b{font:700 25px Georgia;color:#b45d26}input[type=range]{width:100%;accent-color:var(--teal)}.scenario input{accent-color:var(--orange)}.presets{display:flex;gap:7px;justify-content:flex-end;overflow:auto}.presets button{white-space:nowrap;border:1px solid #d4dfdb;background:#f8faf9;color:#354b44;padding:8px 10px;font-size:12px;font-weight:700}.workspace{max-width:1720px;margin:auto;padding:14px;display:grid;grid-template-columns:minmax(300px,345px) minmax(520px,1fr) minmax(280px,330px);gap:14px;align-items:start}.panel{min-height:690px;padding:20px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 30px #17352c0c}.panel-head{display:flex;justify-content:space-between;gap:12px}.kicker{color:#6d7e79}.panel h2{margin:5px 0 0;font:700 24px Georgia}.count{align-self:start;padding:7px 8px;background:#edf4f1;color:var(--teal);font:700 13px monospace}.intro{color:var(--muted);font-size:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#edf2f0;padding:3px;margin:15px 0}.tabs button{border:0;background:transparent;padding:8px;font-size:12px;font-weight:700;color:#64736e}.tabs button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px #1232}.control{padding:12px;margin:11px 0;background:#f8faf9;border-left:3px solid var(--c,#087f77)}.control-row{display:flex;align-items:center;gap:9px;margin-bottom:7px}.icon{width:27px;height:27px;display:grid;place-items:center;background:#e5efec;color:var(--c);font-weight:800}.control strong{font-size:13px}.control small{display:block;color:#87928f;font:10px monospace}.value{margin-left:auto;min-width:43px;padding:4px 6px;text-align:center;background:#e7ecea;color:#5f6c68;font:700 12px monospace}.value.pos{color:#08776f;background:#e2f1ed}.value.neg{color:var(--red);background:#f8e8e5}.ends{display:flex;justify-content:space-between;color:#8a9692;font-size:10px}.detail-list{max-height:505px;overflow:auto;padding-right:5px}.selector{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.selector label{width:min(300px,44%);font-size:10px;font-weight:800;color:#70807a;letter-spacing:.08em;text-transform:uppercase}.selector select{display:block;width:100%;margin-top:5px;padding:9px;border:1px solid #cfdad6;background:#f8faf9;color:#263d37;font-size:12px;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(4,1fr);margin:20px 0;border:1px solid var(--line)}.metric{padding:13px;border-right:1px solid var(--line);background:#fafcfb}.metric:last-child{border:0}.metric span,.metric small{display:block;font-size:10px;color:#71807b}.metric b{display:block;margin:4px 0;font:700 23px Georgia}.metric.good b{color:var(--teal)}.metric.bad b{color:var(--red)}.legend{display:flex;gap:18px;color:#65736e;font-size:11px}.legend i{display:inline-block;width:19px;margin-right:6px;border-top:2px dashed #87928f}.legend i.sc{border-top:3px solid var(--teal)}.legend em{margin-left:auto;font-style:normal}.chart-wrap{position:relative;height:410px;margin-top:12px}.chart-wrap svg{width:100%;height:100%;overflow:visible}.axis{stroke:#dbe1df;stroke-dasharray:2 5}.base-line{fill:none;stroke:#87928f;stroke-width:2;stroke-dasharray:5 6}.scenario-line{fill:none;stroke:var(--teal);stroke-width:3}.band{fill:#087f7718}.reform{stroke:var(--orange);stroke-dasharray:3 4}.chart-label{font-size:11px;fill:#65716e}.chart-note{display:flex;gap:10px;padding:13px;border-top:1px solid var(--line);font-size:12px;color:#62716c}.chart-note b{color:#304942}.empty{min-height:450px;display:grid;place-content:center;text-align:center;color:var(--muted)}.empty .orb{width:110px;height:110px;margin:auto;display:grid;place-items:center;border:1px solid #b8ccc5;border-radius:50%;font:700 28px Georgia;color:var(--teal)}.empty h3{font:700 20px Georgia;color:var(--ink);margin:20px 0 6px}.direction{display:flex;gap:12px;padding:14px;margin:20px 0;background:#eef8f4;border:1px solid #cfe0da}.direction.down{background:#fff2ef;border-color:#efd3cd}.direction .arrow{font-size:28px;color:var(--teal)}.direction.down .arrow{color:var(--red)}.direction span,.direction small{display:block;color:#64736e;font-size:10px}.direction b{display:block;margin:3px 0;font:700 20px Georgia}.contributors h3,.chain h3{font:700 15px Georgia}.contributor{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid #dfe6e3}.contributor strong{display:block;font-size:12px}.contributor small{color:#74817d}.chain{margin-top:20px;padding:14px;background:#edf2f0}.chain div{display:flex;justify-content:space-between;font-size:10px;font-weight:800;text-transform:uppercase}.chain p,.method{font-size:10px;color:#6c7975}.method{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}footer{display:flex;justify-content:space-between;padding:12px 24px;background:var(--dark);color:#8da59e;font-size:10px}.loading{min-height:100vh;display:grid;place-content:center;text-align:center;color:#49635b}
@media(max-width:1180px){.workspace{grid-template-columns:310px 1fr}.insight{grid-column:1/-1;min-height:0}.scenario{grid-template-columns:150px 1fr}.presets{grid-column:1/-1;justify-content:flex-start}}@media(max-width:760px){header{padding:10px 14px}.status{display:none}.brand h1{font-size:18px}.scenario{padding:12px 14px;grid-template-columns:125px 1fr}.presets{grid-column:1/-1}.workspace{grid-template-columns:1fr;padding:8px}.panel{min-height:0;padding:16px}.selector{display:block}.selector label{display:block;width:100%;margin-top:14px}.metrics{grid-template-columns:1fr 1fr}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}.legend em{display:none}footer{flex-direction:column;gap:4px}}
</style>
</head>
<body><div id="app" class="loading"><b>Ladataan Murrosmatriisin laskentamallia…</b></div>
<script>
const API='https://zzbubbrsgiqsvsovkkmf.supabase.co',KEY='sb_publishable_YNqxZI4Oj-DSjVBoTKhQ2Q_4DchUIBb';
const GROUPS=[{key:'work',label:'Työmarkkinat',icon:'T',color:'#087f77',matches:['työmarkkinat']},{key:'security',label:'Sosiaaliturva',icon:'S',color:'#2470a0',matches:['sosiaaliturva','sosiaalipalvelut','verotus']},{key:'housing',label:'Asuminen',icon:'A',color:'#c66a2b',matches:['asuminen']},{key:'future',label:'Koulutus & perhe',icon:'K',color:'#7558a6',matches:['koulutus','perhepolitiikka']}];
const NAMES={'safe_corridor.arope_25_29':'Köyhyys- tai syrjäytymisriski · 25–29','safe_corridor.employment_rate_25_29':'Työllisyysaste · 25–29','safe_corridor.employment_rate_30_34':'Työllisyysaste · 30–34','safe_corridor.fertility_rate_25_29':'Hedelmällisyys · 25–29','safe_corridor.fertility_rate_30_34':'Hedelmällisyys · 30–34','safe_corridor.housing_cost_overburden_25_29':'Asumiskustannusrasitus · 25–29','safe_corridor.leaving_parental_home_age':'Kotoamuuttoikä','safe_corridor.living_with_parents_25_29':'Vanhempien kanssa asuvat · 25–29','safe_corridor.long_term_unemployment_share_25_29':'Pitkäaikaistyöttömyys · 25–29','safe_corridor.long_term_unemployment_share_30_34':'Pitkäaikaistyöttömyys · 30–34','safe_corridor.unemployment_rate_25_29':'Työttömyysaste · 25–29','safe_corridor.unemployment_rate_30_34':'Työttömyysaste · 30–34'};
const PRESETS={balance:{employment_services:45,vocational_education:35,student_aid:30,rental_housing_supply:35,unemployment_security:25,early_childhood_education:30},work:{employment_services:65,vocational_education:55,employment_contracts:35,collective_agreements:25,income_tax:25},pressure:{unemployment_security:-45,student_aid:-40,rental_housing_supply:-35,social_services:-30,early_childhood_education:-25}};
let levers=[],effects=[],baselines=[],norms={},values={},reformYear=2027,selected='safe_corridor.arope_25_29',tab='groups',scenario={};
const fmt=n=>new Intl.NumberFormat('fi-FI',{minimumFractionDigits:1,maximumFractionDigits:1}).format(n||0),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function weight(y,start,min,max,d){const a=y-start;if(a<min)return 0;if(a<=max)return max===min?1:Math.min(1,(a-min+1)/(max-min+1));if(a<=max+d)return Math.max(0,1-(a-max)/d);return 0}
function groupItems(g){return levers.filter(l=>g.matches.some(m=>l.policy_area.includes(m)))}function groupValue(g){const a=groupItems(g);return a.length?Math.round(a.reduce((s,l)=>s+(values[l.lever_key]||0),0)/a.length):0}
function calculate(){scenario={};baselines.forEach(b=>{let delta=0;effects.forEach(e=>{if(e.series_key!==b.series_key)return;const i=(values[e.lever_key]||0)/100;delta+=i*e.effect_direction*(norms[e.series_key]||1)*+e.relative_strength*+e.implementation_coefficient*weight(+b.year,reformYear,+e.lag_min_years,+e.lag_max_years,+e.persistence_years)*10});const score=+b.score_0_100,s=Math.max(0,Math.min(100,score+delta));(scenario[b.series_key]||=[]).push({...b,score,delta,scenario:s,lo:Math.max(0,s-Math.abs(delta)*.35),hi:Math.min(100,s+Math.abs(delta)*.35)})})}
function val(n){return `<output class="value ${n>0?'pos':n<0?'neg':''}">${n>0?'+':''}${Math.abs(n)<10?fmt(n):Math.round(n)}</output>`}function head(step,title,side=''){return `<div class="panel-head"><div><span class="kicker">${step}</span><h2>${esc(title)}</h2></div>${side?`<b class="count">${side}</b>`:''}</div>`}
function chart(data){const W=800,H=380,L=42,R=15,T=15,B=32,x=y=>L+(y-2025)/(2050-2025)*(W-L-R),yy=v=>T+(100-v)/100*(H-T-B),pts=k=>data.map(p=>`${x(+p.year)},${yy(p[k])}`).join(' '),band=data.map(p=>`${x(+p.year)},${yy(p.hi)}`).concat(data.slice().reverse().map(p=>`${x(+p.year)},${yy(p.lo)}`)).join(' ');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Perusuran ja säädösskenaarion kuvaaja">${[0,25,50,75,100].map(v=>`<line class="axis" x1="${L}" x2="${W-R}" y1="${yy(v)}" y2="${yy(v)}"/><text class="chart-label" x="4" y="${yy(v)+4}">${v}</text>`).join('')}<polygon class="band" points="${band}"/><polyline class="base-line" points="${pts('score')}"/><polyline class="scenario-line" points="${pts('scenario')}"/><line class="reform" x1="${x(reformYear)}" x2="${x(reformYear)}" y1="${T}" y2="${H-B}"/><text class="chart-label" x="${x(reformYear)+5}" y="28">muutos</text>${[2025,2030,2035,2040,2045,2050].map(v=>`<text class="chart-label" text-anchor="middle" x="${x(v)}" y="${H-6}">${v}</text>`).join('')}</svg>`}
function render(){calculate();const active=Object.values(values).filter(Boolean).length,data=scenario[selected]||[],end=data.at(-1)||{},peak=data.reduce((a,p)=>!a||Math.abs(p.delta)>Math.abs(a.delta)?p:a,null)||{},series=[...new Set(effects.map(e=>e.series_key))].sort((a,b)=>(NAMES[a]||a).localeCompare(NAMES[b]||b,'fi'));const core=[...new Set(effects.filter(e=>e.include_in_composite).map(e=>e.series_key))],comp=[];for(let y=2025;y<=2050;y++){const ps=core.map(k=>(scenario[k]||[]).find(p=>+p.year===y)).filter(Boolean);comp.push({year:y,baseline:ps.reduce((s,p)=>s+p.score,0)/(ps.length||1),scenario:ps.reduce((s,p)=>s+p.scenario,0)/(ps.length||1)})}const cp=comp.reduce((a,p)=>Math.abs(p.scenario-p.baseline)>Math.abs(a.scenario-a.baseline)?p:a,comp[0]);const cs=effects.filter(e=>e.series_key===selected&&(values[e.lever_key]||0)).map(e=>({...e,impact:(values[e.lever_key]/100)*e.effect_direction*(norms[e.series_key]||1)*+e.relative_strength*+e.implementation_coefficient*weight(+peak.year,reformYear,+e.lag_min_years,+e.lag_max_years,+e.persistence_years)*10})).sort((a,b)=>Math.abs(b.impact)-Math.abs(a.impact));
document.getElementById('app').className='shell';document.getElementById('app').innerHTML=`<header><div class="logo">M</div><div class="brand"><small>MURROSMATRIISI</small><h1>Säädössimulaattori</h1></div><div class="status">Suomen säädös- ja indikaattoriaineisto · v1</div><button class="reset" data-action="reset">↻ Nollaa</button></header><section class="scenario"><div class="year"><span>Skenaarion alku</span><b>${reformYear}</b></div><input data-action="year" type="range" min="2025" max="2035" value="${reformYear}" aria-label="Skenaarion aloitusvuosi"><div class="presets"><button data-preset="balance">✦ Tasapainottava</button><button data-preset="work">Työhön kiinnittyminen</button><button data-preset="pressure">Heikkenevä turva</button></div></section><div class="workspace"><aside class="panel">${head('01 · VALINNAT','Mitä muutetaan?',`${active} / 12`)}<p class="intro">Nolla säilyttää perusuran. Oikealle siirtäminen vahvistaa turvaa tai toimintakykyä, vasemmalle heikentää sitä.</p><div class="tabs"><button data-tab="groups" class="${tab==='groups'?'active':''}">Neljä kokonaisuutta</button><button data-tab="detail" class="${tab==='detail'?'active':''}">Tarkat säädökset</button></div>${tab==='groups'?GROUPS.map(g=>{const n=groupValue(g);return `<div class="control" style="--c:${g.color}"><div class="control-row"><span class="icon">${g.icon}</span><strong>${g.label}</strong>${val(n)}</div><input type="range" min="-100" max="100" step="5" value="${n}" data-group="${g.key}" aria-label="${g.label}"><div class="ends"><span>heikentää</span><span>0</span><span>vahvistaa</span></div></div>`}).join(''):`<div class="detail-list">${levers.map(l=>{const n=values[l.lever_key]||0;return `<div class="control"><div class="control-row"><span><small>${esc(l.statute_id)}</small><strong>${esc(l.title)}</strong></span>${val(n)}</div><input type="range" min="-100" max="100" step="5" value="${n}" data-lever="${l.lever_key}"></div>`}).join('')}</div>`}</aside><section class="panel"><div class="selector">${head('02 · VAIKUTUSURA',NAMES[selected]||selected)}<label>Tarkasteltava mittari<select data-action="series">${series.map(k=>`<option value="${k}" ${k===selected?'selected':''}>${esc(NAMES[k]||k)}</option>`).join('')}</select></label></div><div class="metrics"><div class="metric"><span>Perusura 2050</span><b>${fmt(end.score)}</b><small>pistettä / 100</small></div><div class="metric ${end.delta>=0?'good':'bad'}"><span>Skenaario 2050</span><b>${fmt(end.scenario)}</b><small>${end.delta>=0?'+':''}${fmt(end.delta)} pistettä</small></div><div class="metric"><span>Suurin vaikutus</span><b>${peak.year||'—'}</b><small>${peak.delta>=0?'+':''}${fmt(peak.delta)} pistettä</small></div><div class="metric"><span>Kokonaiskuvan huippu</span><b>${cp.year}</b><small>${cp.scenario-cp.baseline>=0?'+':''}${fmt(cp.scenario-cp.baseline)} pistettä</small></div></div><div class="legend"><span><i></i>Perusura</span><span><i class="sc"></i>Skenaario</span><em>Varjostus = parametriepävarmuus ±35 %</em></div><div class="chart-wrap">${chart(data)}</div><div class="chart-note"><b>Korkeampi pistemäärä tarkoittaa turvallisempaa suuntaa.</b> Sarjat on suhteutettu Pohjoismaiden historialliseen vaihteluun. Perusura on vaimeneva trendiprojektio, ei ennuste.</div></section><aside class="panel insight">${head('03 · TULKINTA','Mistä ero syntyy?')}${active===0?`<div class="empty"><div class="orb">M</div><h3>Perusura on näkyvissä</h3><p>Valitse säädösvipu tai valmis lähtökohta. Näet täällä vaikutusketjun ja ajoituksen.</p></div>`:`<div class="direction ${peak.delta<0?'down':''}"><span class="arrow">${peak.delta>=0?'↗':'↘'}</span><div><span>Voimakkain poikkeama</span><b>${peak.delta>=0?'+':''}${fmt(peak.delta)} pistettä</b><small>vuonna ${peak.year}</small></div></div><div class="contributors"><h3>Vaikuttavat säädökset</h3>${cs.length?cs.slice(0,5).map(c=>`<div class="contributor"><div><strong>${esc(c.lever_title)}</strong><small>${c.relationship_type==='direct'?'suora':c.relationship_type==='indirect'?'välillinen':'tulos'} vaikutus · viive ${c.lag_min_years}–${c.lag_max_years} v</small></div>${val(c.impact)}</div>`).join(''):'<p>Valitut vivut eivät kohdistu tähän mittariin suoraan.</p>'}</div><div class="chain"><h3>Vaikutusketju</h3><div><span>Säädös</span><span>→</span><span>toimeenpano</span><span>→</span><span>viive</span><span>→</span><span>mittari</span></div><p>Toimeenpanokerroin vaimentaa vaikutusta, jos säädös on verkostoltaan kytkeytynyt tai delegoinniltaan syvä.</p></div>`}<p class="method"><b>Tämä on päätelmäsimulaatio.</b> Se näyttää oletettujen mekanismien seuraukset, ei todista yksittäisen lain aiheuttavan muutosta.</p></aside></div><footer><span>Murrosmatriisi · Suomen säädöskerros</span><span>12 säädösvipua · 46 vaikutuskytkentää · 2025–2050</span></footer>`;bind()}
function bind(){document.querySelectorAll('[data-group]').forEach(el=>el.oninput=e=>{const g=GROUPS.find(x=>x.key===e.target.dataset.group);groupItems(g).forEach(l=>values[l.lever_key]=+e.target.value);render()});document.querySelectorAll('[data-lever]').forEach(el=>el.oninput=e=>{values[e.target.dataset.lever]=+e.target.value;render()});document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=e=>{tab=e.target.dataset.tab;render()});document.querySelectorAll('[data-preset]').forEach(el=>el.onclick=e=>{values=Object.fromEntries(levers.map(l=>[l.lever_key,PRESETS[e.target.dataset.preset]?.[l.lever_key]||0]));render()});document.querySelector('[data-action=year]').oninput=e=>{reformYear=+e.target.value;render()};document.querySelector('[data-action=series]').onchange=e=>{selected=e.target.value;render()};document.querySelector('[data-action=reset]').onclick=()=>{values=Object.fromEntries(levers.map(l=>[l.lever_key,0]));reformYear=2027;render()}}
async function load(){try{const h={apikey:KEY,Authorization:`Bearer ${KEY}`},get=p=>fetch(API+'/rest/v1/'+p,{headers:h}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});[levers,effects,baselines,n]=await Promise.all([get('simulation_statute_levers?select=*&active=eq.true'),get('simulation_statute_effect_matrix?select=*'),get('simulation_indicator_baselines?select=series_key,year,raw_value,score_0_100,value_kind&order=year.asc'),get('simulation_normalization_params?select=series_key,favorable_direction')]);levers.sort((a,b)=>(a.metadata?.display_order||99)-(b.metadata?.display_order||99));norms=Object.fromEntries(n.map(x=>[x.series_key,+x.favorable_direction]));values=Object.fromEntries(levers.map(l=>[l.lever_key,0]));render()}catch(e){document.getElementById('app').innerHTML='<b>Tietoja ei saatu ladattua.</b><p>Tiedosto tarvitsee internet-yhteyden Murrosmatriisin julkisen aineiston lukemiseen.</p><button onclick="location.reload()">Yritä uudelleen</button>'}}load();
</script></body></html>
