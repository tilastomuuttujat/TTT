<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTT · Toimituksen nostot</title>
<meta name="description" content="TTT — esseitä, päättelyartikkeleita, visualisointeja ja yhteiskunnallisia pitkän aikavälin analyysejä.">
<meta name="theme-color" content="#f3f1eb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#10151d;--paper:#f3f1eb;--surface:#f8f6f0;--muted:#6e737b;--line:rgba(16,21,29,.14);--blue:#1e4bd1;--max:1320px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;text-rendering:optimizeLegibility}
a{color:inherit}.hidden{display:none!important}
.minimal-stage{min-height:100vh;display:grid;align-items:center;padding:54px 54px 54px 74px}
.minimal-featured{width:min(var(--max),100%);margin:auto}
.featured-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}
.featured-card{min-width:0}
.featured-card__media{overflow:hidden;background:#e3e0d8;border:1px solid var(--line)}
.featured-card__media img{display:block;width:100%;aspect-ratio:1.91/1;object-fit:cover}
.featured-card__body{display:block;padding:18px 2px 0;text-decoration:none}
.featured-card__meta{display:flex;align-items:center;gap:8px;color:#7b7a75;font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.featured-card__meta i{display:block;width:18px;height:1px;background:var(--line)}
.featured-card h3{margin:12px 0 8px;font:600 clamp(1.65rem,2.3vw,2.45rem)/1.02 "Source Serif 4",Georgia,serif;letter-spacing:-.035em}
.featured-card__ingress{display:block;margin:0 0 10px;color:#4f555d;font:400 12.5px/1.62 "DM Sans",system-ui,sans-serif}
.featured-card .desc{display:block;color:#777a7f;font-size:10px;line-height:1.5}
.featured-card__hint{display:inline-block;margin-top:14px;padding-bottom:3px;border-bottom:1px solid rgba(16,21,29,.35);font-size:8px;font-weight:700;letter-spacing:.1em}
.featured-card__body:hover h3,.featured-card__body:focus-visible h3{color:var(--blue)}
.featured-card__body:focus-visible{outline:2px solid var(--blue);outline-offset:6px}

.nav-tab{position:fixed;left:0;top:50%;z-index:1100;transform:translateY(-50%);width:31px;height:140px;border:0;background:var(--ink);color:#fff;writing-mode:vertical-rl;cursor:pointer;font:800 8px/1 system-ui;letter-spacing:.16em}
.nav-tab span{display:block;transform:rotate(180deg)}
.nav-shade{position:fixed;inset:0;z-index:900;background:rgba(15,18,22,.36);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s}
.nav-shade.open{opacity:1;pointer-events:auto}
.nav-drawer{position:fixed;inset:0 auto 0 0;z-index:1000;width:min(420px,90vw);background:var(--surface);transform:translateX(-102%);transition:transform .26s;box-shadow:18px 0 60px rgba(0,0,0,.14);overflow:auto}
.nav-drawer.open{transform:none}
.nav-drawer-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}
.nav-drawer-title{display:flex;align-items:center;gap:11px;font-size:9px;font-weight:800;letter-spacing:.13em}
.nav-drawer-title b{display:grid;place-items:center;width:36px;height:36px;background:var(--ink);color:#fff}
.nav-drawer-head button{width:40px;height:40px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:23px;cursor:pointer}
.nav-drawer-body{padding:20px 22px 34px}
.article-search{display:block;position:sticky;top:0;z-index:2;padding:0 0 16px;background:var(--surface)}
.article-search input{width:100%;height:46px;padding:0 14px;border:1px solid rgba(16,21,29,.28);background:#fff;color:var(--ink);font:600 12px/1 system-ui;outline:none}
.article-search input:focus{border-color:var(--ink)}
.article-search input::placeholder{color:#8b8984}
.article-index{border-top:1px solid var(--line)}
.article-index a{display:block;padding:15px 0 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.article-index a:hover .article-index-title{color:var(--blue)}
.article-index-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:5px;color:#8a8178;font-size:7.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.article-index-title{display:block;font:600 1.05rem/1.18 "Source Serif 4",Georgia,serif;letter-spacing:-.015em}
.article-index-ingress{display:block;margin-top:5px;color:#777a7f;font-size:9.5px;line-height:1.45}
.article-index-empty{padding:26px 0;color:#7c7a75;font-size:11px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

@media(max-width:950px){.minimal-stage{align-items:start;padding-top:42px}.featured-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.minimal-stage{padding:28px 18px 86px}.featured-grid{grid-template-columns:1fr;gap:36px}.featured-card h3{font-size:2rem}.nav-tab{top:auto;left:12px;bottom:14px;transform:none;width:48px;height:48px;border-radius:50%;writing-mode:horizontal-tb}.nav-tab span{font-size:0;transform:none}.nav-tab span:after{content:'☰';font-size:18px}.nav-drawer{width:min(92vw,390px)}}
@media(prefers-reduced-motion:reduce){.nav-drawer,.nav-shade{transition:none}}
</style>
</head>
<body>
<button class="nav-tab" id="nav-tab" type="button" aria-label="Avaa navigaatio" aria-expanded="false"><span>NAVIGOI · TTT</span></button>
<div class="nav-shade" id="shade" aria-hidden="true"></div>
<aside class="nav-drawer" id="drawer" aria-label="Artikkelihakemisto" aria-hidden="true">
  <div class="nav-drawer-head">
    <div class="nav-drawer-title"><b>TTT</b><span>ARTIKKELIT</span></div>
    <button id="nav-close" aria-label="Sulje navigaatio">×</button>
  </div>
  <div class="nav-drawer-body">
    <label class="article-search">
      <span class="sr-only">Hae artikkeleita</span>
      <input id="article-search-input" type="search" placeholder="Hae artikkeleita…" autocomplete="off">
    </label>
    <nav class="article-index" id="article-index" aria-label="Artikkelit"></nav>
    <div class="article-index-empty hidden" id="article-index-empty">Ei hakua vastaavia artikkeleita.</div>
  </div>
</aside>
<main class="minimal-stage" id="app">
  <section class="minimal-featured" aria-label="Toimituksen nostot">
    <div class="featured-grid" id="featured"></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=a=>a.slug||a.id;
const og=a=>(a.ogImage||a.image)?`./images/${encodeURIComponent(a.ogImage||a.image)}`:'';
const articleUrl=a=>`./reader.html?id=${encodeURIComponent(slug(a))}`;
const ingress=a=>a.ingress||(Array.isArray(a.intro)&&a.intro[0])||a.subtitle||'';
let allArticles=[];

function featuredCard(a){
  const tag=(a.tags||[])[0]||'ANALYYSI';
  return `<article class="featured-card">
    <div class="featured-card__media">${og(a)?`<img src="${og(a)}" alt="${esc(a.imageAlt||a.title||'')}">`:''}</div>
    <a class="featured-card__body" href="${articleUrl(a)}">
      <span class="featured-card__meta"><span>${esc(tag)}</span><i></i><span>${esc(a.readingTime||'')}</span></span>
      <h3>${esc(a.title)}</h3>
      <span class="featured-card__ingress">${esc(ingress(a))}</span>
      ${a.subtitle?`<span class="desc">${esc(a.subtitle)}</span>`:''}
      <span class="featured-card__hint">AVAA ARTIKKELI ↗</span>
    </a>
  </article>`;
}

function articleIndexItem(a){
  const tags=(a.tags||[]).slice(0,2).map(esc).join(' · ');
  return `<a href="${articleUrl(a)}">
    <span class="article-index-meta">${tags?`<span>${tags}</span>`:''}${a.readingTime?`<span>· ${esc(a.readingTime)}</span>`:''}</span>
    <span class="article-index-title">${esc(a.title)}</span>
    <span class="article-index-ingress">${esc(ingress(a))}</span>
  </a>`;
}

function renderIndex(list){
  $('#article-index').innerHTML=list.map(articleIndexItem).join('');
  $('#article-index-empty').classList.toggle('hidden',list.length>0);
}

const drawer=$('#drawer'),shade=$('#shade'),tab=$('#nav-tab');
function setDrawer(open){
  drawer.classList.toggle('open',open);
  shade.classList.toggle('open',open);
  drawer.setAttribute('aria-hidden',String(!open));
  shade.setAttribute('aria-hidden',String(!open));
  tab.setAttribute('aria-expanded',String(open));
  if(open)setTimeout(()=>$('#article-search-input')?.focus(),100);
}
tab.addEventListener('click',()=>setDrawer(!drawer.classList.contains('open')));
$('#nav-close').addEventListener('click',()=>setDrawer(false));
shade.addEventListener('click',()=>setDrawer(false));
addEventListener('keydown',e=>{if(e.key==='Escape')setDrawer(false)});

$('#article-search-input').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  renderIndex(!q?allArticles:allArticles.filter(a=>
    [a.title,a.subtitle,ingress(a),...(a.tags||[])].filter(Boolean).join(' ').toLowerCase().includes(q)
  ));
});

fetch('./kirjoitukset.json',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()})
  .then(d=>{
    allArticles=Array.isArray(d)?d:(d.kirjoitukset||[]);
    if(!allArticles.length)throw new Error('Kirjoituksia ei löytynyt');
    $('#featured').innerHTML=allArticles.slice(0,3).map(featuredCard).join('');
    renderIndex(allArticles);
  })
  .catch(e=>{
    $('#featured').innerHTML=`<div style="grid-column:1/-1;padding:30px;border:1px solid var(--line)">Julkaisun lataaminen epäonnistui: ${esc(e.message)}</div>`;
  });
</script>
</body>
</html>
