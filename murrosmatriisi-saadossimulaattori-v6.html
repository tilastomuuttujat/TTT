<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Murrosmatriisi · Säädössimulaattori v4</title>
<meta name="description" content="Säädösvalintojen vaikutukset nuorten aikuisten turvalliseen käytävään 2025–2050. Avoin laskentamalli, viivevaikutukset ja herkkyysanalyysi.">
<style>
:root{
  --ink:#10251f;--ink-2:#33504a;--dark:#0d201b;--dark-2:#12352d;
  --teal:#0a8a7f;--teal-deep:#066a62;--teal-soft:#e6f3ef;
  --sand:#c4662a;--red:#b23c2e;--plum:#302a3d;
  --paper:#fff;--bg:#eef2f0;--line:#d9e2de;--muted:#66807a;
  --r:14px;--r-sm:10px;
  --sh-1:0 1px 3px #12352c14,0 4px 16px #12352c0d;
  --sh-2:0 2px 8px #12352c14,0 18px 46px #12352c1a;
  --fd:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --fs:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fm:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:15px/1.55 var(--fs);
  background:radial-gradient(1200px 520px at 85% -10%,#d8e8e2 0,transparent 60%),var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background-image:linear-gradient(#c8d4cf5c 1px,transparent 1px),linear-gradient(90deg,#c8d4cf5c 1px,transparent 1px);
  background-size:32px 32px;
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0,#000 30%,transparent 100%);
          mask-image:radial-gradient(ellipse 90% 70% at 50% 0,#000 30%,transparent 100%)}
button,select,input{font:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:5px}
::selection{background:#0a8a7f33}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;
  padding:13px 24px;color:#f2faf6;
  background:linear-gradient(120deg,var(--dark) 0,var(--dark-2) 55%,#16473b 100%);
  border-bottom:3px solid var(--sand);box-shadow:0 8px 30px #0d201b55}
.logo{width:46px;height:46px;display:grid;place-items:center;flex:none;border:1.5px solid #4f7a6d;border-radius:12px;
  background:linear-gradient(145deg,#ffffff14,#ffffff05);font:700 25px var(--fd);color:#eaf6f0;
  box-shadow:inset 0 1px 0 #ffffff22,0 4px 10px #0003}
.brand small{display:block;font-size:10px;font-weight:800;letter-spacing:.22em;color:#8fb0a5}
.brand h1{margin:2px 0 0;font:700 21px var(--fd);letter-spacing:.01em}
.htools{margin-left:auto;display:flex;align-items:center;gap:8px}
.htools button{border:1px solid #4f7a6d;background:#ffffff12;color:#dcefe7;border-radius:9px;
  padding:8px 12px;font-size:11.5px;font-weight:700;letter-spacing:.03em;transition:.15s}
.htools button:hover{background:#ffffff22;color:#fff}
.htools .live{display:flex;align-items:center;gap:7px;color:#b7d0c8;font-size:11.5px;padding-right:4px}
.htools .live::before{content:"";width:8px;height:8px;border-radius:50%;background:#3ecf9f;box-shadow:0 0 0 4px #3ecf9f26}

/* scenario bar */
.scenario-bar{position:sticky;top:72px;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;
  padding:11px 24px;background:#ffffffe8;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);box-shadow:var(--sh-1)}
.sb-field{display:flex;align-items:center;gap:9px}
.sb-field label{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#6b7f79}
.sb-field select,.sb-field input[type=number]{border:1px solid var(--line);border-radius:9px;padding:7px 10px;
  background:var(--paper);color:var(--ink);font-size:13px;font-weight:600}
.presets{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 13px;
  font-size:11.5px;font-weight:700;color:var(--ink-2);transition:.15s}
.presets button:hover{border-color:var(--teal);color:var(--teal-deep);background:var(--teal-soft)}
.presets button.reset{color:var(--red);border-color:#eccfca}

/* layout */
.workspace{display:grid;grid-template-columns:360px minmax(0,1fr) 340px;gap:16px;padding:16px 24px 26px;align-items:start}
.panel{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:20px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.kicker{display:block;font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--sand)}
.panel-head h2{margin:3px 0 0;font:700 18px var(--fd)}
.count{font-family:var(--fm);font-size:11px;color:var(--muted);white-space:nowrap;padding-top:12px}

/* levers */
.tabs{display:flex;gap:4px;margin-bottom:14px;padding:4px;background:#f1f5f3;border-radius:11px}
.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-size:11px;font-weight:800;
  letter-spacing:.05em;color:#6b7f79;transition:.15s}
.tabs button.active{background:var(--paper);color:var(--ink);box-shadow:var(--sh-1)}
.group{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:10px;overflow:hidden}
.group>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 13px;background:#f7faf9}
.group>summary::-webkit-details-marker{display:none}
.g-icon{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:8px;color:#fff;font:700 13px var(--fd)}
.g-name{display:block;font-size:13px;font-weight:700}
.g-sub{display:block;font-size:10.5px;color:var(--muted)}
.g-val{margin-left:auto;font:700 13px var(--fm);font-variant-numeric:tabular-nums}
.g-val.pos{color:var(--teal-deep)}.g-val.neg{color:var(--red)}
.group[open]>summary{border-bottom:1px solid var(--line)}
.lever{padding:13px}
.lever+.lever{border-top:1px dashed #e5ece9}
.lever-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lever-top strong{font-size:12.8px;font-weight:700;line-height:1.3}
.lever-top .st{font:600 10px var(--fm);color:#9aa8a3}
.value{font:700 14px var(--fm);font-variant-numeric:tabular-nums;color:#8d9b96}
.value.pos{color:var(--teal-deep)}.value.neg{color:var(--red)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:6px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;
  background:linear-gradient(90deg,#f0d9d2 0,#e8eeeb 50%,#cfe8e0 100%)}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:linear-gradient(90deg,#f0d9d2,#e8eeeb 50%,#cfe8e0)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;margin-top:-6px;border-radius:50%;
  background:var(--paper);border:2px solid var(--teal-deep);box-shadow:0 2px 6px #0d201b33;cursor:grab}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--paper);
  border:2px solid var(--teal-deep);box-shadow:0 2px 6px #0d201b33;cursor:grab}
.lever-meta{display:flex;justify-content:space-between;gap:8px;margin-top:3px;font-size:10px;color:#8b9994}
.lever p{margin:7px 0 0;font-size:11.2px;line-height:1.55;color:#66766f}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:9px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;background:#f0ece4;color:#8a7550}
.badge.warn{background:#fbeee7;color:#a4551f}

/* chart panel */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r-sm);
  overflow:hidden;margin-bottom:16px;background:#fbfdfc}
.metric{padding:12px 13px;border-right:1px solid var(--line)}
.metric:last-child{border-right:0}
.metric span{display:block;font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#7c8d87}
.metric b{display:block;margin-top:4px;font:700 21px var(--fd);font-variant-numeric:tabular-nums}
.metric small{font-size:10.5px;color:var(--muted)}
.metric b.pos{color:var(--teal-deep)}.metric b.neg{color:var(--red)}
.selector{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.selector select{flex:1;min-width:220px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;
  background:var(--paper);font-size:13.5px;font-weight:600}
.series-nav{display:grid;grid-template-columns:40px minmax(190px,1fr) 40px;align-items:stretch;gap:7px;flex:1;min-width:260px}
.series-nav button{border:1px solid #cbd9d4;border-radius:9px;background:#f7faf9;color:var(--teal-deep);font-size:22px;font-weight:800;line-height:1;transition:background .15s,border-color .15s,transform .1s}
.series-nav button:hover{background:#e9f4f0;border-color:var(--teal)}.series-nav button:active{transform:scale(.95)}
.series-name{display:grid;place-items:center;min-height:40px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:12px;font-weight:800;text-align:center;line-height:1.25}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto}
.axis{stroke:#e2e8e5;stroke-dasharray:2 5}
.base-line{fill:none;stroke:#93a19c;stroke-width:2;stroke-dasharray:5 6;stroke-linejoin:round}
.scenario-line{fill:none;stroke:var(--teal);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 3px 6px #0a8a7f44)}
.band{fill:url(#bandGrad)}
.reform{stroke:var(--sand);stroke-width:1.5;stroke-dasharray:3 4}
.chart-label{font:600 11px var(--fs);fill:#6d7c76}
.dot{fill:var(--teal);stroke:#fff;stroke-width:2}
.crosshair{stroke:#9fb2ab;stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
.tip{position:absolute;display:none;min-width:170px;padding:10px 12px;pointer-events:none;z-index:5;
  background:#0e231eee;color:#e9f4ef;border-radius:10px;font-size:11.5px;line-height:1.55;box-shadow:0 10px 30px #0d201b55}
.tip b{color:#fff;font-family:var(--fm)}
.tip .yr{font:700 13px var(--fd);color:#ffd9b8;display:block;margin-bottom:3px}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:11.5px;color:#5d6d67}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px;border-radius:2px}
.chart-note{display:flex;gap:10px;margin-top:14px;padding:13px 15px;border:1px solid #dce6e1;border-radius:var(--r-sm);
  background:#f4f8f6;font-size:11.8px;color:#5a6c66;line-height:1.6}
.chart-note b{color:#2c463f}

/* timeline */
.timeline{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:14px;
  padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fbfdfc}
.timeline button{border:0;border-radius:9px;background:var(--teal-deep);color:#fff;padding:9px 15px;font-weight:800;font-size:12px}
.timeline output{min-width:44px;font:700 13px var(--fm);text-align:right}

/* heatmap */
.heat{margin-top:16px;padding:16px;border-radius:var(--r);background:var(--plum);color:#efeaf3}
.heat h3{margin:0;font:700 15px var(--fd);color:#f3eef6}
.heat p{margin:3px 0 12px;font-size:11px;color:#b9aec5}
.heat canvas{display:block;max-width:100%;height:auto;border-radius:9px}
.heat-legend{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:10.5px;color:#cfc6d5}
.heat-grad{width:170px;height:8px;border-radius:9px;background:linear-gradient(90deg,#c66a2b,#efe9e4 50%,#3fa89b)}
.heat-empty{margin-top:10px;font-size:11.5px;color:#c3b8ce}
.viz-switch{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:8px;align-items:stretch;margin-top:16px}
.viz-switch button{border:1px solid #cbd9d4;border-radius:9px;background:#f7faf9;color:var(--teal-deep);font-size:22px;font-weight:800;transition:background .15s,border-color .15s,transform .1s}
.viz-switch button:hover{background:#e9f4f0;border-color:var(--teal)}.viz-switch button:active{transform:scale(.95)}
.viz-title{display:grid;place-content:center;min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:9px;background:#f7faf9;text-align:center}
.viz-title small{display:block;color:#7c8d87;font-size:8.5px;font-weight:800;letter-spacing:.12em}.viz-title strong{display:block;color:var(--ink);font:700 14px var(--fd)}
.viz-carousel{margin-top:9px}.viz-carousel>.heat,.viz-carousel>.landscape{margin-top:0}
[data-viz-panel][hidden],.heat-empty[hidden],.landscape-empty[hidden]{display:none!important}

/* yhden muuttujan skenaariotiheys */
.landscape{margin-top:16px;padding:18px;border-radius:var(--r);background:#302a3d;color:#efeaf3;border:1px solid #493e57}
.landscape-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.landscape h3{margin:0;font:700 17px var(--fd);color:#f5eff7}
.landscape p{margin:4px 0 12px;font-size:11px;color:#b9aec5;line-height:1.5}
.landscape-kpi{text-align:right;white-space:nowrap}.landscape-kpi b{display:block;font:700 18px var(--fm);color:#fff0b7}.landscape-kpi span{font-size:10px;color:#b9aec5}
.landscape-wrap{position:relative}.landscape canvas{display:block;max-width:100%;height:auto;border-radius:10px;touch-action:none}
.landscape-tip{position:absolute;display:none;pointer-events:none;z-index:3;min-width:175px;padding:9px 11px;border-radius:8px;background:#17131fef;color:#eee8f1;font-size:10.5px;line-height:1.45;box-shadow:0 8px 28px #0007}
.landscape-tip b{color:#fff0b7}.landscape-legend{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:10.5px;color:#cfc6d5;flex-wrap:wrap}
.landscape-grad{width:180px;height:9px;border-radius:9px;background:linear-gradient(90deg,#f0a06f,#6b4150 36%,#302a3d 50%,#4f9aa5 72%,#fff0b7)}
.landscape-legend em{margin-left:auto;font-style:normal;color:#a99daf}.landscape-empty{position:absolute;inset:14px 18px 30px min(220px,35%);display:grid;place-content:center;text-align:center;background:#302a3ddd;color:#cfc6d5;font-size:11.5px;line-height:1.55;border-radius:9px}
.cluster-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.cluster-card{padding:8px 9px;border:1px solid #4c405b;border-radius:8px;background:#373044}.cluster-card span{display:block;color:#b9aec5;font-size:9px}.cluster-card b{display:block;margin-top:2px;font:700 11px var(--fm)}
.profile-stage,.grid-stage{padding:18px;border-radius:var(--r);background:#302a3d;color:#efeaf3;border:1px solid #493e57}
.profile-stage h3,.grid-stage h3{margin:0;font:700 17px var(--fd);color:#f5eff7}.profile-stage>p,.grid-stage>p{margin:4px 0 10px;font-size:11px;color:#b9aec5;line-height:1.5}
.profile-host svg{display:block;width:100%;height:auto;max-height:520px}.profile-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.profile-card{padding:8px 9px;border:1px solid #4c405b;border-radius:8px;background:#373044}.profile-card span{display:block;color:#b9aec5;font-size:9px}.profile-card b{display:block;margin-top:2px;font:700 12px var(--fm)}
.profile-method{margin-top:9px;color:#b9aec5;font-size:9.5px}.profile-method summary{cursor:pointer;color:#d7cddd;font-weight:700}.profile-method ul{margin:7px 0 0;padding-left:18px;line-height:1.55}
.indicator-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.indicator-mini{appearance:none;text-align:left;padding:10px;border:1px solid #493e57;border-radius:9px;background:#373044;color:#efeaf3;cursor:pointer}
.indicator-mini:hover,.indicator-mini.active{border-color:#d8a13a;background:#40364d}.indicator-mini strong{display:block;min-height:30px;font-size:10.5px;line-height:1.35}.indicator-mini svg{display:block;width:100%;height:42px;margin:5px 0}.indicator-mini small{display:block;color:#b9aec5;font-size:9.5px}.indicator-mini b{font:700 11px var(--fm)}
.path-stage{padding:18px;border-radius:var(--r);background:#302a3d;color:#efeaf3;border:1px solid #493e57}.path-stage h3{margin:0;font:700 17px var(--fd);color:#f5eff7}.path-stage>p{margin:4px 0 10px;font-size:11px;color:#b9aec5;line-height:1.5}.path-range{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin:12px 0;padding:10px 12px;border:1px solid #4c405b;border-radius:9px;background:#373044}.path-range label{display:grid;gap:5px;color:#b9aec5;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.path-range output{color:#fff0b7;font:700 12px var(--fm)}.path-range input{width:100%;accent-color:#51bca9}.path-range-arrow{align-self:center;padding-top:14px;color:#fff0b7;font:700 18px var(--fd)}.path-periods{display:flex;gap:5px;flex-wrap:wrap;margin:-3px 0 10px}.path-periods button{border:1px solid #554967;border-radius:7px;background:#373044;color:#cfc6d5;padding:6px 9px;font-size:9.5px;font-weight:700}.path-periods button:hover{border-color:#8f7ba2;color:#fff0b7}.path-summary{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}.path-summary span{padding:6px 9px;border:1px solid #4c405b;border-radius:8px;background:#373044;color:#cfc6d5;font-size:10px}.path-summary b{color:#fff0b7}.path-host{overflow-x:auto}.path-host svg{display:block;width:100%;min-width:680px;height:auto}.path-method{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:8px;color:#a99daf;font-size:9.5px;line-height:1.45}.path-method b{color:#cfc6d5}
@media(max-width:820px){.landscape{padding:14px}.landscape-head{display:block}.landscape-kpi{text-align:left;margin:8px 0}.landscape-legend em{width:100%;margin-left:0}.landscape-empty{left:105px}}
@media(max-width:620px){.profile-cards,.cluster-summary{grid-template-columns:1fr 1fr}.profile-stage,.grid-stage,.path-stage{padding:13px}.indicator-grid{grid-template-columns:1fr 1fr}.path-range{grid-template-columns:1fr}.path-range-arrow{display:none}}

/* insight */
.direction{display:flex;gap:14px;align-items:center;padding:15px;margin-bottom:16px;
  background:linear-gradient(120deg,#ecf8f3,#f5fbf8);border:1px solid #cde3db;border-radius:var(--r-sm)}
.direction.down{background:linear-gradient(120deg,#fdf0ec,#fdf8f6);border-color:#efd2ca}
.direction .arrow{font-size:29px;color:var(--teal)}
.direction.down .arrow{color:var(--red)}
.direction span,.direction small{display:block;color:#5f706a;font-size:10.5px;font-weight:600}
.direction b{display:block;margin:2px 0;font:700 20px var(--fd);font-variant-numeric:tabular-nums}
.ins h3{margin:16px 0 6px;font:700 14.5px var(--fd)}
.contrib{padding:9px 0;border-bottom:1px solid #e9efec}
.contrib-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.contrib strong{font-size:12.2px}
.contrib small{color:#78867f;font-size:10.5px}
.bar{height:5px;border-radius:5px;background:#eef2f0;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.chain{margin-top:16px;padding:14px;border-radius:var(--r-sm);background:#edf2f0;border:1px solid #dde6e2}
.chain div{display:flex;justify-content:space-between;font-size:9.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.05em;color:#3f5a52}
.chain div span:nth-child(even){color:#9db4ac}
.chain p{margin:8px 0 0;font-size:10.5px;color:#67756f;line-height:1.6}
.empty{min-height:320px;display:grid;place-content:center;justify-items:center;text-align:center;color:var(--muted)}
.orb{width:104px;height:104px;display:grid;place-items:center;border-radius:50%;border:1.5px solid #b3ccc4;
  font:700 28px var(--fd);color:var(--teal);background:radial-gradient(circle at 35% 30%,#e8f4f0,#f7fbfa);
  box-shadow:0 10px 30px #0a8a7f1c,inset 0 0 0 10px #ffffffcc;animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.empty h3{margin:20px 0 6px;font:700 19px var(--fd);color:var(--ink)}
.empty p{max-width:30ch;font-size:12.5px}
.method{margin-top:18px;padding-top:13px;border-top:1px solid var(--line);font-size:10.5px;color:#6b7a74;line-height:1.65}

/* ---------- state ---------- */
let levers = [], effects = [], baselines = [], norms = {}, anchors = {}, indicatorMeta = {}, indicatorHistory = {};
let values = {}, reformYear = 2027, selected = 'safe_corridor.arope_25_29';
let tab = 'groups', scenario = {}, composite = [], focusYear = 2032;

/* ---------- helpers ---------- */
const nf = (n, d = 1) => new Intl.NumberFormat('fi-FI', {minimumFractionDigits: d, maximumFractionDigits: d}).format(n || 0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sign = n => (n > 0 ? '+' : '') + nf(n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);

function unitOf(key) {
  if (key.includes('fertility')) return {suffix:'', digits:2, name:'lasta/nainen'};
  if (key.includes('age')) return {suffix:' v', digits:1, name:'vuotta'};
  return {suffix:' %', digits:1, name:'%'};
}
/* pistemäärä (0–100, suurempi = parempi) takaisin alkuperäiseen yksikköön */
function toRaw(key, score) {
  const a = anchors[key];
  if (!a) return null;
  const span = a.upper_anchor - a.lower_anchor;
  return a.favorable_direction === 1
    ? a.lower_anchor + (score / 100) * span
    : a.upper_anchor - (score / 100) * span;
}
function rawLabel(key, score) {
  const r = toRaw(key, score); if (r == null) return '–';
  const u = unitOf(key);
  return nf(r, u.digits) + u.suffix;
}

/* viivepaino: vaikutus kasvaa lag-ikkunassa ja hiipuu persistenssin jälkeen */
function weight(year, start, lagMin, lagMax, persist) {
  const a = year - start;
  if (a < lagMin) return 0;
  if (a <= lagMax) return lagMax === lagMin ? 1 : Math.min(1, (a - lagMin + 1) / (lagMax - lagMin + 1));
  if (a <= lagMax + persist) return Math.max(0, 1 - (a - lagMax) / persist);
  return 0;
}

/* ---------- model ---------- */
function contribution(effect, year) {
  const intensity = (values[effect.lever_key] || 0) / 100;
  if (!intensity) return 0;
  return intensity
    * effect.effect_direction
    * (norms[effect.series_key] || 1)
    * (+effect.relative_strength)
    * (+effect.implementation_coefficient)
    * weight(+year, reformYear, +effect.lag_min_years, +effect.lag_max_years, +effect.persistence_years)
    * 10;
}

function calculate() {
  scenario = {};
  const bySeries = {};
  effects.forEach(e => (bySeries[e.series_key] ||= []).push(e));

  baselines.forEach(b => {
    const list = bySeries[b.series_key] || [];
    let delta = 0;
    for (const e of list) delta += contribution(e, +b.year);
    const score = +b.score_0_100;
    const s = clamp(score + delta, 0, 100);
    const spread = Math.abs(delta) * 0.35;
    (scenario[b.series_key] ||= []).push({
      year: +b.year, score, delta: s - score, scenario: s,
      lo: clamp(s - spread, 0, 100), hi: clamp(s + spread, 0, 100),
      kind: b.value_kind
    });
  });
  Object.values(scenario).forEach(a => a.sort((x, y) => x.year - y.year));

  const keys = Object.keys(scenario);
  composite = YEARS.map(y => {
    let base = 0, scen = 0, n = 0;
    keys.forEach(k => {
      const p = scenario[k].find(r => r.year === y);
      if (p) { base += p.score; scen += p.scenario; n++; }
    });
    return n ? {year: y, base: base / n, scen: scen / n} : {year: y, base: 0, scen: 0};
  });
  heat = buildHeat();
  landscape = buildLandscape();
}

/* herkkyys: mikä vipu selittää muutoksen valitussa indikaattorissa */
function sensitivity(seriesKey, year) {
  const rows = effects.filter(e => e.series_key === seriesKey);
  const map = {};
  rows.forEach(e => {
    const c = contribution(e, year);
    if (!c) return;
    map[e.lever_key] ||= {key: e.lever_key, title: e.lever_title, area: e.policy_area, value: 0, statute: e.statute_id, lag: `${e.lag_min_years}–${e.lag_max_years}`};
    map[e.lever_key].value += c;
  });
  return Object.values(map).sort((a, b) => Math.abs(b.value) - Math.abs(a.value));
}

function activeCount() { return Object.values(values).filter(Boolean).length; }

function stepSeries(direction) { const list=orderedSeries(),i=list.indexOf(selected);if(!list.length)return;selected=list[(Math.max(0,i)+direction+list.length)%list.length];update(); }
const VIZ_VIEWS=['heat','landscape','profile','pathways','grid'],VIZ_NAMES={heat:'Vaikutuskartta',landscape:'Vaikutusmaisema',profile:'Tasapainoprofiili',pathways:'Elämänpolut',grid:'Indikaattoriristikko'};

function groupItems(g) { return levers.filter(l => g.matches.some(m => (l.policy_area || '').includes(m))); }
function groupValue(g) {
  const a = groupItems(g);

/* ---------- heat model (indikaattori × vuosi) ---------- */
function buildHeat() {
  const available = [...new Set(effects.map(e => e.series_key))];
  const rows = [...ORDER.filter(k => available.includes(k)),
                ...available.filter(k => !ORDER.includes(k)).sort((a, b) => (NAMES[a] || a).localeCompare(NAMES[b] || b, 'fi'))];
  const grid = rows.map(k => YEARS.map(y => (scenario[k] || []).find(p => p.year === y)?.delta || 0));
  const maxAbs = Math.max(0.25, ...grid.flat().map(Math.abs));
  const peaks = rows.map((key, ri) => {
    let best = {value: 0, year: Y0};
    grid[ri].forEach((v, i) => { if (Math.abs(v) > Math.abs(best.value)) best = {value: v, year: YEARS[i]}; });
    return {...best, key};
  }).filter(p => Math.abs(p.value) > 0.05).sort((a, b) => Math.abs(b.value) - Math.abs(a.value));
  return {rows, grid, maxAbs, peaks, active: activeCount() > 0};
}

function heatColor(v, max) {
  const t = Math.min(1, Math.abs(v) / (max || 1));
  if (t < 0.05) return [48, 42, 61];
  const stops = v >= 0
    ? [[54, 62, 76], [40, 108, 108], [63, 168, 155], [150, 214, 196], [232, 246, 232]]
    : [[66, 48, 67], [124, 66, 60], [188, 91, 65], [232, 158, 100], [252, 226, 192]];
  const z = t * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(z)), f = z - i;
  return stops[i].map((c, j) => Math.round(c + (stops[i + 1][j] - c) * f));
}

function drawHeat() {
  const canvas = $('heatmap'); if (!canvas || !heat) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cssW = Math.max(260, Math.min(canvas.parentElement.clientWidth - 32, document.documentElement.clientWidth - 60));
  const rowsN = heat.rows.length;
  const cssH = 40 + rowsN * 17;
  canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
  canvas.width = cssW * dpr; canvas.height = cssH * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const L = Math.min(210, Math.max(96, cssW * 0.34)), R = 14, T = 8, B = 26;
  const pw = cssW - L - R, ph = cssH - T - B;
  ctx.clearRect(0, 0, cssW, cssH);
  ctx.fillStyle = '#302a3d'; ctx.fillRect(0, 0, cssW, cssH);

  const cw = pw / YEARS.length, rh = ph / rowsN;
  heat.grid.forEach((row, ri) => row.forEach((v, ci) => {
    const c = heatColor(v, heat.maxAbs);
    ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.fillRect(L + ci * cw, T + ri * rh, Math.ceil(cw) + 0.5, Math.ceil(rh) + 0.5);
  }));

  /* uudistusvuoden viiva */

  const paths=[...m.flows].sort((a,b)=>b.value-a.value).map(f=>{const a=left[f.i],b=right[f.j],h1=Math.max(.7,f.value/Math.max(.0001,m.startScen[f.i])*a.h),h2=Math.max(.7,f.value/Math.max(.0001,m.scenEnd[f.j])*b.h),sy=out[f.i],ty=inc[f.j];out[f.i]+=h1;inc[f.j]+=h2;const mid=(LX+NW+RX)/2;return`<path d="M${LX+NW},${sy} C${mid},${sy} ${mid},${ty} ${RX},${ty} L${RX},${ty+h2} C${mid},${ty+h2} ${mid},${sy+h1} ${LX+NW},${sy+h1}Z" fill="url(#life-${f.i})"><title>${esc(LIFE_STATES[f.i].label)} → ${esc(LIFE_STATES[f.j].label)}: ${nf(f.value*100)} % ikäryhmästä aikavälillä ${m.start}–${m.end}</title></path>`}).join('');
  const nodes=LIFE_STATES.map((s,i)=>{const delta=(m.scenEnd[i]-m.baseEnd[i])*100,c=delta>.04?'#7be0ce':delta<-.04?'#f2a47c':'#a99daf';return`<rect x="${LX}" y="${left[i].y}" width="${NW}" height="${left[i].h}" rx="4" fill="${s.color}"/><rect x="${RX}" y="${right[i].y}" width="${NW}" height="${right[i].h}" rx="4" fill="${s.color}"/><text x="${LX-9}" y="${left[i].y+left[i].h/2+4}" text-anchor="end" fill="#eee8f1" font-size="11">${esc(s.label)}</text><text x="${RX+NW+9}" y="${right[i].y+right[i].h/2+3}" fill="#eee8f1" font-size="10">${nf(m.scenEnd[i]*100)} %</text><text x="${RX+NW+9}" y="${right[i].y+right[i].h/2+15}" fill="${c}" font-size="9">${Math.abs(delta)>.04?sign(delta)+' p. vs perusura':''}</text>`}).join('');
  const boundaryX=LX+NW+(Y0-m.start)/(m.end-m.start)*(RX-LX-NW),boundary=m.start<Y0&&m.end>Y0?`<line x1="${boundaryX}" x2="${boundaryX}" y1="20" y2="${H-16}" stroke="#fff0b7" stroke-opacity=".42" stroke-dasharray="4 5"/><text x="${boundaryX}" y="14" text-anchor="middle" fill="#fff0b7" font-size="9">2025 · havaittu → skenaario</text>`:'';
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="25–34-vuotiaiden mallinnetut elämäntilasiirtymät vuodesta ${m.start} vuoteen ${m.end}"><defs>${defs}</defs><text x="${LX}" y="14" fill="#fff0b7" font-size="11" font-weight="700">${m.start}</text><text x="${RX}" y="14" fill="#fff0b7" font-size="11" font-weight="700">${m.end}</text>${boundary}${paths}${nodes}</svg>`;
  const stable=(m.scenEnd[1]+m.scenEnd[3])*100,fragile=(m.scenEnd[2]+m.scenEnd[4]+m.scenEnd[6])*100,largest=[...m.flows].filter(f=>f.i!==f.j).sort((a,b)=>b.value-a.value)[0];
  if(summary)summary.innerHTML=`<span>Vakaa työasema <b>${nf(stable)} %</b></span><span>Haavoittuva asema <b>${nf(fragile)} %</b></span><span>Suurin siirtymä <b>${largest?esc(LIFE_STATES[largest.i].label)+' → '+esc(LIFE_STATES[largest.j].label):'–'}</b></span>`;
  const ps=$('path-start'),pe=$('path-end'),pso=$('path-start-out'),peo=$('path-end-out');if(ps)ps.value=pathStart;if(pe)pe.value=pathEnd;if(pso)pso.textContent=pathStart;if(peo)peo.textContent=pathEnd;
}

function head(step, title, side = '') {
  return `<div class="panel-head"><div><span class="kicker">${step}</span><h2>${esc(title)}</h2></div>${side ? `<b class="count">${side}</b>` : ''}</div>`;
}

function leverCard(l) {

function chartSvg(data) {
  const W = 800, H = 360, L = 42, R = 16, T = 14, B = 30;
  const x = y => L + (y - Y0) / (Y1 - Y0) * (W - L - R);
  const yy = v => T + (100 - v) / 100 * (H - T - B);
  const pts = k => data.map(p => `${x(p.year)},${yy(p[k])}`).join(' ');
  const band = data.map(p => `${x(p.year)},${yy(p.hi)}`)
    .concat(data.slice().reverse().map(p => `${x(p.year)},${yy(p.lo)}`)).join(' ');
  const zones = data.map((p, i) =>
    `<rect data-zone="${i}" x="${x(p.year) - (W - L - R) / (Y1 - Y0) / 2}" y="${T}" width="${(W - L - R) / (Y1 - Y0)}" height="${H - T - B}" fill="transparent"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Perusuran ja säädösskenaarion kehitys 2025–2050">
    <defs><linearGradient id="bandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a8a7f" stop-opacity=".2"/><stop offset="1" stop-color="#0a8a7f" stop-opacity=".04"/>
    </linearGradient></defs>
    ${[0, 25, 50, 75, 100].map(v => `<line class="axis" x1="${L}" x2="${W - R}" y1="${yy(v)}" y2="${yy(v)}"/><text class="chart-label" x="4" y="${yy(v) + 4}">${v}</text>`).join('')}
    <polygon class="band" points="${band}"/>
    <polyline class="base-line" points="${pts('score')}"/>
    <polyline class="scenario-line" points="${pts('scenario')}"/>
    <line class="reform" x1="${x(reformYear)}" x2="${x(reformYear)}" y1="${T}" y2="${H - B}"/>
    <text class="chart-label" x="${x(reformYear) + 5}" y="26" fill="#c4662a">muutos ${reformYear}</text>
    ${[2025, 2030, 2035, 2040, 2045, 2050].map(v => `<text class="chart-label" text-anchor="middle" x="${x(v)}" y="${H - 6}">${v}</text>`).join('')}
    <g id="hover" style="display:none">
      <line class="crosshair" id="ch" y1="${T}" y2="${H - B}"/>
      <circle class="dot" id="d1" r="4.5"/><circle class="dot" id="d2" r="4.5" fill="#93a19c"/>
    </g>
    ${zones}
  </svg><div class="tip" id="tip"></div>`;
}

function peakOf(key) {
  const data = scenario[key] || [];
  let best = {year: Y0, delta: 0, scenario: 0, score: 0};
  data.forEach(p => { if (Math.abs(p.delta) > Math.abs(best.delta)) best = p; });
  return best;
}

  const data = scenario[selected] || [];

  return `
    <div class="metric"><span>Perusura ${focusYear}</span><b>${nf(f.score)}</b><small>${rawLabel(selected, f.score)}</small></div>

    <div class="metric"><span>Yhdistelmäindeksi</span><b class="${cls(cd)}">${nf(comp.scen)}</b><small>perusura ${nf(comp.base)} · ${sign(cd)}</small></div>`;
}

function insightPanel() {
  if (!activeCount()) {
    return `<section class="panel insight">

      <p>Valitse säädösvipuja vasemmalta. Malli laskee viiveet, toteutuskertoimet ja vaikutusketjut reaaliajassa.</p></div>
      <p class="method">Malli: <b>statute_sim_v1</b>. Kertoimet ovat skenaario-oletuksia, eivät empiirisiä kausaalivaikutuksia.</p>
    </section>`;
  }
  const data = scenario[selected] || [];
  const focus = data.find(d => d.year === focusYear) || data[data.length - 1] || {delta: 0, scenario: 0, score: 0};
  const up = focus.delta >= 0;
  const contribs = sensitivity(selected, focusYear);
  const maxAbs = Math.max(0.01, ...contribs.map(c => Math.abs(c.value)));

  return `<section class="panel insight">
    ${head('Vaihe 3', 'Päätelmä', String(focusYear))}
    <div class="direction ${up ? '' : 'down'}">
      <span class="arrow">${up ? '↗' : '↘'}</span>
      <div>
        <span>${esc(NAMES[selected] || selected)}</span>
        <b>${sign(focus.delta)} pistettä</b>
        <small>${rawLabel(selected, focus.score)} → ${rawLabel(selected, focus.scenario)} vuonna ${focusYear}</small>
      </div>
    </div>
    <div class="ins">
      <h3>Mikä muutosta selittää</h3>
      ${contribs.length ? contribs.slice(0, 6).map(c => `
        <div class="contrib">
          <div class="contrib-top"><strong>${esc(c.title)}</strong>
            <span class="value ${c.value > 0 ? 'pos' : 'neg'}">${sign(c.value)}</span></div>
          <small>${esc(c.area)} · ${esc(c.statute)} · viive ${esc(c.lag)} v</small>
          <div class="bar"><i style="width:${Math.abs(c.value) / maxAbs * 100}%;background:${c.value > 0 ? 'var(--teal)' : 'var(--sand)'}"></i></div>
        </div>`).join('')
        : `<p style="font-size:12px;color:var(--muted)">${focusYear < reformYear + 1 ? 'Vaikutukset eivät ole vielä realisoituneet – viive alkaa uudistusvuodesta ' + reformYear + '.' : 'Vaikutukset ovat jo hiipuneet tähän vuoteen mennessä. Siirrä tarkasteluvuosi lähemmäs uudistusta nähdäksesi vaikutushuipun.'}</p>`}

      <h3>Suurimmat siirtymät koko kartalla</h3>
      ${heat && heat.peaks.length ? heat.peaks.slice(0, 4).map(p => `
        <div class="contrib"><div class="contrib-top">
          <strong style="font-size:11.8px">${esc(NAMES[p.key] || p.key)}</strong>
          <span class="value ${p.value > 0 ? 'pos' : 'neg'}">${sign(p.value)}</span></div>
          <small>huippu vuonna ${p.year}</small></div>`).join('')
        : '<p style="font-size:12px;color:var(--muted)">Ei merkittäviä siirtymiä.</p>'}

      <div class="chain">
        <div><span>Säädös</span><span>→</span><span>Mekanismi</span><span>→</span><span>Indikaattori</span></div>
        <p>Vaikutus etenee viiveellä: <b>${esc(contribs[0]?.lag || '0–2')} vuotta</b> ensivaikutukseen ja hiipuu persistenssin päätyttyä. Toteutuskerroin leikkaa vaikutusta säädöksen kytkeytyneisyyden ja delegoinnin mukaan.</p>
      </div>
    </div>
    <p class="method">Malli: <b>statute_sim_v1</b>. Pistemäärä normalisoitu pohjoismaisiin p05–p95-ankkureihin. Kertoimet ovat läpinäkyviä skenaario-oletuksia, eivät empiirisiä kausaalivaikutuksia – lukuja ei tule esittää ennusteina.</p>
  </section>`;
}

      <div class="sb-field"><label for="reform">Uudistusvuosi</label>
        <input type="number" id="reform" min="${Y0}" max="2045" step="1" value="${reformYear}"></div>
      <div class="sb-field"><label>Aktiivisia vipuja</label><b style="font:700 15px var(--fm)">${activeCount()}</b></div>
      <div class="presets">
        ${Object.entries(PRESETS).map(([k, p]) => `<button data-preset="${k}">${esc(p.label)}</button>`).join('')}
        <button data-preset="reset" class="reset">Nollaa</button>
      </div>
    </div>
    <main class="workspace">
      ${leverPanel()}
      ${chartPanel()}
      ${insightPanel()}
    </main>
    <footer>
      <span>Murrosmatriisi · säädössimulaattori v4 · malli statute_sim_v1</span>
      <span>Aineisto luetaan julkisesta tietokannasta. Skenaario-oletuksia, ei ennusteita.</span>
    </footer>`;
  bind();
  syncViz();
}

/* pieni päivitys ilman koko DOMin uudelleenrakennusta */
function update() {
  calculate();
  const chart = $('chart');
  if (chart) chart.innerHTML = chartSvg(scenario[selected] || []);
  const panels = document.querySelectorAll('.workspace > .panel');
  if (panels[2]) panels[2].outerHTML = insightPanel();
  refreshMetrics();
  bindChart();
  bindLandscape();
  syncViz();
  syncUrl();
}

function refreshMetrics() {
  const data = scenario[selected] || [];
  const focus = data.find(d => d.year === focusYear) || data[data.length - 1] || {score: 0, scenario: 0, delta: 0};
  const box = document.querySelector('.metrics');
  if (box) box.innerHTML = metricsHtml();
  const sn = $('series-name'); if (sn) sn.textContent = NAMES[selected] || selected;
  const note = document.querySelector('.chart-note span');
  if (note) note.innerHTML = `Vuonna ${focusYear} skenaario on <b>${nf(focus.scenario)}</b> pistettä (${rawLabel(selected, focus.scenario)}), perusura ${nf(focus.score)} pistettä (${rawLabel(selected, focus.score)}). Yksikkö: ${unitOf(selected).name}. Pistemäärä on normalisoitu pohjoismaiseen vaihteluväliin, jossa 100 = paras havaittu taso.`;
  const legend = document.querySelector('.heat-legend span:last-child');
  if (legend) legend.textContent = `huippupoikkeama ±${nf(heat ? heat.maxAbs : 0)} p.`;
  const hs = $('heat-empty'); if (hs) hs.hidden = !!heat?.active;
  const le = $('landscape-empty'); if (le) le.hidden = !!landscape?.active;
}

/* ---------- interaction ---------- */
function bindChart() {
  const wrap = $('chart'); if (!wrap) return;
  const svg = wrap.querySelector('svg'), tip = $('tip'), hover = $('hover');
  const data = scenario[selected] || [];
  const W = 800, H = 360, L = 42, R = 16, T = 14, B = 30;
  const x = y => L + (y - Y0) / (Y1 - Y0) * (W - L - R);
  const yy = v => T + (100 - v) / 100 * (H - T - B);

  const show = i => {
    const p = data[i]; if (!p) return;
    hover.style.display = '';
    $('ch').setAttribute('x1', x(p.year)); $('ch').setAttribute('x2', x(p.year));
    $('d1').setAttribute('cx', x(p.year)); $('d1').setAttribute('cy', yy(p.scenario));
    $('d2').setAttribute('cx', x(p.year)); $('d2').setAttribute('cy', yy(p.score));
    tip.style.display = 'block';
    tip.innerHTML = `<span class="yr">${p.year}</span>
      Skenaario <b>${nf(p.scenario)}</b> · ${rawLabel(selected, p.scenario)}<br>
      Perusura <b>${nf(p.score)}</b> · ${rawLabel(selected, p.score)}<br>
      Ero <b>${sign(p.delta)}</b> p.`;
    const rect = wrap.getBoundingClientRect();
    const px = x(p.year) / W * rect.width;
    tip.style.left = clamp(px + 14, 0, rect.width - tip.offsetWidth - 4) + 'px';
    tip.style.top = clamp(yy(p.scenario) / H * rect.height - 20, 0, rect.height - 90) + 'px';
  };
  svg.querySelectorAll('[data-zone]').forEach(z => {
    z.addEventListener('mouseenter', () => { hoverIdx = +z.dataset.zone; show(hoverIdx); });
  });
  svg.addEventListener('mouseleave', () => { hover.style.display = 'none'; tip.style.display = 'none'; });
}

function bind() {
  bindOnce();
  bindChart();
  bindLandscape();
}

let bound = false;
function bindOnce() { if (bound) return; bound = true;
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('click', onClick);
  window.addEventListener('resize', debounce(drawActiveViz,120));
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function onInput(e) {
  const t = e.target;
  if (t.dataset && t.dataset.lever) {
    values[t.dataset.lever] = +t.value;
    const out = t.previousElementSibling?.querySelector('output');
    if (out) {
      const v = +t.value;
      out.textContent = (v > 0 ? '+' : '') + v;
      out.className = 'value ' + (v > 0 ? 'pos' : v < 0 ? 'neg' : '');
    }
    const det = t.closest('details');
    if (det) {
      const g = GROUPS.find(x => det.querySelector('.g-name')?.textContent === x.label);
      if (g) { const gv = groupValue(g), el = det.querySelector('.g-val');
        el.textContent = (gv > 0 ? '+' : '') + gv; el.className = 'g-val ' + (gv > 0 ? 'pos' : gv < 0 ? 'neg' : ''); }
    }
    update();
  }
  if(t.id==='path-start'){pathStart=Math.min(+t.value,pathEnd-1);t.value=pathStart;$('path-start-out').textContent=pathStart;$('focus-out').textContent=`${pathStart}→${pathEnd}`;drawPathways()}
  if(t.id==='path-end'){pathEnd=Math.max(+t.value,pathStart+1);$('path-end-out').textContent=pathEnd;$('focus').value=pathEnd;$('focus-out').textContent=`${pathStart}→${pathEnd}`;drawPathways()}
  if (t.id === 'focus') { if(vizView==='landscape'){mapYear=+t.value;$('focus-out').textContent=mapYear;drawLandscape()}else if(vizView==='pathways'){pathEnd=Math.max(+t.value,pathStart+1);$('focus').value=pathEnd;$('focus-out').textContent=`${pathStart}→${pathEnd}`;drawPathways()}else{focusYear=+t.value;$('focus-out').textContent=focusYear;update()} }
  if (t.id === 'reform') { reformYear = clamp(+t.value || 2027, Y0, 2045); update(); }
}

function onChange(e) {
}

function onClick(e) {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.seriesPick) { selected=b.dataset.seriesPick; update(); return; }
  if (b.dataset.seriesStep) { stepSeries(+b.dataset.seriesStep); return; }
  if (b.dataset.vizStep) { stepViz(+b.dataset.vizStep); return; }
  if(b.dataset.pathRange){const [a,z]=b.dataset.pathRange.split(',').map(Number);pathStart=a;pathEnd=z;syncViz();return}
  if(b.dataset.pathYears){const span=+b.dataset.pathYears;pathEnd=Math.min(Y1,pathStart+span);if(pathEnd-pathStart<span)pathStart=Math.max(MAP_Y0,pathEnd-span);syncViz();return}
  if (b.dataset.tab) { tab = b.dataset.tab; render(); return; }
  if (b.dataset.preset) {
    const k = b.dataset.preset;
    values = Object.fromEntries(levers.map(l => [l.lever_key, 0]));
    if (k !== 'reset') {
      Object.entries(PRESETS[k].set).forEach(([lk, v]) => { if (lk in values) values[lk] = v; });
      calculate();
      const pk = peakOf(selected);
      if (pk.delta) focusYear = pk.year;
    } else { focusYear = 2032; }
    render(); syncUrl();
    toast(k === 'reset' ? 'Skenaario nollattu' : `Linjaus: ${PRESETS[k].label}`);
    return;
  }
  if (b.id === 'play') togglePlay();
  if (b.id === 'csv') exportCsv();
  if (b.id === 'share') shareLink();
  if (b.id === 'download') downloadSelf();
}

function togglePlay() {
  if(vizView==='landscape'){
    if(playing){playing=false;cancelAnimationFrame(playRaf);mapYear=Math.round(playPos);$('play').textContent=`▶ Toista ${MAP_Y0}→${Y1}`;drawLandscape();return}
    playing=true;playPos=MAP_Y0;mapYear=MAP_Y0;$('play').textContent='❚❚ Pysäytä';let started=null,shown=MAP_Y0;const step=now=>{if(!playing)return;if(started===null)started=now;const p=Math.min(1,(now-started)/9000);playPos=MAP_Y0+(Y1-MAP_Y0)*p;const year=Math.min(Y1,Math.floor(playPos));if(year!==shown){shown=mapYear=year;const f=$('focus');if(f)f.value=year;const out=$('focus-out');if(out)out.textContent=year}drawLandscape();if(p<1)playRaf=requestAnimationFrame(step);else{playing=false;playPos=mapYear=Y1;$('play').textContent=`▶ Toista ${MAP_Y0}→${Y1}`;drawLandscape()}};playRaf=requestAnimationFrame(step);return;
  }
  if(vizView==='pathways'){
    if(playing){playing=false;cancelAnimationFrame(playRaf);$('play').textContent='▶ Siirrä aikaväliä';drawPathways();return}
    const span=pathEnd-pathStart,maxStart=Y1-span;playing=true;pathStart=MAP_Y0;pathEnd=MAP_Y0+span;$('play').textContent='❚❚ Pysäytä';let started=null,shown=pathStart;const step=now=>{if(!playing)return;if(started===null)started=now;const p=Math.min(1,(now-started)/7600),start=Math.min(maxStart,Math.floor(MAP_Y0+(maxStart-MAP_Y0)*p));if(start!==shown){shown=pathStart=start;pathEnd=start+span;const f=$('focus');if(f)f.value=pathEnd;const out=$('focus-out');if(out)out.textContent=`${pathStart}→${pathEnd}`;drawPathways()}if(p<1)playRaf=requestAnimationFrame(step);else{playing=false;$('play').textContent='▶ Siirrä aikaväliä';drawPathways()}};playRaf=requestAnimationFrame(step);return;
  }
  if (playing) {
    playing = false; cancelAnimationFrame(playRaf); focusYear = Math.round(playPos);
    $('play').textContent = '▶ Toista 2025→2050'; update(); return;
  }
  playing = true; playPos = Y0; focusYear = Y0; $('play').textContent = '❚❚ Pysäytä';
  let started = null, shownYear = Y0;
  const step = now => {
    if (!playing) return;
    if (started === null) started = now;
    const p = Math.min(1, (now - started) / 5600);
    playPos = Y0 + (Y1 - Y0) * p;
    const year = Math.min(Y1, Math.floor(playPos));
    if (year !== shownYear) { shownYear = focusYear = year; const f = $('focus'); if (f) f.value = year; const out = $('focus-out'); if (out) out.textContent = year; if(vizView==='profile'||vizView==='grid')drawActiveViz(); }
    if(vizView==='heat'||vizView==='landscape'||vizView==='pathways')drawActiveViz();
    if (p < 1) playRaf = requestAnimationFrame(step);
    else { playing = false; playPos = focusYear = Y1; $('play').textContent = '▶ Toista 2025→2050'; update(); }
  };
  playRaf = requestAnimationFrame(step);
}

/* ---------- export & share ---------- */
function exportCsv() {
  const keys = Object.keys(scenario).sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b));
  const rows = [['series_key', 'indikaattori', 'vuosi', 'perusura_score', 'skenaario_score', 'ero', 'perusura_raw', 'skenaario_raw']];
  keys.forEach(k => (scenario[k] || []).forEach(p => rows.push([
    k, NAMES[k] || k, p.year, p.score.toFixed(3), p.scenario.toFixed(3), p.delta.toFixed(3),
    (toRaw(k, p.score) ?? '').toString().slice(0, 8), (toRaw(k, p.scenario) ?? '').toString().slice(0, 8)
  ])));
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  saveBlob(new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8'}), 'murrosmatriisi-skenaario.csv');
  toast('CSV ladattu');
}

function saveBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function downloadSelf() {
  try {
    const res = await fetch(location.href.split('#')[0]);
    const text = await res.text();
    saveBlob(new Blob([text], {type: 'text/html;charset=utf-8'}), 'murrosmatriisi-saadossimulaattori-v4.html');
    toast('HTML-tiedosto ladattu');
  } catch { toast('Lataus ei onnistunut – tallenna sivu selaimesta.'); }
}

function encodeState() {
  const active = Object.entries(values).filter(([, v]) => v).map(([k, v]) => `${k}:${v}`).join(',');
  return `y=${reformYear}&s=${encodeURIComponent(selected)}&f=${focusYear}&v=${encodeURIComponent(active)}`;
}
function syncUrl() { history.replaceState(null, '', '#' + encodeState()); }
function readState() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('y')) reformYear = clamp(+h.get('y'), Y0, 2045);
  if (h.get('s') && NAMES[h.get('s')]) selected = h.get('s');
  if (h.get('f')) focusYear = clamp(+h.get('f'), Y0, Y1);
  if (h.get('v')) h.get('v').split(',').filter(Boolean).forEach(pair => {
    const [k, v] = pair.split(':'); if (k in values) values[k] = clamp(+v || 0, -100, 100);
  });
}
async function shareLink() {
  syncUrl();
  try { await navigator.clipboard.writeText(location.href); toast('Linkki kopioitu leikepöydälle'); }
  catch { toast('Kopioi osoiterivin linkki'); }
}

let toastT;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ---------- load ---------- */
async function get(path, tries = 2) {
  const h = {apikey: KEY, Authorization: `Bearer ${KEY}`};
  for (let i = 0; i <= tries; i++) {
    try {
      const r = await fetch(API + '/rest/v1/' + path, {headers: h});
      if (!r.ok) throw new Error(r.status);
      return await r.json();
    } catch (err) {
      if (i === tries) throw err;
      await new Promise(r => setTimeout(r, 400 * (i + 1)));
    }
  }
}

async function load() {
  try {
    const [lv, ef, bl, nm, im, iv] = await Promise.all([
      get('simulation_statute_levers?select=*&active=eq.true'),
      get('simulation_statute_effect_matrix?select=*'),
      get('simulation_indicator_baselines?select=series_key,year,raw_value,score_0_100,value_kind&order=year.asc&limit=5000'),
      get('simulation_normalization_params?select=*'),
      get('indicator_series?select=series_key,title,theme,pressure_domain,indicator_role,unit,status&published=eq.true&status=eq.curated&limit=500').catch(()=>[]),
      get('indicator_values?select=series_key,year,group_key,value,value_kind&is_published=eq.true&or=(group_key.eq.FI,group_key.eq._,group_key.is.null)&order=year.asc&limit=10000').catch(()=>[])
    ]);
    levers = lv; effects = ef; baselines = bl;
    levers.sort((a, b) => (a.metadata?.display_order || 99) - (b.metadata?.display_order || 99));
    norms = Object.fromEntries(nm.map(x => [x.series_key, +x.favorable_direction]));
    anchors = Object.fromEntries(nm.map(x => [x.series_key, {
      favorable_direction: +x.favorable_direction,
      lower_anchor: +x.lower_anchor,
      upper_anchor: +x.upper_anchor
    }]));
    buildHistory(im,iv);
    values = Object.fromEntries(levers.map(l => [l.lever_key, 0]));
    readState();
    render();
  } catch (e) {
    $('app').className = '';
    $('app').innerHTML = `<div class="error-box">
      <b style="font:700 18px var(--fd)">Aineistoa ei saatu ladattua</b>
      <p style="font-size:13px;color:#66807a">Simulaattori tarvitsee internet-yhteyden Murrosmatriisin julkisen aineiston lukemiseen.</p>
      <button onclick="location.reload()">Yritä uudelleen</button></div>`;
  }
}
load();
</script>
